<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>daftar — its mechanisms, drawn</title><style>
:root{--bg:#0f1319;--panel:#161c24;--line:#2a3644;--fg:#e8edf3;--muted:#93a1b2;--accent:#ff9d4a;--nfill:#1c2530}
@media(prefers-color-scheme:light){:root{--bg:#eef2f6;--panel:#fff;--line:#cfd8e2;--fg:#17202b;--muted:#5a6a7b;--nfill:#f5f8fb}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:14px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 20px}
h1{font-size:17px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font:600 11px ui-monospace,monospace;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab,.seg button,.btn{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;font:600 13px system-ui}
.tab.active,.seg button.active{background:var(--accent);color:#1a1206;border-color:var(--accent)}
.tab.off{opacity:.45;text-decoration:line-through}
.seg{display:flex;gap:0}.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.btn.primary{border-color:var(--accent);color:var(--accent)}.btn.on{background:var(--accent);color:#1a1206}
.spacer{flex:1}
main{max-width:1180px;margin:0 auto;padding:20px}
.lead{color:var(--muted);margin:0 0 12px}
table.ref{border-collapse:collapse;width:100%;font-size:13px}
table.ref th{text-align:left;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:7px 10px}
table.ref td{border-bottom:1px solid var(--line);padding:7px 10px;vertical-align:top}
.mono{font-family:ui-monospace,monospace}.ipc{color:var(--accent)}
.kd{color:var(--muted);font-size:12px}.kd b{color:var(--fg);font-weight:600}
.reffilter{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
select,input{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font:inherit;font-size:13px}
.org{font:11px ui-monospace,monospace;border-radius:6px;padding:1px 7px;border:1px solid var(--line);color:var(--muted)}
.ffnote{color:var(--muted);font-size:11px;margin-left:auto;max-width:44ch}
/* author mode */
#author{display:none;margin-top:18px;border:1px dashed var(--accent);border-radius:14px;padding:14px 16px;background:var(--panel)}
body.authoring #author{display:block}
#author h3{margin:14px 0 6px;font-size:14px;color:var(--accent);letter-spacing:.02em}
#author h3:first-child{margin-top:0}
#author table{border-collapse:collapse;width:100%;font-size:12.5px}
#author th{text-align:left;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:5px 6px}
#author td{border-bottom:1px solid var(--line);padding:4px 6px;vertical-align:middle}
#author input.w{width:100%}#author .note{color:var(--muted);font-size:12px;margin:4px 0 8px}
#author .mini{padding:2px 7px;font-size:12px}
.chg{outline:1px solid var(--accent)}
.addr-more{position:relative;display:inline-block;margin-left:4px;font:600 10.5px ui-monospace,monospace;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px;cursor:help;outline:none}
.addr-more .addr-tip{position:absolute;left:0;top:130%;z-index:30;min-width:240px;white-space:nowrap;background:var(--panel);color:var(--fg);border:1px solid var(--accent);border-radius:9px;padding:8px 10px;font:12px/1.6 ui-monospace,monospace;box-shadow:0 8px 28px rgba(0,0,0,.35);visibility:hidden;opacity:0}
.addr-more:hover .addr-tip,.addr-more:focus .addr-tip{visibility:visible;opacity:1}.addr-more .addr-tip b{color:var(--accent);font-weight:600}
#livebar{margin-top:6px}#livebar a{color:var(--accent)}
#toast{display:none;position:fixed;right:18px;bottom:18px;z-index:60;max-width:520px;white-space:pre-wrap;background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;font:12.5px ui-monospace,monospace;box-shadow:0 8px 28px rgba(0,0,0,.4)}
#toast.bad{border-color:#f85149}
#exportbox{white-space:pre;overflow:auto;max-height:220px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;font:11.5px ui-monospace,monospace}

.fx{--bg:#0f1319;--panel:#161c24;--line:#2a3644;--fg:#e8edf3;--muted:#93a1b2;--accent:#ff9d4a;
 --host:#4aa3ff;--svc:#7ee0a1;--ext:#c9a3ff;--store:#6fd6d6;--off:#5a6675;--nfill:#1c2530;--gauge:#ff9d4a;
 --up:#3fb950;--down:#f85149;--nd:#5a6675;--warn:#d29922;color:var(--fg);font:14px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.fx.light{--bg:#eef2f6;--panel:#fff;--line:#cfd8e2;--fg:#17202b;--muted:#5a6a7b;--nfill:#f5f8fb;--off:#9aa7b5}
.fx *{box-sizing:border-box}
.fx .fx-head h3{margin:0;font-size:19px;font-weight:650}.fx .fx-claim{margin:2px 0 0;font-size:14.5px}
.fx .fx-rel{margin:6px 0 0;color:var(--muted);font-size:12px}.fx .fx-rel b{color:var(--fg);font-weight:600}
.fx .fx-rel a{color:var(--accent)}
.fx .fx-fig{margin:12px 0 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;overflow-x:auto}
.fx svg.schema{width:100%;height:auto;display:block;min-width:620px;color:var(--fg)}
.fx .fx-cap{margin:12px 0 0;font-size:13.5px;line-height:1.6;max-width:95ch}.fx .fx-cap b{font-weight:700}
.fx .k-accent{color:var(--accent)}.fx .k-off{color:var(--off)}
.fx .nbox{fill:var(--nfill);stroke:var(--line);stroke-width:1}
.fx .node.host .nbar,.fx .node.dc .nbar{fill:var(--host)}.fx .node.svc .nbar{fill:var(--svc)}.fx .node.ext .nbar{fill:var(--ext)}
.fx .node.nas .nbar{fill:var(--store)}.fx .node.accent .nbar{fill:var(--accent)}
.fx .node.accent .nbox{stroke:var(--accent);stroke-width:1.6}.fx .node.off .nbox{stroke-dasharray:4 3;opacity:.6}
.fx .node.off .nbar{fill:var(--off)}.fx .node.ext .nbox{stroke-dasharray:5 3}
.fx .ntitle{fill:var(--fg);font:700 13px system-ui}.fx .nip{fill:var(--muted);font:600 11px ui-monospace,monospace}
.fx .nsub{fill:var(--muted);font:12px system-ui}
.fx .cyl{fill:var(--nfill);stroke:var(--store);stroke-width:1.2}.fx .cyltop{fill:none;stroke:var(--store);stroke-width:1.2}
.fx .edge{stroke:var(--muted);stroke-width:1.6;fill:none}.fx .ah{fill:var(--muted)}
.fx .edge.sig{stroke-dasharray:5 3;opacity:.85}
.fx .edge.accent{stroke:var(--accent);stroke-width:2.2}.fx .ah-accent{fill:var(--accent)}
.fx .edge.off{stroke:var(--off);stroke-dasharray:4 3;opacity:.7}.fx .ah-off{fill:var(--off)}
.fx .flab{fill:var(--fg);font:11px system-ui;paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.fx .flab.accent{fill:var(--accent);font-weight:600}.fx .flab.sig{fill:var(--muted)}
.fx .gbox{fill:var(--nfill);stroke:var(--accent);stroke-width:1.6}.fx .glabel{fill:var(--fg);font:600 11px system-ui}
.fx .tbox{fill:var(--nfill);stroke:var(--line)}.fx .ttext{fill:var(--muted);font:11px system-ui}
.fx .tag-warn .tbox,.fx .tag-off .tbox{stroke:var(--accent)}.fx .tag-warn .ttext,.fx .tag-off .ttext{fill:var(--accent)}
.fx .bandbox{fill:none;stroke:var(--line);stroke-dasharray:3 3}.fx .bandtext{fill:var(--muted);font:600 11px system-ui;letter-spacing:.03em}
.fx .gauge-bg{fill:var(--nfill);stroke:var(--line)}.fx .gauge-fill{fill:var(--gauge)}
.fx .ribbonbox{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-dasharray:2 3}
.fx .ribbon-t{fill:var(--accent);font:600 12px ui-monospace,monospace}
.fx .actbtn .abox{fill:var(--accent);stroke:var(--accent)}.fx .actbtn .atext{fill:#1a1206;font:700 13px system-ui}
.fx .actbtn .ahint{fill:#1a1206;opacity:.6;font:9px ui-monospace,monospace;text-transform:uppercase}.fx .actbtn{cursor:pointer}
/* depth: an element deeper than the chosen depth is hidden; so is a node's detail line at depth 0 */
.fx .fx-hide{display:none}
/* live: the element itself changes, in the drawing's own stroke and font */
.fx .el.live-up .nbox,.fx .el.live-up .cyl,.fx .el.live-up .gbox{stroke:var(--up);stroke-width:2.6}
.fx .el.live-down .nbox,.fx .el.live-down .cyl,.fx .el.live-down .gbox{stroke:var(--down);stroke-width:3}
.fx .el.live-down .ntitle{fill:var(--down)}
.fx .fx-chip rect{stroke:var(--panel);stroke-width:2}.fx .fx-chip text{font:700 10.5px system-ui;fill:#fff}
.fx .fx-chip.up rect{fill:var(--up)}.fx .fx-chip.down rect{fill:var(--down)}.fx .fx-chip.nd rect{fill:var(--nd)}
.fx .fx-chip.warn rect{fill:var(--warn)}.fx .fx-chip.val text{fill:#0b0f14}.fx .fx-chip.nd text{fill:#e8edf3}
.fx .el[data-bean]{cursor:help}
.fx .nip.nip-more{text-decoration:underline dotted;cursor:help}.fx .nip{pointer-events:all}
/* legend */
.fx .fx-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:12px;align-items:center}
.fx .fx-legend span{display:flex;align-items:center;gap:5px}.fx .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.fx .sw.host{background:var(--host)}.fx .sw.svc{background:var(--svc)}.fx .sw.ext{background:var(--ext)}
.fx .sw.store{background:var(--store)}.fx .sw.accent{background:var(--accent)}.fx .sw.off{background:var(--off)}
.fx .sw.pat{border:1px solid var(--muted)}.fx .sw.up{background:var(--up)}.fx .sw.down{background:var(--down)}
.fx .fx-legend svg{vertical-align:middle}
/* depth 3: facts and steps */
.fx .fx-detail{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:14px}
.fx .fx-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px}
.fx .fx-card h4{margin:0 0 4px;font-size:13px}.fx .fx-card .mono{font-family:ui-monospace,monospace;color:var(--accent)}
.fx .fx-card dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 8px}
.fx .fx-card dt{color:var(--muted)}.fx .fx-card dd{margin:0;overflow-wrap:anywhere}
.fx .fx-steps{margin:14px 0 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px 10px 30px;font-size:12.5px}
.fx .fx-steps li{margin:3px 0}.fx .fx-sub{color:var(--muted);font-size:12px;margin:14px 0 0;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
/* hover card for a bean at depth 3 */
.fx{position:relative}.fx .fx-tip{position:absolute;z-index:40;max-width:340px;background:var(--panel);border:1px solid var(--accent);
 border-radius:9px;padding:9px 11px;font-size:12px;line-height:1.5;box-shadow:0 8px 28px rgba(0,0,0,.35);pointer-events:none}
.fx .fx-tip b{display:block;margin-bottom:2px}
/* glossary */
.fx .gloss{border-bottom:1px dotted var(--accent);cursor:help;position:relative;outline:none}
.fx .gloss .tip{position:absolute;left:0;bottom:150%;z-index:30;width:300px;max-width:78vw;background:var(--panel);color:var(--fg);
 border:1px solid var(--accent);border-radius:9px;padding:9px 11px;font:12px/1.55 system-ui;box-shadow:0 8px 28px rgba(0,0,0,.35);
 opacity:0;visibility:hidden;transition:opacity .12s;text-align:left;font-weight:400}
.fx .gloss:hover .tip,.fx .gloss:focus .tip{opacity:1;visibility:visible}

/* ===== levels (factory v0.4): four forms, one inspector ===== */
.fx .fx-lv{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.fx .lvname{font:700 11px ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.fx .lvq{color:var(--muted);font-size:12.5px;font-style:italic}
.fx .fx-empty{color:var(--muted)}
.fx svg.lv-schematic .nip{display:none}
.fx svg.schema .el[data-ins]{cursor:pointer;outline:none}
.fx svg.schema .el[data-ins]:hover .nbox,.fx svg.schema .el[data-ins]:focus .nbox{stroke:var(--accent);stroke-width:2}
.fx .bnd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:6 4}.fx .bndtext{fill:var(--muted);font:600 10.5px system-ui;letter-spacing:.05em;text-transform:uppercase}
/* story */
.fx .fx-purpose{font-size:18px;line-height:1.45;margin:10px 0 18px;max-width:62ch;font-weight:500}
.fx .fx-story{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:26px 30px}
.fx .fx-stage{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 16px 14px;outline:none;
 transition:border-color .15s,transform .15s}
.fx .fx-stage:hover,.fx .fx-stage:focus{border-color:var(--accent);transform:translateY(-2px)}
.fx .fx-stage:not(:last-child)::after{content:"";position:absolute;right:-24px;top:34px;width:16px;height:16px;border-top:3px solid var(--line);border-right:3px solid var(--line);transform:rotate(45deg);border-radius:2px}
.fx .fx-stage .num{position:absolute;top:-13px;left:14px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#1a1206;font:800 13px system-ui;display:grid;place-items:center}
.fx .fx-stage .lbl{font:650 15.5px/1.3 system-ui;margin-top:4px}
.fx .fx-stage .doer{color:var(--muted);font-size:13px;line-height:1.45;margin-top:6px}
.fx .fx-outcome{display:flex;gap:14px;align-items:flex-start;margin-top:22px;border:1px solid var(--up);border-radius:16px;padding:14px 16px;background:var(--panel)}
.fx .fx-outcome .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--up);color:#06120a;font:800 13px system-ui;display:grid;place-items:center}
.fx .fx-outcome .lbl{font:650 15px system-ui}.fx .fx-outcome .doer{color:var(--muted);font-size:13.5px;margin-top:2px}
.fx .techs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.fx .fx-tech{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border:1px solid var(--line);border-radius:99px;color:var(--fg);text-decoration:none;font:600 12px system-ui;background:var(--nfill);outline:none}
.fx .fx-tech i{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#1a1206;display:grid;place-items:center;font:800 11px system-ui;font-style:normal}
.fx .fx-tech:hover,.fx .fx-tech:focus{border-color:var(--accent)}.fx .fx-tech .ext{color:var(--muted);font-weight:400}
.fx .fx-learn{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:12.5px}
.fx .fx-learn>span:first-child{text-transform:uppercase;letter-spacing:.06em;font-size:11px;margin-right:4px}
.fx .fx-field{border:1px dashed var(--line);border-radius:8px;padding:2px 9px;cursor:help;outline:none}.fx .fx-field:hover{border-color:var(--accent);color:var(--fg)}
/* health chain */
.fx .fx-chain{display:flex;flex-wrap:wrap;align-items:stretch;gap:0;margin-top:14px}
.fx .fx-tile{position:relative;min-width:170px;max-width:240px;flex:1 1 170px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 20px;margin:6px 0;outline:none;cursor:pointer}
.fx .fx-tile .bar{position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:14px 0 0 14px;background:var(--nd)}
.fx .fx-tile.up .bar{background:var(--up)}.fx .fx-tile.down .bar{background:var(--down)}.fx .fx-tile.warn .bar{background:var(--warn)}
.fx .fx-tile.down{border-color:var(--down)}.fx .fx-tile:hover,.fx .fx-tile:focus{border-color:var(--accent)}
.fx .fx-tile .tname{font:650 14px system-ui}.fx .fx-tile .tstate{font:700 11px ui-monospace,monospace;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.fx .fx-tile.up .tstate{color:var(--up)}.fx .fx-tile.down .tstate{color:var(--down)}.fx .fx-tile.warn .tstate{color:var(--warn)}
.fx .fx-tile .tsub{color:var(--muted);font-size:12px;margin-top:6px}
.fx .fx-tile.blind{background:repeating-linear-gradient(135deg,var(--panel) 0 8px,var(--nfill) 8px 16px);opacity:.85}
.fx .meas{margin-top:8px}.fx .meas .v{font:700 24px/1.1 system-ui;display:block}.fx .meas .mn{color:var(--muted);font-size:11.5px}
.fx .spark{display:block;width:100%;height:22px;margin-top:4px}.fx .spark polyline{fill:none;stroke:var(--accent);stroke-width:1.6;vector-effect:non-scaling-stroke}
.fx .fx-link{align-self:center;width:18px;height:2px;background:var(--line)}
.fx .fx-act{margin-top:10px;width:100%;background:var(--accent);color:#1a1206;border:0;border-radius:8px;padding:6px 8px;font:700 12.5px system-ui;cursor:pointer}
.fx .fx-alerts{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-size:12px}
.fx .fx-alerts>span:first-child{text-transform:uppercase;letter-spacing:.06em;font-size:11px}.fx .fx-alerts .al{border:1px solid var(--line);border-radius:6px;padding:1px 7px}
/* anatomy */
.fx .fx-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:12px}
.fx .fx-card2{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:12.5px}
.fx .fx-card2 header{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.fx .fx-card2 header b{font:700 14px ui-monospace,monospace;cursor:help;outline:none}
.fx .fx-card2 .kind,.fx .fx-card2 .org{font:11px ui-monospace,monospace;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.fx .fx-card2 .role{color:var(--muted);margin:4px 0 2px}
.fx .fx-card2 section{margin-top:8px;line-height:1.55}.fx .fx-card2 section>span{display:block;font:600 10.5px system-ui;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fx .fx-card2 code{font:11.5px ui-monospace,monospace;color:var(--accent)}.fx .fx-card2 code.est{font-weight:700}.fx .fx-card2 i{color:var(--muted);font-style:normal}
.fx .fx-card2 section.open{color:var(--warn)}
.fx .fx-card2 .fx-tech{margin:2px 4px 2px 0}
.fx .fx-steps2{margin:10px 0 0;padding-left:22px;font-size:12.5px}.fx .fx-steps2 li{margin:6px 0}.fx .touch{margin-top:3px}
.fx .pchip{font:11px ui-monospace,monospace;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-right:4px;color:var(--muted)}
/* the inspector — one card, fixed, never clipped */
.fx-ins{position:fixed;z-index:1000;display:none;max-width:380px;min-width:220px;background:var(--panel,#161c24);color:var(--fg,#e8edf3);
 border:1px solid var(--accent,#ff9d4a);border-radius:12px;padding:10px 12px;font:12.5px/1.55 system-ui;box-shadow:0 12px 36px rgba(0,0,0,.4);pointer-events:auto}
.fx-ins.pinned{box-shadow:0 0 0 2px var(--accent,#ff9d4a),0 12px 36px rgba(0,0,0,.4)}.fx-ins b{font-size:13.5px}.fx-ins a{color:var(--accent,#ff9d4a)}
.fx-ins .ins-sub{color:var(--muted,#93a1b2);margin:1px 0 4px}.fx-ins .ins-row{margin-top:6px}.fx-ins .ins-row>span{display:block;font:600 10px system-ui;letter-spacing:.06em;text-transform:uppercase;color:var(--muted,#93a1b2)}
.fx-ins code{font:11.5px ui-monospace,monospace;color:var(--accent,#ff9d4a)}.fx-ins .ins-q{font:10.5px ui-monospace,monospace;color:var(--muted,#93a1b2);word-break:break-all;margin-top:2px}
.fx-ins .ins-foot{margin-top:8px;font-size:10.5px;color:var(--muted,#93a1b2);text-align:right}

/* ===== operate archetypes (v0.5): each mechanism's own question, in its native shape ===== */
.fx .bl{color:var(--muted);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;margin:12px 0 4px}
.fx .big{display:flex;flex-direction:column;gap:2px}.fx .big .bv{font:750 34px/1.05 system-ui;letter-spacing:-.01em}

es the mechanism decide, and where is it fragile?", "philosophy": "Cause and effect. Draw the mechanism, not the inventory: parts by their ROLE, flows as verbs, decisions and thresholds as gates, boundaries where ownership or network changes, and exactly one hinge — the point the whole mechanism turns on. Addresses and live state stay out; the eye must follow cause and effect without reading an IP. A drawing is REDRAWN when it stops explaining (mail was, when its boundaries hid its captions), never patched with overlays.", "form": "schematic", "things": ["component", "flow", "signal", "gate", "store", "boundary", "external", "disabled", "manual-step", "hinge", "action"], "excludes": ["addresses", "live-values", "provenance"], "density": {"max_elements": 18}, "hover": "what this part does in THIS mechanism, and which ledger object it is", "click": "pins the inspector card on the part", "success": "an engineer can predict what stops when any single part fails", "archetypes": ["schematic"]}, {"id": "operate", "depth": 2, "name": "Operate — is it working", "audience": "the engineer on call", "question": "What must the person on call know first about this mechanism, right now?", "philosophy": "The mechanism's own vital sign. Every mechanism has ONE operational question — the thing the person on call must know first — and a shape native to it that answers at a glance: a RESERVOIR for something that fills toward a gate, LANES for parallel paths that must each get through, a ROSTER for the people it serves, GAUGES for measures against limits, a BOARD for a fixed set of devices, a SCOREBOARD for the watcher itself, a FUNNEL for a stream narrowing through its gates. The question is written above its answer; the evidence sits beneath it, the blind spots are listed as what this view cannot see, and the action sits where it acts. A generic chain of tiles is the fallback, never the design.", "form": "health-chain", "things": ["vital-sign", "evidence", "blind-spot", "action", "ale sses and live state stay out; the eye must follow cause and effect without reading an IP. A drawing is REDRAWN when it stops explaining (mail was, when its boundaries hid its captions), never patched with overlays.", "form": "schematic", "things": ["component", "flow", "signal", "gate", "store", "boundary", "external", "disabled", "manual-step", "hinge", "action"], "excludes": ["addresses", "live-values", "provenance"], "density": {"max_elements": 18}, "hover": "what this part does in THIS mechanism, and which ledger object it is", "click": "pins the inspector card on the part", "success": "an engineer can predict what stops when any single part fails", "archetypes": ["schematic"]}, {"id": "operate", "depth": 2, "name": "Operate — is it working", "audience": "the engineer on call", "question": "What must the person on call know first about this mechanism, right now?", "philosophy": "The mechanism's own vital sign. Every mechanism has ONE operational question — the thing the person on call must know first — and a shape native to it that answers at a glance: a RESERVOIR for something that fills toward a gate, LANES for parallel paths that must each get through, a ROSTER for the people it serves, GAUGES for measures against limits, a BOARD for a fixed set of devices, a SCOREBOARD for the watcher itself, a FUNNEL for a stream narrowing through its gates. The question is written above its answer; the evidence sits beneath it, the blind spots are listed as what this view cannot see, and the action sits where it acts. A generic chain of tiles is the fallback, never the design.", "form": "health-chain", "things": ["vital-sign", "evidence", "blind-spot", "action", "alert"], "excludes": ["decoration", "prose-longer-than-one-line", "parts-irrelevant-to-state"], "density": {"max_tiles": 12}, "hover": "current value, threshold, the probe or query it comes from, and the history link", "click": "an action asks, then runs (or dry-runs) on the host; a tile opens its history", "succe    fxMount(root, view, state) renders the level state.level of a view in the FORM its definition names:
     story        (orient)      meaning before machinery: stages in plain words, technologies linked to their manuals
     schematic    (understand)  the drawn mechanism: roles, flows, gates, one hinge — no addresses, no live state
     health-chain (operate)     state first: status tiles in flow order, blind spots shown, actions on their step
     anatomy      (inspect)     evidence: a card of ledger facts per part, the procedure bound to the parts
   state = {level, live, values:{bindId:number}, history:{bindId:[[t,v]..]}, onAction(a), grafana}
   The INSPECTOR is one card for every level: it anchors to the element (not the mouse), is fixed-positioned so no
   container clips it, flips at the screen edges, pins on click (so its links are clickable), closes on Esc or an
   outside click, opens on keyboard focus, and survives a re-render by remembering which element it was pinned to. */
(function(){
const NS='http://www.w3.org/2000/svg';
const W=(typeof window!=='undefined')?window:this;
function h(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmt(v,u){if(v==null||isNaN(v))return '—';v=+v;if(u==='percent')return v.toFixed(1)+'%';if(u==='celsius')return v.toFixed(1)+' °C';
 if(u==='days')return (Math.abs(v)<10?v.toFixed(1):Math.round(v))+' d';if(u==='gbday')return v.toFixed(1)+' GB/day';
 if(u==='s')return v<1?Math.round(v*1000)+' ms':v<120?v.toFixed(1)+' s':Math.round(v/60)+' min';
 if(u==='m')return v<90?Math.round(v)+' min':v<2880?(v/60).toFixed(1)+' h':(v/1440).toFixed(1)+' d';
 if(u==='bps')return v>=1e6?(v/1e6).toFixed(1)+' Mbit/s':v>=1e3?(v/1e3).toFixed(0)+' kbit/s':Math.round(v)+' bit/s';
 return (Math.abs(v)>=100?Math.round(v):v.toFixed(v%1?1:0))+'';}
function stateOf(b,v,live){if(!live)return 'nd';if(v==null)return 'nd';
 if(b.live==='live-state')return v>=1?'up':'down';return v>=b.crit?'down':v>=b.warn?'warn':'up';}

/* ---------------- the inspector ----------------
   A HOVER CARD WITH INTENT. It opens 90 ms after the pointer rests on an inspectable element and stays open while
   the pointer travels into it (a 280 ms grace), so every link inside is clickable WITHOUT pinning. Nested
   elements (a chip inside a stage card) resolve to the INNERMOST one under the pointer. Clicking an element that
   is not itself a link pins its card (for touch and for keeping it while scrolling); clicking a link follows it —
   a chip's own link goes straight to the manual. Esc or a click outside closes a pinned card; keyboard focus
   opens it like hover. The card is fixed-positioned (no container clips it) and flips at the screen edges. */
const INS={el:null,key:null,pinned:false,over:null,t:null,fns:new WeakMap()};
function insEl(){if(!INS.el){INS.el=document.createElement('div');INS.el.className='fx fx-ins';INS.el.setAttribute('role','dialog');
 document.body.appendChild(INS.el);
 document.addEventListener('keydown',e=>{if(e.key==='Escape')insHide(true);});
 document.addEventListener('pointerover',e=>{const t=e.target;
  if(INS.el.contains(t)){clearTimeout(INS.t);return;}                       // travelling into the card keeps it
  const n=t.closest&&t.closest('[data-ins]');
  if(n===INS.over)return;INS.over=n;clearTimeout(INS.t);
  if(n)INS.t=setTimeout(()=>insShow(n,false),90);
  else if(!INS.pinned)INS.t=setTimeout(()=>insHide(false),280);},true);
 document.addEventListener('pointerleave',()=>{if(!INS.pinned)insHide(false);});
 document.addEventListener('click',e=>{const t=e.target;if(INS.el.contains(t))return;
  const n=t.closest&&t.closest('[data-ins]');
  if(!n){if(INS.pinned)insHide(true);return;}
  if(t.closest('a,button,[data-click]'))return;                             // a link, a button or an action does its own thing
  e.stopPropagation();insShow(n,true);},true);
 document.addEventListener('focusin',e=>{const n=e.target.closest&&e.target.closest('[data-ins]');if(n&&!INS.el.contains(e.target))insShow(n,false);});}
 return INS.el;}
function insShow(node,pin){const d=insEl(),fn=INS.fns.get(node);if(!fn)return;const key=node.getAttribute('data-ins');
 if(INS.pinned&&!pin&&INS.key!==key)return;
 d.innerHTML=fn()+(pin?'<div class="ins-foot">pinned · Esc to close</div>':'');
 d.classList.toggle('pinned',!!pin);d.style.display='block';INS.key=key;INS.pinned=!!pin;
 const r=node.getBoundingClientRect(),dw=d.offsetWidth,dh=d.offsetHeight,vw=innerWidth,vh=innerHeight;
 let x=r.left+r.width/2-dw/2,y=r.bottom+6;
 if(y+dh>vh-8)y=r.top-dh-6; if(y<8)y=Math.min(vh-dh-8,r.bottom+6);
 x=Math.max(8,Math.min(vw-dw-8,x));d.style.left=x+'px';d.style.top=y+'px';}
function insHide(force){if(!INS.el)return;if(INS.pinned&&!force)return;INS.el.style.display='none';INS.pinned=false;INS.key=null;INS.over=null;}

/* ---------------- pieces ---------------- */
function short(n){return String(n||'').split(' (')[0];}   // a chip carries the name, the inspector the full title
function techChip(t){return '<a class="fx-tech" href="'+h(t.docs||t.homepage||'#')+'" target="_blank" rel="noopener" data-tech="'+h(t.code)+'">'+
 '<i>'+h((t.name||t.code).slice(0,1))+'</i>'+h(short(t.name||t.code))+' <span class="ext">↗</span></a>';}
function techCard(t){return '<b>'+h(t.name||t.code)+'</b><div class="ins-sub">'+h(t.category||'technology')+(t.vendor?' · '+h(t.vendor):'')+'</div>'+
 (t.docs?'<div><a href="'+h(t.docs)+'" target="_blank" rel="noopener">official documentation ↗</a></div>':'')+
 (t.fields&&t.fields.length?'<div class="ins-row"><span>field of knowledge</span>'+t.fields.map(f=>h(f.code)+' '+h(f.label)).join('<br>')+'</div>':'')+
 (t.occupations&&t.occupations.length?'<div class="ins-row"><span>who runs it</span>'+t.occupations.map(o=>h(o.code)+' '+h(o.label)).join('<br>')+'</div>':'');}
function partCard(f){if(!f)return '';const a=(f.addresses||[]);return '<b>'+h(f.title)+'</b>'+(f.role?'<div class="ins-sub">'+h(f.role)+'</div>':'')+
 (a.length?'<div class="ins-row"><span>addresses</span>'+a.map(x=>'<code>'+h(x.address)+'</code> '+h((x.what||[]).join(' · '))).join('<br>')+'</div>':'')+
 (f.tech&&f.tech.length?'<div class="ins-row"><span>runs</span>'+f.tech.map(t=>'<a href="'+h(t.docs)+'" target="_blank" rel="noopener">'+h(t.name)+' ↗</a>').join(' · ')+'</div>':'');}
function head(view,lv){const q=(view.questions||{})[lv.id];   // the MECHANISM's own question at this level, else the level's
 return '<div class="fx-head"><div class="fx-lv"><span class="lvname">'+h(lv.name)+'</span><span class="lvq">'+h(q||lv.question)+'</span></div>'+
 '<h3>'+view.title+'</h3>'+(lv.form==='story'?'':'<p class="fx-claim">'+view.claim+'</p>')+'</div>';}

/* ---------------- 0 · story ---------------- */
function story(root,view,lv){const s=view.story;
 if(!s){root.innerHTML=head(view,lv)+'<p class="fx-empty">No story is written for this mechanism yet (the factory bean, mechanisms[].story).</p>';return;}
 let o=head(view,lv)+'<p class="fx-purpose">'+h(s.purpose)+'</p><ol class="fx-story" style="--n:'+s.stages.length+'">';
 s.stages.forEach((st,i)=>{o+='<li class="fx-stage" data-st="'+i+'"><span class="num">'+(i+1)+'</span><div class="lbl">'+h(st.label)+'</div><div class="doer">'+h(st.doer)+'</div>'+
  (st.tech.length?'<div class="techs">'+st.tech.map(techChip).join('')+'</div>':'')+'</li>';});
 o+='</ol><div class="fx-outcome"><span class="num">✓</span><div><div class="lbl">When it works</div><div class="doer">'+h(s.outcome)+'</div></div></div>';
 if(s.fields&&s.fields.length)o+='<div class="fx-learn"><span>to learn it properly</span>'+s.fields.map(f=>'<span class="fx-field" data-field="'+h(f.code)+'">'+h(f.code)+' · '+h(f.label)+'</span>').join('')+'</div>';
 root.innerHTML=o;
 const T={};s.stages.forEach(st=>st.tech.forEach(t=>T[t.code]=t));
 root.querySelectorAll('.fx-tech').forEach(a=>inspectable(a,'tech:'+a.dataset.tech,()=>techCard(T[a.dataset.tech])));
 root.querySelectorAll('.fx-stage[data-st]').forEach(n=>{const st=s.stages[+n.dataset.st];
  inspectable(n,'stage:'+n.dataset.st,()=>'<b>'+h(st.label)+'</b><div class="ins-sub">'+h(st.doer)+'</div>'+
   (st.parts&&st.parts.length?'<div class="ins-row"><span>in the ledger</span>'+st.parts.map(p=>h(p.title)+(p.role?' — '+h(p.role):'')).join('<br>')+'</div>':''));});
 root.querySelectorAll('.fx-field').forEach(n=>{const f=s.fields.find(x=>x.code===n.dataset.field);
  inspectable(n,'field:'+f.code,()=>'<b>ISCED-F '+h(f.code)+'</b><div class="ins-sub">'+h(f.path.join(' › '))+'</div><div class="ins-row"><span>technologies here</span>'+h(f.techs.join(', '))+'</div>');});}

/* ---------------- 1 · schematic ---------------- */
function schematic(root,view,lv,state){
 root.innerHTML=head(view,lv)+'<div class="fx-fig">'+view.svg+'</div>'+(view.caption?'<div class="fx-cap">'+view.caption+'</div>':'')+
  (view.legend?'<div class="fx-legend">'+view.legend.map(l=>'<span title="'+h(l[1])+'">'+l[2]+h(l[0])+'</span>').join('')+'</div>':'');
 const svg=root.querySelector('svg.schema');svg.classList.add('lv-schematic');
 const byId={};(view.elements||[]).forEach(e=>byId[e.id]=e);
 svg.querySelectorAll('.el').forEach(g=>{const e=byId[g.dataset.el];if(!e)return;
  if(e.pattern==='flow'||e.pattern==='signal'||e.pattern==='boundary'||e.pattern==='band')return;
  const f=(view.facts||{})[e.bean];
  inspectable(g,'el:'+e.id,()=>'<b>'+h(e.label)+'</b><div class="ins-sub">'+h((view.patternMeaning||{})[e.pattern]||e.pattern)+'</div>'+(f?'<div class="ins-row"><span>ledger</span>'+partCard(f)+'</div>':''));});
 (view.actions||[]).forEach(a=>{const g=svg.querySelector('.el[data-el="'+a.el+'"]');if(!g)return;
  g.setAttribute('data-click','action');if(state.onAction){g.style.cursor='pointer';g.addEventListener('click',()=>state.onAction(a));}});}

/* ---------------- 2 · health chain ---------------- */
function spark(pts,w,hh){if(!pts||pts.length<2)return '';const ys=pts.map(p=>+p[1]),mn=Math.min(...ys),mx=Math.max(...ys),r=(mx-mn)||1;
 return '<svg class="spark" viewBox="0 0 '+w+' '+hh+'" preserveAspectRatio="none"><polyline points="'+
  pts.map((p,i)=>(i/(pts.length-1)*w).toFixed(1)+','+(hh-2-((+p[1]-mn)/r)*(hh-4)).toFixed(1)).join(' ')+'"/></svg>';}
function chain(root,view,lv,state){const vals=state.values||{},hist=state.history||{};
 const bind={};(view.binds||[]).forEach(b=>bind[b.id]=b);
 let o=head(view,lv)+'<div class="fx-chain">';
 (view.tiles||[]).forEach((t,i)=>{
  if(t.blind){o+='<div class="fx-tile blind" data-tile="'+i+'"><div class="bar"></div><div class="tname">'+h(t.label)+'</div><div class="tstate">no signal</div><div class="tsub">'+h(t.why)+'</div></div>';return;}
  const bs=t.binds.map(id=>bind[id]).filter(Boolean);let worst='up',o2='';
  bs.forEach(b=>{const v=vals[b.id],st=stateOf(b,v,state.live);
   if(st==='down')worst='down';else if(st==='warn'&&worst!=='down')worst='warn';else if(st==='nd'&&worst==='up')worst='nd';
   if(b.live==='live-value')o2+='<div class="meas"><span class="v">'+(state.live?fmt(v,b.unit):'—')+'</span><span class="mn">'+h(b.short||b.name)+
    (b.warn<1e17?' · warn '+fmt(b.warn,b.unit):'')+'</span>'+spark(hist[b.id],120,22)+'</div>';});
  const word={up:'up',down:'DOWN',warn:'attention',nd:(state.live?'no data':'live on the factory page')}[worst];
  const act=(view.actions||[]).filter(a=>a.el===t.el);
  o+='<div class="fx-tile '+worst+'" data-tile="'+i+'"><div class="bar"></div><div class="tname">'+h(t.label)+'</div><div class="tstate">'+word+'</div>'+o2+
   act.map(a=>'<button class="fx-act" data-act="'+h(a.el)+'">▶ '+h(a.label||a.tool)+'</button>').join('')+'</div>';
  if(i<(view.tiles.length-1))o+='<div class="fx-link"></div>';});
 o+='</div>';
 if(view.alerts&&view.alerts.length)o+='<div class="fx-alerts"><span>armed alerts</span>'+view.alerts.map(a=>'<span class="al">'+h(a)+'</span>').join('')+'</div>';
 root.innerHTML=o;
 root.querySelectorAll('.fx-tile').forEach(n=>{const t=view.tiles[+n.dataset.tile];
  inspectable(n,'tile:'+t.el,()=>{if(t.blind)return '<b>'+h(t.label)+'</b><div class="ins-sub">'+h(t.why)+'</div>'+partCard((view.facts||{})[t.bean]);
   return '<b>'+h(t.label)+'</b>'+t.binds.map(id=>{const b=bind[id];if(!b)return '';const v=vals[id];
    return '<div class="ins-row"><span>'+h(b.name)+'</span>'+(state.live?'<b>'+fmt(v,b.unit)+'</b>':'offline')+(b.warn<1e17?' · warn at '+fmt(b.warn,b.unit)+', critical at '+fmt(b.crit,b.unit):'')+
     '<div class="ins-q">'+h(b.source||'')+'</div></div>';}).join('')+
    (state.grafana?'<div><a href="'+h(state.grafana)+'/d/'+h(view.uid)+'" target="_blank" rel="noopener">history in Grafana ↗</a></div>':'');});});
 root.querySelectorAll('.fx-act').forEach(bn=>bn.addEventListener('click',e=>{e.stopPropagation();const a=(view.actions||[]).find(x=>x.el===bn.dataset.act);
  if(state.onAction)state.onAction(a);else alert('Actions run on the factory live page.');}));}

/* ---------------- 3 · anatomy ---------------- */
function wiringHtml(w){if(!w||!(w.pipes.length||w.processes.length))return '';
 const rails=[];[...w.pipes,...w.processes].forEach(r=>{const k=r.rail||'';if(!rails.includes(k))rails.push(k);});
 let o='<div class="fx-sub">the wiring — every pipe, where it listens, and the line of configuration that makes it · from [['+h(w.bean)+']]</div><div class="wr">';
 rails.forEach(rl=>{const ps=w.pipes.map((p,i)=>[p,i]).filter(([p])=>(p.rail||'')===rl),pr=w.processes.map((p,i)=>[p,i]).filter(([p])=>(p.rail||'')===rl);
  o+='<section class="wr-rail"><h4>'+h(rl||'—')+'</h4>'+
   (ps.length?'<table class="wr-t"><tbody>'+ps.map(([p,i])=>'<tr class="'+h(p.state||'')+'" data-wp="'+i+'"><td class="wr-ft"><b>'+h(p.from)+'</b> <span class="wr-k k-'+h(p.kind.split(/[ +]/)[0])+'">'+h(p.kind)+'</span> <b>'+h(p.to)+'</b></td><td><code>'+h(p.at)+'</code></td><td class="wr-c">'+h(p.config)+'</td></tr>').join('')+'</tbody></table>':'')+
   (pr.length?'<div class="wr-procs">'+pr.map(([p,i])=>'<span class="wr-p '+h(p.state||'')+'" data-wq="'+i+'"><b>'+h(p.proc)+'</b> <i>'+h(p.user)+'</i></span>').join('')+'</div>':'')+'</section>';});
 return o+'</div>';}
function wireWiring(root,w){if(!w)return;
 root.querySelectorAll('[data-wp]').forEach(n=>{const p=w.pipes[+n.dataset.wp];inspectable(n,'wp:'+n.dataset.wp,()=>'<b>'+h(p.from)+' → '+h(p.to)+'</b><div class="ins-sub">'+h(p.kind)+' · '+h(p.at)+'</div><div class="ins-row"><span>config</span>'+h(p.config)+'</div>'+(p.note?'<div class="ins-row">'+h(p.note)+'</div>':'')+(p.state?'<div class="ins-row"><span>state</span>'+h(p.state)+'</div>':''));});
 root.querySelectorAll('[data-wq]').forEach(n=>{const p=w.processes[+n.dataset.wq];inspectable(n,'wq:'+n.dataset.wq,()=>'<b>'+h(p.proc)+'</b><div class="ins-sub">runs as '+h(p.user)+'</div><div class="ins-row">'+h(p.role)+'</div><div class="ins-row"><span>config</span>'+h(p.config)+'</div>'+(p.note?'<div class="ins-row">'+h(p.note)+'</div>':'')+(p.state?'<div class="ins-row"><span>state</span>'+h(p.state)+'</div>':''));});}
function anatomy(root,view,lv){let o=head(view,lv)+wiringHtml(view.wiring)+'<div class="fx-cards">';
 (view.parts||[]).forEach((p,i)=>{o+='<article class="fx-card2" data-part="'+i+'"><header><b>'+h(p.bean)+'</b><span class="kind">'+h(p.kind)+'</span><span class="org">'+h(p.org)+'</span></header>'+
  (p.role?'<div class="role">'+h(p.role)+'</div>':'')+
  (p.anchors.length?'<section><span>identity</span>'+p.anchors.map(a=>'<code'+(a.establishing?' class="est"':'')+'>'+h(a.key)+' = '+h(a.value)+'</code>').join(' ')+'</section>':'')+
  (p.addresses.length?'<section><span>addresses</span>'+p.addresses.map(a=>'<code>'+h(a.address)+'</code> <i>'+h((a.what||[]).join(' · '))+'</i>').join('<br>')+'</section>':'')+
  (p.tech.length?'<section><span>runs</span>'+p.tech.map(techChip).join('')+'</section>':'')+
  '<section><span>provenance</span>'+h(p.provenance)+'</section>'+
  (p.open.length?'<section class="open"><span>open</span>'+p.open.map(x=>'⚠ '+h(x)).join('<br>')+'</section>':'')+'</article>';});
 o+='</div>';
 if(view.steps&&view.steps.length)o+='<div class="fx-sub">the mechanism, step by step — '+h(view.source||'')+'</div><ol class="fx-steps2">'+
  view.steps.map(s=>'<li><div>'+h(s.text)+'</div>'+(s.parts.length?'<div class="touch">'+s.parts.map(b=>'<span class="pchip">'+h(b)+'</span>').join('')+'</div>':'')+'</li>').join('')+'</ol>';
 root.innerHTML=o;wireWiring(root,view.wiring);
 const T={};(view.parts||[]).forEach(p=>p.tech.forEach(t=>T[t.code]=t));
 root.querySelectorAll('.fx-card2').forEach(card=>card.querySelectorAll('.fx-tech').forEach(a=>
  inspectable(a,'tech:'+a.dataset.tech+':'+card.dataset.part,()=>techCard(T[a.dataset.tech]))));
 root.querySelectorAll('.fx-card2 header b').forEach(n=>{const p=view.parts[+n.closest('.fx-card2').dataset.part];
  inspectable(n,'part:'+p.bean,()=>'<b>'+h(p.bean)+'</b><div class="ins-sub">ledger record beans/'+h(p.bean)+'.md</div><div class="ins-row"><span>provenance</span>'+h(p.provenance)+'</div>');});}


/* ---------------- 2 · operate archetypes ----------------
   Each mechanism answers ITS OWN operational question in the shape native to it; the generic chain is the fallback.
   view.operate = {question, archetype, …config with binding ids, notes:[..], blind:[..]} */
function V(state,id){return (state.values||{})[id];}
function B(view,id){return (view.binds||[]).find(b=>b.id===id)||{};}
function stateWord(st,live){return {up:'up',down:'DOWN',warn:'attention',nd:(live?'no data':'live on the factory page')}[st];}
function dot(st){return '<i class="dot '+st+'"></i>';}
function opHead(view,lv,op){return head(view,lv);}
function opFoot(view,op,state){let o='';
 const acts=view.actions||[];
 if(acts.length)o+='<div class="op-acts">'+acts.map(a=>'<button class="fx-act" data-act="'+h(a.el)+'">▶ '+h(a.label||a.tool)+'</button>').join('')+'</div>';
 if((op.notes||[]).length)o+='<ul class="op-notes">'+op.notes.map(n=>'<li>'+h(n)+'</li>').join('')+'</ul>';
 if((op.blind||[]).length)o+='<div class="op-blind"><span>what this view cannot see</span><ul>'+op.blind.map(n=>'<li>'+h(n)+'</li>').join('')+'</ul></div>';
 if(view.alerts&&view.alerts.length)o+='<div class="fx-alerts"><span>alerts that watch this</span>'+view.alerts.map(a=>'<span class="al">'+h(a)+'</span>').join('')+'</div>';
 return o;}
function wireActs(root,view,state){root.querySelectorAll('.fx-act').forEach(bn=>bn.addEventListener('click',e=>{e.stopPropagation();
 const a=(view.actions||[]).find(x=>x.el===bn.dataset.act);if(state.onAction)state.onAction(a);else alert('Actions run on the factory live page.');}));}
function evidence(view,state,ids){return '<div class="op-ev">'+ids.map(id=>{const b=B(view,id),v=V(state,id),st=stateOf(b,v,state.live);
 return '<span class="ev '+st+'" data-ev="'+h(id)+'">'+dot(st)+h(b.short||b.name)+(b.live==='live-value'?' <b>'+(state.live?fmt(v,b.unit):'—')+'</b>':'')+'</span>';}).join('')+'</div>';}
function evInspect(root,view,state){root.querySelectorAll('[data-ev]').forEach(n=>{const b=B(view,n.dataset.ev);
 inspectable(n,'ev:'+b.id,()=>'<b>'+h(b.name)+'</b><div class="ins-row"><span>now</span>'+(state.live?fmt(V(state,b.id),b.unit):'offline')+'</div><div class="ins-q">'+h(b.source||'')+'</div>');});}

function reservoir(root,view,lv,state,op){const lb=B(view,op.level),v=V(state,op.level),live=state.live&&v!=null;
 const pct=live?Math.max(0,Math.min(100,+v)):null,H=220,W=150;
 let svg='<svg class="tank" viewBox="0 0 '+(W+90)+' '+(H+20)+'"><rect x="10" y="10" width="'+W+'" height="'+H+'" rx="18" class="tank-shell"/>';
 if(pct!=null){const fh=H*pct/100,st=stateOf(lb,v,true);svg+='<rect x="10" y="'+(10+H-fh)+'" width="'+W+'" height="'+fh+'" rx="18" class="tank-fill '+st+'"/>';}
 (op.gates||[]).forEach((g,i)=>{const y=10+H-H*g.at/100;svg+='<line x1="4" x2="'+(W+16)+'" y1="'+y+'" y2="'+y+'" class="gate-line"/><text x="'+(W+22+(i%2)*44)+'" y="'+(y+4)+'" class="gate-t">'+h(g.at)+'%</text>';});
 svg+='<text x="'+(10+W/2)+'" y="'+(10+H/2+10)+'" text-anchor="middle" class="tank-v">'+(pct!=null?fmt(v,'percent'):'—')+'</text></svg>';
 const fv=op.forecast?V(state,op.forecast):null;let fc='';
 if(op.forecast){fc=!state.live||fv==null||isNaN(fv)?'—':(fv<0||fv>3650?'not filling':fmt(fv,'days'));}
 let o=opHead(view,lv,op)+'<div class="op-res"><div class="op-tank">'+svg+'</div><div class="op-side">'+
  ((op.gates||[]).length?'<div class="op-gates">'+op.gates.map(g=>'<div class="gt '+(pct!=null&&pct>=g.at?'past':'')+'"><b>'+h(g.at)+'%</b><span>'+h(g.label)+'</span><em>'+(pct==null?'':pct>=g.at?'passed':(g.at-pct).toFixed(1)+' points away')+'</em></div>').join('')+'</div>':'')+
  (op.forecast?'<div class="big"><span class="bv">'+fc+'</span><span class="bl">'+h(B(view,op.forecast).name||'to the gate')+'</span></div>':'')+
  (state.history&&state.history[op.level]?'<div class="big"><span class="bl">'+h(lb.name)+', last 6 hours</span>'+spark(state.history[op.level],260,46)+'</div>':'')+
  ((op.also||[]).length?'<div class="bl">also filling</div>'+evidence(view,state,op.also):'')+
  ((op.parts||[]).length?'<div class="bl">the parts</div>'+evidence(view,state,op.parts):'')+'</div></div>';
 root.innerHTML=o+opFoot(view,op,state);evInspect(root,view,state);wireActs(root,view,state);}

function lanes(root,view,lv,state,op){let o=opHead(view,lv,op)+'<div class="op-lanes">';
 (op.lanes||[]).forEach((ln,i)=>{let worst='up',at=null;
  const hops=ln.hops.map(hp=>{const b=B(view,hp.bind),st=hp.bind?stateOf(b,V(state,hp.bind),state.live):'nd';
   if(st==='down'&&worst!=='down'){worst='down';at=hp.label;}else if(st==='nd'&&worst==='up')worst='nd';return {hp,st};});
  const verdict=worst==='down'?'blocked at '+h(at):worst==='up'?'getting in':(state.live?'partly unknown':'live on the factory page');
  o+='<div class="lane '+worst+'"><div class="ln-name">'+h(ln.name)+'</div><div class="ln-hops">'+hops.map((x,k)=>
   (k?'<span class="ln-link '+x.st+'"></span>':'')+'<span class="hop '+x.st+'" data-hop="'+i+'-'+k+'"><i></i><em>'+h(x.hp.label)+'</em></span>').join('')+
   '</div><div class="ln-verdict">'+verdict+'</div></div>';});
 o+='</div>';root.innerHTML=o+opFoot(view,op,state);
 root.querySelectorAll('[data-hop]').forEach(n=>{const [i,k]=n.dataset.hop.split('-').map(Number),hp=op.lanes[i].hops[k],b=B(view,hp.bind);
  inspectable(n,'hop:'+n.dataset.hop,()=>'<b>'+h(hp.label)+'</b><div class="ins-sub">'+h(op.lanes[i].name)+'</div>'+(hp.bind?'<div class="ins-row"><span>'+h(b.name)+'</span>'+stateWord(stateOf(b,V(state,hp.bind),state.live),state.live)+'</div><div class="ins-q">'+h(b.source||'')+'</div>':'<div class="ins-sub">no signal</div>'));});
 wireActs(root,view,state);}

function roster(root,view,lv,state,op){const sb=B(view,op.series),rows=(V(state,op.series)||[]).slice().sort((a,b)=>b.value-a.value);
 const act=rows.filter(r=>r.value>=(op.active_over||0)),idle=rows.length-act.length,mx=Math.max(1,...act.map(r=>r.value));
 let o=opHead(view,lv,op)+'<div class="op-roster"><div class="ro-head"><span class="bv">'+(state.live?act.length:'—')+'</span><span class="bl">active now'+(state.live?' of '+rows.length:'')+'</span></div>';
 if(!state.live)o+='<p class="bl">The roster is live on the factory page.</p>';
 const show=act.length>=(op.top||12)?act:rows.slice(0,Math.max(act.length,Math.min(op.top||12,rows.length))),mx2=Math.max(1,...show.map(r=>r.value));
 if(state.live&&!act.length&&rows.length)o+='<div class="bl">nobody above the threshold — the busiest queues:</div>';
 show.slice(0,op.top||12).forEach((r,i)=>{const idl=r.value<(op.active_over||0);o+='<div class="ro-row'+(idl?' idle':'')+'" data-ro="'+i+'"><span class="ro-n">'+h(r.name)+'</span><span class="ro-bar"><i style="width:'+(100*r.value/mx2).toFixed(1)+'%"></i></span><span class="ro-v">'+fmt(r.value,sb.unit)+'</span></div>';});
 if(act.length>(op.top||12))o+='<div class="bl">and '+(act.length-(op.top||12))+' more active</div>';
 if(state.live&&idle)o+='<div class="bl">'+idle+' idle (below '+fmt(op.active_over||0,sb.unit)+')</div>';
 o+='</div>'+((op.parts||[]).length?'<div class="bl">the parts</div>'+evidence(view,state,op.parts):'');
 root.innerHTML=o+opFoot(view,op,state);evInspect(root,view,state);wireActs(root,view,state);}

function arc(v,min,max,warn,crit,unit,name){const a=(x)=>Math.PI*(1-(Math.max(min,Math.min(max,x))-min)/(max-min));
 const P=(ang,r)=>[70+r*Math.cos(ang),72-r*Math.sin(ang)];const seg=(x0,x1,cls)=>{const [ax,ay]=P(a(x0),56),[bx,by]=P(a(x1),56);return '<path d="M'+ax+','+ay+' A56,56 0 0 1 '+bx+','+by+'" class="'+cls+'"/>';};
 const st=v==null?'nd':v>=crit?'down':v>=warn?'warn':'up',[nx,ny]=P(a(v==null?min:v),48);
 return '<svg class="arc" viewBox="0 0 140 96">'+seg(min,warn,'arc-ok')+seg(warn,crit,'arc-warn')+seg(crit,max,'arc-crit')+
  (v!=null?'<line x1="70" y1="72" x2="'+nx+'" y2="'+ny+'" class="needle '+st+'"/>':'')+'<circle cx="70" cy="72" r="4" class="hub"/>'+
  '<text x="70" y="92" text-anchor="middle" class="arc-v '+st+'">'+fmt(v,unit)+'</text></svg><div class="arc-n">'+h(name)+'</div>';}
function gauges(root,view,lv,state,op){const sb=B(view,op.series),rows=(V(state,op.series)||[]).slice().sort((a,b)=>a.name<b.name?-1:1);
 let o=opHead(view,lv,op)+'<div class="op-gauges">';
 if(!state.live||!rows.length)o+='<p class="bl">'+(state.live?'no readings':'The gauges are live on the factory page.')+'</p>';
 rows.forEach((r,i)=>{const nm=(op.names||{})[r.name]||('sensor '+(i+1));o+='<div class="gauge" data-g="'+i+'">'+arc(r.value,op.min||0,op.max||50,sb.warn,sb.crit,sb.unit,nm)+'</div>';});
 o+='</div>';root.innerHTML=o+opFoot(view,op,state);
 root.querySelectorAll('[data-g]').forEach(n=>{const r=rows[+n.dataset.g];inspectable(n,'g:'+r.name,()=>'<b>'+h((op.names||{})[r.name]||'sensor')+'</b><div class="ins-row"><span>id</span><code>'+h(r.name)+'</code></div><div class="ins-row"><span>now</span>'+fmt(r.value,sb.unit)+' · warn '+fmt(sb.warn,sb.unit)+' · critical '+fmt(sb.crit,sb.unit)+'</div>');});
 wireActs(root,view,state);}

function board(root,view,lv,state,op){let o=opHead(view,lv,op);
 if((op.facts||[]).length)o+='<div class="op-facts">'+op.facts.map(id=>{const b=B(view,id);return '<div class="big" data-ev="'+h(id)+'"><span class="bv">'+(state.live?fmt(V(state,id),b.unit):'—')+'</span><span class="bl">'+h(b.name)+'</span></div>';}).join('')+'</div>';
 o+='<div class="op-board">'+(op.items||[]).map((it,i)=>{let worst='up';(it.binds||[]).forEach(id=>{const st=stateOf(B(view,id),V(state,id),state.live);if(st==='down')worst='down';else if(st==='nd'&&worst==='up')worst='nd';});
  if(!(it.binds||[]).length)worst='blind';
  return '<div class="dev '+worst+'" data-dev="'+i+'">'+dot(worst==='blind'?'nd':worst)+'<span class="dv-n">'+h(it.label)+'</span><span class="dv-s">'+(worst==='blind'?'no signal':stateWord(worst,state.live))+'</span>'+((worst==='blind'?it.why:it.fact)?'<span class="dv-f">'+h(worst==='blind'?it.why:it.fact)+'</span>':'')+'</div>';}).join('')+'</div>';
 root.innerHTML=o+opFoot(view,op,state);evInspect(root,view,state);
 root.querySelectorAll('[data-dev]').forEach(n=>{const it=op.items[+n.dataset.dev];inspectable(n,'dev:'+n.dataset.dev,()=>'<b>'+h(it.label)+'</b>'+(it.binds||[]).map(id=>{const b=B(view,id);return '<div class="ins-row"><span>'+h(b.name)+'</span>'+stateWord(stateOf(b,V(state,id),state.live),state.live)+'<div class="ins-q">'+h(b.source||'')+'</div></div>';}).join('')+((it.binds||[]).length?'':'<div class="ins-sub">'+h(it.why||'nothing measures it')+'</div>')+partCard((view.facts||{})[it.bean]));});
 wireActs(root,view,state);}

function scoreboard(root,view,lv,state,op){let o=opHead(view,lv,op)+'<div class="op-facts">'+(op.numbers||[]).map(id=>{const b=B(view,id),v=V(state,id),st=stateOf(b,v,state.live);
 return '<div class="big '+st+'" data-ev="'+h(id)+'"><span class="bv">'+(state.live?fmt(v,b.unit):'—')+'</span><span class="bl">'+h(b.name)+'</span></div>';}).join('')+'</div>';
 if(op.list){const rows=V(state,op.list)||[];o+='<div class="op-firing">'+(!state.live?'<p class="bl">What is firing is live on the factory page.</p>':
  rows.length?'<div class="bl">firing now</div>'+rows.map(r=>'<div class="fire">'+dot('down')+h(r.name)+'</div>').join(''):'<div class="calm">'+dot('up')+'nothing is firing</div>')+'</div>';}
 if((op.parts||[]).length)o+='<div class="bl">the watcher\'s own parts</div>'+evidence(view,state,op.parts);
 root.innerHTML=o+opFoot(view,op,state);evInspect(root,view,state);wireActs(root,view,state);}


/* funnel (v0.6): a stream narrowing through its gates. Each stage is a bar (square-root scaled, so 5,000 connections
   and 20 messages share one page and the narrowing still shows), the count, and what the stage costs: its STOPS branch off below it in red, with the
   reason; its MARKS (tagged, filed) sit beside it in amber. Stages may count different units (connections,
   messages, deliveries) — each says which. Below: the headline numbers and a ROLL CALL of every process and pipe. */
function funnel(root,view,lv,state,op){const live=state.live,val=id=>live?V(state,id):null;

    (s.marks||[]).map((mk,mi)=>{const mv=val(mk.bind);return '<div class="fun-mark" data-fm="'+fi+'-'+si+'-'+mi+'">'+(live?fmt(mv,B(view,mk.bind).unit):'—')+' '+h(mk.label)+'</div>';}).join('')+

  o+='</div></div>';});
 (op.rollcall||[]).forEach((rc,ri)=>{const rows=(val(rc.series)||[]).slice().sort((a,b)=>a.name<b.name?-1:1),idle=new Set(rc.idle||[]);

   (live?rows.map((r,i)=>{const st=idle.has(r.name)?'idle':(r.value>=1?'up':'down');return '<span class="rc-c '+st+'" data-rc="'+ri+'-'+i+'">'+dot(st==='idle'?'nd':st)+h(r.name)+(r.value>1?' <b>×'+r.value+'</b>':'')+'</span>';}).join(''):'<span class="bl">live on the factory page</span>')+'</div></div>';
  rc._rows=rows;});

 const src=id=>'<div class="ins-q">'+h(B(view,id).source||'')+'</div>';

  inspectable(n,'fs:'+n.dataset.fs,()=>'<b>'+h(s.label)+'</b><div class="ins-sub">'+h(op.funnels[fi].name)+(s.unit?' · counted in '+h(s.unit):'')+'</div>'+(s.what?'<div class="ins-row">'+h(s.what)+'</div>':'')+src(s.count));});
 root.querySelectorAll('[data-fp]').forEach(n=>{const [fi,si,pi]=n.dataset.fp.split('-').map(Number),sp=op.funnels[fi].stages[si].stops[pi];

  inspectable(n,'rc:'+n.dataset.rc,()=>'<b>'+h(r.name)+'</b><div class="ins-row"><span>now</span>'+(r.value>=1?(r.value>1?r.value+' running':'up'):'not found')+'</div>'+(nt?'<div class="ins-row">'+h(nt)+'</div>':'')+src(rc.series));});}

  wire();
}
function exportOf(s){ return {mechanisms: s.mechanisms.map(m => Object.assign({key: m.key, title: m.title, include: m.include, bindings: m.bindings, actions: m.actions || []}, m.story ? {story: m.story} : {}, m.levels ? {levels: m.levels} : {})), reference: s.reference, kind_details: s.kind_details}; }
function exportSel(){ return exportOf(S); }
function clean(b){ const o = {}; ['at','live','bean','name','short','expr','unit','warn','crit'].forEach(f => { if (b[f] !== '' && b[f] != null) o[f] = (['warn','crit'].includes(f) ? +b[f] : b[f]); }); return o; }
function wire(){
  const A = s => document.querySelectorAll('#author '+s), go = () => { save(); render(); };
  A('[data-mv]').forEach(b => b.onclick = () => { const i = +b.dataset.mv, j = i + +b.dataset.dir; if (j<0||j>=S.mechanisms.length) return; [S.mechanisms[i], S.mechanisms[j]] = [S.mechanisms[j], S.mechanisms[i]]; go(); });
  A('[data-inc]').forEach(c => c.onchange = () => { S.mechanisms[+c.dataset.inc].include = c.checked; go(); });
  A('[data-title]').forEach(c => c.onchange = () => { S.mechanisms[+c.dataset.title].title = c.value; go(); });
  const story = () => { const m = mech(tab); m.story = m.story || {purpose: '', outcome: '', stages: []}; return m.story; };
  A('[data-sf]').forEach(c => c.onchange = () => { story()[c.dataset.sf] = c.value; go(); });
  A('[data-ss]').forEach(c => c.onchange = () => { const x = story().stages[+c.dataset.ss];
    x[c.dataset.f] = (c.dataset.f === 'beans' || c.dataset.f === 'tech') ? c.value.split(',').map(v => v.trim()).filter(Boolean) : c.value; go(); });
  A('[data-ssdel]').forEach(c => c.onclick = () => { story().stages.splice(+c.dataset.ssdel, 1); go(); });
  const sa = $('#ssadd'); if (sa) sa.onclick = () => { story().stages.push({label: '', doer: '', beans: [], tech: []}); go(); };
  A('[data-b]').forEach(c => c.onchange = () => { const m = mech(tab), b = m.bindings[+c.dataset.b]; b[c.dataset.f] = c.value; m.bindings[+c.dataset.b] = clean(b); go(); });
  A('[data-act]').forEach(c => c.onchange = () => { const m = mech(tab); m.actions = (m.actions || []).filter(x => x.at !== c.dataset.act);
    const cur = {at: c.dataset.act}; A('[data-act="' + c.dataset.act + '"]').forEach(i => { if (i.value) cur[i.dataset.f] = i.value; });
    if (cur.tool) m.actions.push(cur); go(); });
  A('[data-bdel]').forEach(c => c.onclick = () => { mech(tab).bindings.splice(+c.dataset.bdel, 1); go(); });
  const ba = $('#badd'); if (ba) ba.onclick = () => { const m = mech(tab); m.bindings = m.bindings || []; m.bindings.push({at: P.views[tab].elements[0].id, live: 'live-state'}); go(); };
  A('[data-rmv]').forEach(b => b.onclick = () => { const i = +b.dataset.rmv, j = i + +b.dataset.dir; if (j<0||j>=S.reference.length) return; [S.reference[i], S.reference[j]] = [S.reference[j], S.reference[i]]; go(); });
  A('[data-r]').forEach(c => c.onchange = () => { S.reference[+c.dataset.r][c.dataset.f] = c.value; go(); });
  A('[data-ralt]').forEach(c => c.onchange = () => { const r = S.reference[+c.dataset.ralt];
    const alt = c.value.split(';').map(x => x.trim()).filter(Boolean).map(x => { const m = x.match(/^(\S+)\s*(.*)$/); return m[2] ? {address: m[1], what: m[2]} : {address: m[1]}; });
    if (alt.length) r.alt = alt; else delete r.alt; go(); });
  A('[data-rdel]').forEach(c => c.onclick = () => { S.reference.splice(+c.dataset.rdel, 1); go(); });
  $('#radd').onchange = e => { if (e.target.value) { S.reference.push({bean: e.target.value, address: '', role: ''}); go(); } };
  A('[data-kind]').forEach(c => c.onchange = () => { const k = c.dataset.kind; S.kind_details[k] = S.kind_details[k] || {}; if (c.value === '') delete S.kind_details[k][c.dataset.kf]; else S.kind_details[k][c.dataset.kf] = +c.value; go(); });
  $('#dl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(exportSel(), null, 1)], {type: 'application/json'})); a.download = 'factory-selection.json'; a.click(); };
  $('#cp').onclick = () => navigator.clipboard && navigator.clipboard.writeText(JSON.stringify(exportSel(), null, 1));
  $('#reset').onclick = () => { S = fresh(); try { localStorage.removeItem(LS); } catch (e) {} render(); };
}

  $('#livebar').innerHTML = 'live · signed in as <b>' + esc(LIVE.user) + '</b> · ledger ' + esc(LIVE.head) +
    (m && LIVE.grafana ? ' · <a href="' + esc(LIVE.grafana) + '/d/' + esc(m.uid) + '" target="_blank" rel="noopener">history in Grafana ↗</a>' : '') + ' · <a href="/logout">sign out</a>'; }
if (LIVE) { $('#authbtn').style.display = 'none'; setInterval(poll, (LIVE.poll || 30) * 1000); }
$('#authbtn').onclick = () => { document.body.classList.toggle('authoring'); $('#authbtn').classList.toggle('on'); render(); };
render();
