<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>daftar — its mechanisms, drawn</title><style>
:root{--bg:#0f1319;--panel:#161c24;--line:#2a3644;--fg:#e8edf3;--muted:#93a1b2;--accent:#ff9d4a;--nfill:#1c2530}
@media(prefers-color-scheme:light){:root{--bg:#eef2f6;--panel:#fff;--line:#cfd8e2;--fg:#17202b;--muted:#5a6a7b;--nfill:#f5f8fb}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:14px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 20px}
h1{font-size:17px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font:600 11px ui-monospace,monospace;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab,.seg button,.btn{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;font:600 13px system-ui}
.tab.active,.seg button.active{background:var(--accent);color:#1a1206;border-color:var(--accent)}
.seg{display:flex;gap:0}.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.forms{margin:12px 0;display:flex;gap:8px;flex-wrap:wrap}a.btn{text-decoration:none}
.btn.primary{border-color:var(--accent);color:var(--accent)}.btn.on{background:var(--accent);color:#1a1206}
.spacer{flex:1}
main{max-width:1180px;margin:0 auto;padding:20px}
.lead{color:var(--muted);margin:0 0 12px}
table.ref{border-collapse:collapse;width:100%;font-size:13px}
table.ref th{text-align:left;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:7px 10px}
table.ref td{border-bottom:1px solid var(--line);padding:7px 10px;vertical-align:top}
.mono{font-family:ui-monospace,monospace}.ipc{color:var(--accent)}
.kd{color:var(--muted);font-size:12px}.kd b{color:var(--fg);font-weight:600}
.reffilter{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
select,input{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font:inherit;font-size:13px}
.org{font:11px ui-monospace,monospace;border-radius:6px;padding:1px 7px;border:1px solid var(--line);color:var(--muted)}
.ffnote{color:var(--muted);font-size:11px;margin-left:auto;max-width:44ch}
#author{display:none;margin-top:18px;border:1px dashed var(--accent);border-radius:14px;padding:14px 16px;background:var(--panel)}
body.authoring #author{display:block}
#author h3{margin:14px 0 6px;font-size:14px;color:var(--accent);letter-spacing:.02em}
#author h3:first-child{margin-top:0}
#author table{border-collapse:collapse;width:100%;font-size:12.5px}
#author th{text-align:left;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:5px 6px}
#author td{border-bottom:1px solid var(--line);padding:4px 6px;vertical-align:middle}
#author input.w{width:100%}#author .note{color:var(--muted);font-size:12px;margin:4px 0 8px}
#author .mini{padding:2px 7px;font-size:12px}
.addr-more{position:relative;display:inline-block;margin-left:4px;font:600 10.5px ui-monospace,monospace;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px;cursor:help;outline:none}
.addr-more .addr-tip{position:absolute;left:0;top:130%;z-index:30;min-width:240px;white-space:nowrap;background:var(--panel);color:var(--fg);border:1px solid var(--accent);border-radius:9px;padding:8px 10px;font:12px/1.6 ui-monospace,monospace;box-shadow:0 8px 28px rgba(0,0,0,.35);visibility:hidden;opacity:0}
.addr-more:hover .addr-tip,.addr-more:focus .addr-tip{visibility:visible;opacity:1}.addr-more .addr-tip b{color:var(--accent);font-weight:600}
#livebar{margin-top:6px}#livebar a{color:var(--accent)}
#toast{display:none;position:fixed;right:18px;bottom:18px;z-index:60;max-width:520px;white-space:pre-wrap;background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;font:12.5px ui-monospace,monospace;box-shadow:0 8px 28px rgba(0,0,0,.4)}
#toast.bad{border-color:#f85149}
#exportbox{white-space:pre;overflow:auto;max-height:220px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;font:11.5px ui-monospace,monospace}

.vw{--bg:#0f1319;--panel:#161c24;--line:#2a3644;--fg:#e8edf3;--muted:#93a1b2;--accent:#ff9d4a;
 --host:#4aa3ff;--svc:#7ee0a1;--ext:#c9a3ff;--store:#6fd6d6;--off:#5a6675;--nfill:#1c2530;--gauge:#ff9d4a;
 --up:#3fb950;--down:#f85149;--nd:#5a6675;--warn:#d29922;color:var(--fg);font:14px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.vw.light{--bg:#eef2f6;--panel:#fff;--line:#cfd8e2;--fg:#17202b;--muted:#5a6a7b;--nfill:#f5f8fb;--off:#9aa7b5}
.vw *{box-sizing:border-box}
.vw .vw-head h3{margin:0;font-size:19px;font-weight:650}.vw .vw-claim{margin:2px 0 0;font-size:14.5px}
.vw .vw-rel{margin:6px 0 0;color:var(--muted);font-size:12px}.vw .vw-rel b{color:var(--fg);font-weight:600}
.vw .vw-rel a{color:var(--accent)}
.vw .vw-fig{margin:12px 0 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;overflow-x:auto}
.vw svg.schema{width:100%;height:auto;display:block;min-width:620px;color:var(--fg)}
.vw .vw-cap{margin:12px 0 0;font-size:13.5px;line-height:1.6;max-width:95ch}.vw .vw-cap b{font-weight:700}
.vw .k-accent{color:var(--accent)}.vw .k-off{color:var(--off)}
.vw .nbox{fill:var(--nfill);stroke:var(--line);stroke-width:1}
.vw .node.soma .nbar{fill:var(--host)}.vw .node.empsychon .nbar{fill:var(--svc)}.vw .node.ext .nbar{fill:var(--ext)}
.vw .node.lekton .nbar{fill:var(--store)}.vw .node.accent .nbar{fill:var(--accent)}
.vw .node.accent .nbox{stroke:var(--accent);stroke-width:1.6}.vw .node.off .nbox{stroke-dasharray:4 3;opacity:.6}
.vw .node.off .nbar{fill:var(--off)}.vw .node.ext .nbox{stroke-dasharray:5 3}
.vw .ntitle{fill:var(--fg);font:700 13px system-ui}.vw .nip{fill:var(--muted);font:600 11px ui-monospace,monospace}
.vw .nsub{fill:var(--muted);font:12px system-ui}
.vw .cyl{fill:var(--nfill);stroke:var(--store);stroke-width:1.2}.vw .cyltop{fill:none;stroke:var(--store);stroke-width:1.2}
.vw .edge{stroke:var(--muted);stroke-width:1.6;fill:none}.vw .ah{fill:var(--muted)}
.vw .edge.sig{stroke-dasharray:5 3;opacity:.85}
.vw .edge.accent{stroke:var(--accent);stroke-width:2.2}.vw .ah-accent{fill:var(--accent)}
.vw .edge.off{stroke:var(--off);stroke-dasharray:4 3;opacity:.7}.vw .ah-off{fill:var(--off)}
.vw .flab{fill:var(--fg);font:11px system-ui;paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.vw .flab.accent{fill:var(--accent);font-weight:600}.vw .flab.sig{fill:var(--muted)}
.vw .gbox{fill:var(--nfill);stroke:var(--accent);stroke-width:1.6}.vw .glabel{fill:var(--fg);font:600 11px system-ui}
.vw .tbox{fill:var(--nfill);stroke:var(--line)}.vw .ttext{fill:var(--muted);font:11px system-ui}
.vw .tag-warn .tbox,.vw .tag-off .tbox{stroke:var(--accent)}.vw .tag-warn .ttext,.vw .tag-off .ttext{fill:var(--accent)}
.vw .bandbox{fill:none;stroke:var(--line);stroke-dasharray:3 3}.vw .bandtext{fill:var(--muted);font:600 11px system-ui;letter-spacing:.03em}
.vw .gauge-bg{fill:var(--nfill);stroke:var(--line)}.vw .gauge-fill{fill:var(--gauge)}
.vw .ribbonbox{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-dasharray:2 3}
.vw .ribbon-t{fill:var(--accent);font:600 12px ui-monospace,monospace}
.vw .actbtn .abox{fill:var(--accent);stroke:var(--accent)}.vw .actbtn .atext{fill:#1a1206;font:700 13px system-ui}
.vw .actbtn .ahint{fill:#1a1206;opacity:.6;font:9px ui-monospace,monospace;text-transform:uppercase}.vw .actbtn{cursor:pointer}
/* an element a lens hides */
.vw .vw-hide{display:none}
/* live: the element itself changes, in the drawing's own stroke and font */
.vw .el.live-up .nbox,.vw .el.live-up .cyl,.vw .el.live-up .gbox{stroke:var(--up);stroke-width:2.6}
.vw .el.live-down .nbox,.vw .el.live-down .cyl,.vw .el.live-down .gbox{stroke:var(--down);stroke-width:3}
.vw .el.live-down .ntitle{fill:var(--down)}
.vw .vw-chip rect{stroke:var(--panel);stroke-width:2}.vw .vw-chip text{font:700 10.5px system-ui;fill:#fff}
.vw .vw-chip.up rect{fill:var(--up)}.vw .vw-chip.down rect{fill:var(--down)}.vw .vw-chip.nd rect{fill:var(--nd)}
.vw .vw-chip.warn rect{fill:var(--warn)}.vw .vw-chip.val text{fill:#0b0f14}.vw .vw-chip.nd text{fill:#e8edf3}
.vw .el[data-bean]{cursor:help}
.vw .nip.nip-more{text-decoration:underline dotted;cursor:help}.vw .nip{pointer-events:all}
/* legend */
.vw .vw-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:12px;align-items:center}
.vw .vw-legend span{display:flex;align-items:center;gap:5px}.vw .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.vw .sw.soma{background:var(--host)}.vw .sw.empsychon{background:var(--svc)}.vw .sw.ext{background:var(--ext)}
.vw .sw.store{background:var(--store)}.vw .sw.accent{background:var(--accent)}.vw .sw.off{background:var(--off)}
.vw .sw.pat{border:1px solid var(--muted)}.vw .sw.up{background:var(--up)}.vw .sw.down{background:var(--down)}
.vw .vw-legend svg{vertical-align:middle}
/* inspect: facts and steps */
.vw .vw-detail{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:14px}
.vw .vw-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px}
.vw .vw-card h4{margin:0 0 4px;font-size:13px}.vw .vw-card .mono{font-family:ui-monospace,monospace;color:var(--accent)}
.vw .vw-card dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 8px}
.vw .vw-card dt{color:var(--muted)}.vw .vw-card dd{margin:0;overflow-wrap:anywhere}
.vw .vw-steps{margin:14px 0 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px 10px 30px;font-size:12.5px}
.vw .vw-steps li{margin:3px 0}.vw .vw-sub{color:var(--muted);font-size:12px;margin:14px 0 0;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
/* a hover card for a being */
.vw{position:relative}.vw .vw-tip{position:absolute;z-index:40;max-width:340px;background:var(--panel);border:1px solid var(--accent);
 border-radius:9px;padding:9px 11px;font-size:12px;line-height:1.5;box-shadow:0 8px 28px rgba(0,0,0,.35);pointer-events:none}
.vw .vw-tip b{display:block;margin-bottom:2px}
/* glossary */
.vw .gloss{border-bottom:1px dotted var(--accent);cursor:help;position:relative;outline:none}
.vw .gloss .tip{position:absolute;left:0;bottom:150%;z-index:30;width:300px;max-width:78vw;background:var(--panel);color:var(--fg);
 border:1px solid var(--accent);border-radius:9px;padding:9px 11px;font:12px/1.55 system-ui;box-shadow:0 8px 28px rgba(0,0,0,.35);
 opacity:0;visibility:hidden;transition:opacity .12s;text-align:left;font-weight:400}
.vw .gloss:hover .tip,.vw .gloss:focus .tip{opacity:1;visibility:visible}

/* ===== lenses: four forms, one inspector ===== */
.vw .vw-lv{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.vw .lvname{font:700 11px ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.vw .lvq{color:var(--muted);font-size:12.5px;font-style:italic}
.vw .vw-empty{color:var(--muted)}
.vw svg.schema .el[data-ins]{cursor:pointer;outline:none}
.vw svg.schema .el[data-ins]:hover .nbox,.vw svg.schema .el[data-ins]:focus .nbox{stroke:var(--accent);stroke-width:2}
.vw .bnd{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:6 4}.vw .bndtext{fill:var(--muted);font:600 10.5px system-ui;letter-spacing:.05em;text-transform:uppercase}
/* story */
.vw .vw-purpose{font-size:18px;line-height:1.45;margin:10px 0 18px;max-width:62ch;font-weight:500}
.vw .vw-story{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:26px 30px}
.vw .vw-stage{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 16px 14px;outline:none;
 transition:border-color .15s,transform .15s}
.vw .vw-stage:hover,.vw .vw-stage:focus{border-color:var(--accent);transform:translateY(-2px)}
.vw .vw-stage:not(:last-child)::after{content:"";position:absolute;right:-24px;top:34px;width:16px;height:16px;border-top:3px solid var(--line);border-right:3px solid var(--line);transform:rotate(45deg);border-radius:2px}
.vw .vw-stage .num{position:absolute;top:-13px;left:14px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#1a1206;font:800 13px system-ui;display:grid;place-items:center}
.vw .vw-stage .lbl{font:650 15.5px/1.3 system-ui;margin-top:4px}
.vw .vw-stage .doer{color:var(--muted);font-size:13px;line-height:1.45;margin-top:6px}
.vw .vw-outcome{display:flex;gap:14px;align-items:flex-start;margin-top:22px;border:1px solid var(--up);border-radius:16px;padding:14px 16px;background:var(--panel)}
.vw .vw-outcome .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--up);color:#06120a;font:800 13px system-ui;display:grid;place-items:center}
.vw .vw-outcome .lbl{font:650 15px system-ui}.vw .vw-outcome .doer{color:var(--muted);font-size:13.5px;margin-top:2px}
.vw .techs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.vw .vw-tech{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border:1px solid var(--line);border-radius:99px;color:var(--fg);text-decoration:none;font:600 12px system-ui;background:var(--nfill);outline:none}
.vw .vw-tech i{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#1a1206;display:grid;place-items:center;font:800 11px system-ui;font-style:normal}
.vw .vw-tech:hover,.vw .vw-tech:focus{border-color:var(--accent)}.vw .vw-tech .ext{color:var(--muted);font-weight:400}
.vw .vw-learn{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:12.5px}
.vw .vw-learn>span:first-child{text-transform:uppercase;letter-spacing:.06em;font-size:11px;margin-right:4px}
.vw .vw-field{border:1px dashed var(--line);border-radius:8px;padding:2px 9px;cursor:help;outline:none}.vw .vw-field:hover{border-color:var(--accent);color:var(--fg)}
/* health chain */
.vw .vw-chain{display:flex;flex-wrap:wrap;align-items:stretch;gap:0;margin-top:14px}
.vw .vw-tile{position:relative;min-width:170px;max-width:240px;flex:1 1 170px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 20px;margin:6px 0;outline:none;cursor:pointer}
.vw .vw-tile .bar{position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:14px 0 0 14px;background:var(--nd)}
.vw .vw-tile.up .bar{background:var(--up)}.vw .vw-tile.down .bar{background:var(--down)}.vw .vw-tile.warn .bar{background:var(--warn)}
.vw .vw-tile.down{border-color:var(--down)}.vw .vw-tile:hover,.vw .vw-tile:focus{border-color:var(--accent)}
.vw .vw-tile .tname{font:650 14px system-ui}.vw .vw-tile .tstate{font:700 11px ui-monospace,monospace;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.vw .vw-tile.up .tstate{color:var(--up)}.vw .vw-tile.down .tstate{color:var(--down)}.vw .vw-tile.warn .tstate{color:var(--warn)}
.vw .vw-tile .tsub{color:var(--muted);font-size:12px;margin-top:6px}
.vw .vw-tile.blind{background:repeating-linear-gradient(135deg,var(--panel) 0 8px,var(--nfill) 8px 16px);opacity:.85}
.vw .meas{margin-top:8px}.vw .meas .v{font:700 24px/1.1 system-ui;display:block}.vw .meas .mn{color:var(--muted);font-size:11.5px}
.vw .spark{display:block;width:100%;height:22px;margin-top:4px}.vw .spark polyline{fill:none;stroke:var(--accent);stroke-width:1.6;vector-effect:non-scaling-stroke}
.vw .vw-link{align-self:center;width:18px;height:2px;background:var(--line)}
.vw .vw-act{margin-top:10px;width:100%;background:var(--accent);color:#1a1206;border:0;border-radius:8px;padding:6px 8px;font:700 12.5px system-ui;cursor:pointer}
.vw .vw-alerts{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-size:12px}
.vw .vw-alerts>span:first-child{text-transform:uppercase;letter-spacing:.06em;font-size:11px}.vw .vw-alerts .al{border:1px solid var(--line);border-radius:6px;padding:1px 7px}
/* anatomy */
.vw .vw-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:12px}
.vw .vw-card2{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:12.5px}
.vw .vw-card2 header{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.vw .vw-card2 header b{font:700 14px ui-monospace,monospace;cursor:help;outline:none}
.vw .vw-card2 .genos,.vw .vw-card2 .org{font:11px ui-monospace,monospace;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.vw .vw-card2 .role{color:var(--muted);margin:4px 0 2px}
.vw .vw-card2 section{margin-top:8px;line-height:1.55}.vw .vw-card2 section>span{display:block;font:600 10.5px system-ui;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.vw .vw-card2 code{font:11.5px ui-monospace,monospace;color:var(--accent)}.vw .vw-card2 code.est{font-weight:700}.vw .vw-card2 i{color:var(--muted);font-style:normal}
.vw .vw-card2 section.open{color:var(--warn)}
.vw .vw-card2 .vw-tech{margin:2px 4px 2px 0}
.vw .vw-steps2{margin:10px 0 0;padding-left:22px;font-size:12.5px}.vw .vw-steps2 li{margin:6px 0}.vw .touch{margin-top:3px}
.vw .pchip{font:11px ui-monospace,monospace;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-right:4px;color:var(--muted)}
/* the inspector — one card, fixed, never clipped */
.vw-ins{position:fixed;z-index:1000;display:none;max-width:380px;min-width:220px;background:var(--panel,#161c24);color:var(--fg,#e8edf3);
 border:1px solid var(--accent,#ff9d4a);border-radius:12px;padding:10px 12px;font:12.5px/1.55 system-ui;box-shadow:0 12px 36px rgba(0,0,0,.4);pointer-events:auto}
.vw-ins.pinned{box-shadow:0 0 0 2px var(--accent,#ff9d4a),0 12px 36px rgba(0,0,0,.4)}.vw-ins b{font-size:13.5px}.vw-ins a{color:var(--accent,#ff9d4a)}
.vw-ins .ins-sub{color:var(--muted,#93a1b2);margin:1px 0 4px}.vw-ins .ins-row{margin-top:6px}.vw-ins .ins-row>span{display:block;font:600 10px system-ui;letter-spacing:.06em;text-transform:uppercase;color:var(--muted,#93a1b2)}

 (t.docs?'<div><a href="'+h(t.docs)+'" target="_blank" rel="noopener">official documentation ↗</a></div>':'')+
 (t.fields&&t.fields.length?'<div class="ins-row"><span>field of knowledge</span>'+t.fields.map(f=>h(f.code)+' '+h(f.label)).join('<br>')+'</div>':'')+
 (t.occupations&&t.occupations.length?'<div class="ins-row"><span>who runs it</span>'+t.occupations.map(o=>h(o.code)+' '+h(o.label)).join('<br>')+'</div>':'');}
function partCard(f){if(!f)return '';const a=(f.addresses||[]);return '<b>'+h(f.title)+'</b>'+(f.role?'<div class="ins-sub">'+h(f.role)+'</div>':'')+
 (a.length?'<div class="ins-row"><span>addresses</span>'+a.map(x=>'<code>'+h(x.address)+'</code> '+h((x.what||[]).join(' · '))).join('<br>')+'</div>':'')+
 (f.tech&&f.tech.length?'<div class="ins-row"><span>runs</span>'+f.tech.map(t=>'<a href="'+h(t.docs)+'" target="_blank" rel="noopener">'+h(t.name)+' ↗</a>').join(' · ')+'</div>':'');}
function head(view,lv){const q=(view.questions||{})[lv.id];   // the DRAWING's own question at this lens, else the lens's own
 return '<div class="vw-head"><div class="vw-lv"><span class="lvname">'+h(lv.name)+'</span><span class="lvq">'+h(q||lv.question)+'</span></div>'+
 '<h3>'+view.title+'</h3>'+(lv.form==='story'?'':'<p class="vw-claim">'+view.claim+'</p>')+'</div>';}

/* ---------------- orient · story ---------------- */
function story(root,view,lv){const s=view.story;
 if(!s){root.innerHTML=head(view,lv)+'<p class="vw-empty">No story is written for this drawing.</p>';return;}
 let o=head(view,lv)+'<p class="vw-purpose">'+h(s.purpose)+'</p><ol class="vw-story" style="--n:'+s.stages.length+'">';
 s.stages.forEach((st,i)=>{o+='<li class="vw-stage" data-st="'+i+'"><span class="num">'+(i+1)+'</span><div class="lbl">'+h(st.label)+'</div><div class="doer">'+h(st.doer)+'</div>'+
  (st.tech.length?'<div class="techs">'+st.tech.map(techChip).join('')+'</div>':'')+'</li>';});
 o+='</ol><div class="vw-outcome"><span class="num">✓</span><div><div class="lbl">When it works</div><div class="doer">'+h(s.outcome)+'</div></div></div>';
 if(s.fields&&s.fields.length)o+='<div class="vw-learn"><span>to learn it properly</span>'+s.fields.map(f=>'<span class="vw-field" data-field="'+h(f.code)+'">'+h(f.code)+' · '+h(f.label)+'</span>').join('')+'</div>';
 root.innerHTML=o;
 const T={};s.stages.forEach(st=>st.tech.forEach(t=>T[t.code]=t));
 root.querySelectorAll('.vw-tech').forEach(a=>inspectable(a,'tech:'+a.dataset.tech,()=>techCard(T[a.dataset.tech])));
 root.querySelectorAll('.vw-stage[data-st]').forEach(n=>{const st=s.stages[+n.dataset.st];
  inspectable(n,'stage:'+n.dataset.st,()=>'<b>'+h(st.label)+'</b><div class="ins-sub">'+h(st.doer)+'</div>'+
   (st.parts&&st.parts.length?'<div class="ins-row"><span>in the ledger</span>'+st.parts.map(p=>h(p.title)+(p.role?' — '+h(p.role):'')).join('<br>')+'</div>':''));});
 root.querySelectorAll('.vw-field').forEach(n=>{const f=s.fields.find(x=>x.code===n.dataset.field);
  inspectable(n,'field:'+f.code,()=>'<b>'+h(f.scheme)+' '+h(f.code)+'</b><div class="ins-sub">'+h(f.path.join(' › '))+'</div><div class="ins-row"><span>technologies here</span>'+h(f.techs.join(', '))+'</div>');});}

/* ---------------- understand · schematic ---------------- */
function schematic(root,view,lv,state){
 root.innerHTML=head(view,lv)+'<div class="vw-fig">'+view.svg+'</div>'+(view.caption?'<div class="vw-cap">'+view.caption+'</div>':'')+
  (view.legend?'<div class="vw-legend">'+view.legend.map(l=>'<span title="'+h(l[1])+'">'+l[2]+h(l[0])+'</span>').join('')+'</div>':'');
 const svg=root.querySelector('svg.schema');svg.classList.add('lv-schematic');
 const byId={};(view.elements||[]).forEach(e=>byId[e.id]=e);
 svg.querySelectorAll('.el').forEach(g=>{const e=byId[g.dataset.el];if(!e)return;
  if(e.pattern==='flow'||e.pattern==='signal'||e.pattern==='boundary'||e.pattern==='band')return;
  const f=(view.facts||{})[e.bean];
  inspectable(g,'el:'+e.id,()=>'<b>'+h(e.label)+'</b><div class="ins-sub">'+h((view.patternMeaning||{})[e.pattern]||e.pattern)+'</div>'+(f?'<div class="ins-row"><span>ledger</span>'+partCard(f)+'</div>':''));});
 (view.actions||[]).forEach(a=>{const g=svg.querySelector('.el[data-el="'+a.el+'"]');if(!g)return;
  g.setAttribute('data-click','action');if(state.onAction){g.style.cursor='pointer';g.addEventListener('click',()=>state.onAction(a));}});}

/* ---------------- operate · the health chain, the fallback ---------------- */
function spark(pts,w,hh){if(!pts||pts.length<2)return '';const ys=pts.map(p=>+p[1]),mn=Math.min(...ys),mx=Math.max(...ys),r=(mx-mn)||1;
 return '<svg class="spark" viewBox="0 0 '+w+' '+hh+'" preserveAspectRatio="none"><polyline points="'+
  pts.map((p,i)=>(i/(pts.length-1)*w).toFixed(1)+','+(hh-2-((+p[1]-mn)/r)*(hh-4)).toFixed(1)).join(' ')+'"/></svg>';}
function histLink(view,state){return state.historyUrl?'<div><a href="'+h(state.historyUrl)+'/d/'+h(view.uid)+'" target="_blank" rel="noopener">history ↗</a></div>':'';}
function chain(root,view,lv,state){const vals=state.values||{},hist=state.history||{};
 const bind={};(view.binds||[]).forEach(b=>bind[b.id]=b);
 let o=head(view,lv)+'<div class="vw-chain">';
 (view.tiles||[]).forEach((t,i)=>{
  if(t.blind){o+='<div class="vw-tile blind" data-tile="'+i+'"><div class="bar"></div><div class="tname">'+h(t.label)+'</div><div class="tstate">no signal</div><div class="tsub">'+h(t.why)+'</div></div>';return;}
  const bs=t.binds.map(id=>bind[id]).filter(Boolean);let worst='up',o2='';
  bs.forEach(b=>{const v=vals[b.id],st=stateOf(b,v,state.live);
   if(st==='down')worst='down';else if(st==='warn'&&worst!=='down')worst='warn';else if(st==='nd'&&worst==='up')worst='nd';
   if(b.live==='live-value')o2+='<div class="meas"><span class="v">'+(state.live?fmt(v,b):'—')+'</span><span class="mn">'+h(b.short||b.name)+
    (b.warn!=null?' · warn '+fmt(b.warn,b):'')+'</span>'+spark(hist[b.id],120,22)+'</div>';});
  const word={up:'up',down:'DOWN',warn:'attention',nd:(state.live?'no data':ELSEWHERE)}[worst];
  const act=(view.actions||[]).filter(a=>a.el===t.el);
  o+='<div class="vw-tile '+worst+'" data-tile="'+i+'"><div class="bar"></div><div class="tname">'+h(t.label)+'</div><div class="tstate">'+word+'</div>'+o2+
   act.map(a=>'<button class="vw-act" data-act="'+h(a.el)+'">▶ '+h(a.label||a.tool)+'</button>').join('')+'</div>';
  if(i<(view.tiles.length-1))o+='<div class="vw-link"></div>';});
 o+='</div>';
 if(view.alerts&&view.alerts.length)o+='<div class="vw-alerts"><span>armed alerts</span>'+view.alerts.map(a=>'<span class="al">'+h(a)+'</span>').join('')+'</div>';
 root.innerHTML=o;
 root.querySelectorAll('.vw-tile').forEach(n=>{const t=view.tiles[+n.dataset.tile];
  inspectable(n,'tile:'+t.el,()=>{if(t.blind)return '<b>'+h(t.label)+'</b><div class="ins-sub">'+h(t.why)+'</div>'+partCard((view.facts||{})[t.bean]);
   return '<b>'+h(t.label)+'</b>'+t.binds.map(id=>{const b=bind[id];if(!b)return '';const v=vals[id];
    return '<div class="ins-row"><span>'+h(b.name)+'</span>'+(state.live?'<b>'+fmt(v,b)+'</b>':'offline')+(b.warn!=null?' · warn at '+fmt(b.warn,b):'')+(b.crit!=null?', critical at '+fmt(b.crit,b):'')+
     '<div class="ins-q">'+h(b.source||'')+'</div></div>';}).join('')+histLink(view,state);});});
 root.querySelectorAll('.vw-act').forEach(bn=>bn.addEventListener('click',e=>{e.stopPropagation();const a=(view.actions||[]).find(x=>x.el===bn.dataset.act);
  if(state.onAction)state.onAction(a);else alert('Actions run on the served page.');}));}

/* ---------------- inspect · anatomy ---------------- */
function wiringHtml(w){if(!w||!(w.pipes.length||w.processes.length))return '';
 const rails=[];[...w.pipes,...w.processes].forEach(r=>{const k=r.rail||'';if(!rails.includes(k))rails.push(k);});
 let o='<div class="vw-sub">the wiring — every pipe, where it listens, and the line of configuration that makes it · from [['+h(w.bean)+']]</div><div class="wr">';
 rails.forEach(rl=>{const ps=w.pipes.map((p,i)=>[p,i]).filter(([p])=>(p.rail||'')===rl),pr=w.processes.map((p,i)=>[p,i]).filter(([p])=>(p.rail||'')===rl);
  o+='<section class="wr-rail"><h4>'+h(rl||'—')+'</h4>'+
   (ps.length?'<table class="wr-t"><tbody>'+ps.map(([p,i])=>'<tr class="'+h(p.state||'')+'" data-wp="'+i+'"><td class="wr-ft"><b>'+h(p.from)+'</b> <span class="wr-k">'+h(p.channel)+'</span> <b>'+h(p.to)+'</b></td><td><code>'+h(p.at)+'</code></td><td class="wr-c">'+h(p.config)+'</td></tr>').join('')+'</tbody></table>':'')+
   (pr.length?'<div class="wr-procs">'+pr.map(([p,i])=>'<span class="wr-p '+h(p.state||'')+'" data-wq="'+i+'"><b>'+h(p.proc)+'</b> <i>'+h(p.user)+'</i></span>').join('')+'</div>':'')+'</section>';});
 return o+'</div>';}
function wireWiring(root,w){if(!w)return;
 root.querySelectorAll('[data-wp]').forEach(n=>{const p=w.pipes[+n.dataset.wp];inspectable(n,'wp:'+n.dataset.wp,()=>'<b>'+h(p.from)+' → '+h(p.to)+'</b><div class="ins-sub">'+h(p.channel)+' · '+h(p.at)+'</div><div class="ins-row"><span>config</span>'+h(p.config)+'</div>'+(p.note?'<div class="ins-row">'+h(p.note)+'</div>':'')+(p.state?'<div class="ins-row"><span>state</span>'+h(p.state)+'</div>':''));});
 root.querySelectorAll('[data-wq]').forEach(n=>{const p=w.processes[+n.dataset.wq];inspectable(n,'wq:'+n.dataset.wq,()=>'<b>'+h(p.proc)+'</b><div class="ins-sub">runs as '+h(p.user)+'</div><div class="ins-row">'+h(p.role)+'</div><div class="ins-row"><span>config</span>'+h(p.config)+'</div>'+(p.note?'<div class="ins-row">'+h(p.note)+'</div>':'')+(p.state?'<div class="ins-row"><span>state</span>'+h(p.state)+'</div>':''));});}
function anatomy(root,view,lv){let o=head(view,lv)+wiringHtml(view.wiring)+'<div class="vw-cards">';
 (view.parts||[]).forEach((p,i)=>{o+='<article class="vw-card2" data-part="'+i+'"><header><b>'+h(p.bean)+'</b><span class="genos">'+h(p.genos)+'</span><span class="org">'+h(p.org||'no organisation')+'</span></header>'+
  (p.role?'<div class="role">'+h(p.role)+'</div>':'')+
  (p.anchors.length?'<section><span>identity</span>'+p.anchors.map(a=>'<code'+(a.establishing?' class="est"':'')+'>'+h(a.key)+' = '+h(a.value)+'</code>').join(' ')+'</section>':'')+
  (p.addresses.length?'<section><span>addresses</span>'+p.addresses.map(a=>'<code>'+h(a.address)+'</code> <i>'+h((a.what||[]).join(' · '))+'</i>').join('<br>')+'</section>':'')+
  (p.rows&&p.rows.length?'<section><span>facts</span>'+p.rows.map(r=>'<i>'+h(r[0])+'</i> '+h(r[1])).join('<br>')+'</section>':'')+
  (p.tech.length?'<section><span>runs</span>'+p.tech.map(techChip).join('')+'</section>':'')+
  '<section><span>provenance</span>'+h(p.provenance)+'</section>'+
  (p.open.length?'<section class="open"><span>open</span>'+p.open.map(x=>'⚠ '+h(x)).join('<br>')+'</section>':'')+'</article>';});
 o+='</div>';
 if(view.steps&&view.steps.length)o+='<div class="vw-sub">step by step — '+h(view.source||'')+'</div><ol class="vw-steps2">'+
  view.steps.map(s=>'<li><div>'+h(s.text)+'</div>'+(s.parts.length?'<div class="touch">'+s.parts.map(b=>'<span class="pchip">'+h(b)+'</span>').join('')+'</div>':'')+'</li>').join('')+'</ol>';
 root.innerHTML=o;wireWiring(root,view.wiring);
 const T={};(view.parts||[]).forEach(p=>p.tech.forEach(t=>T[t.code]=t));
 root.querySelectorAll('.vw-card2').forEach(card=>card.querySelectorAll('.vw-tech').forEach(a=>
  inspectable(a,'tech:'+a.dataset.tech+':'+card.dataset.part,()=>techCard(T[a.dataset.tech]))));
 root.querySelectorAll('.vw-card2 header b').forEach(n=>{const p=view.parts[+n.closest('.vw-card2').dataset.part];
  inspectable(n,'part:'+p.bean,()=>'<b>'+h(p.bean)+'</b><div class="ins-sub">ledger record beans/'+h(p.bean)+'.md</div><div class="ins-row"><span>provenance</span>'+h(p.provenance)+'</div>');});}


/* ---------------- operate · archetypes ----------------
   Each drawing answers ITS OWN operational question in the shape native to it; the health chain is the fallback.
   view.operate = {archetype, …what the shape reads, as binding ids, notes:[..], blind:[..]} */
function V(state,id){return (state.values||{})[id];}
function B(view,id){return (view.binds||[]).find(b=>b.id===id)||{};}
function stateWord(st,live){return {up:'up',down:'DOWN',warn:'attention',nd:(live?'no data':ELSEWHERE)}[st];}
function dot(st){return '<i class="dot '+st+'"></i>';}
function opFoot(view,op,state){let o=corrHtml(view,op,state);
 const acts=view.actions||[];
 if(acts.length)o+='<div class="op-acts">'+acts.map(a=>'<button class="vw-act" data-act="'+h(a.el)+'">▶ '+h(a.label||a.tool)+'</button>').join('')+'</div>';
 if((op.notes||[]).length)o+='<ul class="op-notes">'+op.notes.map(n=>'<li>'+h(n)+'</li>').join('')+'</ul>';
 if((op.blind||[]).length)o+='<div class="op-blind"><span>what this page cannot see</span><ul>'+op.blind.map(n=>'<li>'+h(n)+'</li>').join('')+'</ul></div>';
 if(view.alerts&&view.alerts.length)o+='<div class="vw-alerts"><span>alerts that watch this</span>'+view.alerts.map(a=>'<span class="al">'+h(a)+'</span>').join('')+'</div>';
 return o;}
function wireActs(root,view,state){wireCorr(root,view,state);root.querySelectorAll('.vw-act').forEach(bn=>bn.addEventListener('click',e=>{e.stopPropagation();
 const a=(view.actions||[]).find(x=>x.el===bn.dataset.act);if(state.onAction)state.onAction(a);else alert('Actions run on the served page.');}));}
function evidence(view,state,ids){return '<div class="op-ev">'+ids.map(id=>{const b=B(view,id),v=V(state,id),st=stateOf(b,v,state.live);
 return '<span class="ev '+st+'" data-ev="'+h(id)+'">'+dot(st)+h(b.short||b.name)+(b.live==='live-value'?' <b>'+(state.live?fmt(v,b):'—')+'</b>':'')+'</span>';}).join('')+'</div>';}
function evInspect(root,view,state){root.querySelectorAll('[data-ev]').forEach(n=>{const b=B(view,n.dataset.ev);
 inspectable(n,'ev:'+b.id,()=>'<b>'+h(b.name)+'</b><div class="ins-row"><span>now</span>'+(state.live?fmt(V(state,b.id),b):'offline')+'</div><div class="ins-q">'+h(b.source||'')+'</div>');});}
function winText(view){const w=view.window||{};return w.hours?('last '+(w.hours%1?w.hours:w.hours.toFixed(0))+' h'):'';}

/* reservoir: a store filling toward its thresholds. The fill is read as a share of the whole, by its unit. */
function reservoir(root,view,lv,state,op){const lb=B(view,op.fill),v=V(state,op.fill),live=state.live&&v!=null;
 const pct=live?Math.max(0,Math.min(100,pctOf(lb,+v))):null,H=220,Wd=150;
 let svg='<svg class="tank" viewBox="0 0 '+(Wd+90)+' '+(H+20)+'"><rect x="10" y="10" width="'+Wd+'" height="'+H+'" rx="18" class="tank-shell"/>';
 if(pct!=null){const fh=H*pct/100,st=stateOf(lb,v,true);svg+='<rect x="10" y="'+(10+H-fh)+'" width="'+Wd+'" height="'+fh+'" rx="18" class="tank-fill '+st+'"/>';}
 (op.thresholds||[]).forEach((g,i)=>{const y=10+H-H*g.at/100;svg+='<line x1="4" x2="'+(Wd+16)+'" y1="'+y+'" y2="'+y+'" class="gate-line"/><text x="'+(Wd+22+(i%2)*44)+'" y="'+(y+4)+'" class="gate-t">'+h(num(g.at))+'%</text>';});
 svg+='<text x="'+(10+Wd/2)+'" y="'+(10+H/2+10)+'" text-anchor="middle" class="tank-v">'+(pct!=null?fmt(pct,PCT):'—')+'</text></svg>';
 const fb=B(view,op.forecast),fv=op.forecast?V(state,op.forecast):null;let fc='';
 if(op.forecast){const s=fb.q==='duration'?coherent(fb,+fv):+fv;fc=!state.live||fv==null||isNaN(fv)?'—':(s<0||s>3650*86400?'not filling':fmt(fv,fb));}
 let o=head(view,lv)+'<div class="op-res"><div class="op-tank">'+svg+'</div><div class="op-side">'+
  ((op.thresholds||[]).length?'<div class="op-gates">'+op.thresholds.map(g=>'<div class="gt '+(pct!=null&&pct>=g.at?'past':'')+'"><b>'+h(num(g.at))+'%</b><span>'+h(g.label)+'</span><em>'+(pct==null?'':pct>=g.at?'passed':(g.at-pct).toFixed(1)+' points away')+'</em></div>').join('')+'</div>':'')+
  (op.forecast?'<div class="big"><span class="bv">'+fc+'</span><span class="bl">'+h(fb.name||'to the next threshold')+'</span></div>':'')+
  (state.history&&state.history[op.fill]?'<div class="big"><span class="bl">'+h(lb.name)+', '+h(winText(view))+'</span>'+spark(state.history[op.fill],260,46)+'</div>':'')+
  ((op.also||[]).length?'<div class="bl">also filling</div>'+evidence(view,state,op.also):'')+
  ((op.parts||[]).length?'<div class="bl">the parts</div>'+evidence(view,state,op.parts):'')+'</div></div>';
 root.innerHTML=o+opFoot(view,op,state);evInspect(root,view,state);wireActs(root,view,state);}

function lanes(root,view,lv,state,op){let o=head(view,lv)+'<div class="op-lanes">';
 (op.lanes||[]).forEach((ln,i)=>{let worst='up',at=null;
  const hops=ln.hops.map(hp=>{const b=B(view,hp.bind),st=hp.bind?stateOf(b,V(state,hp.bind),state.live):'nd';
   if(st==='down'&&worst!=='down'){worst='down';at=hp.label;}else if(st==='nd'&&worst==='up')worst='nd';return {hp,st};});
  const verdict=worst==='down'?'blocked at '+h(at):worst==='up'?'getting through':(state.live?'partly unknown':ELSEWHERE);
  o+='<div class="lane '+worst+'"><div class="ln-name">'+h(ln.name)+'</div><div class="ln-hops">'+hops.map((x,k)=>
   (k?'<span class="ln-link '+x.st+'"></span>':'')+'<span class="hop '+x.st+'" data-hop="'+i+'-'+k+'"><i></i><em>'+h(x.hp.label)+'</em></span>').join('')+
   '</div><div class="ln-verdict">'+verdict+'</div></div>';});
 o+='</div>';root.innerHTML=o+opFoot(view,op,state);
 root.querySelectorAll('[data-hop]').forEach(n=>{const [i,k]=n.dataset.hop.split('-').map(Number),hp=op.lanes[i].hops[k],b=B(view,hp.bind);
  inspectable(n,'hop:'+n.dataset.hop,()=>'<b>'+h(hp.label)+'</b><div class="ins-sub">'+h(op.lanes[i].name)+'</div>'+(hp.bind?'<div class="ins-row"><span>'+h(b.name)+'</span>'+stateWord(stateOf(b,V(state,hp.bind),state.live),state.live)+'</div><div class="ins-q">'+h(b.source||'')+'</div>':'<div class="ins-sub">no signal</div>'));});
 wireActs(root,view,state);}

function itemName(b,n){return ((b.item_names||{})[n])||n;}
function roster(root,view,lv,state,op){const sb=B(view,op.per_item),rows=(V(state,op.per_item)||[]).slice().sort((a,b)=>b.value-a.value);
 const over=op.active_over||0,top=op.top||12,act=rows.filter(r=>r.value>=over),idle=rows.length-act.length;
 let o=head(view,lv)+'<div class="op-roster"><div class="ro-head"><span class="bv">'+(state.live?act.length:'—')+'</span><span class="bl">active now'+(state.live?' of '+rows.length:'')+'</span></div>';
 if(!state.live)o+='<p class="bl">The roster is '+ELSEWHERE+'.</p>';
 const show=act.length>=top?act:rows.slice(0,Math.max(act.length,Math.min(top,rows.length))),mx2=Math.max(1,...show.map(r=>r.value));
 if(state.live&&!act.length&&rows.length)o+='<div class="bl">nothing above the threshold — the busiest:</div>';
 show.slice(0,top).forEach((r,i)=>{const idl=r.value<over;o+='<div class="ro-row'+(idl?' idle':'')+'" data-ro="'+i+'"><span class="ro-n">'+h(itemName(sb,r.name))+'</span><span class="ro-bar"><i style="width:'+(100*r.value/mx2).toFixed(1)+'%"></i></span><span class="ro-v">'+fmt(r.value,sb)+'</span></div>';});
 if(act.length>top)o+='<div class="bl">and '+(act.length-top)+' more active</div>';
 if(state.live&&idle)o+='<div class="bl">'+idle+' idle (below '+fmt(over,sb)+')</div>';

/* race: a run of a procedure against its deadline — the step it is at (a step of the procedure the view draws: 0

  if(fin<=dl){verdict='done in about '+dur(eta)+' — '+dur(dl-fin)+' before the deadline';vst='up';}

/* correlate: any shape may add it. Several values on ONE time axis, stacked, so what moves together is seen together; a

  if(r.pts.length>1){let d='';r.pts.forEach((p,k)=>{const X=x(+p[0]).toFixed(1),Y=y(+p[1]).toFixed(1);d+=k?'H'+X+'V'+Y:'M'+X+','+Y;});g+='<path d="'+d+'" class="corr-line"/>';}

 const bands=c.bands||[];
 if(c.band&&bands.length)o+='<div class="corr-key">'+bands.map((lb,v)=>'<span><i style="background:'+PHC[v%PHC.length]+'"></i>'+h(lb)+'</span>').join('')+'</div>';
 if(band.length){const vals=[...new Set(band.map(p=>+p[1]).filter(v=>!isNaN(v)))].sort((a,b)=>a-b);
  o+='<div class="corr-sub">each value, averaged over the time each step held</div><div class="corr-aggw"><table class="corr-agg"><thead><tr><th></th>'+vals.map(v=>{const n=band.filter(p=>+p[1]===v).length;

  gene.forEach(g => { const terms = [...new Set(Object.values(P.beans).filter(b => b.genos === g).flatMap(b => Object.keys(b.fields)))].sort();
    o += '<div style="overflow-x:auto"><table><thead><tr><th style="width:140px">'+esc(g)+'</th>'+terms.map(t => '<th>'+esc(t)+'</th>').join('')+'</tr></thead><tbody><tr><td class="kd">from lens</td>'+
      terms.map(t => { const f = S.fields.find(x => x.genos === g && x.term === t) || {}; return '<td>'+sel([['','—']].concat((P.levels||[]).map(l => [l.id, l.id])), f.shown_from || '', 'data-kg="'+esc(g)+'" data-kt="'+esc(t)+'"')+'</td>'; }).join('')+'</tr></tbody></table></div><br>'; });
  o += '<h3>Export</h3><p class="note">Download the selection, then bring it into the ledger: <span class="mono">python3 assets/view/bin/dmview.py import view-selection.json</span> — it validates it, writes the page through dmsafe, reads it back and journals it.</p>'+
       '<button class="btn primary" id="dl">Download view-selection.json</button> <button class="btn" id="cp">Copy</button> <button class="btn" id="reset">Reset to the page</button> <span id="dirty" class="kd"></span><div id="exportbox"></div>';
  $('#author').innerHTML = o;
  const ex = exportOf(S); $('#exportbox').textContent = JSON.stringify(ex, null, 1);
  $('#dirty').textContent = JSON.stringify(ex) === JSON.stringify(exportOf(fresh())) ? 'no change from the page' : 'changed from the page — export and import to keep it';
  wire();
}
function exportOf(s){ return {order: s.order, views: s.views, bindings: s.bindings, reference: s.reference, fields: s.fields}; }
function wire(){
  const A = s => document.querySelectorAll('#author '+s), go = () => { save(); render(); };
  A('[data-mv]').forEach(b => b.onclick = () => { const i = +b.dataset.mv, j = i + +b.dataset.dir; if (j<0||j>=S.order.length) return; [S.order[i], S.order[j]] = [S.order[j], S.order[i]]; go(); });
  A('[data-label]').forEach(c => c.onchange = () => { const e = ed(c.dataset.label); if (c.value) e.label = c.value; else delete e.label; go(); });
  A('[data-sf]').forEach(c => c.onchange = () => { ed(tab)[c.dataset.sf] = c.value; go(); });
  A('[data-ss]').forEach(c => c.onchange = () => { const x = ed(tab).stages[+c.dataset.ss], f = c.dataset.f;
    if (f === 'beings') x.beings = csv(c.value).map(b => ({being: b})); else if (f === 'uses') x.uses = csv(c.value).map(t => ({technology: t})); else x[f] = c.value;
    if (x.beings && !x.beings.length) delete x.beings; if (x.uses && !x.uses.length) delete x.uses; go(); });
  A('[data-ssdel]').forEach(c => c.onclick = () => { ed(tab).stages.splice(+c.dataset.ssdel, 1); go(); });
  const sa = $('#ssadd'); if (sa) sa.onclick = () => { const e = ed(tab); e.stages = e.stages || []; e.stages.push({label: '', doer: ''}); go(); };
  A('[data-q]').forEach(c => c.onchange = () => { const e = ed(tab); e.questions = (e.questions || []).filter(q => q.lens !== c.dataset.q); if (c.value) e.questions.push({lens: c.dataset.q, ask: c.value}); go(); });
  A('[data-b]').forEach(c => c.onchange = () => { const b = S.bindings[c.dataset.b], f = c.dataset.f;
    if (f === 'technology' || f === 'says') { const q = (b.query || [])[0] || {}; q[f] = c.value; b.query = q.technology ? [q] : []; if (!b.query.length) delete b.query; }
    else if (c.value === '') delete b[f]; else b[f] = c.value; go(); });
  A('[data-bdel]').forEach(c => c.onclick = () => { delete S.bindings[c.dataset.bdel]; go(); });
  const ba = $('#badd'); if (ba) ba.onclick = () => { let n = 1; while (S.bindings[tab + '-' + n]) n++; S.bindings[tab + '-' + n] = {view: tab, element: P.views[tab].elements[0].id, live: 'live-state'}; go(); };
  A('[data-act]').forEach(c => c.onchange = () => { const e = ed(tab); e.actions = (e.actions || []).filter(x => x.element !== c.dataset.act);
    const cur = {element: c.dataset.act}; A('[data-act="' + c.dataset.act + '"]').forEach(i => { if (i.value) cur[i.dataset.f] = i.value; });
    if (cur.tool) e.actions.push(cur); go(); });
  A('[data-rmv]').forEach(b => b.onclick = () => { const i = +b.dataset.rmv, j = i + +b.dataset.dir; if (j<0||j>=S.reference.length) return; [S.reference[i], S.reference[j]] = [S.reference[j], S.reference[i]]; go(); });
  A('[data-r]').forEach(c => c.onchange = () => { const r = S.reference[+c.dataset.r]; if (c.value) r[c.dataset.f] = c.value; else delete r[c.dataset.f]; go(); });
  A('[data-rdel]').forEach(c => c.onclick = () => { S.reference.splice(+c.dataset.rdel, 1); go(); });
  $('#radd').onchange = e => { if (e.target.value) { S.reference.push({being: e.target.value}); go(); } };
  A('[data-kg]').forEach(c => c.onchange = () => { S.fields = S.fields.filter(f => !(f.genos === c.dataset.kg && f.term === c.dataset.kt));
    if (c.value) S.fields.push({genos: c.dataset.kg, term: c.dataset.kt, shown_from: c.value}); go(); });
  $('#dl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(exportOf(S), null, 1)], {type: 'application/json'})); a.download = 'view-selection.json'; a.click(); };
  $('#cp').onclick = () => navigator.clipboard && navigator.clipboard.writeText(JSON.stringify(exportOf(S), null, 1));
  $('#reset').onclick = () => { S = fresh(); try { localStorage.removeItem(LS); } catch (e) {} render(); };
}
function renderLive(){
  $('#livebar').innerHTML = 'live · signed in as <b>' + esc(LIVE.user) + '</b> · ledger ' + esc(LIVE.head) +
    (LIVE.history && P.views[tab] ? ' · <a href="' + esc(LIVE.history) + '/d/' + esc(P.views[tab].uid) + '" target="_blank" rel="noopener">history ↗</a>' : '') + ' · <a href="/logout">sign out</a>'; }
if (LIVE || !P.author) { $('#authbtn').style.display = 'none'; }
if (LIVE) { setInterval(poll, (LIVE.poll || 30) * 1000); }
$('#authbtn').onclick = () => { document.body.classList.toggle('authoring'); $('#authbtn').classList.toggle('on'); render(); };
render();
