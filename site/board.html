<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
<title>daftar</title>
<meta name="description" content="A notebook you keep with your AI agents: every fact says who said it, every change is journalled, and a gate refuses what breaks the rules.">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/board.css">
</head>
<body>
<div class="wrap">
<header>
  <div>
    <div class="brand"><h1>daftar</h1><span class="fa" lang="fa" dir="rtl">دفتر</span></div>
    <p class="tag" data-t="tagline">{{tagline}}</p>
  </div>
  <div class="side">
    <div class="langs" id="langs" role="group" aria-label="{{lang_group}}" data-ta="lang_group"></div>
    <div class="meta"><span dir="ltr"><b>__RELEASE__</b> · std-vocab <b>__VERSION__</b></span><span id="counts"></span><span id="boards">{{boards}}</span></div>
  </div>
</header>

<div class="axis" role="group" aria-label="{{lens_group}}" data-ta="lens_group">
  <span class="name" data-t="lens_axis">{{lens_axis}}</span>
  <button class="rot" id="lprev" aria-label="{{prev_lens}}" data-ta="prev_lens">‹</button>
  <div class="lenses" id="lenses"></div>
  <button class="rot" id="lnext" aria-label="{{next_lens}}" data-ta="next_lens">›</button>
</div>

<div class="stage">
  <div class="dialbox">
    <svg id="dial" viewBox="-66 -4 492 368" role="group" aria-label="{{dial_label}}" data-ta="dial_label"></svg>
    <div class="mrot">
      <button class="rot" id="mprev" aria-label="{{prev_mech}}" data-ta="prev_mech">‹</button>
      <div class="cap" id="cap"></div>
      <button class="rot" id="mnext" aria-label="{{next_mech}}" data-ta="next_mech">›</button>
    </div>
    <p class="dialnote" data-t="dialnote">{{dialnote}}</p>
  </div>
  <section class="board" id="board" aria-live="polite"></section>
</div>

<footer>
  <span data-t="footer">{{footer}}</span>
  <a href="https://github.com/0mit/daftar" dir="ltr">github.com/0mit/daftar</a>
  <a href="https://github.com/0mit/daftar/blob/master/README.md" dir="ltr">README</a>
  <a href="https://github.com/0mit/daftar/blob/master/MODEL.md" data-t="link_model">{{link_model}}</a>
  <a href="https://github.com/0mit/daftar/blob/master/MANIFESTO.md" data-t="link_manifesto">{{link_manifesto}}</a>
</footer>
</div>
<script type="application/json" id="data">/*__DATA__*/</script>
<script src="assets/board.js"></script>
</body>
</html>
