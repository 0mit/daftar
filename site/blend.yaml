# site/blend.yaml — the words of the one page, which site/blend.py renders from the release (site/board.py):
# a sentence you write, the ladder you climb, a garden played back, and yours. Every form, refusal, rule, count,
# level and role on the page is read from the release; these are only the story's words, in each language.
# `moments` are told in order: one that names a `mechanism` shows that board's proved form and refusal; a `vacant`
# one is a moment the build does not grow yet, told from the law (`items`, as the catalogue names them).
ui:
  en:
    was: written first
    moment: moment {i} of {n}
    earlier: earlier
    later: later
    you_label: Tell your agent
    next_time: The next time you sit down, tell it to read `AGENTS.md` in the notebook.
    skip: Skip to the page
    movements: The page
    m1: A sentence
    m2: A ladder
    m3: A garden's time
    m4: Yours
    lens_group: Read it as
    lang_group: Language
    s_kicker: ①  The language
    s_head: Every fact is one sentence.
    s_lede: 'A verb, and the roles it fills — the same seven roles in every sentence, whatever it is about. Six are the kārakas Pāṇini named for Sanskrit; the seventh is Aristotle''s “as”. A role is not a place in the sentence: it is what a word does in it.'
    s_roles: The seven roles
    s_try: Write it, and let the gate answer
    s_first: Save it as first written
    s_mended: Save it as the gate passed it
    s_taken: Taken. The gate passed this form when the page was built.
    s_refused: Refused
    s_again: Fix what it names, and save again.
    s_nojs: 'As first written, the gate said:'
    l_kicker: ②  The world
    l_head: Every being stands somewhere on one ladder.
    l_lede: From the frame every body takes its room in, through matter, gravitation and the living, to reason, what is made and what is said. Each step stands on the one below it — made of it, or possible on it — and the law keeps every joint. Scroll down the page and you climb.
    l_here: You are here
    l_levels: Its steps
    l_stands: stands on
    l_made_of: made of
    l_possible_on: possible on
    l_while: while
    l_crown: Above every step
    l_mechs: What the notebook keeps here
    t_kicker: ③  The notebook's life
    t_head: A garden, played back.
    t_how: 'Step through its history with the buttons or the arrow keys: earlier is where your writing starts, later where it ends.'
    t_told: 'Not lived by the build yet: told from the law.'
    y_kicker: ④  Yours
    y_head: Your notebook.
    f_counts: '{rules} rules · {verbs} verbs · {tables} tables · {relations} relations · {reasons} reasons, read from release {release}'
    f_built: Built from the release it describes. Every form on this page was passed, and every refusal printed, by that release's own gate.
  fa:
    was: نخست این‌گونه نوشته شد
    moment: لحظه‌ی {i} از {n}
    earlier: پیش‌تر
    later: پس‌تر
    you_label: به عاملتان بگویید
    next_time: دفعه‌ی بعد که پشت کار می‌نشینید، به آن بگویید `AGENTS.md` را در دفتر بخواند.
    skip: رفتن به صفحه
    movements: صفحه
    m1: یک جمله
    m2: یک نردبان
    m3: زمانِ یک باغ
    m4: از آنِ شما
    lens_group: بخوانید همچون
    lang_group: زبان
    s_kicker: ①  زبان
    s_head: هر گزاره یک جمله است.
    s_lede: 'یک فعل، و نقش‌هایی که پر می‌کند: همان هفت نقش در هر جمله، درباره‌ی هر چه باشد. شش تا کارَکه‌هایی‌اند که پانینی برای سنسکریت نام برد؛ هفتمی «همچونِ» ارسطوست. نقش جایی در جمله نیست: کاری است که واژه در آن می‌کند.'
    s_roles: هفت نقش
    s_try: بنویسید، و بگذارید دروازه پاسخ دهد
    s_first: همان‌گونه که نخست نوشته شد ذخیره کن
    s_mended: همان‌گونه که دروازه پذیرفت ذخیره کن
    s_taken: پذیرفته شد. دروازه این شکل را هنگامِ ساختنِ صفحه پذیرفت.
    s_refused: رد شد
    s_again: آنچه را نام می‌برد درست کنید، و دوباره ذخیره کنید.
    s_nojs: 'به شکلِ نخست، دروازه گفت:'
    l_kicker: ②  جهان
    l_head: هر هستی جایی بر یک نردبان می‌ایستد.
    l_lede: از چارچوبی که هر جسم جایش را در آن می‌گیرد، از ماده، گرانش و زندگان، تا خرد، ساخته‌ها و گفته‌ها. هر پله بر پله‌ی زیرینش می‌ایستد (ساخته از آن، یا ممکن بر آن) و قانون هر پیوند را نگه می‌دارد. صفحه را پایین بروید تا بالا بروید.
    l_here: شما اینجایید
    l_levels: پله‌هایش
    l_stands: می‌ایستد بر
    l_made_of: ساخته از
    l_possible_on: ممکن بر
    l_while: تا وقتی
    l_crown: بالاتر از هر پله
    l_mechs: آنچه دفتر اینجا نگه می‌دارد
    t_kicker: ③  زندگیِ دفتر
    t_head: یک باغ، از نخستین روز.
    t_how: 'با دکمه‌ها یا کلیدهای جهت در تاریخچه‌اش گام بردارید: پیش‌تر آن‌جاست که نوشتنِ شما آغاز می‌شود، پس‌تر آن‌جا که پایان می‌یابد.'
    t_told: 'هنوز ساخت آن را نزیسته: از زبانِ قانون گفته شده.'
    y_kicker: ④  از آنِ شما
    y_head: دفترِ شما.
    f_counts: '{rules} قاعده · {verbs} فعل · {tables} جدول · {relations} پیوند · {reasons} دلیل، خوانده از نسخه‌ی {release}'
    f_built: ساخته از همان نسخه‌ای که توصیفش می‌کند. هر شکلِ این صفحه را دروازه‌ی خودِ آن نسخه پذیرفت، و هر پاسخِ رد را خودش چاپ کرد.
roles_fa:
  by: 'کننده: آن که مستقل است و کار را می‌کند'
  of: آنچه کار به آن می‌رسد، یا آنچه درباره‌ی آن است
  through: 'وسیله: ابزار، سند، واژه‌ها، پیوند، روند، توافق، علت'
  to: برای که، یا به سوی چه
  from: 'نقطه‌ی ثابتی که از آن جدا می‌شود: سرچشمه، دهنده، والد'
  at: 'جایگاه، زمینه: جایی در یک چارچوب (کجا و کی، برای جسم؛ کدام، در تاکسیس، برای گفته‌ها)، یا آنچه چیزی بر آن می‌ایستد'
  as: 'در چه مقامی، یا همچون چه: نامی که نام‌دهنده می‌دهد، کاری که هستی می‌کند، شیوه‌ای که چیزی می‌ایستد'
