    boards: "{l} نگاه × {m} سازوکار، {b} تابلو"
    counts: "{terms} اصطلاح، {registries} فهرست، {relations} رابطه، {reasons} دلیل"
    lang_group: "زبان"
    lens_axis: "نگاه"
    lens_group: "چه کسی نگاه می‌کند"
    prev_lens: "نگاه قبلی"
    next_lens: "نگاه بعدی"
    prev_mech: "سازوکار قبلی"
    next_mech: "سازوکار بعدی"
    dial_label: "ده سازوکار، و پرونده‌هایی که هر جفت را به هم می‌بندند"
    dialnote: "هر وتر دو سازوکار را به هم می‌پیوندد؛ ضخامتش نشان می‌دهد چند پرونده از خودِ دفتر (ابزارها، آزمون‌ها، سندها) هر دو را در بر دارند. کلیدهای جهت: ← → سازوکار، ↑ ↓ نگاه."
    footer: "این صفحه از همان نسخه‌ای ساخته می‌شود که توصیفش می‌کند. تابلوهای نگهبان و وترها از قانون، دلیل‌هایش و کاتالوگش خوانده می‌شوند."
