# The boards of the one page: what each lens is told of each mechanism. The keeper's board is read from the release
# itself (the law's meanings, their reasons, the catalogue's rules, relations and checks); these are the words a person
# writes. `items` are the law's own parts the mechanism is made of, as the catalogue names them. An agent's form and
# its refusal are proved, never written: `scene` names the beans of site/garden.yaml the form is shown from and how to
# break it once, and the refusal shown is what the gate printed — it must contain `refused`, or the page is not built.
lenses:
  - { id: person, label: "What is it?", who: "someone curious",
      fa: { label: "این چیست؟", who: "کسی کنجکاو" } }
  - { id: gardener, label: "What do I do?", who: "a gardener",
      fa: { label: "من چه کنم؟", who: "باغبان" } }
  - { id: agent, label: "How is it written?", who: "an agent",
      fa: { label: "چگونه نوشته می‌شود؟", who: "عامل" } }
  - { id: keeper, label: "Why is it so, and where?", who: "a keeper of the law",
      fa: { label: "چرا چنین است، و کجا؟", who: "نگهبان قانون" } }
languages:
  - { id: en, label: "English", dir: ltr }
  - { id: fa, label: "فارسی", dir: rtl }
# The page's own words, in each language. `{name}` is filled by the page; the law's words, the forms and what the gate
# prints are the release's own, and stay as it states them.
