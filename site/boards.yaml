    rope_files: "{n} پرونده"
    ground: "پرونده‌هایی که همه‌ی سازوکارها را نگه می‌دارند و از همین رو در وترها نیامده‌اند: {files}."
    stapled: "دوخته به"
mechanisms:
  - id: who
    short: "Who said it"
    name: "Who said it"
    glyph: "✎"
    items: [term:provenance_src, term:identity_status, term:identifier, section:identity_policy, section:provenance_record]
    staples: { what: "an identity is given to a kind of being", between: "a fact keeps who said it as it crosses", gate: "a fact with no source does not pass" }
    person: >
      Every fact in the notebook says who said it and how they know — you, or an agent; told, measured or guessed. A
      thing is recognised by what identifies it (a serial, a domain name, a code someone published), never by the name
      of its file, so two notebooks that never met can find the same thing.
    gardener: >
      You say what is true; the agent writes it with you as its source. What an agent later measures is written beside
      what you said, never over it — only you change your own word. You ratify what identifies a thing.
    agent_note: "An agent alone records what it observed or inferred; an identity anchor is a person's to ratify."
    scene:
      show: [ { bean: hallway-nas, keys: [identity, provenance] } ]
      break: { bean: hallway-nas-2, copy_of: hallway-nas }
      refused: "establishing anchor serial"
    fa:
      name: "چه کسی گفت"
      short: "چه کسی گفت"
      person: "هر گزاره در این دفتر می‌گوید چه کسی آن را گفته و از کجا می‌داند: شما یا یک عامل؛ شنیده، سنجیده یا حدس‌زده. هر چیز را با آنچه هویتش را نشان می‌دهد می‌شناسند (یک شماره‌ی سریال، یک نام دامنه، کدی که کسی منتشر کرده)، نه با نام پرونده‌اش؛ پس دو دفتری که هرگز همدیگر را ندیده‌اند می‌توانند یک چیز واحد را پیدا کنند."
      gardener: "شما می‌گویید چه چیزی درست است؛ عامل آن را می‌نویسد و شما را منبعش می‌گذارد. آنچه عامل بعدها می‌سنجد کنار گفته‌ی شما نوشته می‌شود، هرگز روی آن؛ تنها خودتان حرف خودتان را تغییر می‌دهید. آنچه هویت یک چیز را نشان می‌دهد، شما تأیید می‌کنید."
      agent_note: "عامل به‌تنهایی فقط آنچه را دیده یا استنباط کرده ثبت می‌کند؛ تأیید لنگر هویت با یک انسان است."
      staples: { what: "هویت به گونه‌ای از موجود داده می‌شود", between: "گزاره هنگام گذر، گوینده‌اش را با خود نگه می‌دارد", gate: "گزاره‌ی بی‌منبع از دروازه نمی‌گذرد" }
  - id: what
    short: "What & whose"
    name: "What it is, and whose"
    glyph: "◈"
    items: [section:natures, section:complexity, section:gene, section:crown, term:creator, term:owned_by, term:responsibility]
    staples: { who: "its kind says which identities it may take", money: "an agreement may be owned by neither party", gate: "every ownership chain must end" }
    person: >
      A thing is first a nature — soma, a body, standing at its level among bodies; lekton, what exists by being
      said — then its kind, which says while what it lives. Each thing has exactly one owner and one who answers for
      it, per facet, and every chain ends: at a person, at someone outside the notebook, or at the crown, which is the
      life chain, where nobody owns.
    gardener: >
      Say what a thing is and who it belongs to; the agent picks its kind and writes who answers for it. A domain is
      held, not owned; a person owns themselves; an agreement between two may be owned by neither.
    agent_note: "The kind refines the nature; the rules for what a thing may say attach to its nature and every kind inherits them."
    scene:
      show: [ { bean: hallway-nas, keys: [genos, nature, owned_by, responsibility] } ]
      break: { bean: hallway-nas, replace: ["owned_by: { legal: { owner: { bean: sam } } }", "owned_by: { legal: { } }"] }
      refused: "needs one of"
    fa:
      name: "چیست، و از آنِ کیست"
      short: "چیستی و مالکیت"
      person: "هر چیز نخست یک سرشت است (سوما، جسم، که در مرتبه‌ی خود میان اجسام می‌ایستد؛ لکتون، آنچه با گفته شدن هست) و سپس گونه‌اش، که می‌گوید در چه حالی زنده است. هر چیز، در هر وجه، دقیقاً یک مالک دارد و یک پاسخگو، و هر زنجیره‌ای پایان می‌یابد: به یک شخص، به کسی بیرون از دفتر، یا به تاج، که همان زنجیره‌ی زندگی است، جایی که هیچ‌کس مالک نیست."
      gardener: "بگویید یک چیز چیست و از آنِ کیست؛ عامل گونه‌اش را برمی‌گزیند و می‌نویسد چه کسی پاسخگوی آن است. دامنه در اختیار است، نه در مالکیت؛ هر شخص مالک خویش است؛ توافقی میان دو نفر ممکن است از آنِ هیچ‌کدام نباشد."
      agent_note: "گونه، سرشت را دقیق‌تر می‌کند؛ قاعده‌های آنچه یک چیز می‌تواند بگوید به سرشتش بسته‌اند و هر گونه آن‌ها را به ارث می‌برد."
      staples: { who: "گونه‌اش می‌گوید چه هویت‌هایی می‌تواند بپذیرد", money: "توافق ممکن است از آنِ هیچ‌یک از دو طرف نباشد", gate: "هر زنجیره‌ی مالکیت باید پایان یابد" }
  - id: when
    short: "When"
    name: "When"
    glyph: "◷"
    items: [value_types, term:timing, section:anchor_systems, section:aspects]
    staples: { where: "a moment is in time and in place together", line: "a series lies along a line of time", money: "a clause falls due on a day" }
    person: >
      A day or a moment is a position, in any calendar — Gregorian, Persian, Hebrew and more — at the precision it was
      said. Where nobody said the day, it is placed by what it followed. Deep time too, and lines that hold at no time:
      the first, the second.
    gardener: >
      Say the day as you know it, in your own calendar; say "after the dinner" if that is all you know. Nothing is
      invented to fill a gap: what nobody said stays unsaid, and the notebook says so.
    agent_note: "A day may be written short (2026-09-20) or long, as one entry of timing, to say its system, its unit, or what it followed."
    scene:
      show: [ { bean: dinner-at-sams, keys: [timing] }, { bean: storage-rent, keys: [parties] } ]
      break: { bean: dinner-at-sams, replace: ["2026-09-12 19:30", "2026-02-30 19:30"] }
      refused: "is no day of gregorian-civil"
    fa:
      name: "کِی"
      short: "کِی"
      person: "یک روز یا یک لحظه، جایگاهی است در هر گاه‌شماری (میلادی، خورشیدی، عبری و بیشتر) با همان دقتی که گفته شده. جایی که کسی روز را نگفته، بر پایه‌ی آنچه پیش از آن رخ داده جای می‌گیرد. زمان ژرف هم، و ترتیب‌هایی که به هیچ زمانی بسته نیستند: نخستین، دومین."
      gardener: "روز را همان‌گونه که می‌دانید بگویید، با گاه‌شمار خودتان؛ اگر تنها همین را می‌دانید، بگویید «بعد از شام». هیچ چیز برای پر کردن جای خالی ساخته نمی‌شود: آنچه کسی نگفته ناگفته می‌ماند، و دفتر همین را می‌گوید."
      agent_note: "روز را می‌توان کوتاه نوشت (`2026-09-20`) یا بلند، به‌صورت یک مدخل `timing`، تا گاه‌شمار، یکا یا آنچه پیش از آن آمده گفته شود."
      staples: { where: "هر لحظه هم در زمان است و هم در جا", line: "سری در امتداد خطِ زمان می‌نشیند", money: "هر بند در روزی سررسید می‌شود" }
  - id: where
    short: "Where"
    name: "Where, and what it takes"
    glyph: "⌖"
    items: [section:placement, term:capacity, term:located_at, term:lives_in, term:workspace]
    staples: { when: "a meeting takes the hours of those present", what: "a host is a body with room to give", pages: "a page draws where things are" }
    person: >
      Things are in, at or among other things — a code in its list, a record in a register, a program on a machine, a
      meeting in someone's hours, a server in its rack. Some placements take nothing from where they are; some take a
      share; some take room no other thing can take at once.
    gardener: >
      Say where a thing is and, if it matters, how much room it takes and how much its host can hold. The notebook
      warns when shares are promised past a host, and refuses two things in one place at once.
    agent_note: "A location in a being's own frame names that being; stated alone (host), the place is known and the position not."
    scene:
      show: [ { bean: rack-a, keys: [capacity] }, { bean: web-1, keys: [located_at] } ]
      break: { bean: web-2, replace: ["rack-a#u19", "rack-a#u17"] }
      refused: "do not take the same room"
    fa:
      name: "کجا، و چه جایی می‌گیرد"
      short: "کجا"
      person: "چیزها در، بر یا میان چیزهای دیگرند: کدی در فهرستش، سابقه‌ای در دفتر ثبت، برنامه‌ای روی ماشین، جلسه‌ای در ساعت‌های کسی، سروری در رکش. برخی جای‌گیری‌ها چیزی از جایی که در آن‌اند نمی‌گیرند؛ برخی سهمی می‌گیرند؛ و برخی جایی می‌گیرند که هیچ چیز دیگری هم‌زمان نمی‌تواند بگیرد."
      gardener: "بگویید یک چیز کجاست و، اگر مهم است، چقدر جا می‌گیرد و میزبانش چقدر ظرفیت دارد. دفتر وقتی سهم‌هایی بیش از توان میزبان وعده داده شود هشدار می‌دهد، و دو چیز را هم‌زمان در یک جا نمی‌پذیرد."
      agent_note: "مکانی در چارچوبِ خودِ یک موجود، نامِ آن موجود را می‌برد؛ اگر تنها میزبان گفته شود (`host`)، جا معلوم است و جایگاه نه."
      staples: { when: "جلسه ساعت‌های حاضران را می‌گیرد", what: "میزبان تنی است که جا برای دادن دارد", pages: "صفحه نشان می‌دهد چیزها کجایند" }
  - id: codes
    short: "Codes"
    name: "Codes"
    glyph: "#"
    items: [value_types, section:knowledge_schemes, term:observations, section:registry_files]
    staples: { who: "a code a publisher gave identifies what it classifies", money: "an account is a code in the garden's own plan", line: "a reading is coded in a scheme" }
    person: >
      An occupation, a field of knowledge, a technology, an account in your own chart: each is a code of a scheme,
      written with the scheme it belongs to, so two notebooks mean the same thing by it.
    gardener: >
      Keep your own classifications as a scheme of your own; a new code is one new row, journalled like any change.
      Published schemes — occupations, fields, technologies — come with the release.
    agent_note: "One form everywhere a code is written: <scheme>:<code>, checked against the scheme it names."
    scene:
      show: [ { bean: hallway-nas, keys: [knowledge] } ]
      break: { bean: hallway-nas, replace: ["isced-f-2013:0612", "isced-f-2013:0699"] }
      refused: "is not a code of"
    fa:
      name: "کدها"
      short: "کدها"
      person: "یک پیشه، یک رشته‌ی دانش، یک فناوری، حسابی در سرفصل حساب‌های خودتان: هر کدام کدی از یک رده‌بندی است و همراه با رده‌بندی‌اش نوشته می‌شود، تا دو دفتر از آن یک معنا را بفهمند."
      gardener: "دسته‌بندی‌های خودتان را به‌صورت رده‌بندی‌ای از آنِ خودتان نگه دارید؛ کد تازه یک ردیف تازه است که مانند هر تغییر دیگری در روزنامه ثبت می‌شود. رده‌بندی‌های منتشرشده (پیشه‌ها، رشته‌ها، فناوری‌ها) همراه نسخه می‌آیند."
      agent_note: "هر جا کدی نوشته شود یک شکل دارد: `<scheme>:<code>`، که در برابر رده‌بندی‌ای که نام می‌برد سنجیده می‌شود."
      staples: { who: "کدی که ناشری داده، آنچه را رده‌بندی می‌کند می‌شناساند", money: "حساب کدی است در طرح حساب‌های خودِ باغ", line: "هر خوانش در یک رده‌بندی کد می‌خورد" }
  - id: money
    short: "Money"
    name: "Money and agreements"
    glyph: "⇄"
    items: [term:parties, term:clauses, term:transactions, term:words, profile:accounting]
    staples: { when: "what falls due, and when it lapses", codes: "where each amount belongs", between: "the other party keeps a notebook too" }
    person: >
      An agreement says who is bound and what each owes; a payment says who paid and who bears it. What one person owes
      another is read from what was paid and agreed — never written down beside it, where it could drift.
    gardener: >
      Tell the agent what was agreed and what was paid, in the currency it was paid in. Your notebook reads the balance;
      it tells you ninety days before a name you hold lapses.
    agent_note: "Amounts are exact, in the currency's own places, and what each party paid adds up to the whole amount."
    scene:
      show: [ { bean: storage-rent, keys: [transactions] } ]
      break: { bean: storage-rent, replace: ["count: \"40.00\"", "count: \"30.00\""] }
      refused: "adds up to"
    fa:
      name: "پول و توافق‌ها"
      short: "پول"
      person: "توافق می‌گوید چه کسی متعهد است و هر کس چه بدهکار است؛ پرداخت می‌گوید چه کسی پرداخت و هزینه بر دوش کیست. بدهی یک نفر به دیگری از آنچه پرداخت و توافق شده خوانده می‌شود، و هرگز جداگانه کنارش نوشته نمی‌شود، جایی که بتواند از آن فاصله بگیرد."
      gardener: "به عامل بگویید چه توافق شد و چه پرداخت شد، به همان ارزی که پرداخت شد. دفترتان مانده را می‌خواند؛ و نود روز پیش از آنکه نامی که در اختیار دارید منقضی شود، به شما خبر می‌دهد."
      agent_note: "مبلغ‌ها دقیق‌اند، با رقم‌های اعشاری خودِ آن ارز، و آنچه هر طرف پرداخته دقیقاً با کل مبلغ جمع می‌شود."
      staples: { when: "چه سررسید می‌شود، و کی منقضی می‌شود", codes: "هر مبلغ به کجا تعلق دارد", between: "طرف دیگر هم دفتری دارد" }
  - id: line
    short: "Along a line"
    name: "Along a line"
    glyph: "∿"
    items: [term:series, section:aggregates, section:operations, term:selections]
    staples: { when: "a line of time, or a line of order", codes: "what a channel holds is coded", money: "a total is read, not stored" }
    person: >
      What a gauge held at each moment, what was found of a thing when it was read: series and readings. What follows
      from them — a total, a trend, a share — is computed each time it is asked, so it never drifts from what was recorded.
    gardener: >
      Ask the notebook a question — how much, how many, which first — and it answers with the lines it read and how.
      Nothing it computes is written back as a fact.
    agent_note: "A series' whole is checked exactly; a gap in a node leaves a whole nobody can check, and that is said."
    scene:
      show: [ { bean: front-door, keys: [series] } ]
      break: { bean: front-door, replace: ["whole: { value: { count: 4", "whole: { value: { count: 5"] }
      refused: "the sum of"
    fa:
      name: "در امتداد یک خط"
      short: "در امتداد خط"
      person: "آنچه یک سنجه در هر لحظه نشان داد، آنچه از یک چیز هنگام خواندنش یافته شد: سری‌ها و خوانش‌ها. آنچه از آن‌ها برمی‌آید (یک جمع، یک روند، یک سهم) هر بار که پرسیده شود از نو محاسبه می‌شود، پس هرگز از آنچه ثبت شده دور نمی‌افتد."
      gardener: "از دفتر بپرسید (چقدر، چند تا، کدام اول) و پاسخ می‌دهد، همراه با سطرهایی که خوانده و اینکه چگونه خوانده. هیچ چیزی که محاسبه می‌کند به‌عنوان گزاره بازنویسی نمی‌شود."
      agent_note: "کلِ یک سری دقیقاً بررسی می‌شود؛ جای خالی در یک گره، کلی باقی می‌گذارد که هیچ‌کس نمی‌تواند بررسی‌اش کند، و این گفته می‌شود."
      staples: { when: "خطی از زمان، یا خطی از ترتیب", codes: "آنچه یک کانال نگه می‌دارد کد دارد", money: "جمع خوانده می‌شود، نه نگه‌داری" }
  - id: between
    short: "Between gardens"
    name: "Between gardens"
    glyph: "⇋"
    items: [term:consent, term:shared_identifiers, term:merge_open, section:planes]
    staples: { who: "a fact keeps its source as it crosses", money: "a shared cost crosses as a proposal", gate: "the other side's gate takes it in" }
    person: >
      Two notebooks meet as two networks do: each its own, neither reaching inside the other. What passes is only ever
      a proposal — one file laid beside, taken in by the other gardener's own hand.
    gardener: >
      Agree with the other person what you share; your agent writes the proposal. Nothing is sent for you, and nothing
      the other side proposes enters your notebook until you commit it.
    agent_note: "A person who is not the gardener is kept by name only with their consent on record."
    scene:
      show: [ { bean: ali, keys: [consent] }, { bean: ali-consent, keys: [parties, words] } ]
      break: { bean: bea, copy_of: ali, staged: true, replace: [ ["consent: { bean: ali-consent }\n", ""], ["123456789abc/person:ali", "person:bea"], ["title: \"Ali\"", "title: \"Bea\""] ] }
      refused: "no consent of theirs"
    fa:
      name: "میان باغ‌ها"
      short: "میان باغ‌ها"
      person: "دو دفتر همان‌گونه به هم می‌رسند که دو شبکه: هر کدام از آنِ خود، و هیچ‌یک به درون دیگری دست نمی‌برد. آنچه می‌گذرد همیشه فقط یک پیشنهاد است: پرونده‌ای که کنار گذاشته می‌شود و باغبانِ دیگر به دست خودش آن را می‌پذیرد."
      gardener: "با آن شخص دیگر بر سر آنچه به اشتراک می‌گذارید توافق کنید؛ عاملتان پیشنهاد را می‌نویسد. هیچ چیز از طرف شما فرستاده نمی‌شود، و هیچ پیشنهادی از سوی دیگر وارد دفترتان نمی‌شود تا خودتان آن را ثبت کنید."
      agent_note: "شخصی که باغبان نیست تنها با رضایتِ ثبت‌شده‌اش با نام نگه داشته می‌شود."
      staples: { who: "گزاره هنگام گذر منبعش را نگه می‌دارد", money: "هزینه‌ی مشترک به‌صورت پیشنهاد می‌گذرد", gate: "دروازه‌ی سوی دیگر آن را می‌پذیرد" }
  - id: gate
    short: "Gate & journal"
    name: "The gate and the journal"
    glyph: "⛨"
    items: [section:schema_language, section:layers, section:retired, section:senses]
    staples: { who: "no fact without its source", what: "the rules attach to natures", between: "each garden's gate is its own" }
    person: >
      The rules are data, versioned, read by a gate on every commit; the gate itself names no term. Every change is
      journalled in the commit that makes it. A change to the rules is itself a journalled change a person ratifies.
    gardener: >
      You ratify what an agent may not decide: identities, safety, and every change to the rules. A new release reaches
      your notebook only when you adopt it — translated, proved, and journalled.
    agent_note: "One command journals, stages and commits; the gate judges what is committed, and its refusal says the fix."
    scene:
      show: [ { save: true } ]
      break: { bean: hallway-nas, replace: ["the family's photos", "the family's photos and films"], staged: true }
      refused: "log/journal.md not updated"
    fa:
      name: "دروازه و دفتر روزنامه"
      short: "دروازه و روزنامه"
      person: "قاعده‌ها داده‌اند، نسخه‌دار، و دروازه آن‌ها را در هر ثبت می‌خواند؛ خودِ دروازه هیچ اصطلاحی را نام نمی‌برد. هر تغییر در همان ثبتی که آن را می‌سازد در روزنامه نوشته می‌شود. تغییرِ قاعده‌ها خود تغییری است که در روزنامه می‌آید و انسانی آن را تأیید می‌کند."
      gardener: "آنچه عامل نمی‌تواند درباره‌اش تصمیم بگیرد، شما تأیید می‌کنید: هویت‌ها، ایمنی، و هر تغییر در قاعده‌ها. نسخه‌ی تازه تنها وقتی به دفترتان می‌رسد که آن را بپذیرید: ترجمه‌شده، اثبات‌شده، و ثبت‌شده در روزنامه."
      agent_note: "یک فرمان، روزنامه را می‌نویسد، آماده می‌کند و ثبت می‌کند؛ دروازه درباره‌ی آنچه ثبت می‌شود داوری می‌کند، و پاسخِ ردش راه اصلاح را می‌گوید."
      staples: { who: "هیچ گزاره‌ای بی‌منبع نیست", what: "قاعده‌ها به سرشت‌ها بسته‌اند", between: "دروازه‌ی هر باغ از آنِ خودِ آن است" }
  - id: pages
    short: "Pages"
    name: "Pages"
    glyph: "▦"
    items: [section:view_lenses, section:view_archetypes]
    staples: { where: "a page draws where things are and how they relate", line: "live values beside the drawing", gate: "a page is checked against the law" }
    person: >
      A notebook can be read as pages: its parts, how work flows between them, and the live values beside each — drawn
      from the notebook itself, never kept anywhere else.
    gardener: >
      Ask for a page of what you care about. It is drawn by one module your notebook keeps, reused from page to page,
      and checked against the law like everything else.
    agent_note: "Every screen is a view page; write each drawing once, reuse it; the garden is the only store."
    scene:
      show: [ { bean: home-page, keys: [view] } ]
      break: { bean: home-page, replace: ["shown_from: understand", "shown_from: glance"] }
      refused: "is not a declared view_lenses"
    fa:
      name: "صفحه‌ها"
      short: "صفحه‌ها"
      person: "دفتر را می‌توان به‌صورت صفحه خواند: بخش‌هایش، اینکه کار چگونه میانشان جریان دارد، و مقدارهای زنده کنار هر یک؛ همه برگرفته از خودِ دفتر، و هرگز نگه‌داری‌شده در جای دیگر."
      gardener: "صفحه‌ای درباره‌ی آنچه برایتان مهم است بخواهید. آن را یک ماژول می‌کشد که دفترتان نگه می‌دارد، از صفحه‌ای به صفحه‌ی دیگر دوباره به کار می‌رود، و مانند هر چیز دیگری در برابر قانون سنجیده می‌شود."
      agent_note: "هر صفحه‌نمایش یک صفحه‌ی `view` است؛ هر نگاره را یک بار بنویسید و دوباره به کار ببرید؛ باغ تنها انبار است."
      staples: { where: "صفحه نشان می‌دهد چیزها کجایند و چگونه به هم مربوط‌اند", line: "مقدارهای زنده کنار نگاره", gate: "صفحه در برابر قانون سنجیده می‌شود" }
