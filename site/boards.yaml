# The boards of the one page: what each lens is told of each mechanism. The keeper's board is read from the release
# itself (the core's law, its reasons, the catalogue's rules, relations and checks); these are the words a person
# writes. `items` are the law's own parts the mechanism is made of, as the catalogue names them (`rule:`, `verb:`,
# `table:`, `section:`, `form:`, `layer:`, `profile:`). An agent's form and its refusal are proved, never written:
# `scene` names the beans of site/garden.yaml the form is shown from (their header `keys` and the statements of their
# `verbs`) and how to break it once (`replace`, `drop` a statement, a `copy_of` another bean, `staged` for what a commit
# would hold), and the refusal shown is the line the gate printed — by the rule `rule` names, containing `refused`, or
# the page is not built.
lenses:
  - { id: person, label: "What is it?", who: "someone curious",
      fa: { label: "این چیست؟", who: "کسی کنجکاو" } }
  - { id: gardener, label: "What do I do?", who: "a gardener",
      fa: { label: "من چه کنم؟", who: "باغبان" } }
  - { id: agent, label: "How is it written?", who: "an agent",
      fa: { label: "چگونه نوشته می‌شود؟", who: "عامل" } }
  - { id: keeper, label: "Why is it so, and where?", who: "a keeper of the law",
      fa: { label: "چرا چنین است، و کجا؟", who: "نگهبان قانون" } }
languages:
  - { id: en, label: "English", dir: ltr }
  - { id: fa, label: "فارسی", dir: rtl }
