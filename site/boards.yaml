    keeper_note: "هر بخش از قانون که این سازوکار از آن ساخته شده، همان‌گونه که نسخه بیانش می‌کند: معنایش، دلیلش، قاعده‌هایی که دروازه از آن بیرون می‌کشد، و آزمون‌هایی که بررسی‌اش می‌کنند. واژه‌های قانون به زبان خودشان، انگلیسی، آمده‌اند."
