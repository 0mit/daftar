# The garden the boards are proved in. site/board.py grows a garden from this checkout (seed/germinate.py, with the
# profiles below), writes these beans, saves them with the command below — the gate must pass them, or the page is not
# built — and then breaks each board's form once, as the board's `scene` says: the refusal a board shows is the line
# the gate printed. Nothing here is anyone's garden; the names are the forms' own (seed/FORMS.md).
gardener: { id: sam, name: "Sam" }
profiles: [view, knowledge]
save:
  who: "agent for sam"
  what: "the NAS, the rack and its servers, a dinner, a shared rent, a counter and a page"
  body: "- action: wrote [[hallway-nas]], [[rack-a]], [[web-1]], [[web-2]], [[dinner-at-sams]], [[ali]], [[ali-consent]], [[garden-ali]], [[storage-rent]], [[front-door]] and [[home-page]]"
beans:
  hallway-nas: |
    ---
    bean: hallway-nas
    genos: host
    title: "hallway-nas — the file server in the hallway cupboard"
    status: active
    summary: "The NAS in the hallway cupboard that keeps the family's photos."
    nature: soma
    identity:
      status: confirmed
      anchors:
        - { key: serial, value: "4XK9-2217", class: hardware, establishing: true }
    provenance: { src: asserted-by-human, by: "sam (gardener)", as_of: now }
    owned_by: { legal: { owner: { bean: sam } } }
    responsibility: { legal: { holder: { bean: sam } } }
    knowledge:
      - { code: "technology:samba", rel: uses }
      - { code: "isced-f-2013:0612", rel: draws_on, topic: "network file sharing" }
    ---
    The NAS in the hallway.
  rack-a: |
    ---
    bean: rack-a
    genos: host
    title: "rack-a — the rack in the office's server room"
    status: active
    summary: "A 42-unit rack in the server room."
    nature: soma
    identity:
      status: confirmed
      anchors:
        - { key: serial, value: "RK-42-0031", class: hardware, establishing: true }
    provenance: { src: asserted-by-human, by: "sam (gardener)", as_of: now }
    owned_by: { legal: { owner: { bean: sam } } }
    responsibility: { legal: { holder: { bean: sam } } }
    capacity:
      - { count: 42, unit: item, placement: location }
    ---
    The rack.
  web-1: |
    ---
    bean: web-1
    genos: host
    title: "web-1 — a web server in rack-a"
    status: active
    summary: "A two-unit web server."
    nature: soma
    identity:
      status: confirmed
      anchors:
        - { key: serial, value: "SRV-WEB-1", class: hardware, establishing: true }
    provenance: { src: asserted-by-human, by: "sam (gardener)", as_of: now }
    owned_by: { legal: { owner: { bean: sam } } }
    responsibility: { legal: { holder: { bean: sam } } }
    located_at:
      - { system: local-frame, openness: here, at: "rack-a#u17", takes: [ { count: 2, unit: item } ] }
    ---
    A web server.
  web-2: |
    ---
    bean: web-2
    genos: host
    title: "web-2 — a web server in rack-a"
    status: active
    summary: "A two-unit web server."
    nature: soma
    identity:
      status: confirmed
      anchors:
        - { key: serial, value: "SRV-WEB-2", class: hardware, establishing: true }
    provenance: { src: asserted-by-human, by: "sam (gardener)", as_of: now }
    owned_by: { legal: { owner: { bean: sam } } }
    responsibility: { legal: { holder: { bean: sam } } }
    located_at:
      - { system: local-frame, openness: here, at: "rack-a#u19", takes: [ { count: 2, unit: item } ] }
    ---
    A web server.
  dinner-at-sams: |
    ---
    bean: dinner-at-sams
    genos: event
    title: "dinner-at-sams — dinner at Sam's"
    status: active
    summary: "Ali came to dinner at Sam's; they agreed to share the rent of a storage unit."
    nature: lekton
    identity:
      status: confirmed
      anchors:
        - { key: identifier, value: "event:dinner-at-sams", class: logical, establishing: true }
    provenance: { src: asserted-by-human, by: "sam", as_of: now }
    owned_by: { legal: { crown: logos } }
    responsibility: { legal: { holder: { bean: sam } } }
    timing:
      start: { system: gregorian-civil, at: "2026-09-12 19:30+03:00", unit: minute }
    refs:
      host:  { bean: sam, rel: host }
      guest: { bean: ali, rel: present }
    ---
    Dinner at Sam's.
  ali: |
    ---
    bean: ali
    genos: person
    title: "Ali"
    status: active
    summary: "Ali, who keeps a garden of her own; Sam shares costs with her."
