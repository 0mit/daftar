# The garden the boards are proved in. site/board.py grows a garden from the release site/RELEASE names
# (seed/germinate.py, with the profiles below), copies into it the files below from its own copy of the language,
# writes these beans, saves them with the command below — the gate must pass them, or the page is not built — and then
# breaks each board's form once, as the board's `scene` says: the refusal a board shows is the line the gate printed.
# Nothing here is anyone's garden; the names are the forms' own (seed/FORMS.md), and the MAC address is one RFC 7042
# keeps for documentation.
gardener: { id: sam, name: "Sam" }
profiles: [view, knowledge]
files:
  drawings/home.py: assets/view/templates/drawings.py
save:
  who: "agent for sam"
  what: "the NAS, the rack and its servers, a dinner, a shared rent, a counter and a page"
  body: "- action: wrote [[hallway-nas]], [[rack-a]], [[web-1]], [[web-2]], [[dinner-at-sams]], [[ali]], [[ali-consent]], [[garden-ali]], [[storage-rent]], [[front-door]] and [[home-page]]"
beans:
  hallway-nas: |
    ---
    bean: hallway-nas
    kind: host
    title: "hallway-nas — the file server in the hallway cupboard"
    summary: "The NAS in the hallway cupboard that keeps the family's photos."
    statements:
      - read:   { by: sam, at: now }
      - name:   { by: ieee-eui48, of: self, as: "00:00:5e:00:53:01", note: "the MAC address on its label" }
      - own:    { by: sam, of: self }
      - answer: { by: sam, of: self, as: keeping }
      - use:    { by: self, of: "technology:samba" }
      - use:    { by: self, of: "isced-f-2013:0612", note: "network file sharing" }
    ---
    The NAS in the hallway.
  rack-a: |
    ---
    bean: rack-a
    kind: host
    title: "rack-a — the rack in the office's server room"
    summary: "A 42-unit rack in the server room."
    statements:
      - read: { by: sam, at: now }
      - own:  { by: sam, of: self }
      - hold: { by: self, of: { count: "42", unit: "{item}" }, note: "its slots" }
    ---
    The rack.
  web-1: |
    ---
    bean: web-1
    kind: host
    title: "web-1 — a web server in rack-a"
    summary: "A two-unit web server."
    statements:
      - read: { by: sam, at: now }
      - own:  { by: sam, of: self }
      - be:   { by: self, at: [rack-a, "rack-a#u17"], as: location, placed: { takes: [ { count: "2", unit: "{item}" } ] } }
    ---
    A web server.
  web-2: |
    ---
    bean: web-2
    kind: host
    title: "web-2 — a web server in rack-a"
    summary: "A two-unit web server."
    statements:
      - read: { by: sam, at: now }
      - own:  { by: sam, of: self }
      - be:   { by: self, at: [rack-a, "rack-a#u19"], as: location, placed: { takes: [ { count: "2", unit: "{item}" } ] } }
    ---
    A web server.
  dinner-at-sams: |
    ---
    bean: dinner-at-sams
    kind: event
    title: "dinner-at-sams — dinner at Sam's"
    summary: "Ali came to dinner at Sam's; they agreed to share the rent of a storage unit."
    statements:
      - say:    { by: sam, at: now }
      - be:     { by: self, at: "2026-09-12 19:30+03:00" }
      - own:    { by: theone, of: self }
      - answer: { by: sam, of: self, as: law }
      - attend: { by: sam, of: self }
      - attend: { by: ali, of: self }
    ---
    Dinner at Sam's.
  ali: |
    ---
    bean: ali
    kind: person
    title: "Ali"
    summary: "Ali, who keeps a garden of her own; Sam shares costs with her."
    statements:
      - say:    { by: sam, at: now }
      - name:   { by: garden, of: self, as: "123456789abc/person:ali" }
      - own:    { by: theone, of: self }
      - answer: { by: self, of: self, as: law }
    ---
    Ali keeps garden-ali.
  ali-consent: |
    ---
    bean: ali-consent
    kind: contract
    title: "Ali's consent"
    summary: "Ali agreed to be kept here by name."
    statements:
      - say:     { by: sam, at: now }
      - own:     { by: theone, of: self }
      - answer:  { by: sam, of: self, as: law }
      - answer:  { by: ali, of: self, as: law }
      - agree:   { id: consent, by: [sam, ali], of: "Ali is kept in Sam's garden by name", through: spoken }
      - concern: { of: [ali] }
    ---
    Agreed on the phone.
  garden-ali: |
    ---
    bean: garden-ali
    kind: garden
    title: "garden-ali — the garden Ali keeps"
    summary: "Ali's own daftar garden."
    statements:
      - say:  { by: sam, at: now }
      - name: { by: garden-id, of: self, as: "123456789abc" }
      - own:  { by: ali, of: self }
    ---
    Ali's garden.
  storage-rent: |
    ---
    bean: storage-rent
    kind: contract
    title: "storage-rent — Sam and Ali share a storage unit"
    summary: "Sam and Ali rent a storage unit together and split its rent; Sam paid September's."
    statements:
      - say:    { by: sam, at: now }
      - own:    { by: theone, of: self }
      - answer: { by: sam, of: self, as: law }
      - answer: { by: ali, of: self, as: law }
      - agree:  { id: agreed, by: [sam, ali], of: "a storage unit the two of them rent", through: dinner-at-sams }
      - pay:    { id: september, by: sam, of: { count: "100.00", unit: XTS }, through: agreed, at: "2026-09-15", note: "September's rent" }
      - bear:   { by: sam, of: september, share: "1" }
      - bear:   { by: ali, of: september, share: "1" }
    ---
    Agreed over dinner.
  front-door: |
    ---
    bean: front-door
    kind: host
    title: "front-door — the counter on the front door"
    summary: "A counter on the front door: how many came in, hour by hour."
    statements:
      - read: { by: sam, at: now }
      - own:  { by: sam, of: self }
      - record:
          id: saturday
          of: self
          series:
            grid: { of: time, in: gregorian-civil, every: { count: "1", unit: h }, from: "2026-09-12 09:00+03:00" }
            unit: h
            placement: following
            holds:
              - { name: came-in, quantity: number, unit: "{person}", stands_for: sum }
            rows: |
              came-in
              3
              1
              4
            whole: { value: { count: "8", unit: "{person}" }, of: came-in, by: sum }
    ---
    The counter.
  home-page: |
    ---
    bean: home-page
    kind: service
    title: "home-page — a page of what Sam keeps"
    summary: "One page of drawings of the home's machines."
    statements:
      - say:  { by: sam, at: now }
      - own:  { by: sam, of: self }
      - draw:
          id: photos
          by: self
          of: [hallway-nas]
          drawing:
            purpose: "The family's photos are kept on the NAS."
            outcome: "Every photo taken at home is on hallway-nas by night."
            stages:
              - { label: "Take the photo", doer: "whoever has a phone" }
              - { label: "Copy it over", doer: "hallway-nas", beings: [ { being: hallway-nas } ] }
              - { label: "Look at it", doer: "the family" }
            questions:
              - { lens: orient, ask: "Where do the photos go?" }
              - { lens: operate, ask: "Is the NAS keeping them?" }
            archetype: health-chain
            blind: [ { what: "how full its disks are", why: "no monitor reads them yet" } ]
      - draw: { id: page, by: self, of: [photos], page: { drawings: "file:drawings/home.py", reference: [ { being: hallway-nas, what: "keeps the photos" } ] } }
    ---
    A page.
