<svg class="d" viewBox="0 0 400 586" role="img" aria-labelledby="need-to-law-t need-to-law-d" xmlns="http://www.w3.org/2000/svg">
<title id="need-to-law-t">How a need becomes law</title><desc id="need-to-law-d">A need becomes law in six steps: a need, as an issue; a proposal, as a pull request with its evidence; the neighbourhood shown — the sibling terms, with what dmreview counts; a person ratifies it by merging; a release, as a tag; and each garden adopts it when its gardener decides, with dmupgrade. A term for a kind of fact needs real cases first; a mechanism may be proposed whole, ahead of its occupants.</desc>
<defs><marker id="need-to-law-ah" viewBox="0 0 7 6" refX="6.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah" d="M0,0 L7,3 L0,6 Z"/></marker><marker id="need-to-law-ah-accent" viewBox="0 0 7 6" refX="6.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah-accent" d="M0,0 L7,3 L0,6 Z"/></marker><marker id="need-to-law-ah-s" viewBox="0 0 7 6" refX="0.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah" d="M7,0 L0,3 L7,6 Z"/></marker><pattern id="need-to-law-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><rect class="h0" width="8" height="8"/><rect class="h1" width="3" height="8"/></pattern></defs>
<g class="node living"><rect class="box" x="36" y="12" width="328" height="52" rx="7"/><rect class="bar" x="36" y="12" width="5" height="52" rx="2"/><text class="t" x="50" y="31">a need</text><text class="s" x="50" y="47">an issue, in your own words</text></g>
<g class="flow"><path class="l" d="M200,64 L200,92" marker-end="url(#need-to-law-ah)"/></g>
<g class="node meta"><rect class="box" x="36" y="92" width="328" height="52" rx="7"/><rect class="bar" x="36" y="92" width="5" height="52" rx="2"/><text class="t" x="50" y="111">a proposal</text><text class="s" x="50" y="127">a pull request, with its evidence</text></g>
<g class="flow"><path class="l" d="M200,144 L200,172" marker-end="url(#need-to-law-ah)"/></g>
<g class="node meta"><rect class="box" x="36" y="172" width="328" height="52" rx="7"/><rect class="bar" x="36" y="172" width="5" height="52" rx="2"/><text class="t" x="50" y="191">the neighbourhood shown</text><text class="s" x="50" y="207">sibling terms; dmreview counts</text></g>
<g class="flow"><path class="l" d="M200,224 L200,252" marker-end="url(#need-to-law-ah)"/></g>
<g class="node living accent"><rect class="box" x="36" y="252" width="328" height="52" rx="7"/><rect class="bar" x="36" y="252" width="5" height="52" rx="2"/><text class="t" x="50" y="271">a person ratifies</text><text class="s" x="50" y="287">the merge</text></g>
<g class="flow"><path class="l" d="M200,304 L200,332" marker-end="url(#need-to-law-ah)"/></g>
<g class="node meta"><rect class="box" x="36" y="332" width="328" height="52" rx="7"/><rect class="bar" x="36" y="332" width="5" height="52" rx="2"/><text class="t" x="50" y="351">a release</text><text class="s" x="50" y="367">a tag</text></g>
<g class="flow"><path class="l" d="M200,384 L200,412" marker-end="url(#need-to-law-ah)"/></g>
<g class="node meta"><rect class="box" x="36" y="412" width="328" height="52" rx="7"/><rect class="bar" x="36" y="412" width="5" height="52" rx="2"/><text class="t" x="50" y="431">each garden adopts it</text><text class="s" x="50" y="447">when its gardener decides: dmupgrade</text></g>
<g class="tag"><rect class="p" x="8" y="494" width="186" height="38" rx="9"/><text class="tl" x="17" y="509">a term for a fact:</text><text class="tl" x="17" y="523">real cases first</text></g>
<g class="tag"><rect class="p" x="206" y="494" width="186" height="38" rx="9"/><text class="tl" x="215" y="509">a mechanism: whole,</text><text class="tl" x="215" y="523">ahead of its occupants</text></g>
<text class="s" x="200" y="566" text-anchor="middle">CONTRIBUTING.md has the test for each</text>
</svg>
