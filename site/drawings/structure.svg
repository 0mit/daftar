<svg class="d" viewBox="0 0 400 432" role="img" aria-labelledby="structure-t structure-d" xmlns="http://www.w3.org/2000/svg">
<title id="structure-t">Structure before prose</title><desc id="structure-d">A fact meets the question: does a term declare it? If one does, it is written as that term&#x27;s attribute, and each attribute says one thing — what it is a position in, whether it is required, what it means — with a remark in note. If none does, the fact goes in details, whole. A sentence written as a key of its own, renewal_note, is refused: it is declared by no term.</desc>
<defs><marker id="structure-ah" viewBox="0 0 7 6" refX="6.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah" d="M0,0 L7,3 L0,6 Z"/></marker><marker id="structure-ah-accent" viewBox="0 0 7 6" refX="6.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah-accent" d="M0,0 L7,3 L0,6 Z"/></marker><marker id="structure-ah-s" viewBox="0 0 7 6" refX="0.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah" d="M7,0 L0,3 L7,6 Z"/></marker><pattern id="structure-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><rect class="h0" width="8" height="8"/><rect class="h1" width="3" height="8"/></pattern></defs>
<g class="node lekton"><rect class="box" x="110" y="12" width="180" height="52" rx="7"/><rect class="bar" x="110" y="12" width="5" height="52" rx="2"/><text class="t" x="124" y="31">a fact</text><text class="s" x="124" y="47">“renews next January”</text></g>
<g class="flow"><path class="l" d="M200,64 L200,100" marker-end="url(#structure-ah)"/></g>
<g class="gate"><polygon class="box" points="200,100 295,130 200,160 105,130"/><text class="g" x="200" y="127.5" text-anchor="middle">does a term</text><text class="g" x="200" y="140.5" text-anchor="middle">declare it?</text></g>
<g class="flow"><path class="l" d="M105,130 L100,130 L100,196" marker-end="url(#structure-ah)"/><text class="fl" x="92" y="164" text-anchor="end">yes</text></g>
<g class="flow"><path class="l" d="M295,130 L300,130 L300,196" marker-end="url(#structure-ah)"/><text class="fl" x="308" y="164" text-anchor="start">no</text></g>
<g class="node lekton"><rect class="box" x="8" y="196" width="184" height="66" rx="7"/><rect class="bar" x="8" y="196" width="5" height="66" rx="2"/><text class="t" x="22" y="215">the term&#x27;s attribute</text><text class="s" x="22" y="231">in · required · meaning</text><text class="s" x="22" y="246">a remark goes in note</text></g>
<g class="node lekton"><rect class="box" x="208" y="196" width="184" height="66" rx="7"/><rect class="bar" x="208" y="196" width="5" height="66" rx="2"/><text class="t" x="222" y="215">details:</text><text class="s" x="222" y="231">kept whole, as written</text><text class="s" x="222" y="246">until a term is proposed</text></g>
<g class="node lekton"><rect class="box" x="8" y="316" width="200" height="52" rx="7"/><rect class="bar" x="8" y="316" width="5" height="52" rx="2"/><text class="t mono" x="22" y="335">renewal_note:</text><text class="s" x="22" y="351">a sentence as a key</text></g>
<g class="refused"><path class="l" d="M208,342 L300,342"/><circle class="o" cx="300" cy="342" r="9"/><path class="x" d="M295.8,337.8 L304.2,346.2 M295.8,346.2 L304.2,337.8"/><text class="fl" x="254" y="334" text-anchor="middle">a key of its own</text></g>
<g class="tag warn"><rect class="p" x="214" y="352" width="178" height="38" rx="9"/><text class="tl" x="223" y="367">refused: declared by</text><text class="tl" x="223" y="381">no vocabulary term</text></g>
<g class="band"><rect class="b" x="8" y="396" width="384" height="28" rx="6"/><text class="cap" x="18" y="414">A SENTENCE WRITTEN AS A KEY IS READABLE BY NOTHING</text></g>
</svg>
