<svg class="d" viewBox="0 0 400 448" role="img" aria-labelledby="whole-t whole-d" xmlns="http://www.w3.org/2000/svg">
<title id="whole-t">Declared whole</title><desc id="whole-d">A clause of an agreement, the loan&#x27;s instalments, can reach five states: in force, met, waived, broken, disputed. The law declares all five, and each is a vacant position — hatched — declared with the reason universal: the states every obligation can reach. A side nobody stands on, not a side missing.</desc>
<defs><marker id="whole-ah" viewBox="0 0 7 6" refX="6.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah" d="M0,0 L7,3 L0,6 Z"/></marker><marker id="whole-ah-accent" viewBox="0 0 7 6" refX="6.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah-accent" d="M0,0 L7,3 L0,6 Z"/></marker><marker id="whole-ah-s" viewBox="0 0 7 6" refX="0.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah" d="M7,0 L0,3 L7,6 Z"/></marker><pattern id="whole-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><rect class="h0" width="8" height="8"/><rect class="h1" width="3" height="8"/></pattern></defs>
<g class="node meta"><rect class="box" x="90" y="12" width="220" height="52" rx="7"/><rect class="bar" x="90" y="12" width="5" height="52" rx="2"/><text class="t" x="104" y="31">instalments</text><text class="s" x="104" y="47">a clause of washer-loan</text></g>
<g class="flow"><path class="l" d="M200,64 L200,104" marker-end="url(#whole-ah)"/><text class="fl" x="208" y="88" text-anchor="start">state</text></g>
<g class="band accent"><rect class="b" x="8" y="104" width="384" height="224" rx="6"/><text class="cap" x="18" y="120">DECLARED WHOLE: CLAUSES.STATE</text></g>
<g class="vacant"><rect class="box" x="20" y="136" width="112" height="70" rx="7" fill="url(#whole-hatch)"/><text class="t" x="76" y="168" text-anchor="middle">in force</text><text class="s" x="76" y="183" text-anchor="middle">holds</text></g>
<g class="vacant"><rect class="box" x="144" y="136" width="112" height="70" rx="7" fill="url(#whole-hatch)"/><text class="t" x="200" y="168" text-anchor="middle">met</text><text class="s" x="200" y="183" text-anchor="middle">discharged</text></g>
<g class="vacant"><rect class="box" x="268" y="136" width="112" height="70" rx="7" fill="url(#whole-hatch)"/><text class="t" x="324" y="168" text-anchor="middle">waived</text><text class="s" x="324" y="183" text-anchor="middle">released</text></g>
<g class="vacant"><rect class="box" x="82" y="226" width="112" height="70" rx="7" fill="url(#whole-hatch)"/><text class="t" x="138" y="258" text-anchor="middle">broken</text><text class="s" x="138" y="273" text-anchor="middle">not kept</text></g>
<g class="vacant"><rect class="box" x="206" y="226" width="112" height="70" rx="7" fill="url(#whole-hatch)"/><text class="t" x="262" y="258" text-anchor="middle">disputed</text><text class="s" x="262" y="273" text-anchor="middle">not agreed</text></g>
<g class="tag"><rect class="p" x="8" y="344" width="384" height="22" rx="9"/><text class="tl" x="200" y="359" text-anchor="middle">vacant, reason universal: the states every obligation can reach</text></g>
<g class="tag warn"><rect class="p" x="8" y="380" width="384" height="22" rx="9"/><text class="tl" x="200" y="395" text-anchor="middle">a side nobody stands on, not a side missing</text></g>
<text class="s" x="200" y="438" text-anchor="middle">hatched: a position declared, with nobody on it yet</text>
</svg>
