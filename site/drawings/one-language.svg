<svg class="d" viewBox="0 0 400 318" role="img" aria-labelledby="one-language-t one-language-d" xmlns="http://www.w3.org/2000/svg">
<title id="one-language-t">One language, one gate</title><desc id="one-language-d">A person, an agent, and an agent of another make each write to the garden. Every write meets the gate, which asks whether it breaks a rule. A write that breaks one is refused; one that passes is committed into the garden, a private git repository holding the beans, each fact with its source, and the journal of every change.</desc>
<defs><marker id="one-language-ah" viewBox="0 0 7 6" refX="6.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah" d="M0,0 L7,3 L0,6 Z"/></marker><marker id="one-language-ah-accent" viewBox="0 0 7 6" refX="6.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah-accent" d="M0,0 L7,3 L0,6 Z"/></marker><marker id="one-language-ah-s" viewBox="0 0 7 6" refX="0.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah" d="M7,0 L0,3 L7,6 Z"/></marker><pattern id="one-language-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><rect class="h0" width="8" height="8"/><rect class="h1" width="3" height="8"/></pattern></defs>
<g class="node empsychon"><rect class="box" x="8" y="14" width="124" height="52" rx="7"/><rect class="bar" x="8" y="14" width="5" height="52" rx="2"/><text class="t" x="22" y="33">you</text><text class="s" x="22" y="49">say what is true</text></g>
<g class="node empsychon"><rect class="box" x="138" y="14" width="124" height="52" rx="7"/><rect class="bar" x="138" y="14" width="5" height="52" rx="2"/><text class="t" x="152" y="33">an agent</text><text class="s" x="152" y="49">writes, commits</text></g>
<g class="node external external"><rect class="box" x="268" y="14" width="124" height="52" rx="7"/><rect class="bar" x="268" y="14" width="5" height="52" rx="2"/><text class="t" x="282" y="33">another make</text><text class="s" x="282" y="49">the same words</text></g>
<g class="flow"><path class="l" d="M70,66 L70,84 L330,84 L330,66"/></g>
<g class="flow"><path class="l" d="M200,66 L200,84"/></g>
<g class="flow"><path class="l" d="M200,84 L200,106" marker-end="url(#one-language-ah)"/></g>
<g class="gate accent"><polygon class="box" points="200,106 284,136 200,166 116,136"/><text class="g" x="200" y="133.5" text-anchor="middle">breaks a rule, or</text><text class="g" x="200" y="146.5" text-anchor="middle">goes unjournalled?</text></g>
<g class="flow"><path class="l" d="M284,136 L352,136" marker-end="url(#one-language-ah)"/><text class="fl" x="318" y="128" text-anchor="middle">refused</text></g>
<g class="tag"><rect class="p" x="290" y="144" width="102" height="36" rx="9"/><text class="tl" x="299" y="159">names the rule</text><text class="tl" x="299" y="173">and where</text></g>
<g class="flow"><path class="l" d="M200,166 L200,196" marker-end="url(#one-language-ah)"/><text class="fl" x="208" y="189" text-anchor="start">passes: one commit</text></g>
<g class="boundary"><rect class="b" x="8" y="196" width="384" height="114" rx="12"/><text class="cap" x="20" y="213">YOUR GARDEN — A PRIVATE GIT REPOSITORY</text></g>
<g class="store lekton"><path class="box" d="M24,229 v62 a84,7 0 0 0 168,0 v-62"/><ellipse class="top" cx="108" cy="229" rx="84" ry="7"/><text class="t" x="108" y="252.5" text-anchor="middle">beans/</text><text class="s" x="108" y="268.5" text-anchor="middle">each fact, with</text><text class="s" x="108" y="283.5" text-anchor="middle">its source</text></g>
<g class="store lekton"><path class="box" d="M208,229 v62 a84,7 0 0 0 168,0 v-62"/><ellipse class="top" cx="292" cy="229" rx="84" ry="7"/><text class="t" x="292" y="252.5" text-anchor="middle">log/journal.md</text><text class="s" x="292" y="268.5" text-anchor="middle">every change:</text><text class="s" x="292" y="283.5" text-anchor="middle">who, and why</text></g>
</svg>
