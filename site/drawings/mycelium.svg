<svg class="d" viewBox="0 0 400 576" role="img" aria-labelledby="mycelium-t mycelium-d" xmlns="http://www.w3.org/2000/svg">
<title id="mycelium-t">The mycelium</title><desc id="mycelium-d">garden-sam, kept by sam, holds the camera agreement both gardeners are parties to. Under it, garden-sam makes a proposal: one file, laid beside both gardens and inside neither. garden-ali reads it, which writes nothing, and asks whether it is clean. It is taken into the working tree, which commits nothing. Ali&#x27;s commit is the ratification. Taking is not accepting: her yes is hers to write. Beneath both is the language they pin.</desc>
<defs><marker id="mycelium-ah" viewBox="0 0 7 6" refX="6.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah" d="M0,0 L7,3 L0,6 Z"/></marker><marker id="mycelium-ah-accent" viewBox="0 0 7 6" refX="6.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah-accent" d="M0,0 L7,3 L0,6 Z"/></marker><marker id="mycelium-ah-s" viewBox="0 0 7 6" refX="0.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah" d="M7,0 L0,3 L7,6 Z"/></marker><pattern id="mycelium-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><rect class="h0" width="8" height="8"/><rect class="h1" width="3" height="8"/></pattern></defs>
<g class="boundary"><rect class="b" x="8" y="10" width="384" height="104" rx="12"/><text class="cap" x="20" y="27">GARDEN-SAM — KEPT BY SAM</text></g>
<g class="node empsychon"><rect class="box" x="22" y="40" width="140" height="52" rx="7"/><rect class="bar" x="22" y="40" width="5" height="52" rx="2"/><text class="t" x="36" y="59">sam</text><text class="s" x="36" y="75">the gardener</text></g>
<g class="store lekton"><path class="box" d="M196,41 v52 a90,7 0 0 0 180,0 v-52"/><ellipse class="top" cx="286" cy="41" rx="90" ry="7"/><text class="t" x="286" y="67.5" text-anchor="middle">shared-camera</text><text class="s" x="286" y="83.5" text-anchor="middle">both are parties to it</text></g>
<g class="flow"><path class="l" d="M286,100 L286,168" marker-end="url(#mycelium-ah)"/><text class="fl" x="294" y="130" text-anchor="start">make — under the</text><text class="fl" x="294" y="143" text-anchor="start">agreement</text></g>
<g class="tag"><rect class="p" x="16" y="132" width="176" height="38" rx="9"/><text class="tl" x="25" y="147">consent first: the</text><text class="tl" x="25" y="161">agreement is the soil</text></g>
<g class="store lekton"><path class="box" d="M196,175 v52 a90,7 0 0 0 180,0 v-52"/><ellipse class="top" cx="286" cy="175" rx="90" ry="7"/><text class="t" x="286" y="193.5" text-anchor="middle">a proposal</text><text class="s" x="286" y="209.5" text-anchor="middle">one file, beside</text><text class="s" x="286" y="224.5" text-anchor="middle">both gardens</text></g>
<g class="flow"><path class="l" d="M286,234 L286,270" marker-end="url(#mycelium-ah)"/><text class="fl" x="278" y="256" text-anchor="end">read — writes nothing</text></g>
<g class="boundary"><rect class="b" x="8" y="270" width="384" height="238" rx="12"/><text class="cap" x="20" y="287">GARDEN-ALI — KEPT BY ALI</text></g>
<g class="gate"><polygon class="box" points="286,274 361,300 286,326 211,300"/><text class="g" x="286" y="304" text-anchor="middle">clean?</text></g>
<g class="flow"><path class="l" d="M286,326 L286,356" marker-end="url(#mycelium-ah)"/><text class="fl" x="294" y="346" text-anchor="start">take</text></g>
<g class="node lekton"><rect class="box" x="196" y="356" width="180" height="52" rx="7"/><rect class="bar" x="196" y="356" width="5" height="52" rx="2"/><text class="t" x="210" y="375">working tree</text><text class="s" x="210" y="391">nothing committed</text></g>
<g class="flow"><path class="l" d="M286,408 L286,438" marker-end="url(#mycelium-ah)"/><text class="fl" x="294" y="428" text-anchor="start">git commit</text></g>
<g class="node empsychon accent"><rect class="box" x="196" y="438" width="180" height="52" rx="7"/><rect class="bar" x="196" y="438" width="5" height="52" rx="2"/><text class="t" x="210" y="457">ali&#x27;s commit</text><text class="s" x="210" y="473">the ratification</text></g>
<g class="tag warn"><rect class="p" x="22" y="356" width="160" height="52" rx="9"/><text class="tl" x="31" y="371">taking is not</text><text class="tl" x="31" y="385">accepting: her yes</text><text class="tl" x="31" y="399">is hers to write</text></g>
<g class="node empsychon"><rect class="box" x="22" y="438" width="160" height="52" rx="7"/><rect class="bar" x="22" y="438" width="5" height="52" rx="2"/><text class="t" x="36" y="457">ali</text><text class="s" x="36" y="473">the gardener</text></g>
<g class="flow"><path class="l" d="M182,464 L196,464" marker-end="url(#mycelium-ah)"/></g>
<g class="band earth"><rect class="b" x="8" y="522" width="384" height="44" rx="6"/><text class="cap" x="18" y="548">THE EARTH — THE LANGUAGE BOTH PIN</text></g>
</svg>
