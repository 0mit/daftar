<svg class="d" viewBox="0 0 400 498" role="img" aria-labelledby="layers-t layers-d" xmlns="http://www.w3.org/2000/svg">
<title id="layers-t">Five layers</title><desc id="layers-d">Five layers, each standing on the one beneath. The manifesto: MANIFESTO.md, what daftar holds to, read when someone asks what it is for. Laws: the vocabulary and the model, read by the gate on every commit. Reasoning: seed/RATIONALE.md, read when a rule surprises someone. Journals: log/journal.md, read by the next agent. History: git, read by nobody until it is all that is left. A story — when, who, where — that tries to enter the law is refused, and goes to the journals instead; the reason for a rule goes to the reasoning.</desc>
<defs><marker id="layers-ah" viewBox="0 0 7 6" refX="6.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah" d="M0,0 L7,3 L0,6 Z"/></marker><marker id="layers-ah-accent" viewBox="0 0 7 6" refX="6.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah-accent" d="M0,0 L7,3 L0,6 Z"/></marker><marker id="layers-ah-s" viewBox="0 0 7 6" refX="0.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah" d="M7,0 L0,3 L7,6 Z"/></marker><pattern id="layers-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><rect class="h0" width="8" height="8"/><rect class="h1" width="3" height="8"/></pattern></defs><g class="node lekton"><rect class="box" x="8" y="14" width="284" height="64" rx="7"/><rect class="bar" x="8" y="14" width="5" height="64" rx="2"/><text class="t" x="22" y="33">MANIFESTO</text><text class="s" x="22" y="49">MANIFESTO.md: what daftar holds</text><text class="s" x="22" y="64">to, read when someone asks why</text></g><g class="flow"><path class="l" d="M150,100 L150,78" marker-end="url(#layers-ah)"/><text class="fl" x="158" y="93" text-anchor="start">stands on</text></g><g transform="translate(0,86)">
<g class="node lekton"><rect class="box" x="8" y="14" width="284" height="64" rx="7"/><rect class="bar" x="8" y="14" width="5" height="64" rx="2"/><text class="t" x="22" y="33">LAWS</text><text class="s" x="22" y="49">the vocabulary and the model:</text><text class="s" x="22" y="64">read by the gate, every commit</text></g>
<g class="flow"><path class="l" d="M150,100 L150,78" marker-end="url(#layers-ah)"/><text class="fl" x="158" y="93" text-anchor="start">stands on</text></g>
<g class="node lekton"><rect class="box" x="8" y="100" width="284" height="64" rx="7"/><rect class="bar" x="8" y="100" width="5" height="64" rx="2"/><text class="t" x="22" y="119">REASONING</text><text class="s" x="22" y="135">seed/RATIONALE.md: read when</text><text class="s" x="22" y="150">a rule surprises someone</text></g>
<g class="flow"><path class="l" d="M150,186 L150,164" marker-end="url(#layers-ah)"/><text class="fl" x="158" y="179" text-anchor="start">stands on</text></g>
<g class="node lekton"><rect class="box" x="8" y="186" width="284" height="64" rx="7"/><rect class="bar" x="8" y="186" width="5" height="64" rx="2"/><text class="t" x="22" y="205">JOURNALS</text><text class="s" x="22" y="221">log/journal.md: read by the next</text><text class="s" x="22" y="236">agent, and by a person</text></g>
<g class="flow"><path class="l" d="M150,272 L150,250" marker-end="url(#layers-ah)"/><text class="fl" x="158" y="265" text-anchor="start">stands on</text></g>
<g class="node lekton"><rect class="box" x="8" y="272" width="284" height="64" rx="7"/><rect class="bar" x="8" y="272" width="5" height="64" rx="2"/><text class="t" x="22" y="291">HISTORY</text><text class="s" x="22" y="307">git: read by nobody, until it</text><text class="s" x="22" y="322">is the only thing left</text></g>
<g class="tag warn"><rect class="p" x="300" y="14" width="92" height="52" rx="9"/><text class="tl" x="309" y="29">a story:</text><text class="tl" x="309" y="43">when, who,</text><text class="tl" x="309" y="57">where</text></g>
<g class="refused"><path class="l" d="M300,46 L292,46"/><circle class="o" cx="292" cy="46" r="9"/><path class="x" d="M287.8,41.8 L296.2,50.2 M287.8,50.2 L296.2,41.8"/></g>
<g class="flow accent"><path class="l" d="M346,66 L346,218 L292,218" marker-end="url(#layers-ah-accent)"/><text class="fl" x="340" y="210" text-anchor="end">goes here</text></g>
<g class="band"><rect class="b" x="8" y="368" width="384" height="34" rx="6"/><text class="cap" x="18" y="389">NO STORY IN THE LAW — EACH LAYER READ AT ITS OWN TIME</text></g>
</g></svg>
