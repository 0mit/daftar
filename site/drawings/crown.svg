<svg class="d" viewBox="0 0 400 452" role="img" aria-labelledby="crown-t crown-d" xmlns="http://www.w3.org/2000/svg">
<title id="crown-t">The crown</title><desc id="crown-d">The crown has three branches, named for the natures: nature for physical beings, logos for metaphysical ones, love for living ones. sam and ali, persons, are each owned by love, and each answers for themselves. An edge that would make ali owned by sam is refused: a person is owned only by love, while alive. The camera sam and ali share is owned by logos, and its parties answer for it. The crown owns and never answers.</desc>
<defs><marker id="crown-ah" viewBox="0 0 7 6" refX="6.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah" d="M0,0 L7,3 L0,6 Z"/></marker><marker id="crown-ah-accent" viewBox="0 0 7 6" refX="6.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah-accent" d="M0,0 L7,3 L0,6 Z"/></marker><marker id="crown-ah-s" viewBox="0 0 7 6" refX="0.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah" d="M7,0 L0,3 L7,6 Z"/></marker><pattern id="crown-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><rect class="h0" width="8" height="8"/><rect class="h1" width="3" height="8"/></pattern></defs>
<g class="band"><rect class="b" x="8" y="10" width="384" height="96" rx="6"/><text class="cap" x="18" y="26">THE CROWN — THE BRANCHES A BEAN CAN NAME</text></g>
<g class="node physical"><rect class="box" x="20" y="36" width="112" height="56" rx="7"/><rect class="bar" x="20" y="36" width="5" height="56" rx="2"/><text class="t" x="34" y="55">nature</text><text class="s" x="34" y="71">physical</text></g>
<g class="node meta"><rect class="box" x="144" y="36" width="112" height="56" rx="7"/><rect class="bar" x="144" y="36" width="5" height="56" rx="2"/><text class="t" x="158" y="55">logos</text><text class="s" x="158" y="71">metaphysical</text></g>
<g class="node living"><rect class="box" x="268" y="36" width="112" height="56" rx="7"/><rect class="bar" x="268" y="36" width="5" height="56" rx="2"/><text class="t" x="282" y="55">love</text><text class="s" x="282" y="71">living</text></g>
<g class="node living"><rect class="box" x="226" y="158" width="156" height="52" rx="7"/><rect class="bar" x="226" y="158" width="5" height="52" rx="2"/><text class="t" x="240" y="177">sam</text><text class="s" x="240" y="193">a person</text></g>
<g class="flow"><path class="l" d="M324,158 L324,92" marker-end="url(#crown-ah)"/><text class="fl" x="332" y="120" text-anchor="start">owned_by:</text><text class="fl" x="332" y="133" text-anchor="start">crown: love</text></g>
<g class="tag"><rect class="p" x="226" y="218" width="156" height="38" rx="9"/><text class="tl" x="235" y="233">answers for themself:</text><text class="tl" x="235" y="247">self: true</text></g>
<g class="node living"><rect class="box" x="226" y="346" width="156" height="52" rx="7"/><rect class="bar" x="226" y="346" width="5" height="52" rx="2"/><text class="t" x="240" y="365">ali</text><text class="s" x="240" y="381">a person</text></g>
<g class="refused"><path class="l" d="M366,346 L366,266"/><circle class="o" cx="366" cy="266" r="9"/><path class="x" d="M361.8,261.8 L370.2,270.2 M361.8,270.2 L370.2,261.8"/><text class="fl" x="358" y="300" text-anchor="end">owner:</text><text class="fl" x="358" y="313" text-anchor="end">sam?</text></g>
<g class="tag warn"><rect class="p" x="226" y="404" width="156" height="38" rx="9"/><text class="tl" x="235" y="419">refused: a person is</text><text class="tl" x="235" y="433">owned only by love</text></g>
<g class="flow"><path class="l" d="M382,372 L394,372 L394,104 L352,104 L352,92" marker-end="url(#crown-ah)"/></g>
<g class="node meta"><rect class="box" x="18" y="196" width="160" height="52" rx="7"/><rect class="bar" x="18" y="196" width="5" height="52" rx="2"/><text class="t" x="32" y="215">shared-camera</text><text class="s" x="32" y="231">an agreement</text></g>
<g class="flow"><path class="l" d="M98,196 L98,136 L200,136 L200,92" marker-end="url(#crown-ah)"/><text class="fl" x="106" y="160" text-anchor="start">owned_by:</text><text class="fl" x="106" y="173" text-anchor="start">crown: logos</text></g>
<g class="flow sig"><path class="l" d="M178,214 L226,190" marker-end="url(#crown-ah)"/></g>
<g class="flow sig"><path class="l" d="M178,234 L226,366" marker-end="url(#crown-ah)"/></g>
<text class="fl" x="98" y="268" text-anchor="middle">both parties answer</text>
<g class="tag"><rect class="p" x="18" y="286" width="160" height="64" rx="9"/><text class="tl" x="27" y="301">the crown owns and</text><text class="tl" x="27" y="315">never answers; the</text><text class="tl" x="27" y="329">parties answer and</text><text class="tl" x="27" y="343">never own</text></g>
</svg>
