<svg class="d" viewBox="0 0 400 560" role="img" aria-labelledby="above-and-beneath-t above-and-beneath-d" xmlns="http://www.w3.org/2000/svg">
<title id="above-and-beneath-t">Above and beneath</title><desc id="above-and-beneath-d">Above the ground, ownership rises through each garden to the crown, theos, where every chain ends: in garden-sam the NAS and the website are owned by sam, and sam, a person, by the crown&#x27;s branch agape; in garden-ali, ali by agape too. Beneath the ground the two gardens meet through the mycelium, dashed threads that carry only a proposal between them. Under everything is the earth: the language both gardens pin.</desc>
