<svg class="d" viewBox="0 0 400 536" role="img" aria-labelledby="ownership-t ownership-d" xmlns="http://www.w3.org/2000/svg">
<title id="ownership-t">Ownership rises</title><desc id="ownership-d">garden-sam&#x27;s ownership chains, each rising until it ends. The website and the NAS are owned by sam; the website lives in the NAS, which is habitat and not ownership. sam is owned by the crown&#x27;s branch agape. The camera sam and ali share is owned by the crown&#x27;s branch logos. The domain is owned outside the garden, by the .org registry, and the rented VPS by its hosting provider. Every chain ends at the crown or outside the garden: a person's at agape.</desc>
<defs><marker id="ownership-ah" viewBox="0 0 7 6" refX="6.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah" d="M0,0 L7,3 L0,6 Z"/></marker><marker id="ownership-ah-accent" viewBox="0 0 7 6" refX="6.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah-accent" d="M0,0 L7,3 L0,6 Z"/></marker><marker id="ownership-ah-s" viewBox="0 0 7 6" refX="0.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah" d="M7,0 L0,3 L7,6 Z"/></marker><pattern id="ownership-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><rect class="h0" width="8" height="8"/><rect class="h1" width="3" height="8"/></pattern></defs>
<g class="band accent"><rect class="b" x="8" y="10" width="384" height="64" rx="6"/><text class="cap" x="18" y="26">THE CROWN</text></g>
<g class="node empsychon"><rect class="box" x="150" y="32" width="108" height="34" rx="7"/><rect class="bar" x="150" y="32" width="5" height="34" rx="2"/><text class="t" x="164" y="53.5">agape</text></g>
<g class="node lekton"><rect class="box" x="272" y="32" width="108" height="34" rx="7"/><rect class="bar" x="272" y="32" width="5" height="34" rx="2"/><text class="t" x="286" y="53.5">logos</text></g>
<g class="node empsychon"><rect class="box" x="140" y="128" width="128" height="44" rx="7"/><rect class="bar" x="140" y="128" width="5" height="44" rx="2"/><text class="t" x="154" y="154.5">sam</text></g>
<g class="flow"><path class="l" d="M204,128 L204,66" marker-end="url(#ownership-ah)"/><text class="fl" x="212" y="102" text-anchor="start">owned by</text></g>
<g class="node soma"><rect class="box" x="16" y="236" width="118" height="52" rx="7"/><rect class="bar" x="16" y="236" width="5" height="52" rx="2"/><text class="t" x="30" y="255">nas</text><text class="s" x="30" y="271">a host</text></g>
<g class="node empsychon"><rect class="box" x="146" y="236" width="112" height="52" rx="7"/><rect class="bar" x="146" y="236" width="5" height="52" rx="2"/><text class="t" x="160" y="255">website</text><text class="s" x="160" y="271">an instance</text></g>
<g class="node lekton"><rect class="box" x="270" y="236" width="122" height="52" rx="7"/><rect class="bar" x="270" y="236" width="5" height="52" rx="2"/><text class="t" x="284" y="255">shared-camera</text><text class="s" x="284" y="271">an agreement</text></g>
<g class="flow"><path class="l" d="M75,236 L75,200 L180,200 L180,172" marker-end="url(#ownership-ah)"/><text class="fl" x="100" y="194" text-anchor="start">owned by</text></g>
<g class="flow"><path class="l" d="M205,236 L205,172" marker-end="url(#ownership-ah)"/></g>
<g class="flow sig"><path class="l" d="M146,272 L134,272" marker-end="url(#ownership-ah)"/></g>
<text class="fl" x="140" y="306" text-anchor="middle">lives in — habitat, not owner</text>
<g class="flow"><path class="l" d="M331,236 L331,66" marker-end="url(#ownership-ah)"/><text class="fl" x="338" y="150" text-anchor="start">owned by</text></g>
<g class="node lekton"><rect class="box" x="16" y="334" width="150" height="52" rx="7"/><rect class="bar" x="16" y="334" width="5" height="52" rx="2"/><text class="t" x="30" y="353">example-org</text><text class="s" x="30" y="369">a domain</text></g>
<g class="node empsychon"><rect class="box" x="206" y="334" width="150" height="52" rx="7"/><rect class="bar" x="206" y="334" width="5" height="52" rx="2"/><text class="t" x="220" y="353">vps-a</text><text class="s" x="220" y="369">a rented server</text></g>
<g class="node external external"><rect class="box" x="16" y="424" width="150" height="52" rx="7"/><rect class="bar" x="16" y="424" width="5" height="52" rx="2"/><text class="t" x="30" y="443">the .org registry</text><text class="s" x="30" y="459">outside the garden</text></g>
<g class="node external external"><rect class="box" x="206" y="424" width="186" height="52" rx="7"/><rect class="bar" x="206" y="424" width="5" height="52" rx="2"/><text class="t" x="220" y="443">the hosting provider</text><text class="s" x="220" y="459">outside the garden</text></g>
<g class="flow"><path class="l" d="M91,386 L91,424" marker-end="url(#ownership-ah)"/><text class="fl" x="98" y="410" text-anchor="start">owned by</text></g>
<g class="flow"><path class="l" d="M281,386 L281,424" marker-end="url(#ownership-ah)"/><text class="fl" x="288" y="410" text-anchor="start">owned by</text></g>
<g class="band"><rect class="b" x="8" y="492" width="384" height="34" rx="6"/><text class="cap" x="18" y="513">EVERY CHAIN ENDS AT THE CROWN OR OUTSIDE</text></g>
</svg>
