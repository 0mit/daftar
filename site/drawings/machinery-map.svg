<svg class="d" viewBox="0 0 400 580" role="img" aria-labelledby="machinery-map-t machinery-map-d" xmlns="http://www.w3.org/2000/svg">
<title id="machinery-map-t">The five mechanisms</title><desc id="machinery-map-d">daftar&#x27;s five mechanisms and where they meet. A writer&#x27;s change passes the gate before it enters the garden&#x27;s history, and the journal gives each change its heading from the clock. Another clone or session reaches the same history through the merge. Another garden meets this one only through the mycelium, by proposal. Agreements feed the ledger, which reads what is owed.</desc>
<defs><marker id="machinery-map-ah" viewBox="0 0 7 6" refX="6.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah" d="M0,0 L7,3 L0,6 Z"/></marker><marker id="machinery-map-ah-accent" viewBox="0 0 7 6" refX="6.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah-accent" d="M0,0 L7,3 L0,6 Z"/></marker><marker id="machinery-map-ah-s" viewBox="0 0 7 6" refX="0.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah" d="M7,0 L0,3 L7,6 Z"/></marker><pattern id="machinery-map-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><rect class="h0" width="8" height="8"/><rect class="h1" width="3" height="8"/></pattern></defs>
<g class="node living"><rect class="box" x="8" y="12" width="176" height="52" rx="7"/><rect class="bar" x="8" y="12" width="5" height="52" rx="2"/><text class="t" x="22" y="31">a writer</text><text class="s" x="22" y="47">a person or an agent</text></g>
<g class="node external external"><rect class="box" x="216" y="12" width="176" height="52" rx="7"/><rect class="bar" x="216" y="12" width="5" height="52" rx="2"/><text class="t" x="230" y="31">the clock</text><text class="s" x="230" y="47">the machine&#x27;s time</text></g>
<g class="flow"><path class="l" d="M83,64 L83,104" marker-end="url(#machinery-map-ah)"/><text class="fl" x="91" y="88" text-anchor="start">a change</text></g>
<g class="node meta accent"><rect class="box" x="8" y="104" width="150" height="56" rx="7"/><rect class="bar" x="8" y="104" width="5" height="56" rx="2"/><text class="t" x="22" y="123">The gate</text><text class="s" x="22" y="139">every write passes it</text></g>
<g class="node meta"><rect class="box" x="226" y="104" width="166" height="56" rx="7"/><rect class="bar" x="226" y="104" width="5" height="56" rx="2"/><text class="t" x="240" y="123">The journal</text><text class="s" x="240" y="139">stamped by the clock</text></g>
<g class="flow"><path class="l" d="M304,64 L304,104" marker-end="url(#machinery-map-ah)"/></g>
<g class="flow"><path class="l" d="M226,144 L158,144" marker-end="url(#machinery-map-ah)"/><text class="fl" x="192" y="122" text-anchor="middle">same</text><text class="fl" x="192" y="135" text-anchor="middle">commit</text></g>
<g class="flow"><path class="l" d="M83,160 L83,204" marker-end="url(#machinery-map-ah)"/><text class="fl" x="91" y="186" text-anchor="start">passes</text></g>
<g class="store meta"><path class="box" d="M8,211 v46 a192,7 0 0 0 384,0 v-46"/><ellipse class="top" cx="200" cy="211" rx="192" ry="7"/><text class="t" x="200" y="234.5" text-anchor="middle">history (git)</text><text class="s" x="200" y="250.5" text-anchor="middle">every commit the gate passed</text></g>
<g class="node living"><rect class="box" x="8" y="300" width="176" height="52" rx="7"/><rect class="bar" x="8" y="300" width="5" height="52" rx="2"/><text class="t" x="22" y="319">another clone</text><text class="s" x="22" y="335">or another session</text></g>
<g class="node meta"><rect class="box" x="216" y="300" width="176" height="52" rx="7"/><rect class="bar" x="216" y="300" width="5" height="52" rx="2"/><text class="t" x="230" y="319">The merge</text><text class="s" x="230" y="335">one bean, one object</text></g>
<g class="flow"><path class="l" d="M184,326 L216,326" marker-end="url(#machinery-map-ah)"/></g>
<g class="flow"><path class="l" d="M304,300 L304,264" marker-end="url(#machinery-map-ah)"/><text class="fl" x="312" y="286" text-anchor="start">joins</text></g>
<g class="node external external"><rect class="box" x="8" y="388" width="108" height="52" rx="7"/><rect class="bar" x="8" y="388" width="5" height="52" rx="2"/><text class="t" x="22" y="407">another</text><text class="s" x="22" y="423">garden</text></g>
<g class="node meta"><rect class="box" x="146" y="388" width="108" height="52" rx="7"/><rect class="bar" x="146" y="388" width="5" height="52" rx="2"/><text class="t" x="160" y="407">The mycelium</text><text class="s" x="160" y="423">by proposal</text></g>
<g class="node living"><rect class="box" x="284" y="388" width="108" height="52" rx="7"/><rect class="bar" x="284" y="388" width="5" height="52" rx="2"/><text class="t" x="298" y="407">this garden</text><text class="s" x="298" y="423">its gardener&#x27;s</text></g>
<g class="flow"><path class="l" d="M118,414 L144,414" marker-end="url(#machinery-map-ah)" marker-start="url(#machinery-map-ah-s)"/></g>
<g class="flow"><path class="l" d="M256,414 L282,414" marker-end="url(#machinery-map-ah)" marker-start="url(#machinery-map-ah-s)"/></g>
<g class="store meta"><path class="box" d="M8,481 v46 a54,7 0 0 0 108,0 v-46"/><ellipse class="top" cx="62" cy="481" rx="54" ry="7"/><text class="t" x="62" y="504.5" text-anchor="middle">agreements</text><text class="s" x="62" y="520.5" text-anchor="middle">what moved</text></g>
<g class="node meta"><rect class="box" x="146" y="478" width="108" height="52" rx="7"/><rect class="bar" x="146" y="478" width="5" height="52" rx="2"/><text class="t" x="160" y="497">The ledger</text><text class="s" x="160" y="513">in fractions</text></g>
<g class="node meta"><rect class="box" x="284" y="478" width="108" height="52" rx="7"/><rect class="bar" x="284" y="478" width="5" height="52" rx="2"/><text class="t" x="298" y="497">what is owed</text><text class="s" x="298" y="513">never stored</text></g>
<g class="flow"><path class="l" d="M116,504 L146,504" marker-end="url(#machinery-map-ah)"/></g>
<g class="flow"><path class="l" d="M254,504 L284,504" marker-end="url(#machinery-map-ah)"/></g>
<text class="s" x="200" y="566" text-anchor="middle">each is drawn at four levels on the machinery page</text>
</svg>
