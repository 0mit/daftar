<svg class="d" viewBox="0 0 400 470" role="img" aria-labelledby="judgment-t judgment-d" xmlns="http://www.w3.org/2000/svg">
<title id="judgment-t">A judgment is its judge&#x27;s</title><desc id="judgment-d">Two versions of one thing, with no edge between them. sam judges version A more beautiful, and ali version B; each judgment is recorded by whom, and why. Nothing judges beauty: bin/dmreview.py counts the preconditions — closure, one statement of each thing, no story in the law, no privileged sibling, structure before prose — and shows them to the person who ratifies, who judges. The merge is the judgment.</desc>
<defs><marker id="judgment-ah" viewBox="0 0 7 6" refX="6.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah" d="M0,0 L7,3 L0,6 Z"/></marker><marker id="judgment-ah-accent" viewBox="0 0 7 6" refX="6.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah-accent" d="M0,0 L7,3 L0,6 Z"/></marker><marker id="judgment-ah-s" viewBox="0 0 7 6" refX="0.5" refY="3" markerWidth="7" markerHeight="6" orient="auto"><path class="ah" d="M7,0 L0,3 L7,6 Z"/></marker><pattern id="judgment-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><rect class="h0" width="8" height="8"/><rect class="h1" width="3" height="8"/></pattern></defs>
<g class="node living"><rect class="box" x="8" y="12" width="176" height="44" rx="7"/><rect class="bar" x="8" y="12" width="5" height="44" rx="2"/><text class="t" x="22" y="38.5">sam</text></g>
<g class="node living"><rect class="box" x="216" y="12" width="176" height="44" rx="7"/><rect class="bar" x="216" y="12" width="5" height="44" rx="2"/><text class="t" x="230" y="38.5">ali</text></g>
<g class="node meta"><rect class="box" x="8" y="130" width="176" height="52" rx="7"/><rect class="bar" x="8" y="130" width="5" height="52" rx="2"/><text class="t" x="22" y="149">version A</text><text class="s" x="22" y="165">a design</text></g>
<g class="node meta"><rect class="box" x="216" y="130" width="176" height="52" rx="7"/><rect class="bar" x="216" y="130" width="5" height="52" rx="2"/><text class="t" x="230" y="149">version B</text><text class="s" x="230" y="165">a design</text></g>
<g class="flow"><path class="l" d="M96,56 L96,130" marker-end="url(#judgment-ah)"/><text class="fl" x="104" y="84" text-anchor="start">more beautiful —</text><text class="fl" x="104" y="97" text-anchor="start">by: sam, and why</text></g>
<g class="flow"><path class="l" d="M304,56 L304,130" marker-end="url(#judgment-ah)"/><text class="fl" x="312" y="84" text-anchor="start">more beautiful —</text><text class="fl" x="312" y="97" text-anchor="start">by: ali, and why</text></g>
<g class="tag"><rect class="p" x="96" y="196" width="208" height="38" rx="9"/><text class="tl" x="200" y="211" text-anchor="middle">no edge: beauty is not</text><text class="tl" x="200" y="225" text-anchor="middle">a position of a thing</text></g>
<g class="node meta"><rect class="box" x="8" y="254" width="384" height="96" rx="7"/><rect class="bar" x="8" y="254" width="5" height="96" rx="2"/><text class="t mono" x="22" y="273">bin/dmreview.py --law</text><text class="s" x="22" y="289">counts the preconditions: closure · one</text><text class="s" x="22" y="304">statement of each thing · no story in the law ·</text><text class="s" x="22" y="319">no privileged sibling · structure before prose</text></g>
<g class="flow"><path class="l" d="M200,350 L200,394" marker-end="url(#judgment-ah)"/><text class="fl" x="208" y="378" text-anchor="start">shown to</text></g>
<g class="node living accent"><rect class="box" x="78" y="394" width="244" height="56" rx="7"/><rect class="bar" x="78" y="394" width="5" height="56" rx="2"/><text class="t" x="92" y="413">the person who ratifies</text><text class="s" x="92" y="429">judges: the merge is the judgment</text></g>
</svg>
