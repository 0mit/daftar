name: ci
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'  # nightly as well: a suite that a date or the network moves under is seen within a day
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the tags: the story ratchet reads its ceiling from the last release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML reuse
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      - name: every document parses
        run: python3 bin/dmsafe.py
      - name: "assets: one reader of what a release ships; an asset is a profile's, and opens no concept of its own"
        run: python3 test/assets.py
      - name: "journal: the entry is written as given, in UTF-8 on every platform, one line to a line"
        run: python3 test/journal.py
      - name: "the preconditions of beauty in the law, counted against the last release — evidence for whoever merges"
        run: python3 bin/dmreview.py --law --against "$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*')"
      - name: "site: the pages parse, their links resolve, and every example is what the tools print"
        run: python3 test/site.py
      - name: "terminology: every word of the seed is on its page, and every relation drawn is one the law states"
        run: python3 test/terminology.py
      - name: "public: a repository carries the language, never a garden"
        run: python3 test/public.py
      - name: "docs: the prose names nothing retired, nothing absent, and the suites the release runs"
        run: python3 test/docs.py
      - name: "manifesto: stated once, above the law; every clause carried or said to be only stated; no copy grows"
        run: python3 test/manifesto.py
      - name: "licences: every file says whose it is and under which terms (REUSE)"
        run: reuse lint
      - name: "sign-off: every commit of a pull request is signed off by a person (CONTRIBUTING.md)"
        if: github.event_name == 'pull_request'
        run: |
          missing=$(git log --format='%H %s%n%b%x00' "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            | python3 -c "import sys; print('\n'.join(c.split('\n')[0][:72] for c in sys.stdin.read().split('\x00') if c.strip() and 'Signed-off-by:' not in c))")
          if [ -n "$missing" ]; then echo "commits with no Signed-off-by:"; echo "$missing"; exit 1; fi

  # EVERY OTHER SUITE, ON EVERY PUSH AND PULL REQUEST, EACH IN A JOB OF ITS OWN. They ran only when the workflow was run
  # by hand, and the law moved through twenty-four versions in eight weeks, most of them MAJOR, while the suites that
  # hold a garden's behaviour went unrun on the pull requests that changed it. Side by side, the longest (peering) sets
  # the time, not the sum.
  suites:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - python3 test/germinate.py   # a garden germinates, passes its gate, refuses bad writes and merges back
          - python3 test/refusals.py   # refusals: what the gate refuses, and that it refuses rather than crashes
          - python3 test/save.py   # save: one call journals, stages and commits; a refused save stays as it stands, and --again finishes it
          - python3 test/sequence.py   # sequence: a series holds what its positions held, a track moves along a walk, a checklist is a set
          - python3 test/stamps.py   # stamps: the day of writing is the clock's — an `as_of` a commit adds is the day of the entry it adds
          - python3 test/converge.py   # gardens converge
          - python3 test/upgrade.py   # a garden adopts a release
          - python3 test/knowledge.py   # knowledge profile
          - python3 test/figures.py   # figures: squares and sequences
          - python3 test/expiry.py   # expiry: a term declares which of its dates runs out
          - python3 test/place.py   # place: positions that name their host
          - python3 test/reform.py   # reform: the law keyed by attribute, and the translator that proves itself
          - python3 test/positions.py   # positions: addresses and ports are places
          - python3 test/shape.py   # shape: a system knows its own shape; planes; the stack rooted in the fields of knowledge
          - python3 test/calendars.py   # calendars: every calendar meets the others at the day; a coordinate is never bare
          - python3 test/rationale.py   # rationale: the law and its reasons, kept apart and related by key
          - python3 test/recurrence.py   # recurrence: a repetition strides by neighbours, by measure, or by the cells of a level
          - python3 test/quantities.py   # quantities: area, volume, speed, acceleration and attenuation are one construct
          - python3 test/money.py   # money: amounts are exact, parts add up to their whole, what is owed is read, never written
          - python3 test/peering.py   # peering: gardens meet only by proposal; a name minted once is carried, never re-minted
          - python3 test/layers.py   # layers: each file sits in one layer, placed by the law or by its garden; no tool's path in the law; the changelog is journal
          - python3 test/base.py   # base: the shapes release 24.0's parts share — selections, a compound key, at most one of a group, cells of a level, the new value types
          - python3 test/view.py   # view: a page of drawings checked as law, drawn by its asset, and closed to a viewer by default
          - python3 test/viewcap.py   # viewcap: a page's asks put to the ledger's grants — parts, tables and CSV, entry forms through the gate, renders, a calendar as a pass, a schedule; daftar's own suite results drawn
          - python3 test/senses.py   # senses: one sense per name over the terms in force — a second sense refused, a garden's own judged in VOCAB.md, a stale row refused
          - python3 test/uncertainty.py   # uncertainty: positions in one to three axes, temperature as a position, u and accuracy, counts, one value however written
          - python3 test/zones.py   # zones: a position names its IANA zone, and an offset is read for a moment, never stored or guessed
          - python3 test/reckon.py   # reckon: one reckoner for every reading — a series read through it, a pinned reading, an allowance, a weighing
          - python3 test/privacy.py   # privacy: sensitivity derived, another person kept by name only on consent, grants closed by default, issued anchors, E.164
          - python3 test/held.py   # held: material sealed off git in a store this host resolves, journalled in one line, erased per subject
          - python3 test/passes.py   # passes: the flow law's rows each granted and refused, each row's guard computed, the journal only grown, a pointer and a claimed session's passes judged at commit
          - python3 test/launch.py   # launch: daftar's own loop logging each piece before the send, a party the gardener grants, the save's trace to a person's words, POST by content, and the hooks for another loop failing closed
          - python3 test/hub.py   # hub: every push judged again — signed by a writer's key, within the writer's grants, and by the gate
          - python3 test/agreements.py   # agreements: occurrences settled one by one, dues relative to them, windows and stance, a condition read, an exclusive term, a reading across gardens
          - python3 test/observations.py   # observations: readings coded in published schemes, verdicts once per observer, hearings, a garden's own extracts, the one finder and its gold set
          - python3 test/crosswalk.py   # crosswalk: FHIR R5 Observations and Darwin Core occurrences carried into beans and back by the law's tables alone; what a table cannot carry listed, never dropped
          - python3 test/rehearsal.py   # rehearsal: an invented health garden end to end — readings and a series sealed off git, read where they are held, no special value in any blob of history, a cleartext remote store in breach, erasure leaving every pointer Erased
          - python3 test/deeptime.py   # deeptime: where and when as one mechanism — a position from another being read at a time, deep time from its datums, the ICS chart and its golden spikes, a garden's tabulated places, a boundary fixed at both ends
    name: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      - run: ${{ matrix.suite }}
