name: ci
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the tags: the story ratchet reads its ceiling from the last release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      - name: every document parses
        run: python3 bin/dmsafe.py
      - name: a garden germinates, passes its gate, refuses bad writes and merges back
        run: python3 test/germinate.py
      - name: "refusals: what the gate refuses, and that it refuses rather than crashes"
        run: python3 test/refusals.py
      - name: "journal: the entry is written as given, in UTF-8 on every platform, one line to a line"
        run: python3 test/journal.py
      - name: gardens converge
        run: python3 test/converge.py
      - name: a garden adopts a release
        run: python3 test/upgrade.py
      - name: knowledge profile
        run: python3 test/knowledge.py
      - name: "figures: squares and sequences"
        run: python3 test/figures.py
      - name: "expiry: a term declares which of its dates runs out"
        run: python3 test/expiry.py
      - name: "place: positions that name their host"
        run: python3 test/place.py
      - name: "reform: the law keyed by attribute, and the translator that proves itself"
        run: python3 test/reform.py
      - name: "positions: addresses and ports are places"
        run: python3 test/positions.py
      - name: "shape: a system knows its own shape; planes; the stack rooted in the fields of knowledge"
        run: python3 test/shape.py
      - name: "calendars: every calendar meets the others at the day; a coordinate is never bare"
        run: python3 test/calendars.py
      - name: "rationale: the law and its reasons, kept apart and related by key"
        run: python3 test/rationale.py
      - name: "recurrence: a repetition strides by neighbours, by measure, or by the cells of a level"
        run: python3 test/recurrence.py
      - name: "quantities: area, volume, speed, acceleration and attenuation are one construct"
        run: python3 test/quantities.py
      - name: "money: amounts are exact, parts add up to their whole, what is owed is read, never written"
        run: python3 test/money.py
      - name: "mycelium: gardens meet only by proposal; a name minted once is carried, never re-minted"
        run: python3 test/mycelium.py
      - name: "the preconditions of beauty in the law, counted against the last release — evidence for whoever merges"
        run: python3 bin/dmreview.py --law --against "$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*')"
      - name: "public: a repository carries the language, never a garden"
        run: python3 test/public.py
      - name: "docs: the prose names nothing retired, nothing absent, and the suites the release runs"
        run: python3 test/docs.py
