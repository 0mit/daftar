name: ci
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:      # the whole list of suites; a push or a pull request runs the brief set
# A RUNNER'S CLOCK MAY BE UNSYNCHRONISED (core 2.0's stamp rule refuses a save it cannot stamp within 30 s):
# the gate asks these time servers instead, as a machine without a time daemon is told to.
env:
  DAFTAR_TIME_SOURCES: time.cloudflare.com,pool.ntp.org
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the tags: the story ratchet reads its ceiling from the last release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML reuse python-stdnum openpyxl blake3 libarchive-c
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      - name: every document parses
        run: python3 bin/safe.py
      - name: "assets: one reader of what a release ships; an asset is a profile's, and opens no concept of its own"
        run: python3 test/assets.py
      - name: "refusals: what the gate refuses, and that it refuses rather than crashes"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/refusals.py
      - name: "journal: the entry is written as given, in UTF-8 on every platform, one line to a line"
        run: python3 test/journal.py
      - name: "core: the minimal core's engine — the law proved whole, every verb's row, and each of its rules' refusals"
        run: python3 test/core.py
      - name: "core_save: the save commits a garden of statements, the core's gate at the commit — the moment the save's, the law ratified"
        run: python3 test/core_save.py
      - name: "core_translate: a garden of today's beans (v0.49.0's law) written in statements, into a copy — every value placed, VOCAB.md the core's rows, the engine passing"
        run: python3 test/core_translate.py
      - name: "core_standards: the core's law its own source — no file generated, every table of rows held to its form, the standards read from core/law/ alone"
        run: python3 test/core_standards.py
      - name: "core_rehearse: v0.49.0's guides' example garden, grown through its gate, translated, judged by the core, and adopting v1.0.0 through its own bin/dmupgrade.py"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/core_rehearse.py
      - name: "core_guides: the guides in their places, each example committed through the core's gate and held to what v0.49.0's guides said"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/core_guides.py
      - name: "core_merge: the statement merge, every rule of MERGE.md, and a garden's gate and merge driver, merged for real; a side in today's words refused"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/core_merge.py
      - name: "core_adopt: a garden grown from v0.49.0 adopts a release of the core through its own bin/dmupgrade.py, in place, in one commit its gate grants history's moments; a garden grown from one starts in it"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/core_adopt.py
      - name: "core_write: the write tools in a garden of the core — save, safe, journal, session, cursor, digest, reform, install, and the upgrade from one release of the core to another"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/core_write.py
      - name: "core_read: the read tools in a garden of the core — garden, where, stale, pos, seq, reckon, ledger — and the forms of a line: a series, a walk, a course and its moves, a reading and a pin"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/core_read.py
      - name: "core_measure: the measure tools in a garden of the core — cal, geo, units, knowledge, crosswalk — and the forms of a measure: a clause's terms, a placement's, a quantity's uncertainty, a garden's own systems and schemes"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/core_measure.py
      - name: "core_between: between gardens in the core — propose, across, pass, held — and the flow law, the held store's form and its check on the host, and the mark of a garden that rehearses"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/core_between.py
      - name: "relay: a peer behind NAT dials out, and an always-on peer relays one port to it and nothing else"
        run: python3 test/relay.py
      - name: "core_law: the law tools in a garden of the core — rules, why, form, forms, catalog, review, facets — and the law they read: the tools by their verbs, and what nothing takes up yet"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/core_law.py
      - name: "core_gate: the gate's others and the launcher in a garden of the core — parse, public, hook, hub, launch — and a session's pass log in the core's form, traced by the save and claimed at the gate"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/core_gate.py
      - name: "hubkey: a garden hub's own key — made by bin/hub.py install in the account's state folder, never in a garden or a repository, shown by `key` — and what the hub writes with it, judged as any writer's"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/hubkey.py
      - name: "core_view: the profiles a garden of the core takes, and the view asset on statements — a page of drawings judged by rule profile, drawn, written back by its author mode, and drawn as today's words drew it"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/core_view.py
      - name: "core_gaps: what v1 part 12b closed, read by the tools in a garden of the core — a payment charged and settled, a weighing, a series' whole, an allowance, bookings judged plan by plan, Darwin Core carried"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/core_gaps.py
      - name: "core_speed: what makes the gate fast, held to the same verdicts — libyaml's loader or the pure one, held's question in one git process, the gate and held in one Python, the law's self-check once per version, the room graph once per judge"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/core_speed.py
      - name: "core_held: the garden held — read again, the same garden while nothing it was read from changed; a document changed, added or removed, GARDEN.md, the index, a racily written file and a worktree each seen; DAFTAR_HELD_CHECK names a reader that changes what is held"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/core_held.py
      - name: "store: statements kept off git as rows, one universe with the beans — a row judged as the gate judges a statement, the pointer through the gate, the check over the union whole and by queries, the round trips between keepings, many writers, a snapshot, a removal recorded, a store found by its host's bean"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/store.py
      - name: "run: every job a tool starts, a course on the standard walk, its registry the store runs — setup, start and how it ends, names and keys, a stop whole, tasks and children, identity, the store's statements judged against the walk, a reader of another user, many writers"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/run.py
      - name: "io: imports and exports, one machinery — every format gives back what it wrote and keeps its guard, a scan's index and an archive's copies into a store as the law's crosswalks say, the same source again writing nothing and a second reading adding its act, a photograph's camera named and filled since, a record into a bean and back, the flow law asked for every pass"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/io.py
      - name: "group: groupings, one engine — the slots, the operations fit, inherit and shared, the groupings read as readings of the law, a template parsed and matched with its date checked, mining a counter's gaps and a Persian date, inheritance with what is set apart, an unset clock, a field's else, shared-mime-info read, a garden's pattern and class schemes held to their forms"
        run: python3 test/group.py
      - name: "storage: what each content's keepings leave open, which folders hold one dataset, the events of a tree, a transfer as a course"
        run: python3 test/storage.py
      - name: "courses: every course of a being in one shape, the one way a course is drawn — a course written, a clause's occurrences, a standing need crossed and repaired, a need's strength on the square, drawn in a table's column and a drawing, right to left"
        run: python3 test/courses.py
      - name: "core_ported: where each of today's suites and each check of today's gate went in v1 — none waiting — and today's words read only from v0.49.0, held to the tree"
        run: python3 test/core_ported.py
      - name: "core_exact: a count is exact everywhere it is read — rates between currencies, and no float in the code"
        run: python3 test/core_exact.py
      - name: "core_conformance: one verdict at every door — every clause of every rule broken by a case, each judged by the save, --again, the staged scope, the tree, a proposal's read, the store's union and a hub's checkout, alike"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/core_conformance.py
      - name: "save: one call journals, stages and commits; a refused save stays as it stands, and --again finishes it"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/save.py
      - name: gardens converge
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/converge.py
      - name: "calendars: every calendar meets the others at the day; a coordinate is never bare"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/calendars.py
      - name: "rationale: the law and its reasons, kept apart and related by key"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/rationale.py
      - name: "the preconditions of beauty in the law, counted against the last release — evidence for whoever merges"
        run: python3 bin/review.py --law --against "$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*')"
      - name: "site: the page parses, loads nothing from outside, and every form and refusal is what the release prints"
        run: python3 test/site.py
      - name: "public: a repository carries the language, never a garden"
        run: python3 test/public.py
      - name: "docs: the prose names nothing retired, nothing absent, and the suites the release runs"
        run: python3 test/docs.py
      - name: "manifesto: stated once, above the law; every clause carried or said to be only stated; no copy grows"
        run: python3 test/manifesto.py
      - name: "widgets: each value shown exactly, isolated and escaped, in each reader's own digits, separators and calendar, none privileged"
        run: python3 test/widgets.py
      - name: "cases: a consultation, an open-heart surgery, an Arduino blinker and a production line with accounts, each a garden of statements that holds together and refuses what it must"
        run: python3 test/cases.py
      - name: "leads: what waits, for whom the garden says — a decision, a case at its step, an open session; never configured, never stored"
        run: python3 test/leads.py
      - name: "core_crosswalks: Odoo's company and department records read from a garden's statements, the one reader, and crosswalks out of form refused"
        run: python3 test/core_crosswalks.py
      - name: "core_inforce: what is in force, read once — a statement while it holds, the decisions in force on a walk, what ends what, a use's standing — and the crosswalks that read through it"
        run: python3 test/core_inforce.py
      - name: "books: a chart of accounts held to its form, a booking as a move from one account to another, the reverse of a move as its reverse sense, a match counted once"
        run: python3 test/books.py
      - name: "books_walks: the books' operations as walks — a payment booked, booked again, reversed, a bank's statement imported and matched, a period closed — each planned as a write, ratified, written as shown and read back"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/books_walks.py
      - name: "act: an action run on the law's own walk — plan, show, check, a person's ratification, apply, verify; refused and rolled back with their reasons"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/act.py
      - name: "routines: a machine's routines read from the garden and run by the one engine — when each falls due at its clock time, which waits on what and why, a run that waits, skips, runs, fails its proof; crossings; cron adopted byte for byte"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/routines.py
      - name: "mailbox: a proposal laid in another garden's mailbox by a key that can do nothing else, and only a proposal taken"
        run: python3 test/mailbox.py
      - name: "layers: each file sits in one layer, placed by the law or by its garden; no tool's path in the law; the changelog is journal"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/layers.py
      - name: "view: a page of drawings checked as law, drawn by its asset, and closed to a viewer by default"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/view.py
      - name: "viewcap: a page's asks put to the ledger's grants — parts, tables and CSV, entry forms through the gate, renders, a calendar as a pass, a schedule; daftar's own suite results drawn"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/viewcap.py
      - name: "view_handplace: the archetypes engraved from readings — a queue, a timeline, flows, a sheet — their law, the readings they draw, the one write path a sheet's Save takes, held values, and the renderers in a browser"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/view_handplace.py
      - name: "bidi: the view's widgets and renderers in a browser, read as they land on the screen, in a right-to-left and a left-to-right page"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/bidi.py
      - name: "view_held_names: a person kept off git by name shown by it to a reader who may read them, on the host that keeps it — and by their opaque id to every other reader, host and page of one file"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/view_held_names.py
      - name: "view_held_named: what is held off git is opened only by a grant that names it — a sealed statement read and written by the gardener, or whom a grant names it to, never by a grant of the whole bean"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/view_held_named.py
      - name: "view_code_names: a code of a scheme a page holds — an account a payment is booked to — drawn by its name in the scheme's own table, in the reader's language, its code beside it"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/view_code_names.py
      - name: "view_table_sort: a reading's table sorts by each column — an amount by its exact value, a day as the law writes it, words in the reader's language's order, the empty last; the lines moved, never drawn again"
        run: python3 test/view_table_sort.py
      - name: "view_timeline_hours: a day's width shared among what takes its hours, opaque, earlier first; what is kept in view laid below its label; the label's title the day in the reader's other calendars (transparency, core 2.7)"
        run: python3 test/view_timeline_hours.py
      - name: "view_share_form: a payment's share form opens with its shares as they stand, each row's part of the whole as a fraction and an amount as it is filled; shares that add up to the payment are amounts"
        run: python3 test/view_share_form.py
      - name: "view_books: an entity's books as a table over a chart's codes — an account a line in the chart's order, its figures per currency, each account's ledger, debit before credit along the reader's line, each account by its name in the reader's language"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/view_books.py
      - name: "view_between_names: what went between gardens with every garden called by a name — this garden as the one read in, an untitled garden as another garden — and what went by its title, never an id"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/view_between_names.py
      - name: "view_actions: a run started from a page with what a person gives it — an action on a table's line starts a walk of the garden the host names, its inputs handed to the walk's tool, its plan shown, nothing changed until ratified"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/view_actions.py
      - name: "view_action_inputs: an action's inputs as a page asks them — chosen of a reading or a scheme, several, filled from the row a button sits on, a day, a file kept off git under its SHA-256 — each held by the host to what was offered"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/view_action_inputs.py
      - name: "view_action_optional: an action's input a person may leave empty — given to the walk as absent, never as an empty word, its meaning the walk's own; never one filled from the row, nor the clock's"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/view_action_optional.py
      - name: "view_held_records: a record held off git, written from a page — a person's contact, a record of `details` read by the page's words, written into the store of the host that keeps it by the held bar, never into git"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/view_held_records.py
      - name: "view_pages: a garden's handplace is its pages — several page beans each checked as its own, listed in the order the garden places them, and a table of a reading drawn with no module"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/view_pages.py
      - name: "view_forms: a form's value on a sheet drawn by its entries — a clause's day, repetition, notice and state, a payment's settlement — edited by its widgets and written through the gate"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/view_forms.py
      - name: "view_places: a place on a sheet — looked up as it is typed, the garden's own first, the reader's position only when asked, a whereabouts never sent — landing as a coordinate in its system with the element it was read from and a `read` of its source, and an element that never establishes an identity"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/view_places.py
      - name: "view_details: what a page names of a being's details drawn on its sheet, kept whole — in the reader's calendar and digits, never edited there"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/view_details.py
      - name: "view_tags: a being's tags on its sheet, changed in the one Edit as a set of words and written through the gate"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/view_tags.py
      - name: "view_said: the queue's leads and the timeline's sessions said in the reader's language and calendar — a step by its walk's words, a clause's day in the reader's calendar, an attendance at its own hour"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/view_said.py
      - name: "names: the law's words a page shows — verbs, roles, qualifiers, kinds, header keys, a form's attributes — named in every language the tables carry, and a sheet drawn in its reader's"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/names.py
      - name: "view_sheet_words: a sheet in its reader's words — each fact by its page's word, no id, the reader's calendar; Edit draws what a reader keeps, and a step chosen by its walk's words"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/view_sheet_words.py
      - name: "view_reader_prefs: each reader's own calendar, digits, hours, first day, zone, date and currency — one BCP 47 tag kept with their account on the host, never in the garden"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/view_reader_prefs.py
      - name: "view_prefs_bean: a reader's way of reading written as a bean to keep or to carry, and read back — the host's file its source, nothing lost either way, the gate judging the form"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/view_prefs_bean.py
      - name: "catalogue: every part of the language, how the parts relate and what each is held to — read from the sources each time, the same bytes twice, and in a garden its copy of the language alone"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/catalogue.py
      - name: "garden: the one garden model — where a garden's documents are, as every tool reads them, in the tree, the index and a commit"
        if: github.event_name == 'workflow_dispatch'   # the whole list: run the workflow by hand
        run: python3 test/garden.py
      - name: "licences: every file says whose it is and under which terms (REUSE)"
        run: reuse lint
      - name: "sign-off: every commit of a pull request is signed off by a person (CONTRIBUTING.md)"
        if: github.event_name == 'pull_request'
        run: |
          missing=$(git log --format='%H %s%n%b%x00' "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            | python3 -c "import sys; print('\n'.join(c.split('\n')[0][:72] for c in sys.stdin.read().split('\x00') if c.strip() and 'Signed-off-by:' not in c))")
          if [ -n "$missing" ]; then echo "commits with no Signed-off-by:"; echo "$missing"; exit 1; fi
  # THE AGENT'S OWN DOOR ON EVERY SYSTEM: the guards' suite alone, short, on each system an agent's harness runs on —
  # the shell the install finds is each system's own (a bash on Linux, Homebrew's on macOS, Git for Windows' bash)
  guard:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DAFTAR_TIME_SOURCES: ""     # the suite's own time source on the loopback (test/machine.py): macOS's runner reaches no NTP server
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      - name: "python3 names the Python set up, where the system names none (Windows)"
        if: runner.os == 'Windows'
        run: python -c "import os, shutil, sys; p = os.path.join(os.path.dirname(sys.executable), 'python3.exe'); os.path.exists(p) or shutil.copy(sys.executable, p)"
      - name: "guard: the law's guards held to their vectors, the gardener's instructions read through the one judge, every recorded case refused before it runs and every allowed form let through, the harness's shell set for this system"
        run: python3 test/guard.py
      - name: "guard, on macOS with Homebrew's bash: the install finds it, and the guards judge under it"
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install bash && cd test && python3 guard.py
