# The public page: site/index.html and the assets it links, published as committed. The check builds the page again from
# the release site/RELEASE names — its forms proved and its refusals printed by that release's gate — and compares.
name: pages
on:
  push:
    branches: [master]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
# A RUNNER'S CLOCK MAY BE UNSYNCHRONISED (core 2.0's stamp rule refuses a save it cannot stamp within 30 s):
# the gate asks these time servers instead, as a machine without a time daemon is told to.
env:
  DAFTAR_TIME_SOURCES: time.cloudflare.com,pool.ntp.org
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the tags: site/RELEASE names one, and site/board.py clones it
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      - name: "site: the page parses, loads nothing from outside, and every form and refusal is what the release prints"
        run: python3 test/site.py
  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: "the published files: the page and its assets; never a source, the template or the scene garden"
        run: >-
          rsync -a --prune-empty-dirs --include 'index.html'
          --include 'assets/***' --exclude '*' site/ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
