  - code: gland
    level: role
    name: gland
    synonyms: "rod gland | cylinder gland | head gland"
    pattern:
      root: { compliance: rigid }
      nodes: { T: { fits: cylinder-tube }, R: { shape: bar }, S: { fits: rod-seal } }
      edges:
        - { x: root, y: T, pair: [fixed, helical] }
        - { x: root, y: R, link: [prismatic, cylindrical] }
        - { x: root, y: S, pair: [fixed], closure: [form], a: { kind: groove, side: int } }
  - code: piston-rod
    level: role
    name: "piston rod"
    synonyms: "rod | ram"
    pattern:
      root: { compliance: rigid, shape: bar }
      nodes: { P: { fits: piston }, G: { fits: gland } }
      edges:
        - { x: root, y: P, rel: one-link }
        - { x: root, y: G, link: [prismatic, cylindrical] }
    wikidata: Q788143
  - code: cylinder-mount
    level: role
    name: mount
    synonyms: "mounting eye | rod eye | clevis | cylinder mount"
    pattern:
      root: {}
      nodes: { P: { compliance: rigid, shape: bar } }
      edges:
        - { x: root, y: P, pair: [revolute], a: { kind: eye } }
  - code: hydraulic-cylinder
    level: role
    name: "hydraulic cylinder"
    synonyms: "hydraulic ram"
    pattern:
      root: { device: "true" }
      nodes: { T: { fits: cylinder-tube }, P: { fits: piston }, R: { fits: piston-rod } }
      edges:
        - { x: root, y: T, rel: part }
        - { x: root, y: P, rel: part }
        - { x: root, y: R, rel: part }
