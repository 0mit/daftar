        - { x: root, y: A, pair: [fixed], closure: [form], b: { kind: groove } }
        - { x: root, y: B, pair: [fixed], closure: [force] }
        - { x: A, y: B, rel: one-link }
        - { x: root, y: F, pair: [pressing] }
  - code: piston-seal
    level: role
    name: "piston seal"
    pattern:
      root: {}
      nodes: { A: { compliance: rigid }, B: { compliance: rigid }, F: { compliance: pressure, use: working-fluid }, G: { compliance: pressure, use: working-fluid } }
      edges:
        - { x: root, y: A, pair: [fixed], closure: [form], b: { kind: groove, side: ext } }
        - { x: root, y: B, pair: [prismatic, cylindrical], closure: [force], b: { kind: bore } }
        - { x: root, y: F, pair: [pressing] }
        - { x: root, y: G, pair: [pressing] }
  - code: rod-seal
    level: role
    name: "rod seal"
    pattern:
      root: {}
