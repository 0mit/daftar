      edges:
        - { x: root, y: A, pair: [fixed], closure: [form], b: { kind: groove, side: int } }
        - { x: root, y: B, pair: [prismatic, cylindrical], closure: [force], b: { kind: seat } }
        - { x: root, y: F, pair: [pressing] }
    wikidata: Q59630201
  - code: wiper-seal
    level: role
    name: "wiper seal"
    synonyms: "wiper | scraper | scraper seal"
    pattern:
      root: {}
      nodes: { A: { compliance: rigid }, B: { compliance: rigid }, F: { compliance: pressure, use: ambient }, W: { compliance: pressure, use: working-fluid } }
      edges:
        - { x: root, y: A, pair: [fixed], closure: [form], b: { kind: groove, side: int } }
        - { x: root, y: B, pair: [prismatic, cylindrical], closure: [force], b: { kind: seat } }
        - { x: root, y: F, pair: [pressing] }
      not:
        - { x: root, y: W, pair: [pressing] }
    wikidata: Q8026705
  - code: blind-plug
    level: role
    name: "blind plug"
    synonyms: "blanking plug | expander plug"
    pattern:
      root: { compliance: rigid }
      nodes: { A: { compliance: rigid }, F: { compliance: pressure, use: working-fluid } }
      edges:
        - { x: root, y: A, pair: [fixed], closure_any: [friction, form, material], b: { kind: port } }
        - { x: root, y: F, pair: [pressing] }
  - code: piston
    level: role
    name: piston
    pattern:
      root: { compliance: rigid }
      nodes: { W: {}, T: { compliance: rigid, shape: tube }, F: { compliance: pressure, use: working-fluid }, R: { compliance: rigid, shape: bar } }
      edges:
        - { x: root, y: W, pair: [fixed], closure: [form], a: { kind: groove, side: ext } }
        - { x: W, y: T, pair: [prismatic, cylindrical] }
        - { x: root, y: F, pair: [pressing] }
        - { x: root, y: R, rel: one-link }
    wikidata: Q45227
    cpv: "34312400"
  - code: cylinder-tube
    level: role
    name: "cylinder tube"
    synonyms: "cylinder barrel | barrel"
    pattern:
      root: { compliance: rigid, shape: tube }
      nodes: { P: { fits: piston } }
      edges:
        - { x: root, y: P, link: [prismatic, cylindrical] }
  - code: cylinder-end-cap
    level: role
    name: "cylinder end cap"
    synonyms: "cylinder head | end cap | cap end"
    pattern:
      root: { compliance: rigid }
      nodes: { T: { fits: cylinder-tube }, F: { compliance: pressure, use: working-fluid }, R: { shape: bar } }
      edges:
        - { x: root, y: T, pair: [fixed] }
        - { x: root, y: F, pair: [pressing] }
      not:
