# The tools of the language (v1 part 9), each by its verb — `python3 bin/daftar.py <verb>` runs `bin/<verb>.py` — and
# the family of what it is for, by which the launcher lists them. A tool's verb is the command's and no statement's:
# `pass` is both, so a tool is keyed `tool`.
# These rows are the law itself: a change to them is a RULE-CHANGE, made here.
families:
  - { family: law, meaning: "read the law: its rules, its reasons, a term's form, the catalogue of its parts" }
  - { family: gate, meaning: "judge: the gate, and the guards that run it where writes arrive" }
  - family: write
    meaning: "make a change: a save with its journal entry, safe edits, sessions, the release adopted"
  - family: read
    meaning: "read the garden: its documents, a reading, what is owed, what has aged, where a thing is"
  - family: measure
    meaning: "place and quantity: calendars, coordinates, units, published knowledge and its crosswalks"
  - family: between
    meaning: "between gardens and places: proposals, merges, readings across, what passes where, what is held"
  - { family: launch, meaning: "daftar's own loop: a model called with every request logged" }
tools:
  - { tool: rules, family: law }
  - { tool: why, family: law }
  - { tool: form, family: law }
  - { tool: forms, family: law }
  - { tool: catalog, family: law }
  - { tool: review, family: law }
  - { tool: facets, family: law }
  - { tool: check, family: gate }
  - { tool: parse, family: gate }
  - { tool: public, family: gate }
  - { tool: hook, family: gate }
  - { tool: hub, family: gate }
  - { tool: sync, family: between }
  - { tool: save, family: write }
  - { tool: safe, family: write }
  - { tool: journal, family: write }
  - { tool: clock, family: write }
  - { tool: session, family: write }
  - { tool: cursor, family: write }
  - { tool: digest, family: write }
  - { tool: act, family: write }
  - { tool: upgrade, family: write }
  - { tool: reform, family: write }
  - { tool: install, family: write }
  - { tool: garden, family: read }
  - { tool: reckon, family: read }
  - { tool: ledger, family: read }
  - { tool: pos, family: read }
  - { tool: seq, family: read }
  - { tool: stale, family: read }
  - { tool: leads, family: read }
  - { tool: where, family: read }
  - { tool: cal, family: measure }
  - { tool: geo, family: measure }
  - { tool: units, family: measure }
  - { tool: fetch, family: measure }
  - { tool: knowledge, family: measure }
  - { tool: crosswalk, family: measure }
  - { tool: propose, family: between }
  - { tool: merge, family: between }
  - { tool: across, family: between }
  - { tool: pass, family: between }
  - { tool: held, family: between }
  - { tool: launch, family: launch }
forms:
  families: { family: required, meaning: required }
  tools:
    tool: required
    family:
      required: "true"
      in: { registry: families, take: family }
      why: "a verb belongs to one family of what the tools are for, and `bin/daftar.py` lists the verbs by it"
