# The bodies' positions: rows of our knowledge tree, the steps of the ladder's lines beside the face's own — matter,
# organisation, bios and the rung.
# These rows are the law itself: a change to them is a RULE-CHANGE, made here.
levels:
  - { level: force-field, line: matter, stands: [{ at: space-time, as: possible-on }], meaning: "a field that binds or gives mass, filling room without excluding: light's (the electromagnetic), the weak, the gluons' (the strong) and the Higgs's, whose value everywhere gives the W, the Z and the matter fields their mass. Its quanta, bosons, may share one state without number, so it can be smooth and classical — a radio wave, a magnet's field. It is where no particle is: the vacuum is every field at its least. Gravitation is none of them: it is the frame itself" }
  - { level: matter-field, line: matter, stands: [{ at: force-field, as: possible-on }], meaning: "a field that takes room, and excludes: the six quarks' and the six leptons'. No two of its quanta share one state (Pauli), which is why matter stands apart, is solid and keeps its size; its charges are its couplings to the force fields and its mass the Higgs's gift, so it rests on them, as they do not on it" }
  - { level: elementary-particle, line: matter, stands: [{ at: force-field, as: made-of }, { at: matter-field, as: made-of }], meaning: "the body's dot: one quantum of a field, with no part known today — a photon, a gluon, a W, a Higgs boson of the force fields; a quark, an electron, a neutrino of the matter fields. Found divisible, it is divided as every dot is, keeping its order and its wholeness, and keeps its system" }
  - { level: hadron, line: matter, stands: [{ at: elementary-particle, as: made-of }], meaning: "quarks bound by the gluons' field, the strong force itself: a proton, a neutron. A quark is never alone (confinement), and most of a hadron's mass is its binding's energy" }
  - { level: nucleus, line: matter, stands: [{ at: hadron, as: made-of }], meaning: "hadrons bound by what the strong force leaves between colour-neutral wholes, the nuclear force: the core of an atom, with its isotopes, its binding and its decay" }
  - { level: atom, line: matter, stands: [{ at: nucleus, as: made-of }], meaning: "a nucleus with its electrons, bound by light's field, the electromagnetic force itself: shells, and the periodic table — hydrogen the first" }
  - { level: molecule, line: matter, stands: [{ at: atom, as: made-of }], meaning: "atoms bound by what the electromagnetic force leaves between neutral atoms, their shared electrons: water, a protein — a shape and a chemical identity" }
  - { level: material, line: matter, stands: [{ at: elementary-particle, as: made-of, while: ensemble }], meaning: "any bound step in number — particles, nuclei, atoms or molecules: matter in bulk, of one kind or a mixture, with a phase, a hardness and a temperature none of its parts has alone — a plasma, a metal, a mineral, a rock, glass, water" }
  - { level: celestial-body, line: organisation, stands: [{ at: material, as: made-of }], meaning: "matter organized by its own gravitation, its materials' bonds still within it, as the `bodies` rows are: a star, a planet, a moon, a rubble-pile asteroid. Here directions are ordered — up and down, bigger and smaller start to mean" }
  - { level: planetary-system, line: organisation, stands: [{ at: celestial-body, as: made-of }], meaning: "bodies held in paths about the largest among them: a star and its planets, a planet and its moons" }
  - { level: galaxy, line: organisation, stands: [{ at: planetary-system, as: made-of }], meaning: "stars, their systems and the matter between them, held together by gravitation" }
  - { level: cell, line: organisation, stands: [{ at: molecule, as: made-of }, { at: material, as: made-of }, { at: living, as: possible-on }], meaning: "the least that lives of itself: it takes in, grows and divides — made of molecules and of material, a chemistry and a temperature, and possible only where life is" }
  - { level: tissue, line: organisation, stands: [{ at: cell, as: made-of }], meaning: "cells of one kind working as one" }
  - { level: organ, line: organisation, stands: [{ at: tissue, as: made-of }], meaning: "tissues serving one capacity of a body, or organs serving one together: a leaf, a heart, a plant's roots, an animal's blood — it is the capacity that has organs" }
  - { level: organism, line: organisation, stands: [{ at: organ, as: made-of }], meaning: "a living body that is one being: a microbe on its one cell, a tree, an animal, a person" }
  - { level: population, line: organisation, stands: [{ at: organism, as: member-of }], meaning: "organisms of one kind living together: a herd, a stand of trees" }
  - { level: community, line: organisation, stands: [{ at: population, as: member-of }], meaning: "populations of many kinds living together" }
  - { level: ecosystem, line: organisation, stands: [{ at: community, as: made-of }, { at: material, as: made-of }], meaning: "a community with the matter it lives on and in — up to every ecosystem of a world together, its biosphere" }
  - { level: component, line: organisation, stands: [{ at: material, as: made-of }, { at: reason, as: possible-on }], meaning: "a made part, one body: made of material and holding no made part — a chip, a board, a platter, a cable. A feature of it — a groove, a thread, a keyway — is no position: a part of it that cannot be taken from it" }
  - { level: device, line: organisation, stands: [{ at: component, as: made-of }], meaning: "made parts assembled to work as one — components, and devices: a device may be part of a device while it is mounted, a bearing of a pulley, the lens of a camera — or devices and structure assembled at a place, a rack, a room of machines, a building: a machine, a router, a drive, a camera, a camera lens, a bearing, a sensor. What it does beyond keeping its form is lent by the hands it came through, its vias" }
  - { level: living, line: bios, stands: [{ at: celestial-body, as: possible-on, while: balance }], meaning: "life: what takes in, grows and divides of itself, possible on a world in balance. It is given: a living being comes through the living" }
  - { level: organic, line: bios, stands: [{ at: living, as: possible-on }], meaning: "what the living make or leave without being alive themselves: a nest, a comb, honey, wood, a shell, remains. It comes through the living, as life does, never through hands alone" }
  - { level: sensitive, line: rung, stands: [{ at: organism, as: possible-on }], meaning: "to perceive, desire and move: the rung above life, a body's power, which takes no room" }

# The columns of each table of rows above: which every row holds (`required`) and which it may (`optional`); a row holds
# the required ones and no other (core/law.py, `columns`). A reading names a table they declare as an input said by
# the law (core/law/lines.yaml `selection_form.inputs`).
columns:
  levels: { level: required, line: required, stands: required, meaning: required, frame_of: optional }
