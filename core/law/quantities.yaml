# The quantities (ISO 80000, SI): the dimensions, what each quantity is of and on which scale, and the kinds of accuracy
# a maker states (GUM). Their units are core/law/units.yaml's, in UCUM; currencies are ISO 4217's.
# These rows are the law itself: a change to them is a RULE-CHANGE, made here.
dimensions:
  # WHERE EACH STANDS AND WHAT IT HOLDS FOR: a dimension `stands` on the ladder as a level does — `possible-on`
  # the step it needs in order to be at all, the way of `ways`, `while` a condition — and `holds_for` says what may bear
  # it: a nature, or a level the bearer is or is made of. What a being is made of carries its categories up (Hartmann's
  # Überformung: a person's body still has mass and still falls); what a step is possible on does not (his Überbauung:
  # reason rests on an organism, and a sayable has no mass), so `holds_for` follows `made-of` alone (rule `bearer`).
  # ONE PATH, ONE STATEMENT: a stand another stand already gives, or a bearer another row already gives, is not written
  # (mass's bearer is the foundation `weight`'s). A CARRIER AND WHAT LIVES IN IT ARE TWO: a host runs an instance (`run`),
  # a disk carries a volume (`carry`), a person's body is its level and reason its rung. The carrier says what it holds
  # (`hold`); what it carries is measured itself, and its bearer is that, never the carrier.
  - dimension: time
    face: time
    stands: [ { at: space-time, as: possible-on } ]
    meaning: "how long — with length, the two faces of the one frame, space∞time (`complexity` space-time): neither without the other. SI fixes the second by the caesium frequency, and the metre from it through c: one frame"
  - dimension: length
    face: place
    stands: [ { at: space-time, as: possible-on } ]
    meaning: "how far — with time, the two faces of the one frame, space∞time (`complexity` space-time): neither without the other"
  - dimension: mass
    stands: [ { at: force-field, as: possible-on } ]
    meaning: "how much matter-energy: a field's energy at rest (E = mc²) — given an elementary particle by the Higgs field, and most of a hadron's by the energy of the gluons' field binding it. Every body has it: the foundation `weight` says so, and is its bearer. SI fixes the kilogram through h"
  - dimension: charge
    stands: [ { at: force-field, as: possible-on } ]
    holds_for: body
    meaning: "how much electric charge: how strongly a field couples to light's field, beside mass and standing on neither — conserved, and counted in elementary charges (e, by which SI fixes the ampere). A current is charge through time; a voltage, energy per charge"
  - dimension: temperature
    stands: [ { at: mass, as: possible-on, while: ensemble } ]
    holds_for: { level: material }
    meaning: "how hot: energy shared over the many degrees of freedom of an ensemble (SI fixes the kelvin through k). No particle, nucleus, atom or single molecule has one; a material has — a plasma, a gas, a metal — and what is made of it: a cell, an organism, a star, a machine"
  - dimension: money
    stands: [ { at: reason, as: possible-on } ]
    holds_for: sayable
    meaning: "how much value, in a currency: what persons agree, on the said line — measured of the agreement and what is said under it: a contract, a payment, an account. Its carriers say what they hold (`hold`): a person, a wallet, a banknote; a body has no money of its own, an agreement about it does. Two currencies meet only through a rate someone observed"
quantities:
  - { quantity: duration, of: { time: 1 } }
  - { quantity: frequency, of: { time: "-1" } }
  - { quantity: length, of: { length: 1 } }
  - { quantity: area, of: { length: 2 } }
  - { quantity: volume, of: { length: 3 } }
  - { quantity: speed, of: { length: 1, time: "-1" } }
  - { quantity: acceleration, of: { length: 1, time: "-2" } }
  - { quantity: mass, of: { mass: 1 } }
  - quantity: information
    of: {}
    holds_for: sayable
    meaning: "how many binary choices a sayable takes in its order: a count, as an amount of substance is (ISO/IEC 80000-13 gives it dimension one), counted in bits and bytes. What is carried bears it — a document, a running instance, a volume, a message — never its carrier, which says what it can hold (`hold: { by: nas, of: 2 TBy }`) and may keep it as charge, magnetisation, pits or light alike. Erasing a bit costs a carrier at temperature T at least kT ln 2 (Landauer): a bridge between the carrier and the carried, not a step. What it means is reason's, and no quantity"
  - quantity: data-rate
    of: { time: "-1" }
    holds_for: sayable
    meaning: "information carried per time: a stream's, a transfer's. A link or a port says the rate it can carry with `hold`"
  - { quantity: level, of: {}, scale: logarithmic }
  - { quantity: attenuation, of: { length: "-1" }, scale: logarithmic }
  - quantity: ratio
    of: {}
    meaning: "a part of a whole, or a rate: dimensionless and linear — a share, a rate of interest"
  - { quantity: density, of: { mass: 1, length: "-3" } }
  - quantity: pressure
    of: { mass: 1, length: "-1", time: "-2" }
    meaning: "a force on an area. A gauge pressure — above the air's — says so in its property, never in its unit"
  - { quantity: volume-flow, of: { length: 3, time: "-1" } }
  - quantity: plane-angle
    of: {}
    meaning: "an angle in a plane: dimensionless and its own kind, as `ratio` and `level` are"
  - quantity: temperature-difference
    of: { temperature: 1 }
    meaning: "how much hotter: the measure of a region of the `temperature` aspect, as a duration is of `time`. A temperature READING is a position on that aspect, never this"
  - quantity: number
    of: {}
    meaning: "how many things, counted: seats, stems, units of stock. Dimensionless and its own kind, apart from `ratio`, which is a share"
  - quantity: money
    of: { money: 1 }
    units_from: { registry: currencies, take: code, digits: digits }
    crosswalk: observed
    meaning: "an amount in one currency. Each currency is a unit, and no factor joins two of them: two currencies meet only through a rate someone observed at a moment, from a source — a reading, recorded with its provenance, never a law. So every amount stays in the currency it was paid or owed in, and whatever is computed from amounts — a share, a sum, a balance, a conversion at an observed rate — is computed in fractions and read, never stored."
  # THE KINDS BEYOND THE FIRST ONES: each `of` in the dimensions; one that stands above its dimensions says
  # where (`stands`) and what it holds for (`holds_for`); one written in another's units says whose (`units_of`)
  - quantity: rotational-speed
    of: { time: "-1" }
    meaning: "how fast a thing turns: turns counted per time — a frequency's exponents, its own kind (a disk's 7200 rpm is no signal's frequency)"
  - quantity: solid-angle
    of: {}
    meaning: "an angle in space: an area on a sphere over its radius squared, dimensionless and its own kind, as `plane-angle` is"
  - quantity: angular-speed
    of: { time: "-1" }
    meaning: "how fast an angle changes: a plane angle per time, its own kind"
  - quantity: linear-density
    of: { mass: 1, length: "-1" }
    meaning: "mass per length: a cable's, a bar's"
  - quantity: surface-density
    of: { mass: 1, length: "-2" }
    meaning: "mass per area: a slab's, a sheet's"
  - quantity: mass-flow
    of: { mass: 1, time: "-1" }
    meaning: "mass through time: what a line carries, a pipe delivers"
  - quantity: momentum
    of: { mass: 1, length: 1, time: "-1" }
    meaning: "mass in motion: mass times speed"
  - quantity: force
    of: { mass: 1, length: 1, time: "-2" }
    meaning: "what changes a body's motion: mass times acceleration"
  - quantity: energy
    of: { mass: 1, length: 2, time: "-2" }
    meaning: "what a body has or gives to do work, heat or light: one quantity, whatever its form"
  - quantity: torque
    of: { mass: 1, length: 2, time: "-2" }
    meaning: "a force's turning about an axis: an energy's exponents, its own kind, never written in joules"
  - quantity: power
    of: { mass: 1, length: 2, time: "-3" }
    meaning: "energy through time"
  - quantity: moment-of-inertia
    of: { mass: 1, length: 2 }
    meaning: "how a body's mass resists turning about an axis"
  - quantity: linear-stiffness
    of: { mass: 1, time: "-2" }
    meaning: "force per displacement: a spring's, a support's"
  - quantity: absorbed-dose
    of: { length: 2, time: "-2" }
    holds_for: body
    meaning: "energy given to matter per its mass, by radiation: its own kind"
  - quantity: weight
    of: { mass: 1, length: 1, time: "-2" }
    units_of: force
    meaning: "the pull of gravitation on a body: a force, its own kind (`foundations: weight`). A scale reads a weight and states a mass through the local g, its uncertainty carrying g's"
  - quantity: gravitational-acceleration
    of: { length: 1, time: "-2" }
    holds_for: body
    units_of: acceleration
    meaning: "the field's strength where a body is: an acceleration, its own kind — needing only the frame's dimensions, as gravitation is the frame's own geometry"
  - quantity: gravitational-potential
    of: { length: 2, time: "-2" }
    meaning: "energy per mass in the field, against a chosen equipotential: a height above the geoid is a position on it"
  - quantity: gravitational-parameter
    of: { length: 3, time: "-2" }
    holds_for: { level: celestial-body }
    meaning: "a body's G times its mass (GM), what its gravitation is measured by"
  - quantity: charge
    of: { charge: 1 }
    meaning: "how much electric charge"
  - quantity: current
    of: { charge: 1, time: "-1" }
    meaning: "charge through time"
  - quantity: potential-difference
    of: { mass: 1, length: 2, time: "-2", charge: "-1" }
    meaning: "energy per charge between two points: a voltage, the measure of a region of the `potential` line"
  - quantity: electric-field
    of: { mass: 1, length: 1, time: "-2", charge: "-1" }
    meaning: "a potential difference per length"
  - quantity: resistance
    of: { mass: 1, length: 2, time: "-1", charge: "-2" }
    holds_for: { level: material }
    meaning: "a potential difference per current: what a material, shaped, puts against a current"
  - quantity: conductance
    of: { mass: "-1", length: "-2", time: 1, charge: 2 }
    holds_for: { level: material }
    meaning: "a current per potential difference: resistance's inverse"
  - quantity: resistivity
    of: { mass: 1, length: 3, time: "-1", charge: "-2" }
    holds_for: { level: material }
    meaning: "a material's own resistance, whatever its shape"
  - quantity: capacitance
    of: { mass: "-1", length: "-2", time: 2, charge: 2 }
    holds_for: { level: component }
    meaning: "charge held per potential difference: a configuration's"
  - quantity: inductance
    of: { mass: 1, length: 2, charge: "-2" }
    holds_for: { level: component }
    meaning: "magnetic flux per current: a coil's"
  - quantity: magnetic-flux
    of: { mass: 1, length: 2, time: "-1", charge: "-1" }
    meaning: "a magnetic field through a surface"
  - quantity: magnetic-flux-density
    of: { mass: 1, time: "-1", charge: "-1" }
    meaning: "a magnetic field's strength"
  - quantity: apparent-power
    of: { mass: 1, length: 2, time: "-3" }
    meaning: "a potential difference times a current, whatever their phase: what a UPS is rated in, its own kind"
  - quantity: reactive-power
    of: { mass: 1, length: 2, time: "-3" }
    meaning: "the part of an apparent power that goes back and forth and does no work: its own kind"
  - quantity: activity
    of: { time: "-1" }
    holds_for: { level: nucleus }
    meaning: "decays of nuclei per time: a frequency's exponents, its own kind"
  - quantity: amount-of-substance
    of: {}
    holds_for: { level: atom }
    meaning: "how many entities of one kind — atoms, molecules, ions — a count, with the mole as its unit of count (N_A of them)"
  - quantity: substance-concentration
    of: { length: "-3" }
    holds_for: { level: material }
    meaning: "an amount of a substance per volume of a solution: a count per volume"
  - quantity: mass-concentration
    of: { mass: 1, length: "-3" }
    holds_for: { level: material }
    meaning: "the mass of a substance per volume of a solution: density's exponents, its own kind"
  - quantity: catalytic-activity
    of: { time: "-1" }
    holds_for: { level: molecule }
    meaning: "an amount of a substance converted per time: an enzyme's"
  - quantity: osmolality
    of: { mass: "-1" }
    holds_for: { level: material }
    meaning: "dissolved particles per mass of solvent"
  - quantity: equivalent-concentration
    of: { length: "-3" }
    holds_for: { level: material }
    meaning: "charge-equivalents of an ion per volume"
  - quantity: ph
    of: {}
    scale: logarithmic
    holds_for: { level: material }
    meaning: "how acid: the negative logarithm of a solution's hydrogen-ion activity"
  - quantity: heat-capacity
    of: { mass: 1, length: 2, time: "-2", temperature: "-1" }
    meaning: "energy per temperature: what a body takes to warm"
  - quantity: entropy
    of: { mass: 1, length: 2, time: "-2", temperature: "-1" }
    units_of: heat-capacity
    meaning: "energy per temperature of a state's disorder: information measured thermally (k ln 2 per bit), its own kind"
  - quantity: specific-heat-capacity
    of: { length: 2, time: "-2", temperature: "-1" }
    meaning: "heat capacity per mass: a material's"
  - quantity: thermal-conductivity
    of: { mass: 1, length: 1, time: "-3", temperature: "-1" }
    meaning: "how a material carries heat"
  - quantity: thermal-transmittance
    of: { mass: 1, time: "-3", temperature: "-1" }
    meaning: "heat through an element per area and per temperature difference: a wall's U-value"
  - quantity: thermal-resistance
    of: { mass: "-1", time: 3, temperature: 1 }
    meaning: "a temperature difference per heat flux: an element's resistance to heat"
  - quantity: heat-flux-density
    of: { mass: 1, time: "-3" }
    meaning: "heat through an area per time"
  - quantity: operation-rate
    of: { time: "-1" }
    meaning: "named events counted per time — operations, packets, frames: its own kind, the events named in the unit"
  - quantity: power-level
    of: {}
    scale: logarithmic
    meaning: "a power as a logarithmic ratio to one milliwatt"
  - quantity: luminous-intensity
    of: { mass: 1, length: 2, time: "-3" }
    stands: [ { at: organism, as: possible-on } ]
    meaning: "radiant power per solid angle as the standard human eye weighs it (the CIE observer): power's exponents, standing on a perceiver; it holds for the source measured"
  - quantity: luminous-flux
    of: { mass: 1, length: 2, time: "-3" }
    stands: [ { at: organism, as: possible-on } ]
    meaning: "radiant power as the standard eye weighs it"
  - quantity: illuminance
    of: { mass: 1, time: "-3" }
    stands: [ { at: organism, as: possible-on } ]
    meaning: "luminous flux falling on an area"
  - quantity: luminance
    of: { mass: 1, time: "-3" }
    stands: [ { at: organism, as: possible-on } ]
    meaning: "luminous intensity per area of a source, in a direction"
  - quantity: luminous-efficacy
    of: {}
    stands: [ { at: organism, as: possible-on } ]
    meaning: "luminous flux per power: how much of a lamp's power the eye receives as light"
  - quantity: loudness-level
    of: {}
    scale: logarithmic
    stands: [ { at: organism, as: possible-on } ]
    meaning: "a sound's level as the standard listener hears it, in phons"
  - quantity: dose-equivalent
    of: { length: 2, time: "-2" }
    holds_for: { level: tissue }
    meaning: "an absorbed dose weighted by its harm to living tissue: held only by what is made of tissue, so standing where tissue is"
  - quantity: arbitrary-unit
    of: {}
    stands: [ { at: reason, as: possible-on } ]
    holds_for: { level: molecule }
    meaning: "an amount fixed by an agreed reference preparation (an international unit of WHO's): no factor joins it to anything but through that reference"
accuracy_kinds:
  - kind: bound
    meaning: "a limit the value lies within either way, as its maker states it: the smallest interval, or circle, that holds it (Darwin Core's coordinateUncertaintyInMeters). Read as a rectangular distribution: u = a/√3 per axis (JCGM 100:2008, 4.3.7)"
  - kind: radius-68
    meaning: "the distance within which the value lies 68 times in 100, as a receiver reports it: one standard uncertainty on one axis, 1.5096 of them for a circular error on two"
  - kind: radius-95
    meaning: "the distance within which it lies 95 times in 100: 1.96 standard uncertainties on one axis, 2.4477 for a circular error on two"
  - kind: unstated
    meaning: "an accuracy its maker gave with no probability: kept as said, and never read as a standard uncertainty"
forms:
  dimensions: { dimension: required, meaning: required, face: optional, stands: optional, holds_for: optional }
  quantities:
    quantity: required
    of: required
    scale: optional
    stands: optional
    holds_for: optional
    units_of: optional
    meaning: optional
    units_from: optional
    crosswalk: optional
  accuracy_kinds: { kind: required, meaning: required }
