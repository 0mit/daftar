# The crosswalks: how a foreign system's records are read from a garden's statements — one row a model of one series of
# that system (FHIR's StructureMap and Darwin Core's mappings, for daftar). The records stay where the garden keeps them;
# a crosswalk only reads them as the system's own client expects, and nothing it reads is stored again.
#
# A ROW's `kind` is the beans it may select, and its `select` narrows them:
#   with: <path>        the bean holds a statement the path names
#   without: <path>     ...or holds none
#   within: { along: <path>, model: <model> }   following the path from the bean, one step or many, reaches a bean the
#                       row of that model selects (a department, through `part … of`, reaches its company)
#   reached: { along: <path>, model: <model> }   a bean the row of that model selects reaches it by the path, through
#                       any of its statements the last step reads (an employment's allowances, `hold … of`, reach each
#                       kind of time off it holds)
# A FIELD is read from the bean:
#   from: title | summary | bean       the bean's own title, summary or id
#   from: <verb>[<role>=<value>,…].<role>   the role of the bean's first own statement of that verb (and those roles;
#                                      a value may name alternatives, `<role>=<a>|<b>`)
#   from: <path>/<path>                the second read from the bean the first reaches: a path runs through beans.
#                                      Where the first names a statement (`<bean>#<id>`), a second of that statement's
#                                      verb reads it alone, and one of another verb the bean it is in
#     position: from | to | days | moment-from | moment-to   ...a position, as Odoo writes it: an extent's first or last
#                                      day, the days it spans, or the first or last moment of its days in the garden's
#                                      zone, in UTC
#   model: <model>, many: true         the records of that model the path reaches, a list
#   stands: { none: …, step: …, final: …, exit: … }   where the bean's course stands on its walk, by the walk's own
#                                      form: before its first move, at a step, a final step, an exit
#     held: true                       ...from a SEALED statement only, as the host that keeps it resolves it: never from
#                                      git. A reader the host resolves none for reads none
#   value: <scalar>                    given, the same for every record
#   model: <model>                     the field holds the record of that model the path reaches (one), or
#     inverse: true                    the records of that model whose path reaches this one (many), or
#     chain: true                      the first record of that model reached by following the path again and again
#   along: <path>, join: "<sep>"       the titles reached by following the path while each is a record of this row's
#                                      model, from the farthest down to this one, joined
#   map: { <value>: <value> }         ...the value read, written as the system writes it (one it does not map: false)
# WHAT IS IN FORCE, read by core/inforce.py, the one reader of it: every path reads only statements that hold (their
# `while`). A `statements` form names statements in force, wherever they are written:
#   statements: { verb: <verb>, with: "<role>=<value>,…", naming: <role>, in_force_on: <walk>, ended_by: <verb>,
#                 standing: true }
#     of that verb, the filters allowing, naming the bean read for in `naming`; among the decisions in force on the walk
#     (where `in_force_on` says one); not ended by a statement of `ended_by` that holds (its day come); and (`standing`)
#     while a permitted of it holds and no forbidden of it does.
#   A ROW whose records are statements says `statements` in place of `kind` and `select`: one record each, numbered by
#     `<bean>#<id>`, its fields reading the statement's own roles (`from: <role>`).
#   A SELECT `named_in: <statements form>` keeps the beans such a statement names. (A path reads beans, so no `within`
#     or `reached` names a row whose records are statements.)
#   A FIELD `statements: <form>` reads the role `from` of each that names the bean (with `model`, their records, `many`
#     unless it says otherwise), or `exists: true`, whether any is in force.
# What the garden does not say, no record has: the field is empty (false, or no records).
# These rows are the law itself: a change to them is a RULE-CHANGE, made here.
# A GARDEN'S OWN ROWS stand in its VOCAB.md (`crosswalks`), in this form, read by the one reader beside these: never a
# name of these, nor a model one of these crosses in its system and series. A row of the garden's is used where a bean
# of its kind is, or says why it is vacant (`vacant: <why>`). A row that proves general is proposed here.
# HOW A ROW'S RECORDS COME AND GO (2.12; MODEL.md, Imports and exports). A row that names its `format` (one of
# core/law/formats.yaml, or a list) and its `act` is read both ways: an export reads each field from the statements, as
# above, and an import writes each field into them, kept by the act:
#   format: <format>, reader: <reader>   how its records are written, and the reader that gives a model's records where
#                                       the format alone cannot (formats.yaml `readers`)
#   records: { table, where, path }     which records of a source: a table and the values its columns hold, a path
#   act: { verb: read | say | derive | make, per: import | record, <role>: <field> }   the knowing act its statements
#                                       are known by: one for all an import keeps, or one a record (a copy's `make`),
#                                       a role named by a field of the record; the rest given where the import runs
#   keep: store | bean                  where an import keeps them, unless it is told otherwise
#   whole: true                         every field of every record is carried, or dropped by a reason, or the import
#                                       fails: nothing is passed over (the account)
#   compose: { <path>: "<form>" }       a value made of parts, each a field read `part: <name>`
#   given: { <path>: <value> }          a value every statement written has, and every one read back holds
#   self: <role>                        the role `self` fills, where the verb leaves two
# A FIELD READ BOTH WAYS. A path `<verb>[<role>=<value>,…].<role>` names a statement: an import writes it, its filters
# as roles, the field's value in the role the path ends in, and `self` in the one required role of a being the verb
# leaves; fields of one verb and the same filters write one statement. A row whose records are statements writes one
# of its verb, each field into its own role (`from: <role>`, `<role>.<key>` a key of a mapping, `id` its id). A path
# that runs through beans, a position, `stands`, `join`, `inverse` and `chain` are read one way only, and an import lists
# such a field as not carried, never guessed. A field also says:
#   as: <conversion>                    how its value is read into the role and back (formats.yaml `conversions`)
#   with: { <role>: <field> }           the other roles of its statement, each from another field
#   unit: <unit>                        the unit a count is in
#   part: <name>                        the part of a composed value it is
#   drop: "<why>"                       a field deliberately carried nowhere, and why
#   else: <field>                       where the record holds no value at this field, the value of the field named,
#                                       read the same way into the same role (an older body's serial in its maker notes
#                                       where the Exif has none); the field named is carried by this one, never twice
# A field of the record no row names is listed by the account as not carried, counted by its name.
forms:
  crosswalk: { crosswalk: required, system: required, series: required, model: required, kind: optional, statements: optional, select: optional, fields: required, meaning: required, vacant: optional, format: optional, reader: optional, records: optional, act: optional, keep: optional, whole: optional, compose: optional, given: optional, self: optional }
  field: { from: optional, value: optional, model: optional, inverse: optional, chain: optional, along: optional, join: optional, held: optional, many: optional, position: optional, stands: optional, map: optional, statements: optional, exists: optional, as: optional, with: optional, unit: optional, part: optional, drop: optional, else: optional }
  statements: { verb: required, with: optional, naming: optional, in_force_on: optional, ended_by: optional, standing: optional }
crosswalks:
  - crosswalk: odoo-17.0-res.company
    system: odoo
    series: "17.0"
    model: res.company
    kind: org
    select: { with: represent.by }
    fields:
      name: { from: title }
      display_name: { from: title }
      email: { from: "name[by=mail].as" }
      website: { from: "name[by=dns].as" }
      parent_id: { from: part.of, model: res.company }
      child_ids: { from: part.of, model: res.company, inverse: true }
      active: { value: true }
    meaning: "the companies a garden is kept for: each organisation someone represents in it, as the gardener represents the firm whose garden it is"
  - crosswalk: odoo-17.0-hr.department
    system: odoo
    series: "17.0"
    model: hr.department
    kind: org
    select: { within: { along: part.of, model: res.company }, without: represent.by }
    fields:
      name: { from: title }
      display_name: { from: title, along: part.of, join: " / " }
      complete_name: { from: title, along: part.of, join: " / " }
      parent_id: { from: part.of, model: hr.department }
      child_ids: { from: part.of, model: hr.department, inverse: true }
      company_id: { from: part.of, model: res.company, chain: true }
      active: { value: true }
    meaning: "a company's departments: each organisation that is part of one of the garden's companies, or of a department of one"
  - crosswalk: odoo-17.0-hr.employee
    system: odoo
    series: "17.0"
    model: hr.employee
    kind: contract
    select: { with: "agree[as=employee].by", within: { along: "agree[as=employer].by", model: res.company } }
    fields:
      name: { from: "agree[as=employee].by/title" }
      display_name: { from: "agree[as=employee].by/title" }
      work_email: { from: "agree[as=employee].by/name[by=mail].as" }
      work_phone: { from: "agree[as=employee].by/name[by=e164].as" }
      job_title: { from: represent.as }
      company_id: { from: "agree[as=employer].by", model: res.company }
      department_id: { from: part.of, model: hr.department }
      active: { value: true }
      identification_id: { from: "agree[as=employee].by/name[by=tr-tckn|ir-national-code].as", held: true }
      private_email: { from: "agree[as=employee].by/name[by=mail].as", held: true }
      private_phone: { from: "agree[as=employee].by/name[by=e164].as", held: true }
    meaning: "a company's employees: each employment, an agreement a person agrees to as employee and one of the garden's companies as employer — the record is the agreement, so one person employed twice is two records, as in Odoo; the name, work mail and work phone are the person's own, from their bean; the job title what they act for the employer as (`represent … as`); the department the one the employment is part of; the identity number, private mail and private phone are held only, read from sealed statements as the host that keeps them resolves them, never from git"
  - crosswalk: odoo-17.0-hr.leave.type
    system: odoo
    series: "17.0"
    model: hr.leave.type
    kind: document
    select: { reached: { along: hold.of, model: hr.employee } }
    fields:
      name: { from: title }
      display_name: { from: title }
      company_id: { from: own.by, model: res.company }
      active: { value: true }
    meaning: "the kinds of time off a company grants: each the terms of one kind of absence, a document that an allowance of one of the garden's employments holds (`hold … of`, a statement of the employment) — an absence names it through the allowance it uses; its company the one of the garden's that owns those terms, or none where none of them does, as a kind every company grants is in Odoo"
  - crosswalk: odoo-17.0-hr.leave
    system: odoo
    series: "17.0"
    model: hr.leave
    kind: event
    select: { with: "be[as=presence].at", within: { along: use.of, model: hr.employee } }
    fields:
      name: { from: title }
      display_name: { from: title }
      employee_id: { from: use.of, model: hr.employee }
      employee_ids: { from: use.of, model: hr.employee, many: true }
      all_employee_ids: { from: use.of, model: hr.employee, many: true }
      department_id: { from: "use.of/part.of", model: hr.department }
      holiday_status_id: { from: "use.of/hold.of", model: hr.leave.type }
      request_date_from: { from: "be[as=presence].at", position: from }
      request_date_to: { from: "be[as=presence].at", position: to }
      date_from: { from: "be[as=presence].at", position: moment-from }
      date_to: { from: "be[as=presence].at", position: moment-to }
      number_of_days: { from: "be[as=presence].at", position: days }
      number_of_days_display: { from: "be[as=presence].at", position: days }
      state: { stands: { none: draft, step: confirm, final: validate, exit: refuse } }
      holiday_type: { value: employee }
      active: { value: true }
      active_employee: { value: true }
    meaning: "an employee's absences: each happening placed over an extent of days (`be … as: presence`) that uses an allowance of an employment (`use … of`, the employment's statement) — its days read from that extent, in the garden's zone; its employee the employment; its type the kind of time off that allowance holds (`hold … of`); its state where its course stands on its walk, by the walk's own form: before its first move to submit, at a step to approve, at a final step approved, at an exit refused"
  - crosswalk: fhir-r5-observation
    system: fhir
    series: "R5"
    model: Observation
    statements: { verb: measure }
    format: json
    act: { verb: read }
    keep: bean
    fields:
      resourceType: { value: Observation }
      status: { value: final }
      id: { from: id }
      "subject.reference": { from: bean, as: { form: "Patient/{}" } }
      "code.coding[0]": { from: as, as: coding }
      "method.coding[0]": { from: method, as: coding }
      "valueCodeableConcept.coding[0]": { from: result, as: coding }
      "valueQuantity.value": { from: value.count, as: decimal }
      "valueQuantity.system": { value: "http://unitsofmeasure.org" }
      "valueQuantity.code": { from: value.unit }
      effectiveDateTime: { from: at }
      "performer[0].reference": { from: by, as: { form: "Practitioner/{}" } }
      "note[0].text": { from: note }
    meaning: "a FHIR R5 Observation is a reading: one `measure` of the bean its subject names (a Patient, by its id) — its code the property read, its first coding by the scheme whose url is the coding's system; a quantity in UCUM, a code its result; when it held, as written; who observed it; its first note. Only a final reading is carried as made (the others' status is listed); a subject or a performer of another resource type is not carried, and neither is a quantity whose unit is not the law's"
  - crosswalk: dwc-occurrence
    system: dwc
    series: "terms"
    model: Occurrence
    statements: { verb: be, with: "as=location" }
    format: csv
    act: { verb: read }
    keep: bean
    compose: { at: "{crs};{lat},{lon}" }
    given: { "placed.openness": elsewhere, "placed.accuracy.unit": m, "placed.accuracy.kind": bound }
    fields:
      occurrenceID: { from: bean }
      eventDate: { from: placed.observed }
      geodeticDatum: { from: at, part: crs }
      decimalLatitude: { from: at, part: lat }
      decimalLongitude: { from: at, part: lon }
      coordinateUncertaintyInMeters: { from: placed.accuracy.count }
      locality: { from: note }
    meaning: "a Darwin Core occurrence is a being seen at a place: a `be` as location of the being its occurrenceID names — its coordinate in the one form of its system (`EPSG:4326;<lat>,<lon>`), the day it was seen there as written (an interval is not carried), the smallest circle that holds it as an accuracy of kind `bound` in metres, as Darwin Core defines the uncertainty, the place in words; seen in the field, so reachable, and not from the machine that records it"
  - crosswalk: file-tree-volume
    system: file-tree
    series: "1"
    model: volume
    kind: volume
    format: [sqlite, tsv, csv, jsonl]
    reader: file-tree
    act: { verb: read }
    keep: store
    fields:
      id: { from: bean }
      carrier: { from: hold.by }
    meaning: "a volume read as a tree of names: the carrier it is kept on holds it"
  - crosswalk: file-tree-folder
    system: file-tree
    series: "1"
    model: folder
    kind: folder
    format: [sqlite, tsv, csv, jsonl]
    reader: file-tree
    act: { verb: read }
    keep: store
    fields:
      id: { from: bean }
      parent: { from: part.of }
      name: { from: name.as, with: { by: parent }, as: escaped }
    meaning: "a folder: part of its parent folder, or of its volume, which gives it its name"
  - crosswalk: file-tree-file
    system: file-tree
    series: "1"
    model: file
    statements: { verb: hold }
    format: [sqlite, tsv, csv, jsonl]
    reader: file-tree
    act: { verb: read }
    keep: store
    fields:
      folder: { from: bean }
      content: { from: of }
      name: { from: as, as: escaped }
    meaning: "a file is no being but a holding: its folder, or its volume, holds a content under the file's name, and a content nobody read is `unknown`. Each name is a holding, a hard link's second among them"
  - crosswalk: file-tree-content
    system: file-tree
    series: "1"
    model: content
    kind: content
    format: [sqlite, tsv, csv, jsonl]
    reader: file-tree
    act: { verb: derive }
    keep: store
    fields:
      id: { from: bean }
      blake3: { from: "name[by=blake3].as" }
      size: { from: "measure[as=information].value", unit: By }
    meaning: "a content, an exact sequence of bytes: named by its BLAKE3 and measured in bytes, derived from the readings of the volumes that hold it"
  - crosswalk: file-tree-copy
    system: file-tree
    series: "1"
    model: copy
    statements: { verb: hold }
    format: sqlite
    reader: copies
    act: { verb: make, per: record, from: source, at: at, note: note }
    keep: store
    fields:
      folder: { from: bean }
      content: { from: of }
      name: { from: as, as: escaped }
    meaning: "a copy is a holding made from the holding it copies: its folder holds the content under its name, known by a `make` from the source holding through the copier, at the moment it was copied"
  - crosswalk: exif-image
    system: exif
    series: "3.0"
    model: image
    kind: content
    format: json
    reader: exiftool
    act: { verb: read }
    keep: store
    fields:
      content: { from: bean }
      "Composite:SubSecDateTimeOriginal": { from: produce.at, as: { moment: exif } }
      "ExifIFD:SerialNumber": { from: produce.by, as: { named: given, hint: ["IFD0:Make", "IFD0:Model"] }, else: "Canon:SerialNumber" }
      "ExifIFD:LensSerialNumber": { from: produce.through, as: { named: given, hint: ["ExifIFD:LensModel"], none: ["0000000000"] } }
    meaning: "a photograph's content was produced by the camera whose serial the picture states, through the lens whose serial it states, at the moment the shutter was released: the original's clock with its fraction and offset where the picture has them, its day alone where it has no offset. the serial is the Exif's, or where it has none the maker notes' (an older Canon body writes it only there), looked up in the namespace the garden names its devices' serials in, which the import is told; a serial that names no being there leaves the camera `unknown`, and is listed with the camera's make and model for a person to name (class F); every other tag is counted, not carried"
  - crosswalk: quicktime-movie
    system: quicktime
    series: "ISO/IEC 14496-12"
    model: movie
    kind: content
    format: json
    reader: exiftool
    act: { verb: read }
    keep: store
    given: { produce.by: unknown }
    fields:
      content: { from: bean }
      "QuickTime:CreateDate": { from: produce.at, as: { moment: quicktime } }
    meaning: "a video's content was made at the moment its movie header states, in UTC as the format says (QuickTime and the ISO base media file format count it from 1904-01-01T00:00Z); a moment at that epoch, or within a month of one of `clock_epochs`, is a clock never set and carries no moment. The camera is not stated by the movie header, so `produce.by` is `unknown`, filled where a person or another record names it; every other tag is counted, not carried"
