# The kinds of being a bean records, each with its nature, and its level and rung where it has them.
# These rows are the law itself: a change to them is a RULE-CHANGE, made here.
kinds:
  - { kind: codebase, nature: sayable }
  - { kind: product, nature: sayable }
  - { kind: org, nature: sayable }
  - { kind: person, nature: body, level: organism, rung: reason }
  - { kind: instance, nature: sayable }
  - { kind: host, nature: body, level: device }
  - { kind: virtual-host, nature: sayable }
  - { kind: domain, nature: sayable }
  - { kind: service, nature: sayable }
  - { kind: program, nature: sayable }
  - { kind: design, nature: sayable }
  - { kind: session, nature: sayable }
  - { kind: contract, nature: sayable }
  - { kind: garden, nature: sayable }
  - { kind: document, nature: sayable }
  - { kind: event, nature: sayable }
  - { kind: volume, nature: sayable, meaning: "a filesystem: a tree of names kept on a carrier, which holds it" }
  - { kind: folder, nature: sayable, meaning: "a directory: it gives a name to each thing it holds, and is part of its parent, or of its volume" }
  - { kind: content, nature: sayable, meaning: "an exact sequence of bytes, named by a digest of them (`blake3`, `sha-256`): what holds it holds it under a name" }
