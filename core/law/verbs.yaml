# The other verbs' rows, ratified 2026-10-01 beside core.yaml. The face's 21 verbs are in core.yaml; these are the rows
# that stand on it, in the same form: the roles each takes, what fills them, which are required, the qualifiers it
# allows, its default where it has one. `replaces` names what of today's law (v0.48.0) each row takes over, so the
# translator has its map; `home` is core, or the profile it belongs to.

tables:                                   # the small tables these rows name; a standard's tables are read from it
  forms:         [written, spoken, unstated]          # how an agreement's words were given
  grants:        [read, write, enact, ratify]         # what a grant opens
  classes:       [A, B, C, D, E, F, G, H, I, J, K]    # the Contract of Parts' classes of decision
  sensitivities: [none, personal, special-category]
  presences:     [present, absent]                     # what a reading found: present, or looked for and not found
  jobs:          [router, mail-primary, mail-backup, file-server, dns-resolver, dns-authoritative, monitoring, web, app-host, vpn-gateway, ledger-hub, workstation]
  verdicts:      [confirms, disputes, abstains]        # what a response to another's statement says of it (v1 part 12b)
  treatments:    [route, mangle, queue]                # how a forwarding device steers traffic: by a route, a mark, a queue
standard_tables: [protocols, knowledge, properties, units]   # read from their standards (IANA, our knowledge tree, ISO 19156, SI and UCUM)

verbs:
  # ---------------------------------------------------------------- agreements, money, permission
  - verb: agree
    meaning: "to be bound by an agreement: each party agrees, as its part in it, on the day it said yes"
    roles:
      by:      { shape: being, many: true }
      of:      { shape: [being, text], many: true }
      through: { shape: [being, row], table: forms }
      as:      { shape: text }
      at:      { shape: position }
    required: [by]
    replaces: [parties, over, words, consent]
    home: core
  - verb: decline
    meaning: "to refuse an agreement offered: a party that said no"
    roles: { by: { shape: being }, of: { shape: statement }, at: { shape: position } }
    required: [by, of]
    replaces: []
    home: core
  - verb: pay
    meaning: "to give an amount: who paid, how much, to whom, under what (`through`: the clause it is made under or keeps, or the card, account or agreement it moved through). An amount is any quantity — money, a share in a hundred, hours (the operator's choice, 2026-10-02): what is owed is read per unit, and two units meet only at a rate someone observed. What it came to in another currency is `charged`, the rate it implies read and never stored; which occurrences of which clauses it settles, and how much of each, is `settles` (v1 part 12b)"
    roles:
      by:      { shape: being, nature: [body, sayable], rung: reason }
      of:      { shape: quantity }
      to:      { shape: being }
      through: { shape: [statement, being] }
      at:      { shape: position }
    qualifiers:
      charged: { shape: quantity }
      settles: { shape: form, form: settlement, many: true }
    required: [by, of]
    replaces: [paid_by, transactions, charged, settles, under]
    home: core
  - verb: bear
    meaning: "to bear a cost, in a share: whoever bears what was paid"
    roles: { by: { shape: being }, of: { shape: statement } }
    qualifiers: { share: { shape: quantity } }
    required: [by, of]
    default:                              # the one who paid bears it, alone: the `by` of the statement it bears
      says: "whoever paid bears it, alone"
      fill: { by: { the: of, take: by } }
      alone: true
    replaces: [borne_by]
    home: core
  - verb: grant
    meaning: "to open to someone an act on what a garden holds: closed by default, so nobody but the gardener may do what no grant opens. It covers what its `of` names — a bean, a statement, or a reading (a `reckon` statement), whose members it covers, read each time it is asked — and opens it to whom its `to` names: a being, or every member of a reading. Which parts of each it opens, and whether each use states a reason, is its `cover` (v1 part 12b): absent, the whole of each"
    roles:
      by:      { shape: being }
      to:      { shape: [being, statement], many: true }
      of:      { shape: [being, statement], many: true }
      as:      { shape: row, table: grants }
      through: { shape: text }
      at:      { shape: position }
    qualifiers: { class: { shape: row, table: classes }, cover: { shape: form, form: cover } }
    required: [by, to, as]
    replaces: [grants, audience, positions]
    home: core
  - verb: can
    meaning: "to be able to do something, taken as a position on the permission square: may, or must. A clause of an agreement in its words is one: whom it is owed to, and what it holds beside its words — the day it falls due, how it repeats, when it falls due relative to another position, how long before a reader is told, its window, an allowance, what it occurs for, what brings it into force (`clause`, core/law/measures.yaml), as a position on the square holds them of the statement it asks. A stance on a field is `as` its code (and every code beneath it), and holds `at` a place, within it (v1 part 7)"
    roles: { by: { shape: being }, of: { shape: text }, to: { shape: being }, as: { shape: row, table: knowledge }, at: { shape: position } }
    qualifiers: { clause: { shape: form, form: clause } }
    required: [by, of]
    replaces: [capabilities]
    home: core
  - verb: represent
    meaning: "to act for another, who is bound by what is done: an employee, a lawyer, a parent"
    roles: { by: { shape: being }, of: { shape: being }, as: { shape: text } }
    required: [by, of]
    replaces: [acting_for]
    home: core

  # ---------------------------------------------------------------- what a being needs, does and holds
  - verb: need
    meaning: "to require something to function: how badly is a position on the necessity square. An item of a checklist is one (v1 part 12b): what is asked for (`of`, in words where no being says it), who provides it (`from`, a being or the word for a party), needed `while` a reading holds (absent, always), met by what `meet`s it; the needs of one bean that share an `as` are alternatives, any one of which meets it"
    roles:
      by:      { shape: being }
      of:      { shape: [being, statement, text], many: true }
      from:    { shape: [being, text] }
      through: { shape: row, table: protocols }
      as:      { shape: text }
    required: [by, of]
    replaces: [depends_on, consumes, reaches, needed_when, items, one_of]
    home: core
  - verb: meet
    meaning: "to meet a need"
    roles: { by: { shape: [being, statement] }, of: { shape: statement } }
    required: [by, of]
    replaces: [met_by]
    home: core
  - verb: use
    meaning: "to use a being, an allowance, or a technology or field of the knowledge tree"
    roles: { by: { shape: being }, of: { shape: [being, statement, row], table: knowledge } }
    required: [by, of]
    replaces: [used_by, draws_on]
    home: core
  - verb: do
    meaning: "to do a job"
    roles: { by: { shape: being }, as: { shape: row, table: jobs } }
    required: [by, as]
    replaces: [roles]
    home: core
  - verb: hold
    meaning: "to hold a quantity, or a being: what a being can hold, and what it holds"
    roles: { by: { shape: being }, of: { shape: [quantity, being], many: true } }
    required: [by, of]
    replaces: [capacity]
    home: core
  - verb: run
    meaning: "to run code: a machine runs an operating system, a program, an instance"
    roles: { by: { shape: being }, of: { shape: being } }
    required: [by, of]
    replaces: [instance_of, os]
    home: core
  - verb: open
    meaning: "to open something: a session, an account"
    roles: { by: { shape: being }, of: { shape: being }, at: { shape: position } }
    required: [of, at]
    replaces: [opened_at]
    home: core
  - verb: move
    meaning: "to move a being along a walk: through its course (a `be` of it, as order, on the walk), the step it reached and the moment, who moved it, and the reason the step lists"
    roles:
      by:      { shape: being }
      of:      { shape: being }
      through: { shape: statement }
      at:      { shape: [position, statement], many: true }
      as:      { shape: text }
    required: [of, through, at]
    replaces: [moves, moves_along, courses]
    home: core
  - verb: step
    meaning: "to be a step of a walk, the line a case moves along: what is done at it, who acts there, and the steps it leads on to"
    roles:
      by:      { shape: [being, text] }
      as:      { shape: text }
      to:      { shape: statement, many: true }
    qualifiers: { walk: { shape: form, form: step } }
    required: [as]
    replaces: [steps]
    home: core
  - verb: attend
    meaning: "to be present at an event, which takes the hours of those present"
    roles: { by: { shape: being }, of: { shape: being }, at: { shape: position } }
    required: [by, of]
    replaces: [takes_time_of]
    home: core

  # ---------------------------------------------------------------- knowing about a being
  - verb: measure
    meaning: "to read a property of a being: its value, at a moment, through an instrument (ISO 19156)"
    roles:
      by:      { shape: being }
      of:      { shape: being }
      as:      { shape: row, table: properties }
      through: { shape: being }
      at:      { shape: position }
    qualifiers:                           # its value with how well it is known inside it; how it was read; a result that is a code, or a presence
      value:    { shape: quantity }
      method:   { shape: row, table: knowledge }
      result:   { shape: row, table: knowledge }
      presence: { shape: row, table: presences }
    required: [of, as]
    replaces: [observations]
    home: core
  - verb: record
    meaning: "to record what a line held at each position: a series (ISO 19156, a coverage) — its positions by rule or listed, what each holds, its rows"
    roles:
      by:      { shape: being }
      of:      { shape: being }
      through: { shape: being }
    qualifiers: { series: { shape: form, form: series } }
    required: [of, series]
    replaces: [series]
    home: core
  - verb: reckon
    meaning: "to declare a reading of the garden: what it selects and what it computes from it, read each time it is asked and never stored"
    roles:
      by:      { shape: being }
      of:      { shape: [being, statement], many: true }
    qualifiers: { reading: { shape: form, form: reading } }
    required: [reading]
    replaces: [selections]
    home: core
  - verb: pin
    meaning: "to fix what rests on a reading: the moment it was read at and the commit of the garden it was read in"
    roles:
      by:      { shape: being }
      of:      { shape: statement, many: true }
      from:    { shape: statement, many: true }
      through: { shape: being }
      at:      { shape: position, many: true }
    required: [of, at]
    replaces: [pin, pin_form]
    home: core
  - verb: classify
    meaning: "to class a being by a code of a scheme of the knowledge tree"
    roles: { by: { shape: being }, of: { shape: being }, as: { shape: row, table: knowledge }, through: { shape: being } }
    required: [of, as]
    replaces: [classified_as, knowledge]
    home: knowledge
  - verb: concern
    meaning: "to be about a person: whom a record is personal to"
    roles: { by: { shape: being }, of: { shape: being, many: true } }
    required: [of]
    replaces: [about]
    home: core
  - verb: rate
    meaning: "to say how much harm a being can do a person if it leaves the garden, above what the engine derives"
    roles: { by: { shape: being, nature: [body], rung: reason }, of: { shape: being }, as: { shape: row, table: sensitivities } }
    required: [by, of, as]
    replaces: [sensitivity]
    home: core

  # ---------------------------------------------------------------- failure and its remedy, disagreement
  - verb: fail
    meaning: "a way a being can fail, or is failing: a statement on the necessity square, possible or happening"
    roles: { by: { shape: being }, as: { shape: text }, through: { shape: [being, statement, text] }, at: { shape: position } }
    required: [by, as]
    replaces: [risks]
    home: core
  - verb: repair
    meaning: "to remedy a failure, where the fix lives"
    roles: { by: { shape: being }, of: { shape: statement }, at: { shape: being } }
    required: [of]
    replaces: [owned_with]
    home: core
  - verb: rule
    meaning: "a person's ruling on a disagreement: the statements disputed, and the one chosen"
    roles: { by: { shape: being, nature: [body], rung: reason }, of: { shape: statement, many: true }, as: { shape: statement }, at: { shape: position } }
    required: [by, of]
    replaces: [hearings, ruling]
    home: core
  - verb: respond
    meaning: "to respond to a statement: an observer's verdict on another's reading — it confirms, disputes or abstains (asked, and would not say), once for each statement — or a speaker's own words at a hearing, in its `through`; a `rule` on statements is given once every speaker of them has responded (v1 part 12b)"
    roles: { by: { shape: being }, of: { shape: statement, many: true }, as: { shape: row, table: verdicts }, through: { shape: text }, at: { shape: position } }
    required: [by, of]
    replaces: [answers, heard]
    home: core
  - verb: weigh
    meaning: "to weigh criteria against each other, pair by pair (the analytic hierarchy process): only the judgments are written — the weights and their consistency are read (`python3 bin/daftar.py reckon weigh <bean>#<id>`), never stored. `by` the judge, `to` what it orders; a weighing orders what a person is shown, and never decides, hides or drops anything (v1 part 12b)"
    roles: { by: { shape: being, nature: [body, sayable], rung: reason }, to: { shape: text } }
    qualifiers: { weighing: { shape: form, form: weighing } }
    required: [by, to, weighing]
    replaces: [weighings]
    home: core

  # ---------------------------------------------------------------- between gardens
  - verb: propose
    meaning: "to offer beans to another garden, under an agreement between their gardeners"
    roles: { by: { shape: being }, of: { shape: being, many: true }, to: { shape: being }, through: { shape: statement }, at: { shape: position } }
    required: [by, of, to]
    replaces: []
    home: core
  - verb: take
    meaning: "to take a proposal in, whole, from the garden that made it: what it carried is known there, and taken here by the gardener's commit, `through` the proposal (its fingerprint)"
    roles: { by: { shape: being }, of: { shape: being }, from: { shape: being }, through: { shape: text }, at: { shape: position } }
    required: [by, of, from]
    replaces: []
    home: core
  - verb: rehearse
    meaning: "to be a rehearsal or a test, saying what it rehearses: a garden that rehearses holds no facts about the world, and what is taken from it is a rehearsal's. A garden says it of itself in GARDEN.md (`test`); this one says it of another garden, on that garden's bean"
    roles: { by: { shape: being }, of: { shape: text }, at: { shape: position } }
    required: [by, of]
    replaces: [test]
    home: core

  # ---------------------------------------------------------------- the network profile
  - verb: serve
    meaning: "to listen at an address and a port, through a protocol, to those who may reach it"
    roles:
      by:      { shape: being }
      at:      { shape: position, many: true }
      through: { shape: row, table: protocols }
      to:      { shape: being, many: true }
    required: [by, at, through]
    qualifiers: { channel: { shape: form, form: channel } }
    replaces: [endpoints, admitted_from, provides_ip, exposure, confidentiality, plane]
    home: network
  - verb: carry
    meaning: "to carry what rides on it: a link carries a tunnel, a disk a volume. A link a being terminates is a `carry` by it, `through` the protocol that makes it, `to` the other end (a link is mutual: each end records the other); what rides on it — another link, a listening surface, a reach — is its `of`; what the channel protects is its `channel` (v1 part 12b)"
    roles: { by: { shape: being }, of: { shape: [being, statement], many: true }, through: { shape: row, table: protocols }, to: { shape: [being, statement] } }
    qualifiers: { channel: { shape: form, form: channel } }
    required: [by]
    replaces: [carried_by, links, via_link, peer]
    home: network
  - verb: route
    meaning: "to send traffic on: from where, to which next hop — by a route, or as a mark that steers it (mangle) or a queue that paces it (`as`, v1 part 12b)"
    roles: { by: { shape: being }, of: { shape: text }, from: { shape: [position, being] }, to: { shape: [position, being] }, as: { shape: row, table: treatments } }
    qualifiers: { channel: { shape: form, form: channel } }
    required: [by, to]
    replaces: [treatments]
    home: network
  - verb: translate
    meaning: "to rewrite an address as traffic crosses: from one, to another (today's treatment `nat`, its words its `of`)"
    roles: { by: { shape: being }, of: { shape: text }, from: { shape: [position, being] }, to: { shape: [position, being] } }
    qualifiers: { channel: { shape: form, form: channel } }
    required: [by, from, to]
    replaces: []
    home: network
  - verb: filter
    meaning: "to let traffic cross or stop it: a position on the permission square of the pass it would make"
    roles: { by: { shape: being }, of: { shape: text }, from: { shape: [position, being] }, to: { shape: [position, being] } }
    qualifiers: { channel: { shape: form, form: channel } }
    required: [by, of]
    replaces: []
    home: network

  # ---------------------------------------------------------------- the other profiles
  - verb: book
    meaning: "to book an amount to an account of the garden's analytic scheme, in a share"
    roles: { by: { shape: being }, of: { shape: statement }, to: { shape: [being, text] } }
    qualifiers: { share: { shape: quantity } }
    required: [of, to]
    replaces: [analytic_distribution]
    home: accounting
  - verb: renew
    meaning: "to renew a registration: on the permission square, whether the registrar renews unasked"
    roles: { by: { shape: being }, of: { shape: being }, at: { shape: position } }
    required: [of]
    replaces: [auto_renew]
    home: domain
  - verb: mark
    meaning: "to fix a boundary of a system's cells by a mark at a position: a being marks the base of a cell (`of`, the cell in its system's form — `ics:Meghalayan`), at a position along one of its own lines (`at`); the system's table of boundaries says the same, and the two ends are held to each other (v1 part 12b: today's `fixes`)"
    roles: { by: { shape: being }, of: { shape: [position, text] }, at: { shape: position } }
    required: [by, at]
    replaces: [fixes]
    home: core
  - verb: produce
    meaning: "to bring an artifact into being: a file, a build, a report; a being, a position, or the words that say it"
    roles:
      by:      { shape: being }
      of:      { shape: [being, position, text], many: true }
      through: { shape: being }
      at:      { shape: position }
    required: [by, of]
    replaces: [produces, produced_by]
    home: core
  - verb: draw
    meaning: "a page draws: each drawing is a `draw` of the being or the mapping it draws, holding its form (`drawing`, the live values that sit on it among it), and the page a `draw` of its drawings, in the order it shows them, holding the page's own (`page`)"
    roles: { by: { shape: being }, of: { shape: [being, statement], many: true } }
    qualifiers: { page: { shape: form, form: page }, drawing: { shape: form, form: drawing } }
    choice: { one_of: [page, drawing] }
    required: [by, of]
    replaces: [view, views, view_bindings, view_monitors]
    home: view

# what the face's verbs and the roles replace, so that the refinery's every verb and role is accounted for here once
face_replaces:
  say:     []
  read:    [capture, readable_from, taken_at]
  derive:  [authority]
  make:    []                       # produces and produced_by went to the row `produce` (ratified 2026-10-01): an artifact is no statement
  be:      [located_at, lives_in, provides_habitat]
  stand:   [stands_on]
  part:    [part_of]
  name:    [identifier]
  come:    [via, given_by]
  own:     [owned_by]
  answer:  [responsibility, answered_by, answered_by_owner, applies_to]
  acquire: [acquired]
  pass:    [flow_form]
dropped: [refs]                          # replaced by no verb: every relation is a statement, and a new one a new verb
roles_replace:                           # a word that is only a role of whatever verb its statement has
  by:      [owned_by_them]
  at:      [as_of]
  from:    [from_where]
  to:      [to_where]
  through: [resolves_through, tool]
  as:      [by_role]
  of:      []
