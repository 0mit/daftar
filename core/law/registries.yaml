# Where a standard's own table is kept (seed/knowledge/), and the schemes of our knowledge tree: ISCED-F 2013, ISCO-08,
# the technologies, the geologic chart and the rest, with what each column of a scheme says. A table each machine
# fetches from its provider, and no release carries a copy of, names no file: its rows are this machine's fetched copy.
# These rows are the law itself: a change to them is a RULE-CHANGE, made here.
registry_files:
  - { registry: isced-f-2013, file: "seed/knowledge/isced-f-2013.tsv", key: code }
  - { registry: isco-08, file: "seed/knowledge/isco-08.tsv", key: code }
  - { registry: technology, file: "seed/knowledge/technology.tsv", key: code }
  - { registry: signals, file: "seed/knowledge/signals.tsv", key: signal }
  - { registry: technology-daftar, file: "seed/knowledge/technology-daftar.tsv", key: code }
  - { registry: name-patterns, file: "seed/knowledge/name-patterns.tsv", key: code }
  - { registry: media-types, key: code }
  - registry: crosswalk-isco-08-isced-f-2013
    file: "seed/knowledge/crosswalk-isco-08-isced-f-2013.tsv"
    key: isco_08
  - { registry: currencies, file: "seed/knowledge/currencies.tsv", key: code }
  - { registry: time-zones, file: "seed/knowledge/time-zones.tsv", key: zone }
  - { registry: ics-chart, file: "seed/knowledge/ics-chart-2026-06.tsv", key: unit }
  - { registry: ics-gssps, file: "seed/knowledge/ics-gssps-2026-09.tsv", key: boundary }
  - { registry: substances, file: "seed/knowledge/substances.tsv", key: code }
  - { registry: mechanisms, file: "seed/knowledge/mechanisms.yaml", key: mechanism, format: yaml }
  - { registry: coefficients, file: "seed/knowledge/coefficients.yaml", key: coefficient, format: yaml }
  - { registry: unece-rec20, key: code }
  - { registry: units-unece-rec20, file: "seed/knowledge/units-unece-rec20.tsv", key: code }
  - { registry: loinc, key: code }
  - { registry: units-loinc, file: "seed/knowledge/units-loinc.tsv", key: code }
  - { registry: ifc-4x3, key: code }
  - { registry: units-ifc-4x3, file: "seed/knowledge/units-ifc-4x3.tsv", key: code }
  - { registry: epsg-uom, key: code }
  - { registry: units-epsg-uom, file: "seed/knowledge/units-epsg-uom.tsv", key: code }
  - { registry: gs1-ai, key: code }
  - { registry: units-gs1-ai, file: "seed/knowledge/units-gs1-ai.tsv", key: code }
  - { registry: cldr-units, file: "seed/knowledge/cldr-units.tsv", key: code }
  - { registry: units-cldr-units, file: "seed/knowledge/units-cldr-units.tsv", key: code }
  - { registry: geonames, key: code }
  - { registry: osm-places, key: code }
  - { registry: col, key: code }
  - { registry: ncbitaxon, key: code }
  - { registry: uberon, key: code }
  - { registry: cl, key: code }
  - { registry: hao, key: code }
  - { registry: po, key: code }
  - { registry: chebi, key: code }
  - { registry: iucn-get, key: code }
  - { registry: etim, key: code }
  - { registry: cpv, key: code }
knowledge_schemes:
  - scheme: isced-f-2013
    classifies: "fields of knowledge (education and training)"
    holding: shipped
    licence: "CC-BY-SA-3.0-IGO"
    release: "ISCED-F 2013 (field descriptions 2015)"
    publisher: "UNESCO Institute for Statistics"
    url: "https://uis.unesco.org/en/topic/international-standard-classification-education-isced"
    levels: [{ level: broad }, { level: narrow }, { level: detailed }]
    neighbours: none
    sources: "seed/knowledge/SOURCES.md"
  - scheme: isco-08
    classifies: occupations
    holding: fetched
    fetch:
      from: "https://webapps.ilo.org/ilostat-files/ISCO/newdocs-08-2021/ISCO-08/ISCO-08%20EN%20Structure%20and%20definitions.xlsx"
      reader: ilo-isco-08-xlsx
      latest: "ISCO-08 has one release, its structure of 2012; the ILO is revising it (ISCO-08 revision, from 2022): a new classification will be a scheme of its own"
    licence: LicenseRef-ILO-ISCO-08
    release: "ISCO-08 (structure, 2012)"
    publisher: "International Labour Organization"
    url: "https://ilostat.ilo.org/methods/concepts-and-definitions/classification-occupation/"
    levels: [{ level: major }, { level: sub-major }, { level: minor }, { level: unit }]
    same_ground_as: [isced-f-2013]
    crosswalk: table
    neighbours: none
    sources: "seed/knowledge/SOURCES.md"
  - scheme: substances
    classifies: "substances by their chemical formula, for walks whose steps take and give them"
    holding: shipped
    licence: "CC0-1.0"
    publisher: "daftar (curated; each row a formula in Hill notation, a fact)"
    url: "seed/knowledge/substances.tsv"
    levels: [{ level: substance }]
    neighbours: none
    sources: "seed/knowledge/SOURCES.md"
  - scheme: technology
    classifies: "established technologies (software, protocols, formats, operating systems), each with its OFFICIAL documentation"
    holding: shipped
    licence: "CC-BY-4.0"
    publisher: "daftar (curated; every row names the project's own documentation, never a third party's)"
    url: "seed/knowledge/technology.tsv"
    levels: [{ level: technology }]
    within: [isced-f-2013]
    neighbours: none
    sources: "seed/knowledge/SOURCES.md"
  - scheme: signals
    classifies: "what a running technology reports about itself — a signal, as OpenTelemetry's semantic conventions name it, with its instrument and unit"
    holding: shipped
    licence: "CC-BY-4.0"
    publisher: "daftar (the names read at the OpenTelemetry semantic conventions; the meanings in daftar's own words)"
    url: "seed/knowledge/signals.tsv"
    levels: [{ level: signal }]
    neighbours: none
    sources: "seed/knowledge/SOURCES.md"
  - scheme: technology-daftar
    classifies: "what daftar does with a technology — reads it (a source), draws on it (a surface), or is carried by it (a carrier) — and whether it speaks it yet, and by which adapter and which suite"
    holding: shipped
    licence: "CC-BY-4.0"
    publisher: daftar
    url: "seed/knowledge/technology-daftar.tsv"
    levels: [{ level: technology }]
    within: [technology]
    neighbours: none
    sources: "seed/knowledge/SOURCES.md"
  - scheme: name-patterns
    classifies: "the names a published convention gives files and folders — a camera's file and folder names as DCF writes them — each a template of literal text and slots (the knowledge profile's form `pattern`); a garden extracts its own beside it"
    holding: shipped
    licence: "CC-BY-4.0"
    publisher: "daftar (curated; each row a convention its publisher documents)"
    url: "seed/knowledge/name-patterns.tsv"
    levels: [{ level: convention }, { level: pattern }]
    neighbours: none
    sources: "seed/knowledge/SOURCES.md"
    form: pattern
  - scheme: media-types
    classifies: "what a file is by the type its name or its bytes say — the media types IANA registers (RFC 6838) and the makers' own `x-` types — each with the generic icon it is shown as, its family"
    holding: fetched
    fetch:
      from: "https://gitlab.freedesktop.org/xdg/shared-mime-info/-/archive/2.4/shared-mime-info-2.4.tar.gz"
      reader: shared-mime-info
      host: "/usr/share/mime/packages/freedesktop.org.xml"
      latest: "freedesktop.org publishes each release of shared-mime-info at gitlab.freedesktop.org/xdg/shared-mime-info/-/releases, its database in data/freedesktop.org.xml.in; a host that installs it keeps the database in /usr/share/mime/packages/freedesktop.org.xml, which the reader reads where no fetch was made"
    licence: GPL-2.0-or-later
    release: "shared-mime-info 2.4"
    code_pattern: "^[A-Za-z0-9][A-Za-z0-9!#$&^_.+-]{0,126}/[A-Za-z0-9][A-Za-z0-9!#$&^_.+-]{0,126}$"
    publisher: "freedesktop.org (the shared-mime-info project)"
    url: "https://specifications.freedesktop.org/shared-mime-info-spec/latest/"
    levels: [{ level: top }, { level: type }]
    neighbours: none
    sources: "seed/knowledge/SOURCES.md"
  - scheme: placement
    classifies: "how one being is placed in, at or among another — from the most general to the most bodily, each rung saying what a placement takes from where it is placed"
    holding: shipped
    licence: "CC-BY-4.0"
    publisher: "daftar (the law's own table, `placements`, and what each takes, `takes`)"
    url: "core/law/measures.yaml"
    levels: [{ level: place }, { level: mode }]
    neighbours: none
    sources: "seed/RATIONALE.md"
  - scheme: unece-rec20
    classifies: "units of measure in trade — the unit an invoice, an order, a customs declaration or a shipping notice writes a quantity in, as UN/CEFACT codes it (Recommendation No. 20; an e-invoice's `unitCode`)"
    holding: fetched
    fetch:
      from: "https://unece.org/sites/default/files/2021-06/rec20_Rev17e-2021.xlsx"
      reader: unece-rec20-xlsx
      latest: "UN/CEFACT's code list recommendations (https://unece.org/trade/uncefact/cl-recommendations) name each revision of Recommendation No. 20 and its spreadsheet; a new revision is a file of its own, read by the same reader while its columns are these"
    licence: LicenseRef-UNECE-terms
    release: "Recommendation No. 20, Revision 17"
    publisher: "UN/CEFACT, the United Nations Economic Commission for Europe"
    url: "https://unece.org/trade/uncefact/cl-recommendations"
    levels: [{ level: unit }]
    neighbours: none
    sources: "seed/knowledge/SOURCES.md"
    units: units-unece-rec20
  - scheme: loinc
    classifies: "laboratory and clinical observations — what is measured or observed, of what, and how its result is written (LOINC terms), each read through its property and its scale"
    holding: fetched
    fetch:
      from: "https://loinc.org/downloads/"
      reader: loinc-table-csv
      latest: "LOINC publishes a release twice a year (2.xx); a person signed in at loinc.org with a free account, who accepts its licence, downloads it, and its LoincTable/Loinc.csv is read alone or inside the release's zip"
    licence: LicenseRef-LOINC
    release: "LOINC 2.81"
    publisher: "Regenstrief Institute, and the LOINC Committee"
    url: "https://loinc.org"
    sensitive: special-category
    levels: [{ level: term }]
    neighbours: none
    sources: "seed/knowledge/SOURCES.md"
    units: units-loinc
  - scheme: ifc-4x3
    classifies: "what a building model measures, and in what: IFC 4.3's measure types (IfcLengthMeasure, IfcThermalTransmittanceMeasure, …) and the SI units a model assigns them, a prefix and a name (`MILLI.METRE`, as IfcSIUnit writes the two)"
    holding: fetched
    fetch:
      from: "https://standards.buildingsmart.org/IFC/RELEASE/IFC4_3/HTML/IFC4X3_ADD2.exp"
      reader: ifc-express
      latest: "buildingSMART publishes each release of IFC with its schema in EXPRESS beside its documentation (standards.buildingsmart.org/IFC/RELEASE); IFC 4.3.2.0, IFC4X3_ADD2, is the one ISO 16739-1:2024 standardises"
    licence: CC-BY-ND-4.0
    release: "IFC 4.3.2.0 (IFC4X3_ADD2)"
    publisher: "buildingSMART International"
    url: "https://standards.buildingsmart.org/IFC/RELEASE/IFC4_3/"
    levels: [{ level: code }]
    neighbours: none
    sources: "seed/knowledge/SOURCES.md"
    units: units-ifc-4x3
  - scheme: epsg-uom
    classifies: "the units of measure of EPSG's geodetic dataset — what a coordinate reference system's axes, a transformation's parameters and a projection's are counted in (ISO 19111), by EPSG's code"
    holding: fetched
    fetch:
      from: "https://epsg.org/download-dataset.html"
      reader: epsg-sql
      latest: "IOGP publishes the EPSG Dataset several times a year (13.x); a person signed in at epsg.org downloads its SQL scripts as a zip, and its data script is read"
    licence: LicenseRef-EPSG-terms
    release: "EPSG Dataset 13.103"
    publisher: "IOGP (the International Association of Oil & Gas Producers), its Geomatics Committee"
    url: "https://epsg.org"
    levels: [{ level: unit }]
    neighbours: none
    sources: "seed/knowledge/SOURCES.md"
    units: units-epsg-uom
  - scheme: gs1-ai
    classifies: "GS1's application identifiers: what a barcode's element string says after its AI — a trade item's net weight, a logistic unit's length, a count — each measure with its unit, and the AI's last digit the decimal point's place (`310n`)"
    holding: fetched
    fetch:
      from: "https://raw.githubusercontent.com/gs1/gs1-syntax-dictionary/main/gs1-syntax-dictionary.txt"
      reader: gs1-syntax-dictionary
      latest: "GS1 publishes the Barcode Syntax Dictionary as a dated release (github.com/gs1/gs1-syntax-dictionary, its tags and its CHANGES); the dictionary follows the GS1 General Specifications, which add an AI when a release does"
    licence: Apache-2.0
    release: "GS1 Barcode Syntax Dictionary, the release `2026-01-27`"
    publisher: "GS1 AISBL"
    url: "https://ref.gs1.org/ai/"
    levels: [{ level: ai }]
    neighbours: none
    sources: "seed/knowledge/SOURCES.md"
    units: units-gs1-ai
  - scheme: cldr-units
    classifies: "the units Unicode CLDR names for people — `length-meter`, `duration-month` — with their names in English, Persian and Turkish, which a widget shows beside a value"
    holding: fetched
    fetch:
      from: "https://registry.npmjs.org/cldr-units-full/-/cldr-units-full-48.2.0.tgz"
      reader: cldr-units-json
      latest: "Unicode releases CLDR twice a year, and publishes its JSON as packages (cldr-units-full, versioned as CLDR is); a later release is the same package at its version"
    licence: Unicode-3.0
    release: "CLDR 48.2"
    publisher: "Unicode, Inc. (the Unicode CLDR project)"
    url: "https://cldr.unicode.org"
    levels: [{ level: unit }]
    neighbours: none
    sources: "seed/knowledge/SOURCES.md"
    units: units-cldr-units
  - scheme: geonames
    classifies: "the world's named places by the gazetteer's feature id — a populated place, a division of a country, a mountain, a river — each with its name and the other names it is written by, its feature class and code, its country and divisions, its population, and its point in WGS 84; a position in the system `geonames` is a row of it"
    holding: fetched
    fetch:
      from: "https://download.geonames.org/export/dump/{part}.zip"
      part: "^[A-Z]{2}$"
      reader: geonames-dump
      latest: "GeoNames exports the whole gazetteer every day, one file a country (export/dump/<CC>.zip, its readme.txt saying the columns), and what changed the day before in its modifications and deletes files; a later copy is the same file fetched again"
    licence: CC-BY-4.0
    release: "the day's export (GeoNames numbers no release: a copy is known by the day it was read, and its SHA-256)"
    publisher: "GeoNames (geonames.org), compiled from public sources and its users' edits"
    url: "https://www.geonames.org"
    levels: [{ level: feature }]
    neighbours: none
    sources: "seed/knowledge/SOURCES.md"
  - scheme: osm-places
    classifies: "OpenStreetMap's places of a country at the scale a person names where something is — the country, its divisions, its cities, villages, districts and localities — by their element, each with its tag, its names in English, Persian and Turkish beside its own, and its centroid in WGS 84; a position in the system `osm` is an element of it, and the streets and houses a place search finds are the search's"
    holding: fetched
    fetch:
      from: "https://download1.graphhopper.com/public/{part}/photon-dump-{part}-1.0-latest.jsonl.zst"
      part: "^[a-z-]+/[a-z-]+$"
      reader: photon-dump
      latest: "OpenStreetMap is edited continuously; GraphHopper publishes, for Photon, a dump of each country every week (download1.graphhopper.com/public/<continent>/<country>/, its .md5 beside it), in the dump format Photon reads; a major release of Photon names its own dump"
    licence: ODbL-1.0
    release: "the dump's data timestamp, as its first line states it (a copy is known by it and its SHA-256)"
    publisher: "OpenStreetMap contributors (the OpenStreetMap Foundation); the dumps prepared by GraphHopper GmbH, for Photon"
    url: "https://www.openstreetmap.org/copyright"
    levels: [{ level: element }]
    neighbours: none
    sources: "seed/knowledge/SOURCES.md"
  - scheme: col
    classifies: "living beings by their scientific names, as the Catalogue of Life's eXtended Release holds them — each accepted name and its synonyms, ranked (a species, a genus, an order) and placed in one tree"
    holding: fetched
    fetch:
      from: "https://api.checklistbank.org/dataset/316691/export.zip?format=COLDP"
      reader: coldp
      latest: "the Catalogue of Life issues a release each month and an eXtended Release (XR) beside it; ChecklistBank lists them (https://api.checklistbank.org/dataset?releasedFrom=3, the XR's origin `xrelease`), and answers a release's ColDP export (dataset/<key>/export.zip?format=COLDP) with its prepared archive"
    licence: CC-BY-4.0
    release: "COL26.10 XR, issued `2026-10-16`"
    code_pattern: "^[0-9A-Z][0-9A-Z.]{0,13}$"
    publisher: "the Catalogue of Life Partnership, through ChecklistBank"
    url: "https://www.catalogueoflife.org"
    at: [organism]
    levels: [{ level: rank }]
    neighbours: [ncbitaxon]
    sources: "seed/knowledge/SOURCES.md"
  - scheme: ncbitaxon
    classifies: "living beings by NCBI's taxonomy, as the OBO Foundry builds it: each taxon with its rank and its parent, the names GenBank gives it beside"
    holding: fetched
    fetch:
      from: "http://purl.obolibrary.org/obo/ncbitaxon.obo"
      reader: obo
      latest: "the OBO build of NCBI's taxonomy is rebuilt from NCBI's dump (its `data-version` the day); the purl answers with the latest"
    licence: CC0-1.0
    release: "the build `2026-07-12` (its data-version)"
    code_pattern: "^[1-9][0-9]{0,8}$"
    publisher: "NCBI (the U.S. National Center for Biotechnology Information); the OBO build by the OBO Foundry"
    url: "https://www.ncbi.nlm.nih.gov/taxonomy"
    at: [organism]
    levels: [{ level: rank }]
    neighbours: [col]
    sources: "seed/knowledge/SOURCES.md"
  - scheme: uberon
    classifies: "the parts of animal bodies across species — organs, tissues, systems and the structures they are made of (UBERON, the cross-species anatomy ontology)"
    holding: fetched
    fetch:
      from: "http://purl.obolibrary.org/obo/uberon.obo"
      reader: obo
      latest: "UBERON is released as its repository tags a release (github.com/obophenotype/uberon/releases); the purl answers with the latest"
    licence: CC-BY-3.0
    release: "`uberon/releases/2026-10-01`"
    code_pattern: "^[0-9]{7}$"
    publisher: "the UBERON project (the OBO Foundry)"
    url: "https://obophenotype.github.io/uberon/"
    at: [organ, tissue]
    levels: [{ level: term }]
    neighbours: [cl, hao, po]
    sources: "seed/knowledge/SOURCES.md"
  - scheme: cl
    classifies: "the kinds of cells of animals (the Cell Ontology)"
    holding: fetched
    fetch:
      from: "http://purl.obolibrary.org/obo/cl.obo"
      reader: obo
      latest: "the Cell Ontology is released as its repository tags a release (github.com/obophenotype/cell-ontology/releases); the purl answers with the latest"
    licence: CC-BY-4.0
    release: "`cl/releases/2026-06-08`"
    code_pattern: "^[0-9]{7}$"
    publisher: "the Cell Ontology project (the OBO Foundry)"
    url: "https://obophenotype.github.io/cell-ontology/"
    at: [cell]
    levels: [{ level: term }]
    neighbours: [uberon, po]
    sources: "seed/knowledge/SOURCES.md"
  - scheme: hao
    classifies: "the parts of the bodies of bees, wasps, ants and sawflies (the Hymenoptera Anatomy Ontology)"
    holding: fetched
    fetch:
      from: "http://purl.obolibrary.org/obo/hao.obo"
      reader: obo
      latest: "the Hymenoptera Anatomy Ontology is kept at github.com/hymao/hao; the purl answers with its master copy"
    licence: CC0-1.0
    code_pattern: "^[0-9]{7}$"
    publisher: "the Hymenoptera Anatomy Ontology project (the OBO Foundry)"
    url: "https://hymao.org"
    at: [organ, tissue]
    levels: [{ level: term }]
    neighbours: [uberon]
    sources: "seed/knowledge/SOURCES.md"
  - scheme: po
    classifies: "the parts of plants — organs, tissues and cells — and their stages (the Plant Ontology)"
    holding: fetched
    fetch:
      from: "http://purl.obolibrary.org/obo/po.obo"
      reader: obo
      latest: "the Plant Ontology is kept at github.com/Planteome/plant-ontology; the purl answers with its master copy"
    licence: CC-BY-4.0
    code_pattern: "^[0-9]{7}$"
    publisher: "the Planteome project (the OBO Foundry)"
    url: "https://planteome.org"
    at: [organ, tissue]
    levels: [{ level: term }]
    neighbours: [uberon, cl]
    sources: "seed/knowledge/SOURCES.md"
  - scheme: chebi
    classifies: "chemical entities — particles, atoms, molecules, ions and the substances made of them — and their classes (ChEBI)"
    holding: fetched
    fetch:
      from: "http://purl.obolibrary.org/obo/chebi.obo"
      reader: obo
      latest: "EMBL-EBI releases ChEBI monthly; the purl answers with the latest"
    licence: CC-BY-4.0
    code_pattern: "^[1-9][0-9]{0,6}$"
    publisher: "EMBL-EBI (the European Bioinformatics Institute)"
    url: "https://www.ebi.ac.uk/chebi/"
    at: [molecule, material]
    levels: [{ level: term }]
    neighbours: [substances]
    sources: "seed/knowledge/SOURCES.md"
  - scheme: iucn-get
    classifies: "ecosystems by the IUCN Global Ecosystem Typology: realms, biomes and ecosystem functional groups"
    holding: fetched
    fetch:
      from: "https://zenodo.org/api/records/10081251/files/map-details.xml/content"
      reader: iucn-get-maps
      latest: "the typology's maps are published on Zenodo as versions of one record (10.5281/zenodo.3546513), each with its map-details.xml; the record of version 2.1.3 is 10081251"
    licence: CC-BY-4.0
    release: "the maps of version 2.1.3, published `2023-11-08`"
    code_pattern: "^(T|M|F|S|MT|SF|FM|MFT|TF|SM)([0-9]{1,2}(\\.[0-9]{1,2})?)?$"
    publisher: "IUCN, the International Union for Conservation of Nature (its Commission on Ecosystem Management)"
    url: "https://global-ecosystems.org"
    at: [ecosystem]
    levels: [{ level: realm }, { level: biome }, { level: group }]
    neighbours: none
    sources: "seed/knowledge/SOURCES.md"
  - scheme: etim
    classifies: "technical products by ETIM's classes — electrical, HVAC, plumbing, building, shipbuilding and machinery products — in their groups"
    holding: fetched
    fetch:
      from: "https://www.etim-international.com/wp-content/uploads/2024/12/ETIM-10.0-ALL-SECTORS-CSV-METRIC-EI-2024-12-05.zip"
      reader: etim-csv
      latest: "ETIM International publishes each release of its model in its international English edition (EI) at https://www.etim-international.com/downloads/?_sft_downloadcategory=model-releases, a CSV export among its formats"
    licence: ODC-By-1.0
    release: "ETIM 10.0, its international English edition of `2024-12-05`"
    code_pattern: "^E[CG][0-9]{6}$"
    publisher: "ETIM International"
    url: "https://www.etim-international.com"
    at: [device, component]
    levels: [{ level: group }, { level: class }]
    neighbours: [cpv]
    sources: "seed/knowledge/SOURCES.md"
  - scheme: cpv
    classifies: "what public bodies buy — supplies, works and services — by the EU's Common Procurement Vocabulary (CPV 2008); a service classifies no body"
    holding: fetched
    fetch:
      from: "http://publications.europa.eu/resource/cellar/1356ebf8-80b9-11ea-bf12-01aa75ed71a1.0001.05/DOC_1"
      reader: cpv-genericode
      latest: "the Publications Office keeps the CPV in EU Vocabularies (op.europa.eu/en/web/eu-vocabularies, the dataset cpv), each version a manifestation of its work in the Cellar; its Genericode is the manifestation of type GC"
    licence: LicenseRef-EU-Commission-Decision-2011-833
    release: "CPV 2008, the Publications Office's version `20260520-0`"
    code_pattern: "^[0-9]{8}$"
    publisher: "the European Commission; the Publications Office of the European Union"
    url: "https://op.europa.eu/en/web/eu-vocabularies/dataset/-/resource?uri=http://publications.europa.eu/resource/dataset/cpv"
    at: [device, component]
    levels: [{ level: division }, { level: group }, { level: class }, { level: category }]
    neighbours: [etim]
    sources: "seed/knowledge/SOURCES.md"
  - scheme: wikidata
    classifies: "anything, by its item — a Q-number — held at its authority: a code of it is checked here by its form alone, and nothing is looked up there"
    holding: at-authority
    licence: CC0-1.0
    release: "live: an item is read when it is looked up, and a garden says when it read it"
    code_pattern: "^Q[1-9][0-9]{0,11}$"
    publisher: "Wikidata's contributors (the Wikimedia Foundation)"
    url: "https://www.wikidata.org"
    levels: [{ level: item }]
    neighbours: none
    sources: "seed/knowledge/SOURCES.md"
knowledge_scheme_form:
  holding: "shipped | extract | at-authority | fetched — how its codes are held: shipped with the release in seed/knowledge/; a garden's own extract in extracts/, each edit a journalled write and not a RULE-CHANGE (F9); held at the publisher and looked up there, checked here only by `code_pattern`; or fetched — each machine downloads the provider's own table (`fetch`) into a cache outside git (bin/fetch.py), under the provider's terms, and reads its codes there; while the release still carries a copy, a machine that has fetched none reads that"
  fetch: "with `fetched`: { from: the provider's own download, reader: how its rows are read, a reader of core/law/formats.yaml `readers` (core/readers.py, bin/fetch.py), latest: how to learn of its latest release, part: where the provider serves its table in parts (a country, a region) — `{part}` in `from`, and the form a part is named in, a regular expression; each part is fetched alone, the parts a garden needs, and read as one table; host: where a machine that installs the provider's file keeps it — read by the reader, unchanged, where this machine has fetched none }"
  licence: "the SPDX identifier of the terms its rows are under — `LicenseRef-<name>` where the publisher's terms have none"
  release: "the publisher's release the rows are from"
  sensitive: "special-category — every code of it is special-category material wherever it is written (a diagnosis, a procedure; F3); absent, not"
  code_pattern: "the form a code must take, a regular expression: with `at-authority`, all that is checked of a code; with `fetched`, what is checked of a code where this machine holds no copy of the scheme"
  relations: "a registry of relations between its own codes, rows {from, to, rel}, `rel` one of part-of, requires, adjacent (N23); resolved by the `registry_links` rows the garden declares for it"
  labels: "[{language, registry, attribution?}] — its labels in another language: a registry of {code, name} rows, and the words its publisher asks to be printed with them, verbatim (N25)"
  units: "a registry of rows in the form `units_crosswalk_form` — its codes crossed into the law's units and kinds, one row a code, so a value written with one of its codes is read as the law's, and the law's written back with its code (bin/units.py)"
  at: "the positions of the ladder whose beings its codes classify, on any line but the frame (core/law/levels.yaml, core.yaml `levels`): a code of it is said (`classify`) only of a being whose kind holds one of them, each compared on its own line — no taxon of a host, no motor's class of a person, no organ's code of a material (rule bearer). Absent, its codes classify beings of any kind"
  form: "a form of a profile the garden takes (core/law/profiles.yaml `forms`) whose attributes its rows hold, as columns, beside `code`, `level`, `parent` and `name`: the accounting profile's `chart` makes the scheme a chart of accounts, the knowledge profile's `pattern` a registry of names' templates and its `class` a scheme of classes. Its rows are held to the form"
# HOW A SCHEME'S CODES CROSS INTO THE LAW'S UNITS AND KINDS (`knowledge_schemes.units`): one row a code, in a registry of
# its own whose file holds the columns it uses of these. A crossing is daftar's: it names the provider's codes and pairs
# each with the law's own rows, and the provider's table stays where its holding keeps it. The law's proof holds every
# row to this form.
units_crosswalk_form:
  code: "a code of the scheme, as its provider writes it; with `axis`, a value its provider writes in that column of its rows"
  axis: "optional: the column of the scheme's rows the row crosses a value of (LOINC's `property`, `scale`), where the scheme's codes are read through what each says on an axis rather than one by one"
  unit: "a unit of the law (core/law/units.yaml, in UCUM): the code is that unit, and measures that unit's quantity"
  quantity: "a kind of the law (core/law/quantities.yaml): the code says what is measured, and not in which unit"
  line: "a line of the law (core/law/measures.yaml `lines`): the code says that what it measures is a position on that line, never a quantity — a temperature reading, a moment, an ordinal judgment. Read through axes, a line named on one wins over a quantity or a kind named on another, which then says what is placed on it: a temperature read as a number is a position on its scale, and a concentration read as 1+, 2+ a position on the ordinal line"
  in: "a system of positions of the law (core/law/systems.yaml): alone, the code is that system's unit of position, and a count written with it is the position the system writes for that count (a Celsius reading); with `level`, the system whose cells the code counts"
  level: "with `in`: a level of that system — a month, a week — whose cells the code counts, read as an extent's `level` and `count` (`extent_form`), never as a duration"
  shape: "a shape of the core (core.yaml `shapes`): the code says only what a value is written as — `quantity`, `row` (a code: a name), `text`, `position`"
  decimals: "`n`: the code is a family written with `n` for its last digit, and that digit says how many of a value's digits follow its decimal point, the value written without one (GS1's 310n); on a row with no target, a family that crosses to nothing, and says why"
  back: "`true` on the one row, of several crossing to one target, whose code that target is written back as; a target one row alone crosses to is written back as that row's code"
  vacant: "with no target, a reason of vacancies.yaml `reasons`: `universal`, the code waits for a kind the law will hold and holds not yet"
  why: "prose: why a row crosses as it does, where that is a judgment a reader should see (a month on an invoice is a calendar's cell, never its provider's mean month); and, on a row with no target, why the code crosses to nothing"
  requires: "at most one target — `unit`, `quantity`, `line`, `in` (alone or with `level`), `shape` — and a row with none says why; `axis` and `code` together name one row"
