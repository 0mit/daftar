operating_systems:
  - { os: slackware, family: unix, path_grammar: unix-filesystem, meaning: "Slackware Linux." }
  - os: almalinux
    family: unix
    path_grammar: unix-filesystem
    meaning: "AlmaLinux, a RHEL-compatible distribution."
  - os: windows
    family: windows
    path_grammar: windows-filesystem
    meaning: "Microsoft Windows. Its path grammar is `windows-filesystem`."
  - os: routeros
    family: network-os
    path_grammar: none
    meaning: "MikroTik RouterOS. Not a general-purpose OS: no user filesystem worth positioning in."
  - os: linux
    family: unix
    path_grammar: unix-filesystem
    meaning: "A Linux system whose distribution is not listed here, or not worth distinguishing."
  - { os: debian, family: unix, path_grammar: unix-filesystem, meaning: "Debian GNU/Linux." }
  - { os: ubuntu, family: unix, path_grammar: unix-filesystem, meaning: "Ubuntu." }
  - { os: rhel, family: unix, path_grammar: unix-filesystem, meaning: "Red Hat Enterprise Linux." }
  - { os: fedora, family: unix, path_grammar: unix-filesystem, meaning: "Fedora Linux." }
  - { os: arch, family: unix, path_grammar: unix-filesystem, meaning: "Arch Linux." }
  - { os: alpine, family: unix, path_grammar: unix-filesystem, meaning: "Alpine Linux." }
  - { os: freebsd, family: unix, path_grammar: unix-filesystem, meaning: "FreeBSD." }
  - { os: macos, family: unix, path_grammar: unix-filesystem, meaning: "Apple macOS." }
storage_formats:
  - { format: ext4, layer: filesystem, posix: "true", meaning: "the estate's ordinary Linux filesystem" }
  - { format: ext2, layer: filesystem, posix: "true", meaning: "a common /boot filesystem" }
  - format: vfat
    layer: filesystem
    posix: "false"
    meaning: "the usual EFI system partition. NOT posix: it carries no ownership or permission bits, which is why an EFI partition cannot hold anything whose mode matters."
  - { format: swap, layer: swap, meaning: "paging space; a formatted volume that holds no filesystem" }
  - format: crypto_LUKS
    layer: encryption
    meaning: "a LUKS container. CARRIES another volume rather than holding files itself — the clearest case for `carried_by`."
  - format: LVM2_member
    layer: volume-manager
    meaning: "an LVM physical volume; the logical volumes inside it are separate entries that name it in `carried_by`"
  - format: linux_raid_member
    layer: raid
    meaning: "an md RAID member. e.g. raid1 for /boot, raid6 for share arrays."
  - format: ntfs
    layer: filesystem
    posix: "false"
    meaning: "the Windows filesystem. Declared and unoccupied — see the vacancy. It is named here because the question 'where does ntfs go' is what produced this registry, and the answer is that it is a STORAGE FORMAT and never a path grammar."
