# The formats statements come in and go out in (MODEL.md, Imports and exports): one row a container's syntax, never a
# model of records. A RECORD is a mapping of fields to values, read from its source with its place there (a line, a
# row, a path), and what its fields mean is a crosswalk's (core/law/crosswalks.yaml). Each format is read and written by
# core/formats.py, one reader and one writer a format and none privileged; `reads` and `writes` say which it has. A
# format no garden needs yet is a row all the same, its vacancy declared (core/law/vacancies.yaml). Text is UTF-8, and a
# name the world gives in bytes is written `escaped` (layers.yaml `store_shape`) in every format.
# A READER turns a format's records into the records of the models it names, where no mapping can say how: a provider's
# columns checked, a path split into its folders and its name, an id minted by a convention. Its code is the release's,
# or the profile's it is `home` to; its row says what it reads and what each record it gives holds.
# A CONVERSION is how a field's value is read into a role and written back from it. The table is closed; each says how
# it is read back (`back`), or `none`, and a field read through one with none is carried one way only.
# These rows are the law itself: a change to them is a RULE-CHANGE, made here.
formats:
  - { format: tsv, standard: "a keyed table in its one form (bin/parse.py table_read)", reads: "true", writes: "true", records: "a row, the header its fields; no cell empty", meaning: "the garden's own tables: extracts, the names, a series' parts, the knowledge files" }
  - { format: csv, standard: "RFC 4180", reads: "true", writes: "true", records: "a row, the header its fields; an empty cell is no value", guard: "written out, a cell a spreadsheet would read as a formula (it begins with =, +, -, @, a tab or a return, and is no number) is written as text, a quote before it", meaning: "comma-separated values, as spreadsheets and most systems export them" }
  - { format: json, standard: "RFC 8259", reads: "true", writes: "true", records: "an object, or each object of an array, at the path a crosswalk's `records` names; a number read as it is written, never as a binary float", meaning: "JSON documents: a standard's records (FHIR), a tool's output (exiftool -json)" }
  - { format: jsonl, standard: "JSON Lines (jsonlines.org)", reads: "true", writes: "true", records: "a line, one JSON object; a number as `json` reads it", meaning: "one record a line: a stream, a store's rows (bin/store.py put)" }
  - { format: sqlite, standard: "SQLite 3", reads: "true", writes: "true", records: "a row of the table a crosswalk's `records` names, filtered by its columns' values", guard: "read only, by a connection that writes nothing; a file another process commits to is copied in steps first, so no long read holds up its writer", meaning: "a database file: a tool's index, a manifest, another program's records" }
  - { format: xml, standard: "XML 1.0", reads: "true", writes: "false", records: "an element at the path a crosswalk's `records` names, its children and attributes its fields", guard: "a document that declares a document type or an entity is refused before it is parsed: a record is data, and nothing in it is expanded, run or fetched", meaning: "XML documents: a bank's ISO 20022 statement, an OFX file, a feed" }
  - { format: xlsx, standard: "ISO/IEC 29500 (Office Open XML spreadsheet)", reads: "true", writes: "false", records: "a row of a sheet, the first row its fields", meaning: "a spreadsheet a provider publishes its table in" }
  - { format: yaml, standard: "a bean's front matter (MODEL.md)", reads: "true", writes: "true", records: "a statement of a bean", meaning: "the garden's own beans: what the store imports from git and exports into it, read by the gate's own reader" }
  - { format: text, standard: "a provider's own syntax (EXPRESS, SQL scripts, a dictionary's lines, a gazetteer's dump)", reads: "true", writes: "false", records: "the whole text, which its reader parses: a format no other system shares", meaning: "a standard's table published in a syntax of its own, read only by the reader its row names" }
  - { format: ics, standard: "RFC 5545 (iCalendar)", reads: "false", writes: "true", records: "an event", meaning: "a calendar of happenings, as a page gives it away" }
  - { format: proposal, standard: "a proposal to another garden (bin/propose.py)", reads: "true", writes: "true", records: "a bean, whole", guard: "its fingerprint covers the whole file; it is read before it is taken, and taken only under an agreement", meaning: "what one garden gives another" }
  - { format: vcard, standard: "RFC 6350 (vCard)", reads: "false", writes: "false", records: "a card: a person's or an organisation's names and ways to reach them", meaning: "an address book's export" }
  - { format: mbox, standard: "RFC 4155 (mbox), RFC 5322 (a message)", reads: "false", writes: "false", records: "a message: its header fields", meaning: "a mailbox's messages" }
  - { format: checksums, standard: "the checksum lines of `b3sum --check` and GNU coreutils, as RFC 8493 (BagIt) §2.1.3 writes a manifest", reads: "true", writes: "true", records: "a line: a digest in lowercase hexadecimal, two spaces, a path `escaped`; the folders of its path before it, each once", meaning: "a manifest: the files of a tree by their contents' digests. Written sorted by path, byte by byte, the digest of empty bytes for an empty file, it is the tree's manifest, and a DATASET is the content of a tree's manifest, named by its BLAKE3" }
  - { format: parquet, standard: "Apache Parquet", reads: "false", writes: "false", records: "a row of the file's table", meaning: "a columnar table, as data tools exchange large ones" }
  - { format: rss, standard: "RSS 2.0 (the RSS Advisory Board's specification)", reads: "true", writes: "false", records: "an item of its channel, as `xml` reads an element", guard: "as `xml`'s: a document that declares a document type or an entity is refused before it is parsed", meaning: "a site's feed of what it publishes, in RSS" }
  - { format: atom, standard: "RFC 4287 (the Atom Syndication Format)", reads: "true", writes: "false", records: "an entry of its feed, as `xml` reads an element", guard: "as `xml`'s: a document that declares a document type or an entity is refused before it is parsed", meaning: "a site's feed of what it publishes, in Atom" }
  - { format: json-feed, standard: "JSON Feed 1.1 (jsonfeed.org)", reads: "true", writes: "false", records: "an item of its `items`; a number as `json` reads it", meaning: "a site's feed of what it publishes, in JSON" }
  - { format: xbrl, standard: "XBRL 2.1 (XBRL International): an instance document", reads: "true", writes: "false", records: "a fact: an element beneath the instance's root that names its context (`contextRef`), with the context's entity, period and the members its segment and scenario name, and its unit (`unitRef`) where it has one, as `xml` reads an element; a context, a unit, a schema's reference or a footnote is no record. A fact inside a page (inline XBRL) is read once it is extracted into an instance", guard: "as `xml`'s: a document that declares a document type or an entity is refused before it is parsed", meaning: "a filing's facts: an entity's values, each for a period and by a concept of a taxonomy, as a regulator receives them" }
  - { format: sdmx, standard: "SDMX-ML 2.1 (ISO 17369): its generic data message", reads: "true", writes: "false", records: "an observation: its own values and attributes, with its series' key and attributes, the dimension at the observation and the structure the message names. A structure-specific message names its key and its attributes alike, and only its structure tells them apart: it is refused, and its provider's generic data read", guard: "as `xml`'s: a document that declares a document type or an entity is refused before it is parsed", meaning: "the series a statistics office or a central bank publishes, as SDMX exchanges them" }
readers:
  - { reader: file-tree, format: [sqlite, tsv, csv, jsonl, checksums], models: [volume, folder, path, file, link, inode, content], gives: "from a listing of paths, each its type (`d` a folder, `f` a file), its size and its content's BLAKE3 (`path`, `type`, `size`, `hash`), and where it says them its inode and how many names it has (`ino`, `nlink`): the volume {id, carrier}; each folder {id, parent, name}, and its path beneath the volume {folder, volume, path}; each file {folder, name, content}, or, a name of an inode of more than one, a link {folder, name, content, through} and once the inode {volume, id, content}, its id `i` and its number; each content {id, blake3, size}. A folder's id is `d-` and the first 16 hexadecimal digits of the SHA-256 of the volume's id, a zero byte and its path; a content's `c-` and the first 24 of its BLAKE3; a file whose content was not read holds `unknown`", meaning: "a filesystem read as a tree of names: a volume's index, the listing of an archive or an image, wherever it was read" }
  - { reader: copies, format: [sqlite], models: [volume, folder, path, content, copy], gives: "the volume copied to {id, carrier}, where its carrier is given, and from a record of copies (`h` the BLAKE3, `dest` the path written, `size`, `class`, `src_vol`, `src_path`, `day`, `day_from`, `at`): each folder of a destination not met before {id, parent, name} and its path beneath the volume {folder, volume, path}, each content not met before by its handle {id}, and each copy {folder, name, content, source, at, note}, its source the holding it was copied from, named as file-tree names it, its moment the copier's clock with its offset", meaning: "what an archive holds, each copy made from the holding it copies" }
  - { reader: exiftool, format: [json], models: [image, movie], gives: "from exiftool's JSON (`-json -G1 -n`), one object a file: its tags by `<group>:<tag>`, and `content`, the content the file's place holds in the keeping the import writes to, found by the volume and the path under its root", meaning: "a photograph's or a video's metadata, as ExifTool reads Exif, XMP, QuickTime and a maker's notes" }
  - { reader: shared-mime-info, format: [text], models: [media-types], gives: "freedesktop.org's shared-mime-info database (its freedesktop.org.xml, from the release's tarball or a host's /usr/share/mime/packages), its document type's internal subset checked to declare no entity and set aside, the rest read as XML: each top-level type once (code, level `top`) and each type (code, level `type`, parent its top-level type, name_en its English comment, family its generic icon — or, where it gives none, its top-level type and `-x-generic`, as the specification makes one —, globs, sub_class_of, aliases)", meaning: "the media types a file's name or bytes say it is, with the family each is shown as" }
  - { reader: obo, format: [text], models: [uberon, cl, hao, po, chebi, ncbitaxon], gives: "an ontology in the OBO flat file format (1.2, 1.4), a stanza at a time: each term of the ontology's own prefix (the header's `ontology`), code its id's local part, level the rank its `has_rank` names or `term`, parent its first `is_a` there, parents and part_of with spaces, name, synonyms (EXACT) and related (RELATED, NARROW, BROAD) with ` | `, status `obsolete` where it is; the definitions and cross-references, the publisher's text, are not read; the release its `data-version`", meaning: "the OBO Foundry's ontologies of anatomy, cells, chemistry and taxa" }
  - { reader: coldp, format: [tsv], models: [col], gives: "a Catalogue of Life Data Package, the zip ChecklistBank exports a release in: its NameUsage.tsv, one name usage a line (`col:ID`, `col:parentID`, `col:status`, `col:rank`, `col:scientificName`, `col:authorship`): code, level, parent (a synonym's, the taxon it names), name, authorship, status; the release its metadata.yaml's alias and day", meaning: "the Catalogue of Life's names of living beings" }
  - { reader: etim-csv, format: [csv], models: [etim], gives: "ETIM's model in its CSV export, a zip of tables (UTF-16, `;`): each group (ETIMARTGROUP.csv: code `EG…`, level `group`, name) and each class (ETIMARTCLASS.csv: code `EC…`, level `class`, parent its group, name, version), a class's synonyms with ` | `; its features, values and units are not read", meaning: "ETIM International's classes of technical products" }
  - { reader: cpv-genericode, format: [xml], models: [cpv], gives: "the Common Procurement Vocabulary in the Publications Office's Genericode: each row's eight-digit `Code` — level by its digits not zero (`division`, `group`, `class`, `category`), parent the nearest code above it the list holds, name its English `Name`; the other languages are not read; the release the list's canonical version", meaning: "the EU's Common Procurement Vocabulary (CPV 2008)" }
  - { reader: iucn-get-maps, format: [xml], models: [iucn-get], gives: "the IUCN Global Ecosystem Typology's map details (`map-details.xml`): each functional group once (code `T1.1`, level `group`, parent its biome, name), and each biome and realm its codes name (level `biome`, `realm`) with no name, the profiles that name them being IUCN's under its own copyright; the release the latest day a map was updated", meaning: "the IUCN Global Ecosystem Typology's functional groups" }
  - { reader: ilo-isco-08-xlsx, format: [xlsx], models: [isco-08], gives: "the first sheet's groups (`Level`, `ISCO 08 Code`, `Title EN`): code, level, parent, name_en; the definitions, tasks and occupations are the ILO's text, not read", meaning: "the ILO's ISCO-08 structure, as its spreadsheet publishes it" }
  - { reader: unece-rec20-xlsx, format: [xlsx], models: [unece-rec20], gives: "the sheet that lists every code once (`Status`, `Common Code`, `Name`, `Symbol`): code, status (`deleted`, `deprecated`), name_en, symbol", meaning: "UN/CEFACT's Recommendation No. 20, codes for units of measure" }
  - { reader: loinc-table-csv, format: [csv], models: [loinc], gives: "LoincTable/Loinc.csv, alone or inside the release's zip (`LOINC_NUM`, `PROPERTY`, `SCALE_TYP`, `STATUS`, `LONG_COMMON_NAME`): code, status, property, scale, name_en", meaning: "LOINC's table of terms" }
  - { reader: ifc-express, format: [text], models: [ifc-4x3], gives: "the schema's measure types and its SI units, each name alone and after each prefix: code, kind (`measure` or `unit`), base", meaning: "IFC's schema in EXPRESS" }
  - { reader: epsg-sql, format: [text], models: [epsg-uom], gives: "each row of `epsg_unitofmeasure` in the dataset's SQL scripts: code, name_en, type, target, factor_b, factor_c, status", meaning: "the EPSG dataset's units of measure" }
  - { reader: gs1-syntax-dictionary, format: [text], models: [gs1-ai], gives: "one line an application identifier or a range of them: code (each of a range), format, name_en", meaning: "GS1's Barcode Syntax Dictionary" }
  - { reader: cldr-units-json, format: [json], models: [cldr-units], gives: "each unit of `main/en/units.json` with a long display name, inside the package's tar or a zip: code, name_en, name_fa, name_tr", meaning: "Unicode CLDR's names of units" }
  - { reader: geonames-dump, format: [text], models: [geonames], gives: "a country's export, one line a feature in the columns its readme names: code, name, ascii, names, latitude, longitude, class, feature, country, admin1, admin2, population, timezone, modified", meaning: "GeoNames' gazetteer, a country at a time" }
  - { reader: photon-dump, format: [jsonl], models: [osm-places], gives: "after the header, each place at one of the layers read, with a name and a centroid: code, layer, kind, name, name_en, name_fa, name_tr, latitude, longitude, country", meaning: "OpenStreetMap's places in the dump Photon reads, a country at a time" }
  - { reader: feed, format: [rss, atom, json-feed], models: [item], gives: "each item of a feed, read alike in its three formats: id, `i-` and the first 16 hexadecimal digits of the SHA-256 of the item's own id (RSS's guid, Atom's and JSON Feed's id), or else of its link, and no record where it has neither; title and summary (RSS's description); link (RSS's link, Atom's link whose rel is `alternate` or none, JSON Feed's url); published, its moment in ISO 8601 (RSS's pubDate as RFC 5322 writes a date, Atom's published or else updated, JSON Feed's date_published); site, the name its link's authority gives, without a port; author, updated, categories and content as written", meaning: "a site's feed: what it publishes, each item once" }
  - { reader: xbrl-facts, format: [xbrl], models: [fact], gives: "each fact of an instance: concept, a coding {system, code}, its element's namespace and its local name; at, its period's instant, or start and end; value and decimals as written; unit, the law's unit of its measures — `iso4217:<code>` the currency, `xbrli:shares` `{share}`, `xbrli:pure` `1`, a divide the numerator's over the denominator's (`USD/{share}`) — or as written; entity and scheme, its context's identifier and the URI it is in, only for a fact of a number of the entity as a whole: a fact holding words (`text`), a nil one (`nil`), or one whose context names a member of a dimension (`dimensions`), gives its identifier as `of` and no entity", meaning: "a filing's facts, its contexts and units read into each" }
  - { reader: sdmx-observations, format: [sdmx], models: [observation], gives: "each observation: series, its series' key, the values of its dimensions in the order the message writes them, joined by `.` — `key` instead, naming no series, where its value is no number (`NaN`, a value not given); measure, a coding {system, code}, the structure the message names and `OBS_VALUE`; at, its time period as the law writes a position — a day or a moment as written, a year, a half, a quarter or a month (`2026`, `2026-S2`, `2026-Q3`, `2026-08`, `2026-M08`) the days from its first to its last (`2026-07-01/2026-09-30`), a week its days in the ISO week calendar — and, a period of no such form, its `TIME_PERIOD` as written and no series; value, as written; unit, its UNIT_MEASURE, the observation's or else its series'; every other attribute as written", meaning: "a series' observations, from a generic data message" }
  - { reader: camt.053, format: [xml], models: [bank-statement], home: accounting, gives: "an ISO 20022 statement (any version of camt.053's namespace): the account, its currency, opening and closing balances, each entry a line {ref, day, value_day, count, unit, text, party, code}", meaning: "a bank's end-of-day statement in ISO 20022" }
  - { reader: camt.054, format: [xml], models: [bank-statement], home: accounting, gives: "an ISO 20022 notification of debits and credits: the account and each entry a line, as camt.053's", meaning: "a bank's notification in ISO 20022" }
  - { reader: ofx, format: [xml], models: [bank-statement], home: accounting, gives: "an OFX statement (1.x SGML or 2.x XML): the account, its currency, its balance, each transaction a line", meaning: "a bank's Open Financial Exchange download" }
  - { reader: mt940, format: [text], models: [bank-statement], home: accounting, gives: "a SWIFT MT940 statement: the account, opening and closing balances, each statement line a line", meaning: "a bank's statement in SWIFT MT940" }
  - { reader: csv, format: [csv], models: [bank-statement], home: accounting, gives: "a bank's own CSV by the garden's mapping (delimiter, decimal, day_format, sign, columns): each row a line", meaning: "a bank's own export, read by the mapping the garden declares" }
# THE EPOCHS A DEVICE'S CLOCK STARTS FROM: a camera, a phone or a recorder whose clock was never set (or lost its
# battery) writes the moment its clock counts from, and the seconds since it was switched on. A moment within an epoch's
# `window` after it is read as no moment at all (the conversion `moment`); each epoch is a published one, named here.
# These rows are the law itself: a change to them is a RULE-CHANGE, made here.
clock_epochs:
  - { epoch: zero, written: "0000:00:00 00:00:00", standard: "none: a moment written all zeros", meaning: "no clock was read at all: a field a device fills with zeros when it has no moment" }
  - { epoch: quicktime, at: "1904-01-01T00:00Z", window: { count: 31, unit: d }, standard: "ISO/IEC 14496-12 (the ISO base media file format), and QuickTime's own: the moment its times count from", meaning: "a video whose clock was never set" }
  - { epoch: unix, at: "1970-01-01T00:00Z", window: { count: 31, unit: d }, standard: "POSIX (IEEE Std 1003.1), Seconds Since the Epoch", meaning: "a device that counts its clock as Unix's, never set" }
  - { epoch: fat, at: "1980-01-01", window: { count: 31, unit: d }, standard: "Microsoft's FAT file system specification: the first day a FAT timestamp can hold, a local time", meaning: "a camera that keeps its clock as a FAT timestamp, never set — a PowerShot writes 1980-01-01 00:00 and the seconds since it was switched on" }
  - { epoch: gps, at: "1980-01-06T00:00Z", window: { count: 31, unit: d }, standard: "IS-GPS-200: the epoch of GPS time", meaning: "a device that keeps GPS time, never set" }
  - { epoch: year-00, at: "2000-01-01", window: { count: 31, unit: d }, standard: "a real-time clock that keeps two digits of the year: its year 00", meaning: "a device whose clock keeps two digits of the year, never set" }
conversions:
  - { conversion: escaped, back: "the bytes it stands for", meaning: "a name the world gives in bytes, as text: UTF-8, and `%XX` for a byte that is no part of well-formed UTF-8, a control character and `%` itself" }
  - { conversion: moment, back: "the system's own writing of it", meaning: "a moment as a system writes it — `exif`: `YYYY:MM:DD HH:MM:SS`, a fraction of a second and an offset where it has them; `quicktime`: as `exif`, in UTC as the format says; `epoch`: seconds since 1970-01-01T00:00Z; `iso`: ISO 8601 — read as the law's moment; a clock with no offset is read as its day alone, and the account says how many were. A moment a device writes within an epoch's `window` after one of `clock_epochs` is a clock never set: no moment is carried, and the account lists it with the epoch it sits on" }
  - { conversion: decimal, back: "the number as written", meaning: "a number kept exactly as written: a count's text, never a binary float" }
  - { conversion: form, back: "the value placed in the form", meaning: "a value written inside a form, `Patient/{}`: only the part at `{}` is carried, and a value in no such form is not" }
  - { conversion: part, back: "the part read out of the whole by its form", meaning: "one part of a value made of several fields by the form the crosswalk's `compose` gives (`{crs};{lat},{lon}`): a whole whose parts are not all there is not carried" }
  - { conversion: coding, back: "the coding, its system the scheme's url", meaning: "a coding `{system, code}` as `<scheme>:<code>`, the scheme the one whose `url` is the system; a coding of a system no scheme names is not carried" }
  - { conversion: named, back: "the name the namespace gives the being", meaning: "the being a namespace names by the value: in a required role `unknown` where no being is named so, and listed in the account with the record's hints; in another, left out and listed. The namespace is the row's, or `given`: the one the import is told, where it is a garden's own (the namespace a garden names its devices' serials in, which the law cannot know)" }
  - { conversion: prefix, back: none, meaning: "a handle made of a prefix and the value's first digits (`c-` and 24): the being a digest names, by its handle" }
columns:
  formats: { format: required, standard: required, reads: required, writes: required, records: required, guard: optional, meaning: required }
  readers: { reader: required, format: required, models: required, gives: required, meaning: required, home: optional }
  conversions: { conversion: required, back: required, meaning: required }
  clock_epochs: { epoch: required, standard: required, meaning: required, at: optional, written: optional, window: optional }
