# The checks: what a value is held to where its row's pattern does not say all of its form. A namespace, a system of
# positions or a designation names one by `checked_by`, or is one. Each check reads one kind of value (`reads`): a
# `name` a namespace gives, a `position` in a system, or a `designation`, the way a part's type is written. A check
# that `calls` a well-used library is applied by bin/parse.py, one function a row and none without one, after the
# pattern of the row that names it; a designation is a `pattern` of the law, matched as every pattern of the law is.
# Each row is held to its `vectors`: values it holds and values it refuses. A comparison of a reading fits a value to a
# row by these (core/law/lines.yaml `comparisons`, `fits`), and the store's SQL calls the same function.
# The table is closed. These rows are the law itself: a change to them is a RULE-CHANGE, made here.
checks:
  - check: ipaddress-v4
    reads: position
    calls: "Python's ipaddress (ip_address, ip_interface)"
    meaning: "an IPv4 address, or an interface with its prefix, in the one spelling the library writes it in"
    vectors: { holds: ["192.0.2.10", "192.0.2.0/24"], refuses: ["192.0.2.010", "203.0.113.300", "2001:db8::1"] }
  - check: ipaddress-v6
    reads: position
    calls: "Python's ipaddress (ip_address, ip_interface)"
    meaning: "an IPv6 address, or an interface with its prefix, in the one spelling the library writes it in: lowercase, its zeros compressed"
    vectors: { holds: ["2001:db8::1", "2001:db8::/32"], refuses: ["2001:DB8::1", "2001:0db8:0:0:0:0:0:1", "192.0.2.10"] }
  - check: ror-checksum
    reads: name
    calls: "python-stdnum (iso7064.mod_97_10), over the number the six base32 characters encode"
    meaning: "a ROR id's two last digits: the ISO/IEC 7064 MOD 97-10 check of the number its six characters of Crockford's base32 encode"
    vectors: { holds: ["05dxps055"], refuses: ["05dxps056"] }
  - check: orcid-checksum
    reads: name
    calls: "python-stdnum (iso7064.mod_11_2)"
    meaning: "an ORCID iD's last character: the ISO/IEC 7064 MOD 11-2 check of the fifteen digits before it"
    vectors: { holds: ["0000-0002-1825-0097"], refuses: ["0000-0002-1825-0098"] }
  - check: uuid-integer
    reads: name
    calls: "Python's uuid (UUID(int=…))"
    meaning: "a DICOM UID under 2.25: the decimal integer of a UUID, less than 2 to the 128th"
    vectors: { holds: ["2.25.0", "2.25.340282366920938463463374607431768211455"], refuses: ["2.25.340282366920938463463374607431768211456"] }
  - check: gs1-element
    reads: name
    calls: "python-stdnum (gs1_128)"
    meaning: "one GS1 element string: its application identifier, then the key, its check digit holding; never a key and its data"
    vectors: { holds: ["(01)09520123456788"], refuses: ["(01)09520123456787", "(01)09520123456788(10)AB"] }
  - check: tckimlik
    reads: name
    calls: "python-stdnum (tr.tckimlik)"
    meaning: "a T.C. Kimlik No's two last digits, its check"
    vectors: { holds: ["17291716060"], refuses: ["17291716050"] }
  - check: lei-checksum
    reads: name
    calls: "python-stdnum (lei)"
    meaning: "an LEI's two last digits: the ISO/IEC 7064 MOD 97-10 check of the whole, its letters read as numbers (A as 10 … Z as 35)"
    vectors: { holds: ["506700GE1G29325QX363"], refuses: ["506700GE1G29325QX364"] }
  - check: isin-checksum
    reads: name
    calls: "python-stdnum (isin)"
    meaning: "an ISIN's last digit: the check ISO 6166 computes over the eleven characters before it, its letters read as numbers (A as 10 … Z as 35) and every other digit of them doubled, the rightmost first, and the digits summed; and its first two letters a country's, or a code ISO 6166 gives"
    vectors: { holds: ["US0378331005"], refuses: ["US0378331006"] }
  - check: figi-checksum
    reads: name
    calls: "python-stdnum (figi)"
    meaning: "a FIGI's last digit: the check its standard computes over the eleven characters before it, its letters read as numbers (A as 10 … Z as 35), every other one doubled, the second from the right first, and the digits summed; and its first two letters none of the prefixes the standard keeps out"
    vectors: { holds: ["BBG000BLNQ16"], refuses: ["BBG000BLNQ17"] }
  - check: rolling-bearing
    reads: designation
    pattern: '^(?:[1-8]|N|NU|NJ|NUP|NN|QJ)[0-9]{1,4}(?:/[0-9]+(?:\.[0-9]+)?)?$'
    meaning: "a rolling bearing's basic designation, as ISO 15's plan of boundary dimensions writes it and the charts copy it: its type (a digit, or the letters of a cylindrical roller or a four-point bearing), its dimension series, and its bore — a code of two digits, a digit below ten millimetres, or `/` and the bore in millimetres: `6203`, `6301`, `6000`, `608`, `30205`, `NU205`, `62/22`. A suffix (`2RS`, `C3`) is no part of it"
    vectors: { holds: ["6203", "6301", "6000", "608", "30205", "NU205", "62/22"], refuses: ["6203-2RS", "62O3", "6", "6 203"] }
  - check: metric-thread
    reads: designation
    pattern: '^M[0-9]+(?:\.[0-9]+)?(?:[x×][0-9]+(?:\.[0-9]+)?){0,2}$'
    meaning: "an ISO metric screw thread by `M` and its nominal diameter in millimetres, then its pitch where it is fine, or a fastener's length: `M6`, `M10x1.25`, `M6x20`, `M10x50`"
    vectors: { holds: ["M6", "M6x20", "M10x50", "M10x1.25", "M10×1.25"], refuses: ["m6x20", "M6-20", "6x20", "Mx20"] }
  - check: o-ring
    reads: designation
    pattern: '^[0-9]+(?:\.[0-9]{1,2})?[x×][0-9]+(?:\.[0-9]{1,2})?$'
    meaning: "an O-ring's, or an X-ring's, size by its inner diameter and its cross-section in millimetres, as ISO 3601-1 sizes one: `25.07x2.51`, `10x2`"
    vectors: { holds: ["25.07x2.51", "10x2", "3.68x1.78"], refuses: ["25.07", "25,07x2,51", "x2.51", "25.07x2.51x3"] }
  - check: lip-seal
    reads: designation
    pattern: '^(?:[0-9]+(?:\.[0-9]{1,2})?-[0-9]+(?:\.[0-9]{1,2})?-[0-9]+(?:\.[0-9]{1,2})?|[0-9]+(?:\.[0-9]{1,2})?[x×][0-9]+(?:\.[0-9]{1,2})?[x×][0-9]+(?:\.[0-9]{1,2})?)$'
    meaning: "a rotary shaft lip seal's size by its bore, its outside diameter and its width in millimetres, as ISO 6194-1 sizes one, written with one separator: `23.3-37-8`, `35x52x7`"
    vectors: { holds: ["23.3-37-8", "35x52x7", "20-35-7"], refuses: ["23.3-37", "35x52-7", "23,3-37-8"] }
  - check: steel-grade
    reads: designation
    pattern: '^(?:1\.[0-9]{4,5}|C[0-9]{2,3}[A-Z0-9]*|[0-9]{2,3}(?:[A-Z][a-z]?){1,4}[0-9]+(?:-[0-9]+)*|X[0-9]{1,3}(?:[A-Z][a-z]?){1,5}[0-9]+(?:-[0-9]+)*|[SEPLBYRHD][0-9]{3}[A-Z0-9+]*|DC0[1-7][A-Z0-9+]*)$'
    meaning: "a steel by its grade, as EN 10027 writes one: its number (`1.4301`), or its name by its carbon (`C45`), its alloying elements (`42CrMo4`, `X5CrNi18-10`) or its use and strength (`S235JR`, `DC01`)"
    vectors: { holds: ["C45", "42CrMo4", "16MnCr5", "X5CrNi18-10", "S235JR", "1.4301", "DC01"], refuses: ["c45", "42crmo4", "AISI 304", "1.43", "S 235"] }
  - check: polymer
    reads: designation
    pattern: '^[A-Z]{2,6}[0-9]*(?:/[0-9]+)*(?:-[A-Z]{1,4})*(?:-[A-Z]{2}[0-9]{1,2}(?:\+[A-Z]{2}[0-9]{1,2})*)?$'
    meaning: "a polymer by its ISO 1043-1 symbol, its qualifiers after a hyphen, and its fillers and their share by ISO 1043-2: `PA66-GF30`, `PE-HD`, `PVC-U`, `POM`, `PTFE`"
    vectors: { holds: ["PA66-GF30", "PE-HD", "PVC-U", "PP", "POM", "PTFE", "PA6", "PEEK"], refuses: ["pa66", "PA 66", "P", "PA66-gf30", "PA66GF30"] }

# The columns of the table: which every row holds (`required`) and which it may (`optional`); a row holds the required
# ones and no other (core/law.py, `columns`). A row `calls` a library or holds a `pattern`, one of the two.
columns:
  checks: { check: required, reads: required, calls: optional, pattern: optional, meaning: required, vectors: required }
