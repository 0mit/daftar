# The flow law (v1 part 8): how a pass between layers is made, which passes stand, and what a logged pass may carry
# beside its statement. A row holds a pass made `from` one of its layers, `to` one of its layers, `through` one of its
# methods (a method, or a verb: say, read, derive, make, take, serve, hold), and, where it names `as`, carrying
# statements known there by one of those acts. A pass no row holds is refused. Of the rows that hold it, the nearest
# decides — a row that names `as` is nearer than one that names only layers — and of two as near, a refusal. `ratified`
# is refused until a garden's own row grants the party it names, with the basis it grants on (a RULE-CHANGE); a garden's
# own rows otherwise only refuse. `keeper: release` holds only for a file the release keeps.
# These rows are the law itself: a change to them is a RULE-CHANGE, made here.
methods:
  - { method: edit, meaning: "a writer changes a file, by hand or through a tool at the writer's word" }
  - { method: stamp, meaning: "the save writes the clock's reading where `now` stood, from a clock within half the stamp's resolution (thirty seconds for a minute's stamp) of its time sources; a save that cannot show it refuses to stamp, and writes nothing (bin/clock.py: the sources are siblings — the kernel's discipline, the servers the host was given, those its keeper names)" }
  - { method: append, meaning: "an entry added after the last, and nothing before it changed" }
  - { method: record, meaning: "a tool writes what it read off the world, with the reading's moment" }
  - { method: capture, meaning: "a command's output kept as it came, its owner and its command named" }
  - { method: merge, meaning: "the merge engine joins two copies of one being, keeping each value's source" }
  - { method: forward, meaning: "what a garden holds from another, made for a third, the passing garden's id appended to its path" }
  - { method: adopt, meaning: "a release's files laid into a garden, by germination or an upgrade" }
  - { method: publish, meaning: "material pushed, or offered for merging, to a public repository" }
  - { method: render, meaning: "material placed into a request to a model" }
  - { method: show, meaning: "a tool prints material to whoever runs it" }
  - { method: send, meaning: "material sent to a party outside the garden" }
flows:
  - { flow: words-to-said, from: [words, instructions], to: estate, through: say, as: say, grant: granted, why: "a said value's source is a person's words: a document they gave, or what they asked, recorded with who said it" }
  - { flow: model-output-is-no-word, from: [self, work], to: estate, through: [edit, say, derive], as: say, grant: refused, why: "a model's own output, or an agent's own notes, is no one's words: a said value the agent wrote on its own say is a guess" }
  - { flow: examples-are-not-facts, from: guide, to: estate, through: [edit, say, derive, record], grant: refused, why: "a value in a guide is an example's: a name, a day or an amount copied from one into a bean is a fact nobody gave" }
  - { flow: copied-is-not-said, from: estate, to: estate, through: edit, as: say, grant: refused, why: "a value copied from another bean has that bean for its source, not a person: it is cited in `from` and derived" }
  - { flow: derived, from: [estate, law, words, world, clock, history, other-garden], to: estate, through: [derive, merge], as: derive, grant: granted, why: "a value computed from inputs it names is as strong as its weakest input" }
  - { flow: made-here, from: [self, work, instructions, words], to: estate, through: edit, as: make, grant: granted, why: "prose, and a name minted, are made where they are written" }
  - { flow: clock-to-stamped, from: clock, to: estate, through: stamp, grant: granted, why: "the save reads the clock and writes the reading, as it writes the journal heading beside it" }
  - { flow: stamped-is-not-typed, from: [self, work, words, instructions, guide, estate], to: estate, through: stamp, grant: refused, why: "a day the save reads is never typed: a typed day is a guess, or a copy of an example's" }
  - { flow: world-read, from: world, to: estate, through: [record, edit], as: read, grant: granted, why: "a reading of a machine, a service or a run, recorded by whoever took it, with its moment" }
  - { flow: world-captured, from: world, to: history, through: capture, grant: granted, why: "a command's output is kept as it came, with its owner and its command, so it can be taken again and compared" }
  - { flow: run-observed, from: history, to: estate, through: record, as: say, grant: granted, why: "a result a captured run printed, a suite's verdict at a commit, is recorded as an observation that points at its capture, by a journalled save: the capture is the reading, and can be read again" }
  - { flow: merged, from: [estate, other-garden], to: estate, through: merge, grant: granted, why: "two copies of one being are joined with every value's source kept, and a subsumed value kept beside the winner" }
  - { flow: peer-taken, from: other-garden, to: estate, through: take, grant: granted, why: "import: authenticity is the receiver's, about the peer it met; what the peer said crosses one hop, the path recorded" }
  - { flow: peer-copied, from: other-garden, to: estate, through: edit, grant: refused, why: "another garden's facts come in through a proposal taken, whose fingerprint is recorded, never as a hand copy nobody can trace" }
  - { flow: peer-offered, from: estate, to: other-garden, through: make, grant: granted, why: "export: a person's name crosses only where their word reaches, and nothing is sold" }
  - { flow: peer-written, from: [estate, self, work], to: other-garden, through: edit, grant: refused, why: "another garden is written only by its own gardener: what this one would give it is a proposal" }
  - { flow: transit, from: other-garden, to: other-garden, through: forward, grant: granted, why: "transit: passed on as it came, the passing garden's id appended to the path; a path that holds the receiver is a loop" }
  - { flow: sealed, from: estate, to: held, through: hold, grant: granted, why: "material that must not sit in git is kept off it, where it can be erased per subject" }
  - { flow: unsealed, from: held, to: [estate, public, other-garden], through: [edit, make, publish], grant: refused, why: "sealed material comes back into git, or out of the garden, only as its pointer" }
  - { flow: sealed-read, from: held, to: request, through: [render, show], grant: ratified, why: "sealed material is read into a request only where the gardener grants it" }
  - { flow: journalled, from: [work, instructions, self, history], to: journal, through: append, grant: granted, why: "what was done and why is appended, entry by entry, beside the commit that did it" }
  - { flow: journal-rewritten, from: [work, instructions, self, history, journal], to: journal, through: edit, grant: refused, why: "a journal is appended and never rewritten: an entry changed after the fact is a record nobody can trust" }
  - { flow: queued, from: [work, instructions, self], to: queue, through: edit, grant: granted, why: "what waits for a person is proposed, parked and settled in place" }
  - { flow: law-ratified, from: [instructions, words], to: [law, manifesto], through: edit, grant: granted, why: "a change to the law is ratified by a person, and said distinctly as a RULE-CHANGE" }
  - { flow: story-in-law, from: [journal, history, reasoning, work], to: [law, manifesto], through: edit, grant: refused, why: "the law is applied alone, in the present tense: a story or a reason in it leans on a layer beneath" }
  - { flow: law-restated, from: law, to: [reasoning, guide, journal], through: edit, grant: refused, why: "a second statement of a rule disagrees with the first in time; a form is derived from the law, never copied" }
  - { flow: law-derived, from: law, to: guide, through: derive, grant: granted, why: "a form or a list is derived from the law by a tool, so it cannot disagree with it" }
  - { flow: released, from: public, to: [law, manifesto, reasoning, guide, gate, journal], through: adopt, grant: granted, why: "a release's files are laid into a garden whole, and the commit says RULE-CHANGE" }
  - { flow: release-in-estate, from: public, to: estate, through: adopt, grant: refused, why: "a release carries no garden's facts" }
  - { flow: kept-private, from: [estate, words, work, instructions, journal, queue, history, self], to: public, through: publish, grant: refused, why: "a garden's own material never goes to a public repository" }
  - { flow: release-public, from: [manifesto, law, reasoning, guide, gate], to: public, through: publish, grant: granted, keeper: release, why: "what the release keeps is public under its licences" }
  - { flow: composed-here, from: [manifesto, law, reasoning, journal, history, queue, guide, estate, gate, words, work, instructions, self], to: request, through: [render, show], grant: granted, why: "a request composed on this host keeps what it holds on this host, the model's own earlier turns among it" }
  - { flow: sent-out, from: [request, estate], to: remote, through: send, grant: ratified, why: "a hosted or remote party is refused until the gardener grants that party, with the basis the gardener's own law asks for sending there" }
  - { flow: served, from: estate, to: remote, through: serve, grant: granted, why: "a page or an action is served only to a viewer a grant opens it to, asked before each one" }
  - { flow: refusal-detail-served, from: history, to: remote, through: serve, grant: granted, why: "a refusal's detail — what a tool's log kept of why it refused — is served only to a viewer whose grants reach what it is about, as far as they reach, by the machine that holds it, which judges the one who asks: it is never sent ahead" }
metadata:
  - { key: characters, in: count, meaning: "how long the material was, counted in characters" }
  - { key: seq, in: count, meaning: "the pass's place in its session, where the log's order is not enough" }
  - { key: turn, in: count, meaning: "the turn of the session it happened in" }
  - { key: oid, in: oid, meaning: "the git object id of the material, as `git hash-object` gives it" }
  - { key: form, in: form, meaning: "how a person's words were carried: a word of `words.form`" }
  - { key: party, in: bean, meaning: "the bean of the party it went to, where it left the garden" }
  - { key: quoted, in: count, meaning: "how often the value a pass carries was found, as written, in its source; 0 where it was found nowhere quoted, and the pass is HOPED: the words may say it another way" }
  - { key: distinct, in: count, meaning: "how many of those finds were by a part of the value that names one thing — a day, an amount of three digits or more, eight characters or more; 0 where every find was by a short word or a small number, which is in everything: the attribution is weak" }
dropped:
  - { flow: law-owned, why: "a value the law owns is the filler of a role whose shape is a row, judged by its table (rule valency): no pass carries it" }

# The columns of each table of rows above: which every row holds (`required`) and which it may (`optional`); a row holds
# the required ones and no other (core/law.py, `columns`).
columns:
  methods: { method: required, meaning: required }
  flows: { flow: required, from: required, to: required, through: required, as: optional, grant: required, keeper: optional, party: optional, basis: optional, why: required }
  metadata: { key: required, in: required, meaning: required }
  dropped: { flow: required, why: required }
