# `prediction` (expected, with what brings it), `universal` (the standard holds it for any garden), `out-of-context` or
# `impossible`. A vacancy is at `table:<t>` (a row of a table), `figure:<f>` (a position on a figure),
# `form:<f>.<attribute>` (a value of a form's attribute; `form:<f>`, one of its `one_of`) or
# `details:<term>.<attribute>` (what `details` keeps under today's term). The law holds each at a place it has; that one
# is taken is evidence (`python3 bin/review.py --law`), never a refusal. A garden says a row of its own is vacant on the
# row (`vacant`), as rule vacancy reads it.
