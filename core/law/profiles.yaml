      - at: "table:protocols"
        position: tcp
        reason: prediction
        why: "Every endpoint recorded so far takes its transport from its protocol's row, and A DEFAULT DOES NOT OCCUPY: a position is taken by an entry that STATES it. Expected first where a protocol answers on a transport other than its usual one — the DNS server that answers on 53/tcp as well as 53/udp."
      - at: "table:protocols"
        position: udp
        reason: prediction
        why: "As for tcp: no entry has yet needed to state it, because the protocols that use it say so in their own rows."
      - at: "table:systems"
        position: ipv6
        reason: prediction
        why: "`prediction` and not `impossible`: v6 is ordinary and arriving, and the position exists so that the day one endpoint takes it, the gate says the prediction came true instead of letting a whole address family appear with nothing noticing."
  - profile: domain
    meaning: "for a garden that holds delegated names — registered domains. The one class of fact that can lose a name outright is its registration, and a registration is an agreement: the registrant holds the name through a registrar until a day on which it lapses unless it is renewed — a contract `over` the domain, its parties `registrant` and `registrar`, its `timing` the `registration`, and a clause `renewal` that falls due on the day it lapses, with ninety days' `notice`: an unrenewed domain takes its DNS and its mail with it. The profile adds the one word of the field the core does not have. A garden with no domains inherits none of it."
    verbs: [renew]
    went: { "clauses.auto_renew": "the verb `renew`, a position on the permission square of a renewal" }
    dropped:
      - at: "clauses.auto_renew"
        position: enabled
        why: "the core's `renew` says whether a registrar renews unasked by a position on the permission square of the renewal — `permitted`, `forbidden`, or no position where it is not known — so the three values are the square's, and none is kept vacant"
      - at: "clauses.auto_renew"
        position: disabled
        why: "the core's `renew` says whether a registrar renews unasked by a position on the permission square of the renewal — `permitted`, `forbidden`, or no position where it is not known — so the three values are the square's, and none is kept vacant"
      - at: "clauses.auto_renew"
        position: unknown
        why: "the core's `renew` says whether a registrar renews unasked by a position on the permission square of the renewal — `permitted`, `forbidden`, or no position where it is not known — so the three values are the square's, and none is kept vacant"
  - profile: knowledge
    meaning: "for a garden that says what things ARE in the world's shared terms: the field of knowledge a skill or a technology draws on (ISCED-F 2013), the occupation a role or a person's work is (ISCO-08), and the established technology a program, instance or host runs (with its official documentation). The codes are UNIVERSAL: the same in every garden, so knowledge merges across gardens that never met — and a being that IS one of them (an occupation, a field, a technology) is identified by it, `identifier: isco-08:2522`, a coding."
    verbs: [classify]
    forms: [pattern, class]
    went: { knowledge: "the verbs `classify` (`classified_as`) and `use` (`uses`, `draws_on`)" }
  - profile: view
    meaning: "for a garden that draws what it keeps: a page of drawings, each of a mapping or a bean the garden holds, read at four lenses, with live values beside the drawing and actions a host may run. Its asset is `assets/view/`, which a garden receives only while it extends this profile. A garden that draws nothing should inherit none of it."
    verbs: [draw]
    tables: [lenses, archetypes, orientations, aspects, date_styles, currency_displays]
    forms: [page, drawing, reader_preferences]
    asset: "assets/view"
    went:
      view: "the form `page`, held by the page's own `draw`"
      view_monitors: "the form `page`, its `monitors`"
      views: "the form `drawing`, held by a `draw` of each drawing"
      view_bindings: "the form `drawing`, its `values`: each value sits on one drawing"
    vacancies:
      - at: "table:archetypes"
        position: reservoir
        reason: universal
        why: "the operate shapes the asset draws, declared whole; a garden takes the ones its drawings need"
      - at: "table:archetypes"
