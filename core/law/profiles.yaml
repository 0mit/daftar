# The profiles (v1 part 11): what a garden takes up beside the core, each by its name in its VOCAB.md (`profiles:
# [<name>, …]`, a RULE-CHANGE). A profile gives the verbs whose row names it as their `home` (core/law/verbs.yaml), its
# tables, the forms its verbs hold, the attributes it adds to a form of the core (`adds`), and its asset
# (`assets/<profile>/`, which a garden receives while it takes the profile). A garden that does not take a profile uses
# none of it: rule `profile`. Each of today's terms and overlays of a profile is named where it went (`went`), and each
# of its vacancies is at its place in the core.
# GENERATED by `python3 core/translate.py profiles` from std-vocab 32.1's `profiles`, `view_lenses`, `view_archetypes`
# and `planes`; a change is made there, or by a RULE-CHANGE that moves these rows, never by hand here.
profiles:
  - profile: accounting
    meaning: "for a garden that keeps accounts, in the words its field uses. Analytic accounting first: where each amount's cost or revenue belongs, along plans the garden keeps as its own scheme of codes — a plan is a code at the scheme's first level, `plan`, and an account one beneath it, `account`. What an account holds is READ (bin/dmreckon.py `apportion`), never stored. Its names are the field's: `analytic_distribution` is what an ERP's user already writes, and seed/COOKBOOK.md pairs each of the field's names with where it is kept"
    verbs: [book]
    went:
      "transactions.analytic_distribution": "the verb `book` (an amount's statement booked to an account, in a share)"
      "clauses.analytic_distribution": "the verb `book` (what a clause asks booked to an account)"
  - profile: code
    meaning: "for a garden that manages source code: where its trees are and how an agent treats each, and the repository identity of a code bean"
    adds:
      placement:
        attrs:
          role:
            in: [own-source, vendored-dependency, generated-artifact]
            meaning: "what the tree at this position is of the code bean: own-source (its own source) | vendored-dependency (another code's tree carried inside it) | generated-artifact (what its build made). A tree of another code that it is only read beside is that code's own location, reached through `depends_on`"
          scan_policy:
            in: [index, reference-only, skim]
            meaning: "index (own code — walk fully) | reference-only (do NOT re-scan each session; consult analysis_cache, grep on demand only) | skim (structure only)"
          stack: { in: { type: kebab }, meaning: "language/runtime tag, e.g. python-django | csharp-dotnet (optional)" }
          entrypoint: { in: prose, meaning: "manifest / solution / addin that roots the tree (optional)" }
        cells: [{ when: { role: [own-source, vendored-dependency, generated-artifact] }, requires: [scan_policy] }]
    went:
      located_at: "the form `placement` (`be`'s `placed`), which the profile gives `role`, `scan_policy`, `stack` and `entrypoint`"
      git_remote: "the verb `name`, in a namespace of the garden's own (`anchor-git_remote`)"
    vacancies:
      - at: "form:placement.role"
        position: vendored-dependency
        reason: prediction
        why: "No bean vendors a third-party tree into its own source today. Kept because vendoring is an ordinary state for a code estate, and without the position a vendored tree would be recorded as own-source, silently losing the distinction between the code the estate wrote and the code it carries."
      - at: "form:placement.role"
        position: generated-artifact
        reason: prediction
        why: "No bean records a build-output tree yet. Kept because an artifact tree must never be indexed as own-source: it is derived, so re-analysing it teaches nothing the source did not already say."
  - profile: network
    meaning: "for a garden that manages machines that talk to each other: what a being ANSWERS ON, what it REACHES FOR, the LINKS those ride over, and what a forwarding device DOES to traffic in between. A garden with one host and no network should inherit none of it."
    verbs: [serve, carry, route, translate, filter]
    tables: [planes]
    went:
      endpoints: "the verb `serve`"
      links: "the verb `carry`"
      reaches: "the verb `need`"
      treatments: "the verbs `route`, `translate` and `filter`"
    vacancies:
      - at: "table:protocols"
        position: pptp
        reason: impossible
        why: "Nothing should speak it. `impossible` rather than `prediction`, which is the whole point of registering it: MS-CHAPv2 and MPPE are broken by published attacks, so a pptp tunnel protects nothing while presenting as a VPN in every inventory that lists it. Declaring the position and refusing it is how the law states a standing decision that would otherwise exist only as an absence — and an absence is indistinguishable from nobody having thought about it."
      - at: "table:protocols"
        position: ipv4
        reason: universal
        why: "declared because the structure is general, not because an occupant is expected (CONTRIBUTING: a mechanism may precede its occupants)"
      - at: "table:protocols"
        position: ipv6
        reason: universal
        why: "declared because the structure is general, not because an occupant is expected (CONTRIBUTING: a mechanism may precede its occupants)"
      - at: "table:protocols"
        position: icmp
        reason: universal
        why: "declared because the structure is general, not because an occupant is expected (CONTRIBUTING: a mechanism may precede its occupants)"
