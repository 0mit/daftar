      - at: "table:archetypes"
        position: gauges
        reason: universal
        why: "the operate shapes the asset draws, declared whole; a garden takes the ones its drawings need"
      - at: "table:archetypes"
        position: board
        reason: universal
        why: "the operate shapes the asset draws, declared whole; a garden takes the ones its drawings need"
      - at: "table:archetypes"
        position: scoreboard
        reason: universal
        why: "the operate shapes the asset draws, declared whole; a garden takes the ones its drawings need"
      - at: "table:archetypes"
        position: funnel
        reason: universal
        why: "the operate shapes the asset draws, declared whole; a garden takes the ones its drawings need"
      - at: "table:archetypes"
        position: race
        reason: universal
        why: "the operate shapes the asset draws, declared whole; a garden takes the ones its drawings need"
      - at: "table:archetypes"
        position: table
        reason: universal
        why: "the operate shapes the asset draws, declared whole; a garden takes the ones its drawings need"
      - at: "table:archetypes"
        position: health-chain
        reason: universal
        why: "the operate shapes the asset draws, declared whole; a garden takes the ones its drawings need"
      - at: "form:drawing.values.live"
        position: live-state
