lenses:
  - lens: orient
    depth: 0
    form: story
    max: { stages: 5, words_per_stage: 14 }
    meaning: "what the drawn thing does and what it is built from, for someone who has never touched it: its purpose, three to five stages in the order work flows, its outcome, and each technology's own documentation. No address, port or live value"
  - lens: understand
    depth: 1
    form: schematic
    max: { elements: 18 }
    meaning: "how the parts co-operate, where the work is decided and where it is fragile: parts by what they do, flows as verbs, decisions as gates, boundaries where ownership or network changes. No live value, and no address unless the page is private (`view.visibility`)"
  - lens: operate
    depth: 2
    form: health-chain
    max: { tiles: 12 }
    meaning: "what the person on call must know first, now: the drawn thing's own vital sign in a shape native to it (a row of `view_archetypes`), the evidence beneath it, what the page cannot see, and where a person may act"
  - lens: inspect
    depth: 3
    form: anatomy
    max: { cards: 12 }
    meaning: "what exactly the parts are and how that is known: a card of each part's own facts with their provenance, the steps, the wiring, and what is still open"
archetypes:
  - archetype: reservoir
    reads: [hold]
    meaning: "a store filling toward its thresholds: how full, each threshold and what it does, the time to the next, what else fills it"
    when: "the risk is something filling up: a disk, a queue, a quota"
  - archetype: lanes
    reads: ["need.through"]
    meaning: "parallel paths, each a lane of hops coloured by state, with a verdict per lane"
    when: "the work goes through redundant paths that must each get through"
  - archetype: roster
    reads: [reckon]
    meaning: "the items it serves: how many are active, and a bar each for how much"
    when: "the question is who uses it and how much"
  - archetype: gauges
    meaning: "one dial per value against its warning and critical limits"
    when: "the work keeps values inside limits"
  - archetype: board
    reads: [part]
    meaning: "a fixed set of parts, each with its state and one fact, and the headline numbers"
    when: "a known set of parts must each be doing its job"
  - archetype: scoreboard
    reads: ["page.monitors"]
    meaning: "the watcher's own vital numbers and what is firing, or a calm 'nothing is firing'"
    when: "what is drawn is the watching itself"
  - archetype: funnel
    frame: [routine]
    meaning: "a stream narrowing through its stages: how many reached each, where the rest stopped and why, then a roll call of the parts"
    when: "work enters, is judged at a series of stages, and leaves"
  - archetype: race
    frame: [routine, walk]
    meaning: "a run of a procedure against its deadline: the step it is at (a step of the procedure the view `draws`, in the order its `steps` list them), how long it has run, how long it still needs, and the verdict"
    when: "what is drawn is a bounded run that must end before a moment"
  - archetype: table
    reads: [record]
    axes: { inline: taxis, block: ordinal }
    meaning: "the members of a reading, or the rows of a series, one line each with a column per path: the report, and an offline file of it. Or the codes of a chart (the drawing's `chart`), in the chart's order: the books of the being it draws, an account a line — and beneath an account that holds parties a line for each party its lines name, and one for its lines that name none — each column a figure the accounting profile's asset reads of it, per currency, with the totals and whether they balance; an account that posts opening its ledger, and a party its own"
    when: "the question is which ones, and what each holds"
  - archetype: queue
    axes: { block: ordinal }
    meaning: "what waits, and for whom: the reader's leads (bin/leads.py), grouped by what each waits on — a decision, a case at a step, an obligation falling due, a failure a reading shows, an open session — the most urgent first, each opening the sheet of the being it is about. Engraved from the reading: no drawing module draws it"
    when: "the question is what needs the reader now"
  - archetype: timeline
    frame: [time]
    axes: { inline: time }
    meaning: "the members of a reading placed by their moments in the reader's calendar — a happening's time, a clause's due day and each occurrence of its repetition within the drawing's `span`, walked by bin/stale.py, the function that warns — as a week (its days side by side, its first the day the reader's region begins a week on, each day a timeline of its hours: what takes them a block at them, what is kept in view beside them), a month, or a list: three readings of one line. Engraved from the reading: no drawing module draws it"
    when: "the question is when"
  - archetype: flows
    reads: [pay, bear, pass]
    axes: { inline: flow }
    meaning: "who owes whom, and what went between gardens: parties as nodes and, per currency, an arrow from the one who owes to the one owed, netted as bin/ledger.py nets it, its amount exact; or gardens as nodes, an arrow for what went from one to the other. The arrowhead is the glyph of `next` in the reader's script. Engraved from the reading: no drawing module draws it"
    when: "the question is who owes whom, or what crossed between gardens"
  - archetype: course
    frame: [walk, time]
    reads: [be, move]
    meaning: "one course as it stands, the one way a course is drawn — a line of a table (a column's `stands`), beneath its being on a sheet, a run on a host's page: its walk's steps in their order with the step it stands at marked and the ways out and pauses apart, since when, who acts there, overdue where the step's `usually` has passed; the needs it states, each met or not and blocking or not; the amounts it needs. A course is a being placed on a walk (`be` as order) and its moves; a clause's occurrence (due on its day, met when a payment `settles` it) and a standing need (holding, or crossed where a `fail` through a `measure` of it has no `repair`) are read as courses the same way, never written as moves. Engraved from the reading (bin/seq.py): no drawing module draws it"
    when: "the question is where something stands on its way, and who acts next"
  - archetype: sheet
    meaning: "one being as it stands: its title and summary, its statements verb by verb — each with the statements that take it as their `of` beneath it, a payment with its shares and the clauses that ask it — and its held values, marked as kept on the machine that holds them; the facts its page's `fields` names for its kind. For a reader who may write it, the one place it is changed: one Edit turns each fact they may write into its widget, and one Save is one commit with one journal entry. Engraved from the being: no drawing module draws it"
    when: "the question is what one being is, or a change to it"
  - archetype: cursor
    meaning: "one being or several, the cursor, kept still while the aspect around it turns: what the aspect follows through the cursor, laid out by its order, each group of it in its line (a series with its gaps, a class with what is set apart); a cursor on a member turns to its group, and the next cursor is a click on what is shown. The trail of cursors is the reader's history; a saved board is a page whose drawing is this, saved by the sheet's one Save"
    when: "the question is what this one is among its siblings — its copies, its series, its class, what carries it — and the reader moves from one to the next"
  - archetype: health-chain
    meaning: "tiles in flow order with value, limit and trend, and the blind spots"
    when: "no shape native to what is drawn is designed yet"
# WHERE EACH ORDER RUNS ON A PAGE (the direction design, ratified 2026-10-10): a drawing keeps the frame of what it draws.
# A sayable is laid out in the taxis, which on a page is the reader's script — its inline axis mirrored with the script.
# A body keeps its own frame — the ladder's foundation below, north up, more up — never mirrored, because the world
# does not turn around when its reader's language does. assets/view/lib/widgets/direction.js turns these rows into
# axes, commands bound to keys, glyphs and gestures; a page names a command by its meaning, never by a side.
orientations:
  - { order: ordinal, of: "line:ordinal", axis: inline, sense: "1", follows: "true", commands: [next, previous], meaning: "which in order: the first at the start of the reader's line, the next toward its end" }
  - { order: taxis, of: "level:taxis", axis: inline, sense: "1", follows: "true", commands: [next, previous], meaning: "the frame of sayables: a page, a statement, a list, read in the reader's own script" }
  - { order: time, of: "line:time", axis: inline, sense: "1", follows: "true", commands: [later, earlier], meaning: "a timeline, a series, a journal: earlier at the start of the reader's line, later at its end" }
  - { order: routine, of: "line:routine", axis: inline, sense: "1", follows: "true", commands: [next, previous], meaning: "a procedure's steps: the first at the start of the line; its branches down the block" }
  - { order: flow, of: "verb:pass", axis: inline, sense: "1", follows: "true", commands: [next, previous], meaning: "from at the start, to at the end: a mail route, a backup's copy, a proposal between gardens — its arrowhead the glyph of next" }
  - { order: walk, of: "line:walk", axis: block, sense: "1", follows: "true", commands: [next, previous], meaning: "part-of, ownership, habitat, dependency: the whole at the block start, its parts indented toward the reader's line end" }
  - { order: ladder, of: "table:ways", axis: vertical, sense: "-1", follows: "false", commands: [up, down], meaning: "the ladder's stands, made-of and possible-on: the foundation below and what stands on it above — gravitation's up, never mirrored" }
  - { order: magnitude, of: "line:temperature", axis: vertical, sense: "-1", follows: "false", commands: [up, down], meaning: "a metered line's value — a temperature, a potential, a measure: more is up" }
  - { order: place, of: "line:place", axis: map, sense: "1", follows: "false", meaning: "a map: north up and east right, whatever the reader's script; a tree of places is the walk" }
  - { order: depth, of: "way:made-of", axis: z, sense: "1", follows: "false", commands: [in, out], meaning: "made-of read inward: in shows a being's parts, out its whole" }
# THE ASPECTS OF A BOARD (the archetype `cursor`): each a frame of relations through the cursor — the verb it follows
# (or a grouping it reads), the role the cursor fills in it, the order it is laid out by. A profile brings its own
# (`home`); the board turns from one to the next about the cursor, which stays where it is. Named by the operator's
# word, "aspect" (2026-10-18), beside the view's `lenses`, which are readings by the reader's depth.
# These rows are the law itself: a change to them is a RULE-CHANGE, made here.
aspects:
  - { aspect: holds, home: core, follows: hold, points: by, order: walk, of: [host, volume, folder], meaning: "what the cursor carries, folders first; between several, what they hold in common" }
  - { aspect: carried-by, home: core, follows: hold, points: of, order: walk, of: [content, folder, volume, host], meaning: "what carries the cursor: the folders and volumes that hold a content, the folder and volume a folder is in, the machine a disk is part of" }
  - { aspect: copies, home: core, follows: make, points: from, order: flow, of: [content], meaning: "every holding of one content, and every copy made of it, from its source to where it was copied" }
  - { aspect: in-backup, home: core, follows: make, points: of, order: flow, of: [content, folder, volume], meaning: "the place a content was copied into, and that place's other members, by the volume each came from" }
  - { aspect: its-series, home: core, follows: name-series, points: of, order: ordinal, of: [content, folder], meaning: "the run of names the cursor's file is one of: its counter's runs and gaps, the days and the camera" }
  - { aspect: its-class, home: core, follows: root, points: of, order: walk, of: [content, folder, volume], meaning: "the codes the cursor holds, where each came from — said, inherited from a whole, suggested by a pattern — and, at a root, what it holds and what is set apart" }
  - { aspect: its-moves, home: accounting, follows: pay, points: by, order: time, of: [person, org, account], meaning: "the payments the cursor made and received, in time" }
  - { aspect: its-category, home: accounting, follows: moves, points: of, order: walk, of: [document], meaning: "the merchant's moves a bank's line is one of, and the code of the plan they are booked to" }
  - { aspect: its-dataset, home: storage, follows: datasets, points: of, order: walk, of: [content, folder], meaning: "the dataset the cursor is one tree of: its manifest's content, and every folder that holds that tree, by the volume each is on" }
  - { aspect: its-safety, home: storage, follows: keepings, points: of, order: walk, of: [content, folder, volume], meaning: "the cursor's keepings by risk: for each risk its policy asks it to be safe against, the keepings that resolve it and what is missing" }
# THE ACCOUNTING PROFILE'S TABLES: what an account of a chart is (its element), and the roles an account plays in the
# books' readings. The elements are the IFRS Conceptual Framework's five (§4.2): a published list no jurisdiction's
# chart owns. Each is read in a SENSE, as each order of the view is (`orientations`): value is a charge that moves — it
# arrives at a position (the field's debit) and leaves one (its credit) — and an element's balance is its net charge
# read along the arrival (`1`) or against it (`-1`).
date_styles:
  - { style: short, meaning: "the day in figures alone, as its calendar writes it: 1405/7/21" }
  - { style: medium, meaning: "the day with its month abbreviated where its language abbreviates one" }
  - { style: long, meaning: "the day with its month's name: 21 Mehr 1405" }
  - { style: full, meaning: "the day with its weekday and its month's name: Monday, 21 Mehr 1405" }
currency_displays:
  - { display: symbol, meaning: "a currency by its symbol where its locale has one, else its code: US$" }
  - { display: narrowSymbol, meaning: "by its narrowest symbol, where the reader knows which currency it is: $" }
  - { display: code, meaning: "by its ISO 4217 code: USD" }
  - { display: name, meaning: "by its name in the reader's language: US dollars" }
elements:
  - { element: asset, sense: "1", meaning: "a present economic resource the entity controls as a result of past events: cash, a bank account, a receivable, a thing bought to keep" }
  - { element: liability, sense: "-1", meaning: "a present obligation of the entity to transfer an economic resource as a result of past events: a payable, a card's balance, a loan" }
  - { element: equity, sense: "-1", meaning: "the residual interest in the assets after deducting all liabilities: what the entity's owners put in, and its result kept" }
  - { element: income, sense: "-1", meaning: "an increase in assets, or decrease in liabilities, that increases equity, other than from owners: a sale, a fee earned, interest received" }
  - { element: expense, sense: "1", meaning: "a decrease in assets, or increase in liabilities, that decreases equity, other than to owners: what is spent and used up" }
account_roles:
  - { role: awaiting, meaning: "where a part no booking places waits, awaiting an account: a statement's line not yet booked" }
  - { role: unsaid, meaning: "where a payment whose means is not said, or has no account in the chart, is held until it is; absent, the account `awaiting`" }
  - { role: earnings, meaning: "where a period's result is carried: income less expense, kept" }
  - { role: tax, meaning: "where a tax owed to an authority, or claimable from one, is held" }
keeping_properties:
  - { property: disk, meaning: "the distinct physical carriers a content is kept on: a disk by its own being, two volumes of one disk one, a volume read in a content on the carriers of the content's keepings, a disk held for its health none" }
  - { property: array, meaning: "a keeping on a volume whose carriers survive the loss of any one of them" }
  - { property: volume, meaning: "the distinct volumes a content is kept on, each a keeping a write to another does not reach; volumes a sync keeps alike, carrying each removal from one to the other, are one" }
  - { property: place, meaning: "the distinct places its carriers are at (`be … as: location`); a carrier whose place nobody said is at none" }
  - { property: offline, meaning: "a keeping whose carrier is attached to no running host: a disk that is part of none and that no running course of `walk-run` holds" }
  - { property: immutable, meaning: "a keeping no account of a host that reaches it can write" }
  - { property: verified, meaning: "a keeping whose content's bytes were read and found whole — a scan that hashed them, a copy checked by its digest, a check of a manifest — within the policy's `within`" }
  - { property: key, meaning: "a keeping none of whose carriers needs a key, or each of whose needed keys two holders hold: a carrier needs a key it is said to need (`need … of` the key, a being), and a holder holds it (`hold … of` the key: that it is held, never what it is)" }
layout_slots:
  - { slot: day, forms: [yyyy, yyyy-mm, yyyy-mm-dd], meaning: "the day a member's content was made — its `produce.at`, else the day a pattern its name fits reads, else the day the nearest of its folders' names holds — in the form the slot names, in the garden's calendar" }
  - { slot: event, meaning: "the event its content is in, by the grouping `events` and the gap its schema names: its first day, and `…` and its last where they differ, `yyyy-mm-dd`" }
  - { slot: maker, meaning: "the being that made its content (`produce.by`), by its id; `unknown` where nobody said" }
  - { slot: found, meaning: "the path of the folder it was found under, from the root of the volume its source was read on (the holding it is made from, `make … from`)" }
  - { slot: within, meaning: "the path of its folder from the nearest folder a code it matches by is said of, that folder's name first: another's media kept as it was found beneath the folder it was found under" }
  - { slot: name, meaning: "the member's own name; where another content is held under it at that place already, its name with `-` and the first eight digits of its content's BLAKE3 before its extension" }
  - { slot: blake3, meaning: "its content's BLAKE3, the 64 hexadecimal digits that name it: a blob's name in a box" }
risks: []
risk_form:
  risk: "the risk's name, a kebab word: what may happen to a content's keepings"
  meaning: "what happens, said for a reader"
  resolved_by: "the ways a content is safe against it, a list, any one of which resolves it: each a map of keeping properties (`keeping_properties`) to the least count of the content's keepings that hold each — `{ disk: 2 }`, two keepings on two disks; `{ offline: 1 }`, one keeping offline; `{ verified: 2 }`, two keepings each found whole within the policy's `within`"
planes:
  - { plane: data, meaning: "the traffic the being exists to carry or to serve" }
  - plane: control
    meaning: "how the being decides where traffic goes: routing adjacencies, discovery, redundancy election"
  - { plane: management, meaning: "how an operator reaches the being to configure or observe it" }
forms:
  pattern:
    meaning: "a name's template, on the rows of a scheme that names this form (`form: pattern`), beside its code, level, parent and name: what a name fits, what text it is read from, what it suggests and where it applies. A row is read by the operation `fit`, the most specific first"
    attrs:
      template:
        required: "true"
        in: { type: text }
        meaning: "literal text and slots, `{<slot>}` or `{<slot>:<width or form>}` — a width `4` exactly four, `4+` four or more — each slot a row of `slots` (core/law/lines.yaml); `{{` and `}}` a brace. Nothing in it is evaluated"
      reads:
        in: { type: field_path }
        meaning: "the text the template is matched against: `as` of a holding (a file's name), of a `name` (a folder's), a statement's `note` (a bank line's words), or `path`, a holding's path beneath its volume — its folder's name by the volume, `/`, its own name — or a folder's; absent, a holding's name"
      case:
        in: [exact, any]
        meaning: "whether literal letters are compared with their case; absent, without"
      extensions:
        in: { type: kebab }
        meaning: "the extensions its `extension` slot allows, a list, compared without case"
      calendar:
        in: { registry: systems, take: system, where: { dimension: [time] } }
        meaning: "with a `date` slot, the calendar its day is read and checked in"
      suggests:
        in: { type: coding }
        meaning: "the codes of class schemes a name that fits is evidence for, a list: `media:captured-raw`, `roles:dropping`"
      grouping:
        in: { registry: groupings, take: grouping }
        meaning: "the grouping its members make (`name-series`); absent, any"
      marks:
        in: [by]
        meaning: "`by`: what it suggests is for the folder that holds a file of this name, not the file's content — a `package.json` marks a code tree; absent, for the being the text names"
      within:
        in: { type: coding }
        meaning: "the row applies only to a member one of whose wholes holds this code, or a code beneath it: a folder named `bin` is a build's only inside a code tree"
      beside:
        in: { type: coding }
        meaning: "the row applies only where most of the member's siblings hold this code: a `.pot` file is a gettext template beside `.po` files"
      match:
        in: [whole, part, word]
        meaning: "how much of the text the template takes: `whole`, all of it; `part`, a run anywhere in it; `word`, a run anywhere in it that no letter or digit touches on either side; absent, `whole`"
      only:
        in: [suggests]
        meaning: "`suggests`: the row is read for what it suggests alone — `fit` makes no group of a text it takes, which goes on to the next row, or to mining; absent, its members group as `grouping` says"
  class:
    meaning: "what a code of a class scheme is, on the rows of a scheme that names this form (`form: class`), beside its code, level, parent and name: the being it stands for, and whether its members are set apart from their wholes' codes. Its codes are what `inherit` reads"
    attrs:
      stands_for:
        in: being
        meaning: "the being the code stands for: `work:orchard` stands for the orchard co-op. One code a being, as a chart's account stands for one"
      apart:
        in: ["true"]
        meaning: "`true`: a member of this code inherits no code from its wholes, and its parts inherit from it alone — a program's tree, a system's dropping, another's code placed there"
  keep:
    meaning: "what a code of a policy scheme asks of its members' keepings, on the rows of a scheme that names this form (`form: keep`) beside its code, level, parent and name: the risks each member must be safe against, how recently a keeping must have been found whole, and the codes of other schemes it is read for. A content's code is read by `inherit` — what a person classed it, or its nearest whole, as — else it is the code whose `for` names a code the content holds; a content of no code is read for what its keepings resolve, and judged against nothing"
    attrs:
      covers:
        in: { registry: risks, take: risk }
        meaning: "the risks a member must be safe against, a list of rows of `risks`"
      within:
        in: { quantity: duration }
        meaning: "how recently each keeping's bytes must have been read and found whole for the property `verified`: a count and a unit of time, `365 d`"
      for:
        in: { type: coding }
        meaning: "codes of other class schemes, a list: a member holding one, and classed by nothing nearer, is read under this code"
  schema:
    meaning: "a directory's schema, on the rows of a scheme that names this form (`form: schema`) beside its code, level, parent and name: a schema (a code with no parent), said of a directory by a person (`classify` of the folder), and its nodes (codes whose parent is the schema), each the place beneath the directory its members belong at by their facts. A member belongs at the first node whose `matches` it holds — in a box (`links`), at every such node, each a name linked to its one blob: one content under several schemas. It is in place where its path is the one the node's template gives its facts, out of place where it is not, and at no node where it holds no node's `matches`; a name whose content changed since the reading before is a change. Nothing is moved by a reading"
    attrs:
      template:
        in: { type: text }
        meaning: "a node's path beneath the directory: literal text, `/` between folders, and slots of the storage profile's `layout_slots` — `{day:yyyy}/{day:yyyy-mm-dd}/{name}`, `.blobs/{blake3}`; nothing in it is evaluated"
      matches:
        in: { type: coding }
        meaning: "the codes a member must hold for a node, a list, any one of which does: a class of the garden's (`media:captured-raw`), a role; absent, every member"
      links:
        in: ["true"]
        meaning: "`true`: a node of a box — its names may be hard links to the blobs of the box, one inode a content (the node `.blobs/{blake3}`), and so nothing beneath it is changed in place; absent, its names are files of their own, edited in place, and never linked"
      versions:
        in: { type: count }
        meaning: "how many earlier contents of a name that changed are kept, the latest first"
      age:
        in: { quantity: duration }
        meaning: "how long an earlier content is kept, whichever of `versions` and `age` comes first"
      history:
        in: being
        meaning: "a schema's: the box, on another disk, that keeps the earlier contents of its changed names, each a blob"
      gap:
        in: { quantity: duration }
        meaning: "a schema's: the gap after which a new event begins, for the slot `event`"
  chart:
    meaning: "what each account of a chart of accounts is, on the rows of a scheme that names this form (`form: chart`) beside its code, level, parent and name: a booking names a postable account — a code no other code has for its parent"
    attrs:
      element:
        in: { registry: elements, take: element }
        meaning: "what the account is — asset, liability, equity, income, expense; stated on a row, or inherited from its nearest ancestor that states one"
      stands_for:
        in: being
        meaning: "the being whose account this is: a bank account, a card, a cash box, a loan agreement. One account of a chart stands for a being; a booking that names the being is read as naming this account"
      parties:
        in: { registry: kinds, take: kind }
        meaning: "the kinds of being whose current accounts it holds, a list: a booking to it names the party, and what a party owes or is owed is read from the payments, as bin/ledger.py reads it"
      role:
        in: { registry: account_roles, take: role }
        meaning: "a role the account plays in the books' readings, one account a role"
      closed:
        in: { type: position }
        meaning: "the day (`YYYY-MM-DD`) after which nothing is booked to it: an account a booking used is closed, never moved or deleted"
  page:
    meaning: "this bean is a page of drawings: the garden's own drawing module, the organisation it opens on, who reads it, the parts a reader looks up, which of a being's own facts a card shows, and the words a reader may hover. What it is called is its `title`; what it draws is its `views`; where its live values come from is its `view_monitors`"
    replaces: [view, view_monitors]
    attrs:
      drawings:
        in: { pointer: bean_field_pointer }
        meaning: "`file:<path>` of the garden's own drawing module: the garden's code, never the law's. A page whose drawings are all engraved from readings — a queue, a timeline, flows, a sheet, a table of a reading — names none: the view draws a table of a reading by its columns where its page names no module"
      palette:
        in: { pointer: bean_field_pointer }
        meaning: "`file:<path>` of the garden's own palette: the colours its sheets are drawn in, in each mode — day, night, print — as tokens (`{ modes: { <mode>: { <token>: <colour> } } }`). The grammar is the asset's and every garden's; the palette is the garden's. Absent, the asset's own"
      opens_on:
        in: { being: { kind: [org] } }
        meaning: "the organisation the page opens on; absent, every organisation the reader may see"
      visibility:
        in: [public, private]
        meaning: "who reads the page. public (absent): anyone it is published to — no drawing shows an address, and a being's addresses are on its card, for a viewer who may see them | private: only the viewers its host signs in — at the understand lens each part shows its own address in its box, the one `reference` chooses from the being's own record, sent only to a viewer who may see that being; and a drawing's own text may show addresses, which every viewer of that drawing sees"
      glossary: { in: { prose: named }, meaning: "what a word on the page means, under the word" }
      reference:
        meaning: "the parts a reader looks up, one entry per being, in the order listed. The address that stands for a being is one the being itself states, and is chosen here, never stated here"
        in:
          entries:
            being: { required: "true", in: being, meaning: "the part" }
            system:
              in: { registry: systems, take: system, where: { dimension: [place] } }
              meaning: "the place system whose position stands for it: the first the being states in that system, in `located_at`, its anchors or its `endpoints`, in that order"
            what: { in: prose, meaning: "one line: what the part is for, in this page's words" }
          keyed_by: being
      fields:
        meaning: "which of a being's own facts a card shows, for a being of which kind, from which lens on"
        in:
          entries:
            kind:
              required: "true"
              in: { registry: kinds, take: kind }
              meaning: "the kind of the beings whose cards show it"
            fact:
              required: "true"
              in: { pattern: "^[a-z][a-z0-9_.-]*$" }
              meaning: "the fact a card shows: a verb of the law (the being's statements of it), a key of the header (`title`, `summary`, `tags`), or a key `details` keeps, or a path into one (`case.opened_on`), or a field of a record held off git that the being points to, by the record's key (`contact.phone`, `intake.level`), or that record itself (`intake`), the words its fields are gathered under; or, with `reading`, the word the reading's part of the card goes by. A statement of the verb that is sealed (`held`), and a record held off git, is shown by the host that holds its store, and only to a reader a grant names it to; every other reader is told where it is kept"
            reading:
              in: { key_of: readings }
              meaning: "a reading of the page (a `reckon` of its bean) that the card shows for its being: given that being as the reading's first input, what it gives is drawn under `label` — read for each card as it is opened, never stored. The books' step with `party` gives a person's account, each account its balance and its lines"
            shown_from:
              required: "true"
              in: { registry: lenses, take: lens }
              meaning: "the first lens that shows it; every deeper lens shows it too"
            label:
              in: prose
              meaning: "what the page calls the fact, in the page's language — a heading for the statements of a verb, a name for a key `details` keeps; absent, the law's word for it, as the reader's language names it"
      monitors:
        meaning: "the monitors a page's live values come from, one entry each. What a monitor watches is its own `reaches` and each target's own `endpoints`; which technology it runs is its own `knowledge` (`uses`), and the asset reads it through its adapter for that technology"
        in:
          entries:
            monitor: { required: "true", in: being, meaning: "the being that collects the values" }
            settings:
              in: { pointer: bean_field_pointer }
              meaning: "where that monitor states what only its technology needs, read by the adapter in the technology's own form: stated, not checked, until a term the law declares carries it"
            note:
              in: prose
              meaning: "optional prose. THE place for it: an entry holds only declared attributes, so a remark is written here and never as a new key"
          keyed_by: monitor
  drawing:
    meaning: "what the page draws, one entry per drawing under the key its drawing module draws it by: the mapping or bean it draws, the story of it in plain words, the question each lens asks, the operate lens's shape and what the shape reads, where its processes and pipes are stated, and where a person may act. A value named in it is a key of `view_bindings` on the same page"
    replaces: [views, view_bindings]
    attrs:
      label: { in: prose, meaning: "its name on the page; absent, the title of what it draws" }
      purpose: { required: "true", in: prose, meaning: "what it guarantees, in one sentence" }
      outcome: { required: "true", in: prose, meaning: "what is true when it works" }
      stages:
        required: "true"
        meaning: "three to five stages in the order work flows, each in plain words, with the beings that do it and the technologies it uses"
        in:
          entries:
            label: { required: "true", in: prose, meaning: "the stage, in a few words" }
            doer: { required: "true", in: prose, meaning: "who or what does it" }
            beings: { in: { entries: { being: { required: "true", in: being } } }, meaning: "the beings that do it" }
            uses:
              in: { entries: { technology: { required: "true", in: { registry: technology, take: code } } } }
              meaning: "the technologies it uses, each opening its own documentation"
      questions:
        required: "true"
        meaning: "the question this drawing asks at each lens, in its own words; a lens it names none for asks the lens's own"
        in:
          entries:
            lens: { required: "true", in: { registry: lenses, take: lens } }
            ask: { required: "true", in: prose }
          keyed_by: lens
      processes:
        in: { pointer: bean_field_pointer }
        meaning: "inspect: where the processes of what it draws are stated — a field of a being, read as the being states it"
      pipes:
        in: { pointer: bean_field_pointer }
        meaning: "inspect: where the pipes between those processes are stated, likewise"
      actions:
        meaning: "where a person may act: the drawn element a button sits on and the tool it asks the host for. What a tool runs is the host's, never the ledger's"
        in:
          entries:
            element:
              required: "true"
              in: { type: kebab }
              meaning: "the drawn element the button sits on, by the id its drawing gives it"
            tool:
              required: "true"
              in: { type: kebab }
              meaning: "the tool, by the name the host's own configuration gives it"
            confirm: { in: prose, meaning: "what the button asks before it runs" }
            acts_on: { in: being, meaning: "the being it acts on, where that is not the element's" }
            inputs:
              meaning: "what the tool is given beyond who pressed, the moment and the being acted on, which the host always hands it: each value by name, with its `origin` as a reading's inputs state it (`selection_form.inputs`) — the clock, read by the reader; any other, a value the person pressing types"
              in:
                entries:
                  name: { required: "true", in: { type: kebab } }
                  origin:
                    required: "true"
                    in: origin
                    meaning: "`{act: read, nature: soma, by: reader}`, the clock; any other, a value the person pressing gives"
                  type: { in: { registry: types, take: type }, meaning: "the form of a value given: a day (`position`) read in the reader's calendar; a file (`file`) the person chooses on their machine" }
                  quantity:
                    in: { registry: quantities, take: quantity }
                    meaning: "the quantity a value given measures"
                  of:
                    in: prose
                    meaning: "where a value given is chosen from, and nothing else is taken: a reading this page declares, by its id (its members, each by its title, those the reader may read), or a scheme the garden knows, `scheme:<name>` (its rows, each by its name in the reader's language; a row others sit beneath is a heading, never chosen; a value `<scheme>:<code>`)"
                  many:
                    in: ["true"]
                    meaning: "several values of it, a list: each one as the input asks"
                  beside:
                    in: { type: kebab }
                    meaning: "a list given row by row beside another list of this action: both `many`, this one beside the other, which is beside none — the page draws them as one table, a row each, and the tool is handed the two lists aligned, of one length (a person beside their share)"
                  optional:
                    in: ["true"]
                    meaning: "a value the person pressing may leave empty, where empty has a meaning the tool states (no note, no cost centre, today's day): left empty, the tool is given no value of that name, never an empty one. Never an input filled `from` the element, nor the clock's: a tool cannot run without them. Absent, the input is asked, and a run is not started without it"
                  from:
                    in: { type: field_path }
                    meaning: "filled by the host from the element the button sits on, never asked of the person: `self`, the element's own (the being of a table's line or a sheet; `<bean>#<id>`, the statement of a sheet's row), or a path into it (`of.unit`)"
                  note: { in: prose }
                keyed_by: name
            reason:
              in: [asked]
              meaning: "asked — the person pressing states a reason, which the host's audit records"
            every:
              in: recurrence
              meaning: "a schedule: the host runs it at each occurrence (`view run-scheduled`), as `answered_by`"
            answered_by:
              in: { being: { kind: [person, org] } }
              meaning: "with `every`: who answers for what it does when nobody presses — the actor its grant is asked for"
            note:
              in: prose
              meaning: "optional prose. THE place for it: an entry holds only declared attributes, so a remark is written here and never as a new key"
      archetype:
        required: "true"
        in: { registry: archetypes, take: archetype }
        meaning: "operate: the shape its vital sign is drawn in. The facts propose one (`view_archetypes` `frame` and `reads`); the page may choose another"
      aspect:
        in: { registry: aspects, take: aspect }
        meaning: "cursor: the aspect the board shows first, a row of `aspects` of a profile the garden takes; absent, the first its cursor's kind is shown in"
      cursor:
        in: being
        meaning: "cursor: the being or beings it is kept on, a list; a being kept only in a store by its pointer (`store:<kind>:<id>`)"
      frame:
        in: { registry: lines, take: line, where: { figure: [sequence] } }
        meaning: "the line the drawing is laid out along — place (a map, a room, a rack), time (a timeline), routine or walk (its steps, a course), ordinal (a line) — and so what stands where in it; absent, placed by hand"
      axes:
        meaning: "where each order runs on the drawing, written as one mapping, `{ inline: time }`: per axis of the drawing, the order that runs along it, a row of `orientations` that runs on that axis — so an order is never laid on an axis its row does not take (a magnitude runs up, never along the reader's line). widgets/direction.js lays the drawing out from it. Absent, its archetype's own (`archetypes` `axes`)"
        in:
          entries:
            inline:
              in: { registry: orientations, take: order, where: { axis: [inline] } }
              meaning: "the order that runs along the reader's line, from its start to its end, turning with the script"
            block:
              in: { registry: orientations, take: order, where: { axis: [block] } }
              meaning: "the order that runs down the page, one line after another"
            vertical:
              in: { registry: orientations, take: order, where: { axis: [vertical] } }
              meaning: "the order that runs up the page, the body's own up, which never turns with the script"
            map:
              in: { registry: orientations, take: order, where: { axis: [map] } }
              meaning: "the order a map is laid out in: north up and east right, whatever the reader's script"
      span:
        in: extent
        meaning: "timeline: how far it reaches on each side of the day it is read on, a length on `time` (`measure`); a repetition is walked within it and never beyond. Absent, six weeks on each side: a month's grid and the weeks around it. table of a chart: how far back from the day it is read on the period reaches, what came before it each account's opening; absent, the books from their first day"
      chart:
        in: { registry: knowledge_schemes, take: scheme }
        meaning: "table: or the codes of a chart — a scheme naming the accounting profile's form `chart` — in the chart's order, one line each: an account of the books of the being the drawing draws, as the profile's asset reads them"
      layouts:
        in: [week, month, list]
        meaning: "timeline: the readings of its one line a reader switches between — week (each day a timeline of its hours), month (a grid of weeks), list (a line for each day that holds something) — the first listed shown first; absent, all three, week first"
      nodes:
        in: [parties, gardens]
        meaning: "flows: what its nodes are. parties — the parties to the agreements its `selection` holds (absent, every agreement here), and per currency an arrow from the one who owes to the one owed, netted as bin/ledger.py nets it | gardens — the garden and each other garden it records, and an arrow for what went from one to the other: what it took from it (`take`), what it proposed to it (`propose`), what passed to or from another garden (`pass`)"
      new:
        in: { registry: kinds, take: kind }
        meaning: "the kinds of being a reader may make from this drawing: each opens as an empty sheet of its kind, whose first Save mints the bean's id — an opaque `p-<8 hex>` for a person, kept so until they give their word — and writes it whole. The page's `fields` says which facts a sheet of the kind shows"
      opens:
        meaning: "zoom: a drawn element that opens a drawing of its own — another drawing of the page, or, with no `view`, a DETAIL of this one: the region a boundary draws, at a larger scale, as a technical drawing's detail view is. A lens holds its limit by opening a part, never by crowding it"
        in:
          entries:
            element:
              required: "true"
              in: { type: kebab }
              meaning: "the drawn element, by the id its drawing gives it: a part, or, for a detail, a boundary"
            view:
              in: { key_of: drawings }
              meaning: "the drawing it opens; absent, the element is a boundary that opens as a detail of this drawing"
      blind:
        required: "true"
        meaning: "what the page cannot see of it, and why: never omitted"
        in: { entries: { what: { required: "true", in: prose }, why: { in: prose } } }
      notes:
        in: { entries: { note: { required: "true", in: prose } } }
        meaning: "operate: a line the person on call reads under the shape"
      fill: { in: { key_of: values }, meaning: "reservoir: how full it is" }
      thresholds:
        in:
          entries: { fullness: { required: "true", in: { quantity: ratio } }, label: { required: "true", in: prose } }
        meaning: "reservoir: the marks on its scale, as a share of the whole, and what each does"
      forecast: { in: { key_of: values }, meaning: "reservoir: how long until the next threshold" }
      also:
        in: { entries: { bind: { required: "true", in: { key_of: values } } } }
        meaning: "reservoir: what else fills it"
      parts:
        in: { entries: { bind: { required: "true", in: { key_of: values } } } }
        meaning: "the values of the parts beneath the shape: the evidence"
      lanes:
        in:
          entries:
            label: { required: "true", in: prose }
            hops:
              required: "true"
              in:
                entries: { label: { required: "true", in: prose }, bind: { required: "true", in: { key_of: values } } }
        meaning: "lanes: each path, and the hops it must get through in order"
      per_item: { in: { key_of: values }, meaning: "roster, gauges: the live-series that gives one value per item" }
      active_over:
        in: { type: count }
        meaning: "roster: in that value's unit, the value from which an item counts as active"
      top: { in: { type: count }, meaning: "roster: how many items are shown" }
      min: { in: { type: count }, meaning: "gauges: in that value's unit, the low end of each dial" }
      max: { in: { type: count }, meaning: "gauges: in that value's unit, the high end of each dial" }
      facts:
        in: { entries: { bind: { required: "true", in: { key_of: values } } } }
        meaning: "board: the headline numbers"
      members:
        in:
          entries:
            label: { required: "true", in: prose }
            binds: { in: { entries: { bind: { required: "true", in: { key_of: values } } } } }
            fact: { in: { key_of: values } }
            why: { in: prose }
            being: { in: being }
        meaning: "board: its parts, each with the values that say its state, one fact, and why an unmeasured part is not measured"
      numbers:
        in: { entries: { bind: { required: "true", in: { key_of: values } } } }
        meaning: "scoreboard, funnel, race: the headline numbers"
      list: { in: { key_of: values }, meaning: "scoreboard: the live-series of what is firing" }
      funnels:
        in:
          entries:
            label: { required: "true", in: prose }
            stages:
              required: "true"
              in:
                entries:
                  label: { required: "true", in: prose }
                  tally: { in: { key_of: values } }
                  selection:
                    in: { key_of: readings }
                    meaning: "or a reading of the page whose members are counted: a walk's step (`at_step`)"
                  counts: { in: prose }
                  what: { in: prose }
                  stops:
                    in:
                      entries:
                        label: { required: "true", in: prose }
                        bind: { required: "true", in: { key_of: values } }
                        what: { in: prose }
                  marks:
                    in:
                      entries:
                        label: { required: "true", in: prose }
                        bind: { required: "true", in: { key_of: values } }
                        what: { in: prose }
                one_of: [tally, selection]
                at_most_one_of: [[tally, selection]]
        meaning: "funnel: each stream, its stages in order with how many reached each — a live value, or the members of a reading — and what each counts, and where the rest stopped or were marked"
      window: { in: prose, meaning: "funnel: the span its counts cover, in words" }
      rollcall:
        in:
          entries:
            label: { required: "true", in: prose }
            per_item: { required: "true", in: { key_of: values } }
            idle: { in: { entries: { member: { required: "true", in: any } } } }
            notes: { in: { prose: named } }
        meaning: "funnel: the parts called by name, each up or down, and the items known to carry nothing"
      selection:
        in: { key_of: readings }
        meaning: "table: the members it lists, one line each — a reading of the page's own `selections`"
      series:
        in: { pointer: bean_field_pointer }
        meaning: "table: or the positions of one of a being's `series` (`{bean, field}`), one line each"
      columns:
        in:
          entries:
            label: { required: "true", in: prose }
            path:
              in: { type: field_path }
              meaning: "a path in each member, or a channel of the series, or a figure of an account of the chart: `code`, `name`, `element`, `opening`, `debit`, `credit`, `balance`"
            stands:
              in: bean_id
              meaning: "instead of `path`: a walk, a being of the garden whose `step`s are its steps — the member's course on it, drawn by the archetype `course` in one line"
          one_of: [path, stands]
        meaning: "table: a column per path, or per walk a course of each member is on"
      writes:
        in:
          entries:
            verb:
              in: { registry: verbs, take: verb }
              meaning: "a verb of the law: its form is derived each time from the verb's row — each role and qualifier drawn by the widget of its shape, what is `required` and the row's default from the row — and the statement it adds is written as a sheet's Save writes one"
            preset:
              in: any
              meaning: "with `verb`: roles the form fills itself, by the verb's own role names (`{ through: card }`), which the person writing does not change"
            term:
              in: { pattern: "^[a-z][a-z0-9_]*$" }
              meaning: "in today's words: a term whose entry the form adds"
            attrs:
              in: { entries: { attr: { required: "true", in: { type: kebab } } } }
              meaning: "with `term`: the attributes the form asks for"
          one_of: [verb, term]
        meaning: "an entry form: a statement of a verb of the law, added to the being the drawing draws, or to a new being of its `new`, by the one write path a sheet's Save takes — or, in today's words, an entry of a term for those attributes, built from the law's form of it. Saved through bin/save.py with the reader's being as `<who>`, after `write` is granted them; the gate judges it as any other commit"
      renders:
        in:
          entries:
            template: { required: "true", in: { pointer: bean_field_pointer } }
            selection: { in: { key_of: readings } }
        meaning: "a template of the garden (`file:<path>`) rendered from each member of a reading (`selection`; absent, the being drawn) into a document; once kept, a `document` bean with its `content_hash`"
      feed:
        in: { entries: { selection: { required: "true", in: { key_of: readings } }, notice: { in: extent } } }
        meaning: "a calendar export (RFC 5545) of a reading's members, each at its `timing` or its clause's due, a notice `notice` before; every export is a pass the host audits"
      step_at:
        in: { key_of: values }
        meaning: "race: the value that says which step of the procedure the run is at — 0 before the first, n at the n-th of its `steps`"
      elapsed: { in: { key_of: values }, meaning: "race: how long it has run" }
      deadline: { in: extent, meaning: "race: how long after its start it must be done — a length on `time`" }
      deadline_from:
        in: { key_of: values }
        meaning: "race: the value that says when it must be done, where that moves"
      eta: { in: { key_of: values }, meaning: "race: how long it still needs" }
      progress: { in: { key_of: values }, meaning: "race: how much of it is done, as a share of the whole" }
      checkpoints:
        in: { entries: { after: { required: "true", in: extent }, label: { required: "true", in: prose } } }
        meaning: "race: marks on its time bar, each a length after its start"
      correlate:
        meaning: "any shape: values drawn on one time axis, so what moves together is seen together"
        in:
          entries:
            title: { in: prose }
            traces:
              required: "true"
              in: { entries: { bind: { required: "true", in: { key_of: values } } } }
              meaning: "the values drawn, one trace each"
            span: { in: extent, meaning: "how far back the axis reaches — a length on `time`" }
            every: { in: recurrence, meaning: "how often a point is taken — every N units along `time`" }
            band: { in: { key_of: values }, meaning: "a step value (as `step_at`) that shades every trace" }
            relate:
              in:
                entries:
                  across: { required: "true", in: { key_of: values } }
                  measure: { required: "true", in: { key_of: values } }
                  bins: { in: { type: count } }
                  at_step: { in: { type: count } }
                  keep: { in: [all, positive] }
              meaning: "one value's mean across the bins of another, over the time drawn: only while the band is at `at_step` where it names one, and `positive` keeps the moments it is above zero"
      values:
        meaning: "the live values the page draws, each under a key the views name it by: which drawing and which of its elements it sits on, what kind of value it is, its unit and limits, and how each technology computes it. A value is read when the page is drawn, and never stored. Each is named once on its page, and sits on the drawing that holds it"
        in:
          map_of:
            element:
              required: "true"
              in: { type: kebab }
              meaning: "the drawn element it sits on, by the id its drawing gives it"
            live:
              required: "true"
              in: [live-state, live-value, live-series]
              meaning: "live-state — whether the being answers, as its monitor reaches it | live-value — one number | live-series — many, each an item"
            being: { in: being, meaning: "the being a live-state reads; absent, the being the element depicts" }
            label: { in: prose, meaning: "its name on the page; absent, the element's" }
            short: { in: prose, meaning: "its name where room is short" }
            unit: { in: { registry: units, take: unit }, meaning: "absent, a bare number" }
            warn: { in: { type: count }, meaning: "in its unit, the value from which it warns" }
            crit: { in: { type: count }, meaning: "in its unit, the value from which it is critical" }
            item_names: { in: { prose: named }, meaning: "live-series: the page's name for an item, under the item" }
            signal:
              in: { registry: signals, take: signal }
              meaning: "what it measures, by the name the signal is published under: each source adapter asks it in its own language, so a `query` is written only where none can"
            query:
              meaning: "how each technology computes it, in that technology's own language, one entry per technology; its adapter refuses what it cannot read"
              in:
                entries:
                  technology: { required: "true", in: { registry: technology, take: code } }
                  says: { required: "true", in: any, meaning: "the query, in the technology's own language" }
                  items_by:
                    in: any
                    meaning: "live-series: what tells its items apart, in the technology's own terms"
                keyed_by: technology
            note:
              in: prose
              meaning: "optional prose. THE place for it: an entry holds only declared attributes, so a remark is written here and never as a new key"
          key_form: kebab
          cells:
            - when: { live: live-value }
              requires: [[query, signal]]
              why: "a number is computed by a monitor: asked in its language, or named by its published signal"
            - when: { live: live-series }
              requires: [[query, signal]]
              why: "a series is computed by a monitor: asked in its language, or named by its published signal"
    cells:
      - when: { archetype: reservoir }
        requires: [fill, thresholds]
        why: "a reservoir answers with how full it is against its thresholds"
      - { when: { archetype: lanes }, requires: [lanes], why: "lanes answer with each path" }
      - { when: { archetype: roster }, requires: [per_item], why: "a roster answers with the value of its items" }
      - { when: { archetype: gauges }, requires: [per_item], why: "gauges answer with the value of their items" }
      - { when: { archetype: board }, requires: [members], why: "a board answers with its parts" }
      - { when: { archetype: scoreboard }, requires: [numbers], why: "a scoreboard answers with its numbers" }
      - { when: { archetype: funnel }, requires: [funnels], why: "a funnel answers with its streams" }
      - { when: { archetype: race }, requires: [step_at], why: "a race answers with the step the run is at" }
      - when: { archetype: race }
        expects: [elapsed]
        why: "without how long it has run, the bar against the deadline cannot be drawn"
      - { when: { archetype: table }, requires: [columns], why: "a table answers with a column per path" }
      - { when: { archetype: timeline }, requires: [selection], why: "a timeline places the members of a reading at their moments" }
      - when: { archetype: flows }
        requires: [nodes]
        why: "flows answer with who owes whom, read from the ledger, or with what passed between gardens"
  reader_preferences:
    meaning: "a reader's own way of reading, written as a bean to keep or to carry to another machine: held by a `draw` of the bean whose `of` is the reader (`preferences`). It is kept with the reader's account on the host they read on — that host's own file is its source, never a garden — and a bean of it is a file a person carries, which a garden holds only where a person puts it there. A preference not given is not held: the language's own stands for it"
    attrs:
      garden:
        in: { type: kebab }
        meaning: "the garden they were set in, by its id (`python3 bin/propose.py id`, twelve hexadecimal digits), where the host keeps a reader's preferences garden by garden; absent, the host's one garden"
      locale:
        in: { type: locale_tag }
        meaning: "their language, its calendar, the first day of their week, their hour cycle, their digits and the zone they read moments in: one tag"
      date:
        in: { registry: date_styles, take: style }
        meaning: "how a day is written for them"
      currency:
        in: { registry: currency_displays, take: display }
        meaning: "how a currency is named for them"
  lenses: { lens: required, depth: required, form: required, max: required, meaning: required }
  archetypes: { archetype: required, meaning: required, when: required, frame: optional, reads: optional, axes: optional }
  orientations: { order: required, of: required, axis: required, sense: required, follows: required, commands: optional, meaning: required }
  aspects: { aspect: required, home: required, follows: required, points: required, order: required, of: required, meaning: required }
  planes: { plane: required, meaning: required }
  keeping_properties: { property: required, meaning: required }
  layout_slots: { slot: required, meaning: required, forms: optional }
  risks: { risk: required, meaning: required, resolved_by: required }
  elements: { element: required, sense: required, meaning: required }
  account_roles: { role: required, meaning: required }
  date_styles: { style: required, meaning: required }
  currency_displays: { display: required, meaning: required }
  profiles:
    profile: required
    meaning: required
    verbs: optional
    tables: optional
    forms: optional
    adds: optional
    asset: optional
    went: required
    vacancies: optional
    dropped: optional
