# The frame of places: the bodies (IAU, IUGG) and the reference systems fixed to them (EPSG, ISO 19111), with their
# kinds and frames.
# These rows are the law itself: a change to them is a RULE-CHANGE, made here.
bodies:
  - { body: earth, mean_radius_m: "6371008.8", gm_m3_s2: "398600441800000", authority: "IUGG / IERS; GM: WGS 84 (NGA)", meaning: "the Earth" }
  - { body: moon, mean_radius_m: "1737400.0", authority: "IAU WGCCRE", meaning: "the Moon" }
  - { body: mars, mean_radius_m: "3389500.0", authority: "IAU WGCCRE", meaning: Mars }
reference_system_kinds:
  - { kind: geographic-2d, meaning: "latitude and longitude on a body's ellipsoid or sphere" }
  - { kind: geographic-3d, meaning: "latitude, longitude and height above the ellipsoid" }
  - { kind: geocentric, meaning: "X, Y, Z from the body's centre of mass" }
  - { kind: projected, meaning: "a plane: the body's curved surface flattened by a named projection, in metres" }
  - { kind: vertical, meaning: "a height or depth alone, against a named surface" }
  - { kind: engineering, meaning: "a local frame fixed to a structure or a vehicle, moving with it" }
  - kind: compound
    meaning: "systems together: a horizontal and a vertical one, or a spatial and a temporal one — the frame's two halves in one (ISO 19111:2019)"
reference_frames:
  - { frame: static, meaning: "fixed to a tectonic plate (or to a body with none): ground keeps its coordinates" }
  - { frame: dynamic, meaning: "fixed to the whole body: ground drifts in it, and a coordinate needs its epoch" }
reference_systems:
  - crs: "EPSG:4326"
    body: earth
    kind: geographic-2d
    frame: dynamic
    axes: [lat, lon]
    ensemble_accuracy: { count: 2, unit: metre }
    meaning: "WGS 84, latitude and longitude in degrees — what a satellite receiver reports — an ENSEMBLE of realisations, accurate to 2 m as EPSG states: no motion finer than that is read from it"
  - crs: "EPSG:4979"
    body: earth
    kind: geographic-3d
    frame: dynamic
    axes: [lat, lon, h]
    meaning: "WGS 84 with ellipsoidal height in metres. Ellipsoidal height is NOT height above sea level"
  - crs: "EPSG:4978"
    body: earth
    kind: geocentric
    frame: dynamic
    axes: [x, y, z]
    meaning: "WGS 84 geocentric: metres from the Earth's centre of mass"
  - crs: "EPSG:4258"
    body: earth
    kind: geographic-2d
    frame: static
    axes: [lat, lon]
    meaning: "ETRS89: fixed to the Eurasian plate, so European ground keeps its coordinates. It and WGS 84 drift apart by about 2.5 cm a year"
  - crs: "EPSG:3857"
    body: earth
    kind: projected
    frame: dynamic
    axes: [x, y]
    meaning: "Web Mercator: the plane nearly every web map is drawn on. For DRAWING; distances in it are wrong away from the equator"
  - crs: "EPSG:32639"
    body: earth
    kind: projected
    frame: dynamic
    axes: [e, n]
    meaning: "WGS 84 / UTM zone 39N: metres on a plane, good within its six-degree zone. One of sixty; named because a projected system is where metres are honest"
  - crs: "EPSG:5773"
    body: earth
    kind: vertical
    frame: static
    axes: [H]
    surface: equipotential
    meaning: "EGM96 height: metres above the geoid, which is what `above sea level` means"
  - crs: "EPSG:9990"
    body: earth
    kind: geographic-2d
    frame: dynamic
    axes: [lat, lon]
    frame_epoch: "2015.0"
    meaning: "ITRF2020: the realisation plate motion is published in"
  - crs: "IAU_2015:30100"
    body: moon
    kind: geographic-2d
    frame: static
    axes: [lat, lon]
    meaning: "the Moon (2015), planetocentric latitude and longitude on a sphere"
  - crs: "IAU_2015:49900"
    body: mars
    kind: geographic-2d
    frame: static
    axes: [lat, lon]
    meaning: "Mars (2015), planetocentric latitude and longitude on a sphere"
forms:
  bodies: { body: required, mean_radius_m: required, gm_m3_s2: optional, authority: required, meaning: required }
  reference_system_kinds: { kind: required, meaning: required }
  reference_frames: { frame: required, meaning: required }
  reference_systems:
    crs: required
    body:
      required: "true"
      in: { registry: bodies, take: body }
      why: "a reference system is fixed to a body, and a latitude is a latitude ON something"
    kind: { required: "true", in: { registry: reference_system_kinds, take: kind }, why: "the classes ISO 19111 names" }
    frame:
      required: "true"
      in: { registry: reference_frames, take: frame }
      why: "static or dynamic: whether a coordinate needs an epoch"
    axes: required
    ensemble_accuracy: optional
    meaning: required
    frame_epoch: optional
    surface:
      in: [equipotential, geometric]
      why: "a vertical system's height is against an equipotential (the geoid: gravitation's ordering of above and below) or against a geometric surface (the ellipsoid: the frame's); a height above sea level is the first"
