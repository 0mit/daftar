# The forms of a line (v1 part 6): what a series holds along its line, how a walk goes at a step, and the steps of a
# reading, each held by a statement of its verb (`record`, `step`, `reckon`) in one qualifier of the shape `form`; and
# the grammar a reading is read in — its closed list of operations, the comparisons a condition names (by the core's
# Unicode sign where it has one), the aggregates, the ordering keys and a pin's form.
# These rows are the law itself: a change to them is a RULE-CHANGE, made here.
operations:
  - op: select
    gives: set
    takes:
      kind: { in: { registry: kinds, take: kind }, meaning: "the beans of this kind" }
      of: { in: { type: kebab }, meaning: "or the members of an earlier step's set" }
      entries:
        in: { type: field_path }
        meaning: "the entries at this path of each bean selected, instead of the beans"
      where:
        in: any
        meaning: "conditions, each `{path: <field_path>, <comparator>: <operand>}`; a member is selected when it meets every one (`comparators`)"
      store:
        in: { type: kebab }
        meaning: "the beings of the kind kept in a store as well: one the host declares by its name (`details.stores.<name>`), or `any`, every store it declares — each read in one snapshot. A reading that names one is read only where a host keeps it; the gate, which reads no store, never reads it"
    meaning: "the beans, or their entries, that meet every condition — and, with `store`, the beings and statements a store keeps, one universe with the beans"
  - op: intersect
    gives: set
    takes: { of: { required: "true", in: { type: kebab } }, with: { required: "true", in: { type: kebab } } }
    meaning: "the members of both sets"
  - op: union
    gives: set
    takes: { of: { required: "true", in: { type: kebab } }, with: { required: "true", in: { type: kebab } } }
    meaning: "the members of either set"
  - op: minus
    gives: set
    takes: { of: { required: "true", in: { type: kebab } }, with: { required: "true", in: { type: kebab } } }
    meaning: "the members of the first set that are not in the second"
  - op: count
    gives: value
    takes: { of: { required: "true", in: { type: kebab } } }
    meaning: "how many members a set holds — per group, of groups — in the unit `item`"
  - op: sum
    gives: value
    takes: { of: { required: "true", in: { type: kebab } }, path: { required: "true", in: { type: field_path } } }
    meaning: "the quantities at the path of every member added, exactly, by exact conversion within one quantity; a member whose value is not a quantity is named, and the sum is refused. Per group, of groups"
  - op: min
    gives: value
    takes: { of: { required: "true", in: { type: kebab } }, path: { required: "true", in: { type: field_path } } }
    meaning: "the least value at the path, and the member that holds it"
  - op: max
    gives: value
    takes: { of: { required: "true", in: { type: kebab } }, path: { required: "true", in: { type: field_path } } }
    meaning: "the greatest value at the path, and the member that holds it"
  - op: order
    gives: order
    takes:
      of: { required: "true", in: { type: kebab } }
      path: { required: "true", in: { type: field_path } }
      direction: { in: [ascending, descending] }
    meaning: "the members in the order of the value at the path, ascending unless it says; ties in the order of their ids"
  - op: group
    gives: groups
    takes:
      of: { required: "true", in: { type: kebab } }
      path: { required: "true", in: { type: field_path } }
      level: { in: { type: kebab } }
      system: { in: { registry: systems, take: system, where: { dimension: [time] } } }
      gap: { in: { quantity: duration } }
    meaning: "the members grouped by the value at the path — or, with `level` and `system`, by the cell of that level the moment at the path falls in, read in the reading's `zone`; or, with `gap`, in the order of the moment at the path, a new group wherever the time from one member to the next is longer than the gap, a member with no moment at the path in none and named"
  - op: some
    gives: truth
    takes: { of: { required: "true", in: { type: kebab } }, where: { in: any } }
    meaning: "whether some member meets every condition"
  - op: all
    gives: truth
    takes: { of: { required: "true", in: { type: kebab } }, where: { in: any } }
    meaning: "whether every member meets every condition; of no members, true"
  - op: not
    gives: truth
    takes: { of: { required: "true", in: { type: kebab } } }
    meaning: "the truth reversed; NOT KNOWN stays not known"
  - op: compare
    gives: truth
    takes:
      of: { required: "true", in: { type: kebab } }
      with: { required: "true", in: { type: kebab } }
      is: { required: "true", in: [less, at-most, equal, at-least, greater] }
      band: { in: { quantity: any }, meaning: "with `is: equal`: how far apart they may be and still be equal" }
    meaning: "whether two values stand as `is` says, exactly, by exact conversion within one quantity. With `band`: equal when |Δ| ≤ band and the difference is RESOLVABLE — k·u(Δ) ≤ band, k the law's `compatibility.multiple` — and NOT KNOWN when |Δ| ≤ band and it is not"
  - op: read
    gives: value
    takes: { of: { in: { type: kebab } }, path: { required: "true", in: { type: field_path } } }
    meaning: "the one value at the path — of the one member of an earlier set, or of the bean the reading is read from — with its u; refused when the path holds none or several"
  - op: constant
    gives: value
    takes: { value: { required: "true", in: { quantity: any } } }
    meaning: "a value the reading states: a band, a limit, an allowance — with its u where it has one"
  - op: difference
    gives: value
    exact: "true"
    u_rule: absolute
    takes: { of: { required: "true", in: { type: kebab } }, with: { required: "true", in: { type: kebab } } }
    meaning: "the first less the second, one quantity"
  - op: multiply
    gives: value
    exact: "true"
    u_rule: relative
    takes:
      of: { required: "true", in: { type: kebab } }
      with: { in: { type: kebab } }
      coefficient: { in: { type: kebab }, meaning: "a row of `coefficients`" }
      count: { in: { type: count } }
    meaning: "the product of the first and one of `with`, `coefficient` or `count`; its quantity is the product of theirs"
  - op: divide
    gives: value
    exact: "true"
    u_rule: relative
    takes: { of: { required: "true", in: { type: kebab } }, with: { required: "true", in: { type: kebab } } }
    meaning: "the first over the second"
  - op: power
    gives: value
    exact: whole
    u_rule: relative
    takes: { of: { required: "true", in: { type: kebab } }, exponent: { required: "true", in: { type: count } } }
    meaning: "the value to a power: exact for a whole exponent, ≈ otherwise"
  - op: square-root
    gives: value
    exact: "false"
    u_rule: relative
    takes: { of: { required: "true", in: { type: kebab } } }
    meaning: "the square root, ≈ unless the value is the square of one"
  - op: exp
    gives: value
    exact: "false"
    u_rule: derivative
    takes: { of: { required: "true", in: { type: kebab } } }
    meaning: "e to the power of a number with no dimension: a model fitted in logarithms, ≈"
  - op: ln
    gives: value
    exact: "false"
    u_rule: derivative
    takes: { of: { required: "true", in: { type: kebab } } }
    meaning: "the natural logarithm of a positive number with no dimension, ≈"
  - op: convert
    gives: value
    exact: "true"
    u_rule: relative
    takes:
      of: { required: "true", in: { type: kebab } }
      unit: { required: "true", in: { registry: units, take: unit } }
    meaning: "the value in another unit of its quantity, exactly"
  - op: lookup
    gives: value
    exact: "true"
    u_rule: row
    takes:
      coefficient: { required: "true", in: { type: kebab } }
      where: { required: "true", in: { type: field_path }, meaning: "the code that selects the row" }
    meaning: "the row of `coefficients` a code selects, with its own u"
  - op: elapsed
    gives: value
    exact: "true"
    u_rule: resolution
    takes:
      of: { required: "true", in: { type: kebab } }
      with: { required: "true", in: { type: kebab } }
      unit: { required: "true", in: { registry: units, take: unit } }
    meaning: "the extent from the second position to the first, of one time system; its u from the resolutions they were written to"
  - op: choose
    gives: value
    exact: per-row
    u_rule: per-row
    takes:
      computes: { required: "true", in: { type: kebab }, meaning: "the property code a row of `mechanisms` computes" }
      of: { in: { type: kebab }, meaning: "the being it is read for: an earlier set of one" }
    meaning: "the mechanism whose `valid` covers the case, and of those the one with the smaller validated error; the others print as the spread. None covers it: refused, saying why"
  - op: rotate
    gives: value
    exact: "false"
    u_rule: derivative
    takes:
      pole: { required: "true", in: { type: kebab }, meaning: "the pole's rows of `coefficients`" }
      of: { required: "true", in: { type: kebab } }
    meaning: "the velocity, east and north, of a point on a body turning about an axis"
  - op: position-to
    gives: value
    exact: "false"
    u_rule: derivative
    takes:
      of: { required: "true", in: { type: kebab } }
      system: { required: "true", in: { registry: systems, take: system, where: { dimension: [place] } } }
    meaning: "a position in another reference system; refused where PROJ is absent"
  - op: within
    gives: set
    exact: "true"
    u_rule: none
    takes:
      of: { required: "true", in: { type: kebab } }
      path: { required: "true", in: { type: field_path } }
      extent: { in: extent }
      place: { in: any }
    meaning: "the members whose position or moment at the path lies within the extent, or the place"
  - op: books
    gives: groups
    exact: "true"
    u_rule: none
    takes:
      to: { required: "true", in: { type: position }, meaning: "the day the books are read through: a day, or an input naming one — the reader's clock, read as it is asked" }
      chart: { in: { registry: knowledge_schemes, take: scheme }, meaning: "the chart; absent, the garden's one chart" }
      entity: { in: { type: kebab }, meaning: "whose books; absent, the gardener's" }
      party: { in: { type: kebab }, meaning: "one party's part alone: a being the chart holds as a party, or an input or a step naming one — each account that holds parties, what that party holds in it" }
    meaning: "each account's net charge through a day, in an entity's books in a chart — what arrived there less what left, per currency — read from the moves the garden holds by the accounting profile's reader (its asset); with `party`, one party's part of each account that holds parties. A `pin` of a reading whose step is this closes the books through that day: read at the pinned commit, they are fixed, and a move that comes after it with an earlier day is read on the first day after it"
  - op: apportion
    gives: groups
    exact: "true"
    u_rule: none
    takes:
      of: { required: "true", in: { type: kebab } }
      amount: { required: "true", in: { type: field_path } }
      over: { required: "true", in: { type: field_path } }
      per: { in: { type: kebab } }
      level: { in: { type: kebab } }
      digits: { in: ["true", "false"] }
    meaning: "each code's part of the members' amounts: each member's amount (at `amount`) shared over its entries at `over` — by an entry's share of its group's shares, the group being the codes under one ancestor at `per` (the scheme's first level where none is named), or by an entry's own amount — summed per code, or per the code's ancestor at `level`. Exact, in fractions. With `digits: true` each part is written in the currency's decimal places, the cents a split leaves over going to the parts with the largest remainders, the first code first — the one rule, so no two readings round a split two ways"
  - op: ancestor-at-level
    gives: set
    exact: "true"
    u_rule: none
    takes: { of: { required: "true", in: { type: kebab } }, level: { required: "true", in: { type: kebab } } }
    meaning: "each code's ancestor at a level, by its scheme's `parent`"
  - op: neighbour-of
    gives: set
    exact: "true"
    u_rule: none
    takes:
      of: { required: "true", in: { type: kebab } }
      relation: { in: { type: kebab }, meaning: "a registry of relations, rows {from, to, rel}" }
      distance: { in: { quantity: length } }
    meaning: "the codes a relation's `adjacent` rows name beside each, or the beings within a distance (≈)"
  - op: at
    gives: value
    exact: per-channel
    u_rule: ties
    takes:
      series: { required: "true", in: { type: field_path }, meaning: "`<bean>:<term>.<key>`" }
      channel: { in: { type: kebab } }
      position: { required: "true", in: any }
    meaning: "what a channel holds at a position, as the channel says it is read between rows"
  - op: window
    gives: value
    exact: per-channel
    u_rule: absolute
    takes:
      series: { required: "true", in: { type: field_path } }
      channel: { in: { type: kebab } }
      extent: { in: extent }
      by: { in: { registry: aggregates, take: aggregate } }
    meaning: "what a stretch of the line holds: by one of these, or several as groups"
  - op: integral
    gives: value
    exact: "true"
    u_rule: absolute
    takes:
      series: { required: "true", in: { type: field_path } }
      channel: { in: { type: kebab } }
      extent: { in: extent }
      base: { in: any, meaning: "a position on the channel's scale, from which each value is measured" }
    meaning: "the channel summed along the line: a sum's rows added, a point's trapezoids"
  - op: rate
    gives: value
    exact: per-channel
    u_rule: relative
    takes:
      series: { required: "true", in: { type: field_path } }
      channel: { in: { type: kebab } }
      from: { required: "true", in: any }
      to: { required: "true", in: any }
    meaning: "the change over the distance between two positions of the line"
  - op: trend
    gives: value
    exact: "false"
    u_rule: least-squares
    takes:
      series: { required: "true", in: { type: field_path } }
      channel: { in: { type: kebab } }
      extent: { in: extent }
    meaning: "the fitted slope and its u; a slope that does not exceed k·u is never called a motion, and the span that would resolve it is said"
  - op: through
    gives: value
    exact: "true"
    u_rule: ties
    takes:
      series: { required: "true", in: { type: field_path } }
      channel: { in: { type: kebab } }
      position: { required: "true", in: any }
      back: { in: ["true", "false"] }
    meaning: "a position read across a tie series, forward or back, never beyond the outermost ties"
  - op: gaps
    gives: set
    exact: "true"
    u_rule: none
    takes:
      series: { required: "true", in: { type: field_path } }
      channel: { in: { type: kebab } }
      extent: { in: extent }
    meaning: "every stretch holding no value, with its reason"
  - op: travelled
    gives: value
    exact: "false"
    u_rule: derivative
    takes: { series: { required: "true", in: { type: field_path } }, channel: { in: { type: kebab } } }
    meaning: "the length along a channel of positions"
  - op: join
    gives: set
    exact: per-channel
    u_rule: absolute
    takes:
      series: { in: { type: field_path }, meaning: "the first of two series, its `with` the second's path" }
      with: { required: "true", in: any, meaning: "the second: a series' path, with `series`; with `of`, an earlier step's set or an input's" }
      channel: { in: { type: kebab } }
      of: { in: { type: kebab }, meaning: "the first of two sets: an earlier step's, or an input's" }
      "on": { in: any, meaning: "with `of`: the columns that are equal, `{<path of a member of of>: <path of a member of with>}`, each value read as the being it names; a value that is no name — nothing, a list, a `someone` — equals none" }
      keep: { in: [both, matched, unmatched], meaning: "with `of`: each pair that agrees, as one member (`both`, the default); each member of `of` some member of `with` agrees with, once (`matched`); or each that none does (`unmatched`)" }
      as: { in: any, meaning: "with `keep: both`: the two names a pair's members are read under, `[<of's>, <with's>]`" }
    meaning: "two series row by row: agree, compatible (within k·u), differ, or one only; or two sets on equal columns, the members of `of` in their order and, for each, those of `with` in theirs"
  - op: cycle
    gives: set
    exact: "true"
    u_rule: none
    takes:
      of: { required: "true", in: { type: kebab }, meaning: "the members whose edges are judged: an earlier step's set" }
      with: { in: { type: kebab }, meaning: "more edges of the same relation, walked and never judged: a set, or an input said by the law" }
      from: { required: "true", in: any, meaning: "where an edge starts: a path of a member, or a list of paths" }
      to: { required: "true", in: any, meaning: "where it leads: a path of a member, or a list of paths" }
      within: { in: { type: kebab }, meaning: "a set of beans: an edge counts where both its ends are among them" }
    meaning: "the edges of a relation that lie on a loop, with the way round: for each member of `of` and each edge it makes — from each being at `from` to each at `to`, a list read as its items and each a name read as the being it names — the edge whose end leads back to its start by the edges of `of` and `with`, nearest first and each being's next in the order of their names (core/reach.py): the member, with `start` and `next`, the edge's two ends; `way`, the beings from `next` to the last before `start` (`next` alone for an edge to itself); and `loop`, from `start` round to it again. Its proof is the statements and the law's rows that give each edge of the way"
  - op: reach
    gives: set
    exact: "true"
    u_rule: none
    takes:
      of: { required: "true", in: { type: kebab }, meaning: "the members whose starts are read: an earlier step's set" }
      at: { required: "true", in: { type: field_path }, meaning: "each member's start, read as the being it names" }
      through: { required: "true", in: { type: kebab }, meaning: "the relation's edges: an earlier step's set, or an input said by the law" }
      from: { required: "true", in: any, meaning: "where an edge starts: a path, or a list of paths" }
      to: { required: "true", in: any, meaning: "where it leads: a path, or a list of paths" }
    meaning: "what a relation reaches: for each start, itself and every being the edges of `through` lead to from it in one step or more, nearest first — a member each, `start` and `reached`, with `way`, the beings from the start (not itself) to what it reached; each start read once. Its proof is the statements and the law's rows of the way's edges"
  - op: first
    gives: set
    exact: "true"
    u_rule: none
    takes:
      of: { required: "true", in: { type: kebab } }
      by: { required: "true", in: any, meaning: "the paths whose values make a group, each read as the being it names: one path, or a list" }
      groups: { in: [read, values], meaning: "the order the groups are given in: as their first members are read (`read`, the default), or of their values, each name by its characters (`values`)" }
    meaning: "one member of each group of the members whose values at `by` are one: the first in the order the garden is read in — its documents in their order, each document's statements in theirs; the groups in the order `groups` says"
  - op: last
    gives: set
    exact: "true"
    u_rule: none
    takes:
      of: { required: "true", in: { type: kebab } }
      by: { required: "true", in: any, meaning: "the paths whose values make a group, each read as the being it names: one path, or a list" }
      groups: { in: [read, values], meaning: "the order the groups are given in: as their first members are read (`read`, the default), or of their values, each name by its characters (`values`)" }
    meaning: "one member of each group of the members whose values at `by` are one: the last in the order the garden is read in; the groups in the order `groups` says"
  - op: overlap
    gives: set
    exact: "true"
    u_rule: none
    takes:
      of: { required: "true", in: { type: kebab }, meaning: "the members: an earlier step's set" }
      from: { in: { type: field_path }, meaning: "where each member's span starts: one moment, or a day, its start (`describe`'s `<as>.from`)" }
      to: { in: { type: field_path }, meaning: "where it ends: one moment, or a day, its end (`<as>.to`); with `from`, or neither" }
      by: { in: any, meaning: "the paths whose values make a group, each read as the being it names: one path, or a list. Pairs are of one group; a member whose value there is no name is in none" }
      groups: { in: [read, values], meaning: "the order the groups are given in: as their first members are read (`read`, the default), or of their values, each name by its characters (`values`)" }
      first: { in: ["true", "false"], meaning: "with `true`: only the first member of each group is paired, alone with each later one" }
      as: { required: "true", in: any, meaning: "the two names a pair's members are read under, `[<the earlier's>, <the later's>]`" }
    meaning: "the pairs of members whose spans overlap — the one starts before the other ends and ends after it starts — within each group of the members whose values at `by` are one: each pair one member, the earlier and the later under the names of `as`, told at the later's place (where it came to overlap one before it), its proof both members'. A group's members are in the order of their starts, of their ends where they start alike, then as the set holds them; its pairs in that order, the earlier's first. With `first: \"true\"`, only the first is paired, alone with each later one — the first holder of a place compared with each who comes after. A member whose span is not one moment or one day at each path is in no pair. With neither `from` nor `to`, every two members of a group overlap: each holds what it holds at once"
  - op: describe
    gives: set
    exact: "true"
    u_rule: none
    takes:
      of: { required: "true", in: { type: kebab } }
      at: { in: { type: field_path }, meaning: "what is described: the value at this path of each member — a list, each of its items, a member for each; absent, the member itself, a statement" }
      as: { required: "true", in: { type: kebab }, meaning: "the name the built-in columns are read under: `<as>.being`, the being as it is written, and `<as>.kind`, `<as>.nature`, and a column for each line of the ladder but the frame, named by the line — `<as>.matter`, `<as>.organisation`, `<as>.bios`, `<as>.rung`; of a statement, `<as>.bean` (the bean it is written in), `<as>.verb`, `<as>.index`, `<as>.place` (`<bean>[<i>] <verb>`, where a refusal is told) and `<as>.id`; of a position, `<as>.system`, `<as>.point` and `<as>.from` and `<as>.to`" }
    meaning: "each member with the built-in columns of a being, read from the law: its kind — a bean's own, a being's a store keeps, a `someone`'s — its kind's nature, and the position its kind holds on each line of the ladder but the frame, where it holds one; none for what names no being (the crown, `unknown`, a word). Of a statement — the member itself, or a value naming one by its id in the bean it is written in or as `<bean>#<id>` — the columns of that statement; none for what names no statement. Of a position — a value that names no being and no statement, read in a declared system (rule frame) — its columns: its system; `point`, `\"true\"` where it names a point (its system `covers` one) and `\"false\"` where an area, which holds many; and its span, `from` and `to`, to the moment — a moment itself, a day the whole of it, an extent from its start to the end of its end — each written as a moment in UTC to the millisecond, none for a position that is no time; none for `now`, `unknown` and what no system reads"
  - op: weigh
    gives: groups
    exact: "false"
    u_rule: none
    takes: { weighing: { required: "true", in: { key_of: weighings } } }
    meaning: "the weights of a weighing's criteria (the principal eigenvector) and its consistency ratio"
  - op: axes
    gives: groups
    exact: "false"
    u_rule: none
    takes:
      of: { required: "true", in: { type: kebab }, meaning: "the members: beings, each read with what it needs, what needs it and what it meets" }
      weighing: { in: { key_of: weighings }, meaning: "the judge's weighing of the three axes, its criteria `feasibility`, `efficiency` and `necessity`; absent, each axis is said alone and no member is marked" }
    meaning: "each member read on three axes, each a score from 0 to 1 beside the evidence it rests on, read at the moment asked. FEASIBILITY: the share of its blocking needs met or meetable — a `meet` of it stands, or a provider is said and nothing says it `impossible` — and 0 where one is impossible. NECESSITY: what needs it now — the needs of others whose `of` is it, in force (`while`) and unmet at that moment, a blocking one 1 and another ½ — as a share of the most any member has. EFFICIENCY: what it yields against what it costs — its yield (those needs, in force or not, by the same counts, and each failure it is said to remedy, a `repair` of it by the member, 1) as a share of the most any member yields, times its cost: in each unit its needs ask an amount in, the least amount of the members that ask one over its own, the mean of those, and that over one more than the failures it makes possible (`possible` of a `fail` through it) — never two units added without a rate someone measured, and each amount shown beside. With the weighing, each member's weighted sum, and its mark: `optimum here, now` for the member with the greatest sum whose feasibility is 1 and whose necessity is more than 0, and `wasteful weight` for one whose necessity is 0, or whose yield is 0 while it costs something. Read each time, never stored: a mark orders what is shown, and never decides"
  - op: used-within
    gives: value
    exact: "true"
    u_rule: none
    takes:
      of: { required: "true", in: { type: kebab } }
      path: { required: "true", in: { type: field_path } }
      within: { required: "true", in: extent }
      at: { required: "true", in: any }
    meaning: "the length of the members' extents inside the window of `within` that ends at `at`; where the path holds a position, how many fall inside it"
  - op: conservation
    gives: truth
    exact: "true"
    u_rule: none
    takes:
      walk: { required: "true", in: { type: field_path }, meaning: "a path to a walk's `steps`" }
      scheme: { required: "true", in: { registry: knowledge_schemes, take: scheme } }
    meaning: "whether each step's `takes` and `gives` conserve every element and the charge, exactly; a substance with no formula is refused"
  - op: fit
    gives: groups
    exact: "true"
    u_rule: none
    takes:
      of: { required: "true", in: { type: kebab }, meaning: "the members: an earlier step's set, or an input naming a list of texts" }
      path: { in: { type: field_path }, meaning: "the text each member is read by — a holding's name (`as`), a folder's name, a payment's words (`note`); absent, the member itself, a text" }
      scheme: { in: { registry: knowledge_schemes, take: scheme }, meaning: "the scheme of the form `pattern` read first; absent, every scheme of that form the garden reads, the garden's own before the release's" }
      by: { in: { type: kebab }, meaning: "the role of a member whose being a group stays inside: `by`, the folder that holds a file — a run of names is a run in one folder" }
    meaning: "the members grouped by the pattern their text fits — the most specific row first (more literal characters, then fewer slots, then the code's order), its `within` and `beside` met — or, fitting none, by the shape mined from the text (its runs of letters, of decimal digits of any script, of hexadecimal digits, each other character); each group with its template and what its slots hold: a counter's first and last, how many members and the positions between them nobody holds, a date's and a time's extent in the calendar the pattern names, a word's values. A date is a day its calendar has, checked by that calendar; where two calendars fit a mined date, both are said and none is chosen. Read each time, offline, the same answer each time"
  - op: inherit
    gives: groups
    exact: "true"
    u_rule: none
    takes:
      of: { required: "true", in: { type: kebab }, meaning: "the members: beings of a set" }
      scheme: { required: "true", in: { registry: knowledge_schemes, take: scheme }, meaning: "the class scheme whose codes are read" }
      weighs: { in: { registry: groupings, take: grouping }, meaning: "the grouping whose `weighs` say what does not fit its whole; absent, nothing is set apart by kind, day or shape" }
    meaning: "each member's codes of a class scheme, with where each came from: those said of it (a `classify` in a bean); else those said of its nearest whole up `part`, and of each folder that holds it (`hold`), unless a code of the scheme is said nearer, between, or a pattern its name fits suggests a code that sets apart (the form `class`, `apart`), or it fits the whole it would inherit from by none of two of kind, day and shape (the grouping's `weighs`): set apart, with why; else those the patterns its name fits suggest. Two codes said of one being both stand. The codes are read, never written: what is said stands above what is read. `part` is free of cycles by rule `order`; a cycle among a scheme's own `parent` and `part-of` is refused, naming it"
  - op: keepings
    gives: groups
    exact: "true"
    u_rule: none
    takes:
      of: { required: "true", in: { type: kebab }, meaning: "the contents" }
      scheme: { in: { registry: knowledge_schemes, take: scheme }, meaning: "the policy scheme, of the form `keep`, whose codes say what each content must be safe against; absent, every content is read for what its keepings resolve and judged against nothing" }
    meaning: "each content by its policy code and the risks of that code its keepings leave open: its keepings (every holding of it, through `through` once), the properties each holds (core/law/profiles.yaml `keeping_properties`), and for each risk left open, the alternative of its `resolved_by` nearest to met and what it lacks — a keeping on another disk, at another place, offline, found whole since. A carrier a later reading took out keeps nothing; a keeping whose property nothing says lacks it"
  - op: datasets
    gives: groups
    exact: "true"
    u_rule: none
    takes:
      of: { required: "true", in: { type: kebab }, meaning: "the folders" }
    meaning: "the folders by the dataset their tree is — the content of their tree's manifest (core/law/formats.yaml `checksums`), named by its BLAKE3 — each group one dataset and the folders that hold it alike; a tree holding a file whose content nobody read is no dataset, and named"
  - op: layout
    gives: groups
    exact: "true"
    u_rule: none
    takes:
      of: { required: "true", in: { type: kebab }, meaning: "the folders" }
      scheme: { required: "true", in: { registry: knowledge_schemes, take: scheme }, meaning: "the scheme of the form `schema` whose schemas are said of folders" }
    meaning: "each member beneath a folder a schema of the scheme is said of (`classify` of the folder), by the node it belongs at — the first whose `matches` it holds — and how it stands: in place, where its path is the one the node's template gives its facts; out of place, with that path; at no node. And each name whose content changed since the reading before, with the earlier contents its schema's history keeps"
  - op: shared
    gives: groups
    exact: "true"
    u_rule: none
    takes:
      of: { required: "true", in: { type: kebab }, meaning: "the cursors: a set of beings" }
      aspect: { required: "true", in: { registry: aspects, take: aspect }, meaning: "the aspect whose relation is followed (the view profile's `aspects`)" }
    meaning: "what every member of the set reaches by the aspect's relation, and how many reach each, grouped by where they are reached — the contents two disks both hold, by the pair of folders they sit in: a computation of its own for each relation, never a set operation on each member's neighbours"
comparisons:
  - comparator: is
    sign: "="
    monotone: "false"
    meaning: "the value at the path equals the operand: a literal, `{input: <name>}`, or `{step: <id>}` of a value"
  - { comparator: in, sign: "∈", monotone: "false", meaning: "the value is one of a list of operands" }
  - comparator: at_least
    sign: "≥"
    monotone: "false"
    meaning: "not less than the operand: a number exactly, a quantity by exact conversion, a position through the day, or through the instant in the reading's `zone`"
  - { comparator: at_most, sign: "≤", monotone: "false", meaning: "not more than the operand, read as `at_least` is" }
  - { comparator: exists, sign: "∃", monotone: "false", meaning: "the path holds a value" }
  - { comparator: absent, sign: "∄", monotone: "false", meaning: "the path holds none" }
  - comparator: reached
    monotone: "true"
    meaning: "the course at the path has at some moment held this step of its walk, or a step reachable from it by `next`: what has been reached stays reached"
  - { comparator: at_step, monotone: "false", meaning: "the course's CURRENT step is this one" }
  - comparator: refers_to
    monotone: "false"
    meaning: "a ref or a bean id at the path names this bean — the caller, a given value"
  - comparator: fits
    monotone: "false"
    meaning: "the value at the path is in the one form of a row of the law the operand names: `{namespace: <row>}`, `{type: <row>}` or `{system: <row>}` — its pattern, its `holds_no` but what its `but` lets through, and the check its `checked_by` names (core/law/checks.yaml) — or, with `{holds: <Unicode property>}`, holds a character of that property alone: Bidi_Control, or a general category (`Cc`) or its class (`C`); or, with `{concept: <code>}`, a code of a scheme of concepts (the knowledge profile's form `concept`), names a being of the garden said to be of that concept, or of which its pattern is read in what the garden's statements draw — its bodies, their parts and their joints, a fact no statement draws fitting no constraint on it. A row that states no form is fitted to nothing, and the reading naming it is refused"
  - comparator: "≠"
    sign: "≠"
    monotone: "false"
    meaning: "the value at the path is not the operand: the core's sign, which today's words lacked"
  - comparator: "<"
    sign: "<"
    monotone: "false"
    meaning: "less than the operand, read as `at_least` is: the core's sign, which today's words lacked"
  - comparator: ">"
    sign: ">"
    monotone: "false"
    meaning: "more than the operand, read as `at_least` is: the core's sign, which today's words lacked"
aggregates:
  - { aggregate: sum, meaning: "the parts added: two nodes of 2 are 4" }
  - { aggregate: product, meaning: "the parts multiplied: two nodes of 2 are 4 again, three of 2 are 8" }
  - { aggregate: mean, meaning: "the sum shared equally over the parts: their sum divided by how many they are" }
  - { aggregate: min, meaning: "the least of the parts" }
  - { aggregate: max, meaning: "the greatest of the parts" }
  - { aggregate: count, meaning: "how many parts there are, in the unit `item`: how long an ordinal line is" }
  - { aggregate: first, meaning: "the part at the line's first position" }
  - { aggregate: last, meaning: "the part at the line's last position" }
ordering_keys:
  - key: merge
    meaning: "a disagreement a merge shows a person: weight × |Δ| / (k · u of Δ) for a measured value, the weight alone for an exact one — after the Contract's classes F, E and D, which no weight reorders"
    inputs:
      - { name: weight, origin: { act: say }, quantity: ratio }
      - { name: delta, origin: { act: say }, quantity: ratio, note: "|Δ|, in the unit of u" }
      - { name: u, origin: { act: say }, quantity: ratio }
    steps:
      - { id: k, op: constant, value: { count: 2, unit: one } }
      - { id: ku, op: multiply, of: u, with: k }
      - { id: z, op: divide, of: delta, with: ku }
      - { id: key, op: multiply, of: weight, with: z }
  - key: tests
    meaning: "a suite in the working loop: weight × how often it failed ÷ its measured seconds; every suite still runs at a release"
    inputs:
      - { name: weight, origin: { act: say }, quantity: ratio }
      - { name: failed, origin: { act: say }, quantity: number }
      - { name: seconds, origin: { act: say }, quantity: duration }
    steps: [{ id: w, op: multiply, of: weight, with: failed }, { id: key, op: divide, of: w, with: seconds }]
  - key: controls
    meaning: "a guard: weight × its distance from checked"
    inputs:
      - { name: weight, origin: { act: say }, quantity: ratio }
      - { name: distance, origin: { act: say }, quantity: ratio }
    steps: [{ id: key, op: multiply, of: weight, with: distance }]
  - key: improvements
    meaning: "an improvement: weight × the loss it removes, its cost beside"
    inputs:
      - { name: weight, origin: { act: say }, quantity: ratio }
      - { name: loss, origin: { act: say }, quantity: ratio }
    steps: [{ id: key, op: multiply, of: weight, with: loss }]
  - key: effort
    meaning: "where a model's effort goes: importance × uncertainty — key items to the best model and a person, the rest to deterministic tools"
    inputs:
      - { name: importance, origin: { act: say }, quantity: ratio }
      - { name: uncertainty, origin: { act: say }, quantity: ratio }
    steps: [{ id: key, op: multiply, of: importance, with: uncertainty }]
# THE NEAREST: one ordering of the candidates that hold one case, nearest or most specific first — by the keys its use
# names, read in order, each one of that use's own — and, at each use, what a tie of the nearest does. A use the law
# names no row for, or a key a use does not have, is refused by the law's check (core/nearest.py applies these rows).
# These rows are the law itself: a change to them is a RULE-CHANGE, made here.
nearest:
  ties:
    - { tie: refuse, meaning: "none of them decides: the case is held by none" }
    - { tie: both, meaning: "every one of them stands, together" }
    - { tie: order, meaning: "the first of them stands, in the order its use reads its candidates in" }
  uses:
    - use: flows
      meaning: "the rows of the flow table that hold a pass (core/law/flows.yaml; rule `layers`). Rows that stand together stand as all of them say: a pass is refused where one of them refuses it, and asks a party where one of them asks one"
      keys:
        - { key: as, meaning: "a row that names the act what the pass carries is known by there (`as`) is nearer than one that names only layers" }
      tie: both
    - use: patterns
      meaning: "the rows of a scheme of names' templates (`form: pattern`) that a name fits, read in order: the garden's own schemes first, then the release's, each scheme's rows in theirs"
      keys:
        - { key: literal, meaning: "a template with more literal characters is nearer" }
        - { key: slots, meaning: "of two as literal, one with fewer slots is nearer" }
      tie: order
    - use: wholes
      meaning: "the wholes a member inherits a class's code from: its whole up `part`, and for a content each folder that holds it"
      keys:
        - { key: way, meaning: "a whole is nearer than one beyond it on its way up, and no whole beyond one that holds a code is read on that way; wholes on two ways are as near" }
      tie: both
    - use: locations
      meaning: "the beans whose `be`, as location, holds a position covering a path (the cursor), read in the garden's order"
      keys:
        - { key: length, meaning: "a longer position is nearer" }
      tie: order
# THE GROUPINGS: one row a standard reading a profile brings (`home`; `core` for every garden), the kind of group it
# makes and what its one line shows (`selection_form.line`). A garden adds its own in VOCAB.md (`groupings`), read the
# same way. Each is read each time and never written: what a person says of a member — a `classify` of it — stands above
# it. A grouping that reads moments reads them in the garden's zone (GARDEN.md `zone`) unless the asker gives one.
# These rows are the law itself: a change to them is a RULE-CHANGE, made here.
groupings:
  - grouping: name-series
    home: core
    meaning: "a run of names in one folder: the files that fit one pattern, its counter's runs and the positions between them nobody holds, the days their contents were made on and the camera, where every member agrees. A content whose moment is a clock never set (core/law/formats.yaml `clock_epochs`) is placed between the dated neighbours of its camera's counter, after the one and before the other (`event-anchored`), where the series holds any"
    steps:
      - { id: folders, op: select, kind: folder, store: any }
      - { id: files, op: select, of: folders, entries: hold }
      - { id: runs, op: fit, of: files, path: as, by: by }
    line: [range, count, missing, "cells:of>produce.at", "agree:of>produce.by"]
  - grouping: day
    home: core
    meaning: "the contents made on one day, by the day cell their `produce.at` falls in, in the calendar the asker reads in — none is the one a day is grouped in, and every calendar whose day begins at midnight gives the same cells"
    inputs:
      - { name: calendar, origin: { act: say }, type: kebab }
    steps:
      - { id: made, op: select, kind: content, store: any, entries: produce }
      - { id: days, op: group, of: made, path: at, level: day, system: { input: calendar } }
    line: [range, count, "agree:by"]
  - grouping: root
    home: core
    meaning: "what a code said of a whole holds by inheritance — a folder of an organisation's, a job's, a person's — with what is set apart beneath it: by kind (a media type's family under 2 % of the whole's bytes and 5 % of its files, and none of its two largest), by day (more than 365 days from the nearest of the whole's days), by shape (fitting none of its siblings' patterns while four in five of them fit one); two of the three set a member apart"
    inputs:
      - { name: scheme, origin: { act: say }, type: kebab }
    steps:
      - { id: beings, op: select, kind: folder, store: any }
      - { id: classed, op: inherit, of: beings, scheme: { input: scheme }, weighs: root }
    line: [code, count, "sum:of>measure.value", apart]
    weighs: { kind: { bytes: "0.02", files: "0.05", largest: 2 }, day: { measure: { count: 365, unit: d } }, shape: { most: "0.8" }, of: 2 }
  - grouping: names
    home: core
    meaning: "any list of names — bean ids, statement ids, paths — by the patterns they fit: what the gate's replies show in place of a thousand names, needing no store"
    inputs:
      - { name: names, origin: { act: say }, type: text }
    steps:
      - { id: shapes, op: fit, of: { input: names } }
    line: [range, count, missing]
  - grouping: passes
    home: core
    meaning: "the runs of one name — a watcher's passes, a scan per volume — each a course on `walk-run`, by the pattern of its name"
    steps:
      - { id: courses, op: select, kind: host, store: any, entries: be, where: [ { path: at, "=": walk-run } ] }
      - { id: names, op: fit, of: courses, path: note }
    line: [range, count, extent]
  - grouping: moves
    home: accounting
    meaning: "a bank's lines by the pattern of their words — the lines of one merchant — each group suggesting the code of a plan its pattern names, which a person books it to (`book … to`)"
    steps:
      - { id: statements, op: select, kind: document, store: any }
      - { id: lines, op: select, of: statements, entries: pay }
      - { id: merchants, op: fit, of: lines, path: note }
    line: [range, count, "sum:of", extent]
  - grouping: events
    home: storage
    meaning: "the contents made within one stretch of time, a new event wherever the time from one content's moment to the next is longer than the gap, each event by the cameras and devices that made it (`produce.by`). A content's moment is its `produce.at`, else the day a pattern its name fits reads in it (a `date` slot), else the day the nearest of its folders' names holds; a day alone stands for the whole of it. A content whose moment is a clock never set is placed in the event of its camera's dated neighbours in its series of names, where both are in one; a content with no moment is in no event, and named"
    inputs:
      - { name: gap, origin: { act: say }, quantity: duration }
    steps:
      - { id: made, op: select, kind: content, store: any, entries: produce }
      - { id: events, op: group, of: made, path: at, gap: { input: gap } }
    line: [extent, count, "each:by"]
  - grouping: datasets
    home: storage
    meaning: "the folders whose trees are one dataset, each group a dataset and the folders that hold it alike"
    steps:
      - { id: folders, op: select, kind: folder, store: any }
      - { id: trees, op: datasets, of: folders }
    line: [code, count]
  - grouping: keepings
    home: storage
    meaning: "the contents by their policy code and the risks their keepings leave open, each group with what would close each risk"
    inputs:
      - { name: scheme, origin: { act: say }, type: kebab }
    steps:
      - { id: contents, op: select, kind: content, store: any }
      - { id: open, op: keepings, of: contents, scheme: { input: scheme } }
    line: [code, count, "sum:measure.value", missing]
  - grouping: schemas
    home: storage
    meaning: "the members of each directory a schema is said of, by how each stands against its schema: in place, out of place, at no node, changed"
    inputs:
      - { name: scheme, origin: { act: say }, type: kebab }
    steps:
      - { id: folders, op: select, kind: folder, store: any }
      - { id: placed, op: layout, of: folders, scheme: { input: scheme } }
    line: [code, count, "sum:measure.value"]

selection_form:
  inputs: "optional: values a reading takes from outside what the garden holds, one entry each, named, each with its `origin` (`schema_language.origin`). Read by the reader (`{act: read, nature: soma, by: reader}`) — the moment of the reading, from the clock; said by another garden (`{act: said, nature: lekton, by: garden}`) — a value read from it at a commit it published and granted (`garden`, `path`); said by the law (`{act: say, nature: sayable, by: law}`) — the law's table the input's name names, each row a member: any table the law's columns declare (`columns`, or a standard's `forms`, the face's first: a name two files declare is the first's), with the garden's own rows where it adds to the table, each marked `garden: true`; `stands`, each level's stands as `{by: <the level>, at, as, while}`, the law's own ladder; and `manifest`, the manifest's keys, each with the value the garden's GARDEN.md gives it (`value`); from an earlier rule (`{name, from: {rule, step}}`, a rule's reading only) — the members of a step of a rule before this one in core.yaml's order, so the readings are stratified by the rules' order as the steps are by theirs; any other — a value the ASKER gives, in the form `type` or `quantity` states, and the reading's line records it as the asker's, said. Who is asking is such a value until a guard signs the asker in. A step names an input `{input: <name>}`; a reading with an input is read only where the input is given"
  steps: "the reading, in order: each step applies ONE operation of `operations`, to what earlier steps gave and to the beans the garden holds, with what that operation's row `takes`; the last step's result is the reading's. A step names earlier steps by `id`, or an input by its `name`, and never a later step, so a reading never loops. No formula is written and no string is evaluated"
  zone: "optional: the civil time zone, a row of `time-zones`, in which a step that groups or compares by a calendar level reads a moment. A step that needs one refuses without it"
  result: "what the last step gives, by its operation's row: a set (of beans, entries or values), a truth (true, false or NOT KNOWN), a value with its u, an order, or groups. Where a truth is asked — a clause's `when`, a checklist's `met_by`, a grant's audience — a set holds when it is not empty, and NOT KNOWN does not hold"
  refuse: "a rule's reading (core.yaml `rules`, its `reading`): the steps whose members are the rule's refusals, each `{of: <step>, at?: <path>, message: <words>}`, a set or an order. A refusal is told at the place of the statement its member is (`<bean>[<i>] <verb>`; of a pair, the first's) — with `at`, a path of the statement's keys, each one key (`clause.by_role`), at that path inside it: `<bean>[<i>] <verb>.<at>` —, in the order of `refuse` and of each step's members. The message names a member's values by `{<path>}`, each written as text — a list with ` → ` between its items, and a being a `describe` reads as it was written, or a `someone` by its kind — and a set by `{<path>:set}`: the values at the path, a list's items each, every one once, in the order of their characters, with `, ` between them; nothing in it is evaluated. Each refusal carries its proof, the statements and the law's rows its member rests on, which `daftar why <rule> <place>` prints"
  line: "a group's one line: what the gate's replies, the pages and the runs page show of a group in place of its members — its fields in the order its grouping's `line` names, each written by its value's own writer (a count, a position in the reader's calendar, a being by its title), the members' own text never repeated. A field is one of: `range` (the group's template with its counter's first and last, or its date's extent, in place of the slot), `count` (how many members), `missing` (the positions between a counter's first and last nobody holds, counted), `extent` (a date's or a time's first and last), `values` (a word slot's values, the first few), `code` (the code a group of `inherit` holds, and where it came from), `apart` (how many were set apart, and why, by reason), `cells:<path>` (the cells of the level the grouping names the members' positions at the path fall in), `agree:<path>` (the value every member holds at the path, shown only where all agree), `each:<path>` (the values the members hold at the path, each with how many, the most first), `sum:<path>` (the quantities at the path added)"
  read: "READ each time it is asked, by bin/reckon.py, and never written back as a fact. An act that fixes a reading — an invoice, a period closed, a verdict — records the commit and the moment it was read at (the verb `pin`)"
forms:
  series:
    meaning: "What this being holds ALONG A SEQUENCE: each entry is a series, a line whose positions hold values. Its positions are given by a rule (`grid`, a recurrence) or listed (`span`, an extent, from whose `from` each row writes its offset in `unit`s); `holds` names what each position holds, one channel per column; the rows are one table. A series is the world along a line, at the position where it held.\n"
    replaces: series
    one_of: [grid, span, held]
    attrs:
      grid:
        in: recurrence
        meaning: "the positions BY RULE: a recurrence with a `from` and no `to` or `times`, striding by a measure or by a level with a length; row n is at occurrence n, the first at `from`, and the last row is its end"
      span:
        in: extent
        meaning: "the positions LISTED: the region the rows lie in, whose `from` is offset 0; each row writes its offset"
      unit:
        in: { registry: units, take: unit }
        meaning: "the resolution held, and what an offset counts: a row's offset and a grid's stride are whole numbers of it. On a COUNTED line (its system's neighbours counted) no unit is stated: an offset there is a count of neighbours, and nothing measures it"
      placement:
        in: [point, bounds, preceding, following]
        meaning: "where a row sits on the line: point — at its position, the reading when silent | bounds — over a region, a listed row writing its `from` and `to`, a grid's row n over [n, n+1) strides | preceding — at its position, over the region back to the row before | following — at its position, over the region on to the next"
      holds:
        meaning: "the CHANNELS: what a position holds, one column each — a measured value, a position, or a code"
        in:
          keyed_by: name
          at_most_one_of: [[u, accuracy]]
          entries:
            name: { required: "true", in: { type: kebab }, meaning: "the column's heading, once in its series" }
            quantity:
              in: { registry: quantities, take: quantity }
              meaning: "a MEASURED value: the quantity every cell is of, counted in `unit`"
            unit:
              in: { registry: units, take: unit }
              meaning: "with `quantity`, the one unit every cell is counted in; with `system` and `from`, what an offset from `from` counts"
            system:
              in: { registry: systems, take: system }
              meaning: "a POSITION: every cell is a position in this system, in its one form less the channel's `prefix` and `suffix` — or, with `from` and `unit`, a whole offset from `from`"
            from:
              in: { form_of: anchor_systems, keyed_by: system, take: pattern }
              meaning: "with `system` and `unit`: the position an offset of 0 is"
            prefix:
              in: { type: text }
              meaning: "with `system`: what every cell's position begins with, written once here"
            suffix:
              in: { type: text }
              meaning: "with `system`: what every cell's position ends with, written once here"
            scheme:
              in: { registry: knowledge_schemes, take: scheme }
              meaning: "a CODE: every cell is a code of this published scheme"
            stands_for:
              required: "true"
              in: [point, mean, sum, min, max, state, instant]
              meaning: "what a cell stands for over its row's place: point — the value at the row's position | mean, sum, min, max — over the row's region | state — the value holds from the row until the next, or over the row's region | instant — something happened at the row's position, and nothing is held between rows"
            between:
              in: [none, linear]
              meaning: "what is read between two rows: none, the reading when silent | linear — on a straight line between two neighbouring readings of a point, only where the line and the channel are both metered"
            u:
              in: { quantity: any }
              meaning: "the standard uncertainty of every cell, in a unit of what the cell measures: a value read with it is printed to its digits"
            accuracy:
              in:
                entries:
                  count:
                    required: "true"
                    in: { type: count }
                    meaning: "the accuracy stated: an accuracy with no number states nothing"
                  unit: { required: "true", in: { registry: units, take: unit }, meaning: "its unit" }
                  kind:
                    required: "true"
                    in: { registry: accuracy_kinds, take: kind }
                    meaning: "its kind, a row of `accuracy_kinds`"
              meaning: "an accuracy as its maker stated it, with its kind (`uncertainty_form`), never beside `u`: the reader turns it into an uncertainty, a writer never does"
            persists:
              in: [none, offset, scale, unknown]
              meaning: "whether one cell's error repeats in the next: none | offset — a common offset, which cancels in a difference | scale — a common relative error, which scales a difference | unknown, read both ways"
            monotone:
              in: [increasing, decreasing]
              meaning: "the channel never goes back along the line: a row that does is refused, unless its cell is excluded"
            limits:
              in:
                entries:
                  below: { in: { type: count }, meaning: "what a bare `<` is below" }
                  above: { in: { type: count }, meaning: "what a bare `>` is above" }
              meaning: "the limits a bare `<` or `>` in a cell stands for"
            property:
              in: { type: coding }
              meaning: "WHAT the channel is of, as a code of a published scheme, so that two gardens' channels meet by code and never by name"
            note: { in: prose, meaning: "optional prose" }
      rows:
        in: { type: rows }
        meaning: "the table, inline: its header names the position columns (`at`, or `from` and `to` under `bounds`; none on a grid) and each channel once, then one line per row. Absent, the rows are the parts `series/<bean>/<key>/<part>.tsv`: a grid's part named by the number of its first row, a listed series' by any kebab name"
      excluded:
        in:
          entries:
            at:
              required: "true"
              in: { type: count }
              meaning: "the row: its offset on a listed series (its `from` under `bounds`), its number on a grid, the first 0"
            channel: { in: { type: kebab }, meaning: "the cell's channel; absent, every cell of the row" }
            by: { required: "true", in: bean_id, meaning: "the judge who set it aside" }
            why: { required: "true", in: prose, meaning: why }
            note:
              in: prose
              meaning: "optional prose. THE place for it: an entry holds only declared attributes, so a remark is written here and never as a new key"
        meaning: "a cell SET ASIDE by a judge: kept and shown, and read by no operation"
      held:
        in: { pattern: "^root:[a-z0-9][a-z0-9-]*/[A-Za-z0-9][A-Za-z0-9._-]*$" }
        meaning: "the whole series is kept OFF GIT, in the held layer, under this opaque pointer, and the entry says nothing else"
      whole:
        meaning: "what the series is AS A WHOLE, made of what its positions hold: the value, the channel it is made of, and how (`by`, an aggregate) — two nodes of 2 are a whole of 4 `by: sum`, and of 4 `by: product`. Checked exactly, in fractions, against the rows; a row that holds a gap leaves a whole that cannot be checked, and says so"
        in:
          entries:
            value:
              required: "true"
              in: { quantity: any }
              meaning: "the whole, a measured value in a unit of the channel's quantity (`count` is in `item`)"
            of: { required: "true", in: { type: kebab }, meaning: "the channel it is made of, by its name" }
            by:
              required: "true"
              in: { registry: aggregates, take: aggregate }
              meaning: "how the parts make the whole"
  step:
    meaning: "the ordered steps a mapping performs: a WALK, whose steps say who acts at each, how long each usually takes, which are ways out, pauses and ends, and why a case may move into each"
    replaces: steps
    attrs:
      usually:
        in: extent
        meaning: "how long the step usually takes: an extent on `time` with a `measure`, `{ of: time, measure: {count, unit} }`, or counted in cells of a calendar's level, `{ of: time, in: <system>, level: <level>, count: <n> }` (`extent_form.level`)"
      exit:
        in: ["true"]
        meaning: "a way out, reached from any step with no `next` naming it: withdrawn, cancelled, lost"
      resumes:
        in: ["true"]
        meaning: "a PAUSE, reached from any step with no `next` naming it: the move after it returns to the step it was entered from, or takes a way out"
      final:
        in: ["true"]
        meaning: "an end nothing follows: a move after it is refused. An end that is not final may be left, and the case taken up again"
      machine:
        in: ["true"]
        meaning: "the machine that keeps the course acts at this step, not a person's hands: nobody is told while the step is within its `usually`, and past it, whoever keeps the being"
      reasons:
        in: any
        meaning: "the reasons a move into this step may cite, as a list of kebab words, each once. Its form is the walk's to judge"
      is: { in: { type: coding }, meaning: "the published process the step is, where a scheme names one" }
      takes:
        in:
          entries:
            code: { required: "true", in: { type: coding }, meaning: "the code, with its scheme" }
            amount: { in: { quantity: any }, meaning: "how much, where it is measured" }
          keyed_by: code
        meaning: "what one run of the step takes in, each once"
      gives:
        in:
          entries:
            code: { required: "true", in: { type: coding }, meaning: "the code, with its scheme" }
            amount: { in: { quantity: any }, meaning: "how much, where it is measured" }
          keyed_by: code
        meaning: "what one run of the step gives out, each once"
      ways:
        in:
          keyed_by: to
          entries:
            to: { required: "true", in: { type: kebab }, meaning: "the step it leads to: one of the step's `to`" }
            when: { in: prose, meaning: "when this way on is taken: said by each of two or more" }
            note: { in: prose, meaning: "optional prose" }
        meaning: "the words of a way on, one entry for each step it leads to that has any: when it is taken, a note"
  reading:
    meaning: "the readings this bean declares (`selection_form`): which beans or entries of the garden it selects and what it computes from them — how many, whether any, which first, how much — each under a name a clause, a checklist, a grant or a page names it by (`key_of: selections`). Read by bin/reckon.py each time, never stored"
    replaces: selections
    attrs:
      what: { required: "true", in: prose, meaning: "what it selects, in the words a person checks it against" }
      inputs:
        meaning: "what it takes from outside what the garden holds (`selection_form.inputs`)"
        in:
          entries:
            name: { required: "true", in: { type: kebab } }
            origin:
              required: "true"
              in: origin
              meaning: "`{act: read, nature: soma, by: reader}`, the clock; `{act: said, nature: lekton, by: garden}`, another garden; any other, a value the asker gives"
            type: { in: { registry: types, take: type }, meaning: "with `given`: the form of the value" }
            quantity:
              in: { registry: quantities, take: quantity }
              meaning: "with `given`: the quantity it measures"
            garden: { in: { bean_id: { gene: [garden] } }, meaning: "with `garden`: the garden read" }
            path: { in: { type: field_path }, meaning: "with `garden`: what is read there, `<bean>:<path>`" }
            note: { in: prose }
          keyed_by: name
      zone:
        in: { registry: time-zones, take: zone }
        meaning: "the civil time zone a calendar level is read in (`selection_form.zone`)"
      steps:
        required: "true"
        in: any
        meaning: "the operations, in order, each `{id, op, ...}` with what its row of `operations` takes — judged against that row by bin/reckon.py's check, called by the gate"


# The slots of a name's template (the knowledge profile's form `pattern`): what its varying part may be, each with what it
# matches and how it is read. A template is literal text and slots, `{<slot>}` or `{<slot>:<width or form>}`; nothing in
# it is evaluated. A name the world gives is read with its digits of any script as ASCII digits (normalised at the
# boundary, where it enters: a ledger's own value is never read so); a date and a time are checked, never guessed.
# These rows are the law itself: a change to them is a RULE-CHANGE, made here.
slots:
  - { slot: counter, matches: '[0-9]+', width: allowed, meaning: "decimal digits: a position on the ordinal line the pattern counts in one container (a folder's names, a run's name); members in order make runs, and a position between a run's first and last that nobody holds is a gap. With a width, exactly that many digits; with a width and `+`, at least that many — a counter padded to a width it outgrows" }
  - { slot: number, matches: '[0-9]+', width: allowed, meaning: "decimal digits that are no counter — a version, a size, a resolution: never ranged" }
  - { slot: date, forms: [yyyymmdd, yymmdd, yyyy-mm-dd, yyyy_mm_dd, yyyy.mm.dd], meaning: "a day, in one of ISO 8601's basic and extended forms or the separators names use: a day of the calendar the pattern names (`calendar`), checked by that calendar — a day it does not have is no date" }
  - { slot: time, forms: [hhmmss, hhmm, hh-mm-ss, hh.mm.ss, hh_mm_ss], meaning: "a time of day in one of ISO 8601's basic forms or the separators names use, checked: hours below 24, minutes below 60, seconds below 61" }
  - { slot: hex, matches: '[0-9A-Fa-f]+', width: required, meaning: "hexadecimal digits of a width, either case: a digest or a minted id, never ranged and never a date" }
  - { slot: alnum, matches: '[A-Za-z0-9_]+', width: allowed, meaning: "letters, digits and underscores: a maker's own prefix — DCF's four free characters" }
  - { slot: word, width: allowed, meaning: "letters of any script (Unicode's general category L), read by the engine, not by an ASCII pattern of the law: a word that varies between members" }
  - { slot: text, matches: '.+?', meaning: "any run, the shortest that lets the rest fit: at most one a template, so that a template still says what is fixed around it" }
  - { slot: extension, meaning: "what follows a name's last dot, one to eight letters or digits of any script, compared without case: the row's `extensions` lists those it allows" }

# The forms a value is written in, which a line's form names (`type`), each with its pattern or what it holds, and
# the refusal of a value out of it; and the gaps a series' cell holds where it holds no value, each by its token.
# These rows are the law itself: a change to them is a RULE-CHANGE, made here.
types:
  - type: position
    dimension: time
    unit: day
    any_system: "true"
    clock: offset
    exists: { reckoning: [arithmetic] }
    refusal: "must be a POSITION in time, in the one form of the calendar it is stated in: a day (`2026-09-20`, `persian:1405-06-29`, `hebrew:5787-01-09`, `2026-W38-7`), or a moment to the minute or finer with the offset it was read at (`2026-10-28 14:05-05:00`, `persian:1405-08-06 14:35+01:00`) (Rule 6 paper-durable) — or the same position written long, as one entry of `timing`: `{ system: gregorian-civil, at: 2026-09-20, unit: day }`, or, where nobody said the day, `{ system: event-anchored, at: \"after:<what it followed>\", unit: day, note: <what is known of when> }`"
    meaning: "a POSITION IN TIME, in ANY calendar, held to the unit its form is written at: a day, or a moment to the minute or finer with the offset it was read at — no calendar is the one a position must be in, and a clock reading is never without its offset (`clock: offset`), since civil time is read from a place. `unit` is the coarsest a position is held to; an attribute held to a finer one says so beside the type (`in: { type: position, unit: minute }`). What the save writes for `now` is the clock's reading to the second, true to the minute (the method `stamp`). It is written SHORT, as its calendar writes it, or LONG as one entry of the term `long_form` names — `timing`, `{system, at, unit, by?, note?, where?}` — the same position, which also holds what the short form cannot: a day nobody said, placed by its neighbours (`event-anchored`), who read it, where it was, a note. A day its calendar does not have is no position: where the calendar's row is reckoned in one of the ways `exists.reckoning` names, the day a position names, written back in that calendar, is the position written, and a year the reckoning cannot reach is no year. So it is for every position held to a day — where a repetition starts and ends, a bound of a region in time."
  - type: kebab
    origin: { act: make }
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    refusal: "must be kebab-case (the name is open, but still paper-durable)"
    meaning: "an open name in lowercase words joined by hyphens"
  - type: count
    pattern: "^-?(0|[1-9][0-9]{0,39})(\\.[0-9]{1,40})?$"
    refusal: "must be a whole number, or a decimal written as a string (\"12.5\"), in plain decimal digits — no leading zero, at most forty digits before the point and forty after: a float has no canonical form, and a longer count is one some reader cannot hold exactly"
    meaning: "the count of a measured value — how many of its unit — written as a person writes a number, and held exactly by every reader"
  - type: text
    holds_no: Cc
    but: ["\t"]
    lines_in: block
    refusal: "a control character, which text never holds: no one reads it, and printed it moves, erases or hides what a reader's terminal shows. Text holds a tab, and a line feed only in a block scalar (`|` or `>`), whose lines are lines on the page"
    meaning: "what every key and every string value of a bean, a mapping, GARDEN.md and VOCAB.md is: characters a person reads. It holds no character of the Unicode general category `holds_no` but those in `but`, and a line feed only in a scalar of the style `lines_in` names. Every other value type is text first"
  - type: field_path
    origin: { act: say, nature: sayable, by: law }
    pattern: "^(?:@occurrence|(?:[a-z0-9][a-z0-9-]*:)?(?:\\*\\*|\\*|[a-z0-9_][a-z0-9_-]*)(?:\\[[a-z_][a-z0-9_]*=[^\\]\\s]+\\])?(?:\\.(?:\\*\\*|\\*|[a-z0-9_][a-z0-9_-]*)(?:\\[[a-z_][a-z0-9_]*=[^\\]\\s]+\\])?)*(?:>(?:\\*\\*|\\*|[a-z0-9_][a-z0-9_-]*)(?:\\[[a-z_][a-z0-9_]*=[^\\]\\s]+\\])?(?:\\.(?:\\*\\*|\\*|[a-z0-9_][a-z0-9_-]*)(?:\\[[a-z_][a-z0-9_]*=[^\\]\\s]+\\])?)*)*)$"
    refusal: "must be a path into what beans hold — keys joined by `.`; `*` for every key of a map or entry of a list; `**` for every key and item below, at any depth; `[<attr>=<value>]` for the entries holding that value; `>` to follow a ref to the bean it names and go on there; `<bean>:` first to start at another bean; or `@occurrence`. For example `parties[role=seller].who>title`"
    meaning: "a PATH into a bean's front matter, read by the one reader (bin/parse.py `path_read`; evaluated by bin/reckon.py). Read from the bean it is read from — the selected member, the occurrence, the bean that declares it — unless it names another. A list is gone into entry by entry. `**` reads every value below where it stands, at any depth — each value of a map and each item of a list, each before what it holds — so a path reaches every text a node holds (core 3.3, I.7). `@occurrence` is the moment an occurrence of an `each` clause entered its selection"
  - type: held_pointer
    pattern: "^root:[a-z0-9][a-z0-9-]*/[0-9a-f]{32}$"
    refusal: "must be `root:<logical root>/<32 lowercase hexadecimal digits>` — a key bin/held.py mints, which says nothing of what it holds"
    meaning: "where material held OFF git is (`held_form`): a logical root each host resolves through its own `roots`, and an opaque key minted at random"
  - type: language_tag
    pattern: "^[a-z]{2,3}(-[A-Z][a-z]{3})?(-([A-Z]{2}|[0-9]{3}))?$"
    refusal: "must be a language as BCP 47 writes one: `fa`, `pt-BR`, `sr-Latn-RS`, `es-419`"
    meaning: "a language, as BCP 47 (RFC 5646) writes it: its language subtag, then its script and its region where they are needed"
  - type: locale_tag
    pattern: "^[a-z]{2,8}(-[a-z]{3}){0,3}(-[A-Z][a-z]{3})?(-([A-Z]{2}|[0-9]{3}))?(-([a-z0-9]{5,8}|[0-9][a-z0-9]{3}))*(-u((-ca(-[a-z0-9]{3,8})+)(-fw(-[a-z0-9]{3,8})+)?(-hc(-[a-z0-9]{3,8})+)?(-nu(-[a-z0-9]{3,8})+)?(-tz(-[a-z0-9]{3,8})+)?|(-fw(-[a-z0-9]{3,8})+)(-hc(-[a-z0-9]{3,8})+)?(-nu(-[a-z0-9]{3,8})+)?(-tz(-[a-z0-9]{3,8})+)?|(-hc(-[a-z0-9]{3,8})+)(-nu(-[a-z0-9]{3,8})+)?(-tz(-[a-z0-9]{3,8})+)?|(-nu(-[a-z0-9]{3,8})+)(-tz(-[a-z0-9]{3,8})+)?|(-tz(-[a-z0-9]{3,8})+)))?$"
    refusal: "must be a way of reading as BCP 47 writes it, in its canonical form: a language tag, then `-u-` and the Unicode keys a reader sets — `ca` (calendar), `fw` (first day of the week), `hc` (hour cycle), `nu` (digits), `tz` (zone) — in that order, each with its type: `fa-u-ca-persian-nu-arabext`"
    meaning: "a reader's way of reading, as BCP 47 (RFC 5646) writes a language tag and its Unicode extension (UTS #35) says the calendar, the first day of the week, the hour cycle, the digits and the zone a moment is shown in. Each key's type is one CLDR has (`seed/knowledge/cldr-bcp47.tsv`), which assets/view/lib/view_prefs.py checks where it writes and reads one"
  - type: file
    pattern: "^[0-9a-f]{64}$"
    refusal: "must be a file's SHA-256, sixty-four lowercase hexadecimal digits: the host keeps the file under it"
    meaning: "a FILE a person chose on their machine, given to an action: carried to the host and kept there off git, under its SHA-256 (`<git dir>/daftar-inputs/<sha-256>`, readable by its owner alone), which is the value the run is given and keeps; the tool reads the file by it (bin/walktool.py `file`). Its bytes are never in the ledger"
  - type: coding
    pattern: "^[a-z0-9][a-z0-9-]*:\\S+$"
    scheme_from: knowledge_schemes
    holds_no: Bidi_Control
    refusal: "must be a CODE WITH ITS SCHEME, written `<scheme>:<code>` — `isco-08:2522`, `technology:samba`, `analytic:orchard` — the scheme a row of `knowledge_schemes` and the code one of its codes"
    meaning: "a CODE OF A SCHEME, written with the scheme it is a code of: `<scheme>:<code>`. One capsule wherever a code is written — what an observation is of and what it found, what a step is and takes, what a channel holds, what a stance covers, where an amount belongs, what a being draws on, an identity assigned outside every garden. The scheme is a row of `knowledge_schemes`; the code is one of its codes, looked up where the scheme is held here and held to its form where it is held at its authority. The first colon ends the scheme, whose name has none. It holds no character of the Unicode property `holds_no` (Bidi_Control, PropList.txt): one reorders what is shown around it, and would make a code read as another (Trojan Source, CVE-2021-42574)."
  - type: rows
    separator: "\t"
    inline_most: 100
    gaps: gaps
    refusal: "is not a table in its one form: a header line naming each column once, then one line per row, as many cells as the header, one tab between two, each line ending in a line feed alone — no empty line, no empty cell, no cell beginning or ending in a space. A value nobody read is a gap token (`gap_tokens`), never a blank"
    meaning: "a TABLE of rows, written in a bean as a block (`rows: |`): text, with one tab between two cells. What a cell means is its column's; a cell that holds no value says why, with a gap token. It is read and written by one reader and one writer, byte for byte, and a table of more than `inline_most` rows is warned about: its rows belong in the parts of a file"
gaps:
  - { token: "-", gap: not-read, meaning: "no reading was made here" }
  - { token: "?", gap: unreadable, meaning: "a reading was made, and it cannot be read here" }
  - token: "<"
    gap: below
    takes: count
    meaning: "below a limit: `<` and the limit's count, or a bare `<` for the channel's `limits.below`"
  - { token: ">", gap: above, takes: count, meaning: "above a limit, as `<` is below one" }
  - { token: "_", gap: absent, meaning: "there is nothing here to read: a core not recovered, a ring never formed" }
  - { token: "#", gap: withheld, meaning: "a value exists, and this copy does not carry it" }

# The columns of each table of rows above: which every row holds (`required`) and which it may (`optional`); a row holds
# the required ones and no other (core/law.py, `columns`).
columns:
  operations: { op: required, gives: required, takes: required, meaning: required, exact: optional, u_rule: optional }
  comparisons: { comparator: required, sign: optional, monotone: required, meaning: required }
  aggregates: { aggregate: required, meaning: required }
  ordering_keys: { key: required, meaning: required, inputs: required, steps: required }
  groupings: { grouping: required, home: required, meaning: required, steps: required, line: required, inputs: optional, weighs: optional }
  slots: { slot: required, meaning: required, matches: optional, width: optional, forms: optional }
  types:
    type: required
    system: optional
    unit: optional
    pattern: optional
    refusal: required
    meaning: required
    dimension: optional
    any_system: optional
    exists: optional
    clock: optional
    origin: optional
    holds_no: optional
    but: optional
    lines_in: optional
    either: optional
    scheme_from: optional
    separator: optional
    inline_most: optional
    gaps: optional
  gaps: { token: required, gap: required, meaning: required, takes: optional }
