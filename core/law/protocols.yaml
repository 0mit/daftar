# The protocols, by the IANA protocol and service registries' names: the layer each is at, what it rides on, its
# transport and its default ports.
# GENERATED by `python3 core/translate.py protocols` from std-vocab 32.1's `net_protocols`; a change is made there, or
# by a RULE-CHANGE that moves these rows, never by hand here.
protocols:
  - protocol: tcp
    technology: tcp
    layer: transport
    positions: tcp-port
    meaning: "the Transmission Control Protocol. Its positions are ports (`anchor_systems.tcp-port`)."
  - protocol: udp
    technology: udp
    layer: transport
    positions: udp-port
    meaning: "the User Datagram Protocol. Its positions are ports (`anchor_systems.udp-port`)."
  - protocol: ssh
    technology: ssh
    layer: application
    transport: tcp
    default_ports: [22]
    meaning: "the Secure Shell transport: an authenticated, encrypted channel that other protocols ride."
  - protocol: sftp
    technology: sftp
    layer: application
    transport: tcp
    rides_on: [ssh]
    meaning: "file transfer carried INSIDE an ssh channel. It has no port of its own, and `rides_on` is what records that rather than a fabricated default."
  - protocol: git
    technology: git-protocol
    layer: application
    transport: tcp
    rides_on: [ssh, http]
    meaning: "the git wire protocol. It is usually carried — `host-a:git/ledger.git` and `vps-a:tree` are both git over ssh — so its protection is whatever carries it, and the row says so instead of claiming one."
  - protocol: http
    technology: http
    layer: application
    transport: tcp
    default_ports: [80, 443]
    meaning: "the Hypertext Transfer Protocol. 443 is this same protocol with an endpoint taking the `encrypted` position, NOT a separate protocol called https."
  - protocol: smtp
    technology: smtp
    layer: application
    transport: tcp
    default_ports: [25, 465, 587]
    meaning: "mail transfer. One protocol on three ports: 25 relay, 465 implicit TLS, 587 submission — the port is a fact about the endpoint and the protection is an aspect position, so none of the three needs its own row."
  - protocol: pop3
    technology: pop3
    layer: application
    transport: tcp
    default_ports: [110, 995]
    meaning: "mailbox retrieval, download-oriented. 995 is the same protocol wrapped in TLS."
  - protocol: imap
    technology: imap
    layer: application
    transport: tcp
    default_ports: [143, 993]
    meaning: "mailbox access, server-side-state-oriented. 993 is the same protocol wrapped in TLS."
  - protocol: smb
    technology: smb
    layer: application
    transport: tcp
    default_ports: [445]
    meaning: "the Server Message Block file-sharing protocol. The PROTOCOL — Samba is one implementation of it and is a bean, not a row."
  - protocol: mysql
    technology: mysql-protocol
    layer: application
    transport: tcp
    default_ports: [3306]
    meaning: "the MySQL/MariaDB client-server wire protocol. Again the protocol, not the server."
  - protocol: dns
    technology: dns
    layer: application
    transport: udp
    default_ports: [53]
    meaning: "the Domain Name System query protocol"
  - protocol: wireguard
    technology: wireguard
    layer: link
    transport: udp
    default_ports: [51820]
    synthesizes_link: "true"
    meaning: "a tunnel protocol that MANUFACTURES A LINK: a wireguard peering produces an interface other protocols are then carried over. `synthesizes_link` is what distinguishes it from every application row above, and it is why `links` is a term and not a note."
  - protocol: pptp
    technology: pptp
    layer: link
    transport: tcp
    default_ports: [1723]
    synthesizes_link: "true"
    meaning: "the Point-to-Point Tunneling Protocol. Registered so the estate can state that it does NOT use it and never will — see the `network` profile's vacancies, where the position is declared `impossible` rather than `prediction`. Its MS-CHAPv2 authentication and MPPE encryption are both broken by published attacks, so a tunnel built on it protects nothing while LOOKING like a VPN in every inventory. A registry that omitted it could not express that judgment at all; the vacancy is where the judgment lives, and occupying the position warns.\n"
  - protocol: ipv4
    technology: ipv4
    layer: network
    positions: ipv4
    meaning: "Internet Protocol version 4. Its positions are addresses (`anchor_systems.ipv4`)."
  - { protocol: ipv6, technology: ipv6, layer: network, positions: ipv6, meaning: "Internet Protocol version 6." }
  - protocol: icmp
    technology: icmp
    layer: network
    plane: control
    meaning: "Internet Control Message Protocol: how the network layer reports that it could not deliver."
  - protocol: arp
    technology: arp
    layer: link
    plane: control
    meaning: "Address Resolution Protocol: finds the link-layer address that holds a network address — the join between two positioning systems."
  - protocol: dot1q
    technology: dot1q
    layer: link
    synthesizes_link: "true"
    rides_on: [ethernet]
    meaning: "IEEE 802.1Q VLAN tagging: one physical link carried as several segments. The plainest OVERLAY: a place system drawn over another."
  - protocol: stp
    technology: stp
    layer: link
    plane: control
    meaning: "Spanning Tree (IEEE 802.1D/w/s): elects one loop-free tree out of a meshed link layer — `acyclic`, enforced by a protocol."
  - protocol: lldp
    technology: lldp
    layer: link
    plane: control
    meaning: "Link Layer Discovery Protocol (IEEE 802.1AB): each device tells its NEIGHBOUR who it is. Neighbourhood, measured rather than drawn."
  - protocol: gre
    technology: gre
    layer: link
    synthesizes_link: "true"
    meaning: "Generic Routing Encapsulation: an unencrypted tunnel that manufactures a link."
  - protocol: ipsec
    technology: ipsec
    layer: link
    synthesizes_link: "true"
    meaning: "IPsec: authenticated, encrypted carriage of the network layer; in tunnel mode it manufactures a link."
  - protocol: vxlan
    technology: vxlan
    layer: link
    transport: udp
    default_ports: [4789]
    synthesizes_link: "true"
    meaning: "Virtual eXtensible LAN: a link layer carried over a routed network — an overlay with the underlay's reach."
  - protocol: ospf
    technology: ospf
    layer: network
    plane: control
    family: link-state
    scope: interior
    meaning: "Open Shortest Path First. Floods link states, computes shortest paths by cost, and divides a network into AREAS that summarise at their borders."
  - protocol: is-is
    technology: is-is
    layer: link
    plane: control
    family: link-state
    scope: interior
    meaning: "Intermediate System to Intermediate System. Link-state like OSPF, carried directly on the link layer, with two LEVELS."
  - protocol: rip
    technology: rip
    layer: application
    transport: udp
    default_ports: [520]
    plane: control
    family: distance-vector
    scope: interior
    meaning: "Routing Information Protocol. Distance-vector by hop COUNT — a metric that counts neighbours and measures nothing."
  - protocol: eigrp
    technology: eigrp
    layer: network
    plane: control
    family: distance-vector
    scope: interior
    meaning: "Enhanced Interior Gateway Routing Protocol. Advanced distance-vector with a composite metric; one vendor's, published as an informational RFC."
  - protocol: bgp
    technology: bgp
    layer: application
    transport: tcp
    default_ports: [179]
    plane: control
    family: path-vector
    scope: exterior
    meaning: "Border Gateway Protocol. Carries the whole path of autonomous systems, so POLICY can refuse one; the protocol between administrations."
  - protocol: vrrp
    technology: vrrp
    layer: network
    plane: control
    meaning: "Virtual Router Redundancy Protocol: several routers answer as one address, one at a time. A shared address made honest."
  - protocol: dhcp
    technology: dhcp
    layer: application
    transport: udp
    default_ports: [67, 68]
    plane: control
    meaning: "Dynamic Host Configuration Protocol: hands a being its position in the address space — the reason an address corroborates and never establishes."
  - protocol: ntp
    technology: ntp
    layer: application
    transport: udp
    default_ports: [123]
    plane: control
    meaning: "Network Time Protocol: how beings agree a position in TIME. A ledger of timestamps rests on it."
  - protocol: snmp
    technology: snmp
    layer: application
    transport: udp
    default_ports: [161, 162]
    plane: management
    meaning: "Simple Network Management Protocol: a being read, and sometimes written, by its operator."
  - protocol: ethernet
    technology: ethernet
    layer: link
    meaning: "an ethernet link, including an aggregated one. Added while MIGRATING the corpus, not while designing it: `carried_by` had nothing to terminate on until a base link existed, and an aggregated bond is a real measured one. This row is the design's own claim tested on itself — adding a protocol is a registry row, not a rule-change to any term."
  - protocol: pppoe
    technology: pppoe
    layer: link
    rides_on: [ethernet]
    synthesizes_link: "true"
    meaning: "PPP over Ethernet: a WAN dial that runs directly on ethernet frames, with no IP transport or port of its own. Like wireguard it MANUFACTURES a link, which is what lets a tunnel name it in `carried_by`."
forms:
  protocols:
    protocol: required
    technology:
      in: { registry: technology, take: code }
      why: "a protocol names its entry in the catalogue of technologies, which carries its specification and the field of knowledge it belongs to — so a routing mechanism ledgered tomorrow hangs from the same tree as a mail server does today"
    layer: required
    positions: optional
    meaning: required
    transport: optional
    default_ports: optional
    rides_on: optional
    synthesizes_link: optional
    plane: optional
    family: optional
    scope: optional
