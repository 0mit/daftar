# The units a quantity is written in: each a UCUM code (the one form a bean writes), with the law's English name
# attached as its text, and the quantity it measures. Ratified 2026-10-01: "keep UCUM ...
# with the english complete names as texts attached to them". Every unit of the law has one row here, which the law's
# proof checks; the codes are UCUM's (https://ucum.org/ucum), and where UCUM writes none the row says so and why.
# Currencies are ISO 4217's codes, read from seed/knowledge/currencies.tsv with their names, and are not rows here.
# Each unit's `factor` (v1 part 7) is two whole numbers, its size in its quantity's coherent unit as a fraction, so a
# conversion is exact arithmetic and never a rounded float (bin/units.py). These rows are the law itself: a change to
# them is a RULE-CHANGE, made here.
units:
  - { unit: "1",           name: one,                        quantity: ratio, factor: ["1", "1"] }
  - { unit: "%",           name: percent,                    quantity: ratio, factor: ["1", "100"] }
  - { unit: "[ppth]",      name: per-mille,                  quantity: ratio, factor: ["1", "1000"] }
  - { unit: "10*-4",       name: basis-point,                quantity: ratio, factor: ["1", "10000"] }
  - { unit: ms,            name: millisecond,                quantity: duration, factor: ["1", "1000"] }
  - { unit: s,             name: second,                     quantity: duration, factor: ["1", "1"] }
  - { unit: min,           name: minute,                     quantity: duration, factor: ["60", "1"] }
  - { unit: h,             name: hour,                       quantity: duration, factor: ["3600", "1"] }
  - { unit: d,             name: day,                        quantity: duration, factor: ["86400", "1"] }
  - { unit: mm,            name: millimetre,                 quantity: length, factor: ["1", "1000"] }
  - { unit: m,             name: metre,                      quantity: length, factor: ["1", "1"] }
  - { unit: km,            name: kilometre,                  quantity: length, factor: ["1000", "1"] }
  - { unit: m2,            name: square-metre,               quantity: area, factor: ["1", "1"] }
  - { unit: har,           name: hectare,                    quantity: area, factor: ["10000", "1"] }
  - { unit: km2,           name: square-kilometre,           quantity: area, factor: ["1000000", "1"] }
  - { unit: m3,            name: cubic-metre,                quantity: volume, factor: ["1", "1"] }
  - { unit: L,             name: litre,                      quantity: volume, factor: ["1", "1000"] }
  - { unit: m/s,           name: metre-per-second,           quantity: speed, factor: ["1", "1"] }
  - { unit: km/h,          name: kilometre-per-hour,         quantity: speed, factor: ["5", "18"] }
  - { unit: m/s2,          name: metre-per-second-squared,   quantity: acceleration, factor: ["1", "1"] }
  - { unit: Hz,            name: hertz,                      quantity: frequency, factor: ["1", "1"] }
  - { unit: kg,            name: kilogram,                   quantity: mass, factor: ["1", "1"] }
  - { unit: g,             name: gram,                       quantity: mass, factor: ["1", "1000"] }
  - { unit: bit,           name: bit,                        quantity: information, factor: ["1", "8"] }
  - { unit: By,            name: byte,                       quantity: information, factor: ["1", "1"] }
  - { unit: kBy,           name: kilobyte,                   quantity: information, factor: ["1000", "1"] }
  - { unit: MBy,           name: megabyte,                   quantity: information, factor: ["1000000", "1"] }
  - { unit: GBy,           name: gigabyte,                   quantity: information, factor: ["1000000000", "1"] }
  - { unit: TBy,           name: terabyte,                   quantity: information, factor: ["1000000000000", "1"] }
  - { unit: GiBy,          name: gibibyte,                   quantity: information, factor: ["1073741824", "1"] }
  - { unit: By/s,          name: byte-per-second,            quantity: data-rate, factor: ["1", "1"] }
  - { unit: bit/s,         name: bit-per-second,             quantity: data-rate, factor: ["1", "8"] }
  - { unit: Mbit/s,        name: megabit-per-second,         quantity: data-rate, factor: ["125000", "1"] }
  - { unit: dB,            name: decibel,                    quantity: level, factor: ["1", "1"] }
  - { unit: decibel-per-metre,     name: decibel-per-metre,     quantity: attenuation, factor: ["1", "1"], ucum: "false",
      why: "UCUM §22: a unit on a special scale, as the bel is, takes part in no product or quotient, so UCUM writes no attenuation; the law's name is the code" }
  - { unit: decibel-per-kilometre, name: decibel-per-kilometre, quantity: attenuation, factor: ["1", "1000"], ucum: "false",
      why: "UCUM §22: a unit on a special scale, as the bel is, takes part in no product or quotient, so UCUM writes no attenuation; the law's name is the code" }
