# The forms of a measure (v1 part 7): the lines a region or a repetition lies on, how a region is bounded, how a
# repetition strides, how well a value is known, when two values agree within their uncertainty, and the forms a
# statement holds them in — `extent` and `recurrence`, what a clause of an agreement holds beside its words (`can`'s
# `clause`) and what a placement holds beside its position (`be`'s `placed`).
# GENERATED by `python3 core/translate.py measures` from std-vocab 32.1's `aspects`, `placement` (what each placement
# takes of its host: `takes`), `extent_form`, `recurrence_form`, `uncertainty_form`, `compatibility`, `mechanism_form`,
# `coefficient_form` and the terms `clauses` and `located_at`; a change is made there, or by a RULE-CHANGE that moves
# these rows, never by hand here.
lines:
  - line: necessity
    region: "false"
    why: "the positions are modalities, not points on a line: nothing lies between `necessary` and `possible`, so there is no region to bound"
    meaning: "what a being requires in order to do its work"
  - line: permission
    region: "false"
    why: "the positions are modalities, not points on a line: nothing lies between `necessary` and `possible`, so there is no region to bound"
    meaning: "what a being may or must be able to do"
  - line: feasibility
    region: "false"
    why: "the positions are modalities, not points on a line: nothing lies between `necessary` and `possible`, so there is no region to bound"
    meaning: "whether a state of affairs CAN obtain for this being, independent of whether it is allowed"
  - line: confidentiality
    region: "false"
    why: "the positions are modalities, not points on a line: nothing lies between `necessary` and `possible`, so there is no region to bound"
    meaning: "whether a channel protects what crosses it from anything on the path"
  - line: fixing
    region: "false"
    why: "the positions are modalities, not points on a line: nothing lies between `necessary` and `possible`, so there is no region to bound"
    meaning: "what fixes a boundary on a line: a mark in a being, or a value stated on the line itself"
  - line: time
    region: "true"
    metered: time
    lines: 1
    systems: time
    meaning: "when: a position on the one line everything that happens is ordered along"
  - line: place
    region: "true"
    metered: length
    lines: open
    systems: place
    meaning: "where: a position among the places a being can be, whether a coordinate, a site or a path in a tree"
  - line: walk
    region: "true"
    metered: none
    lines: 1
    systems: none
    meaning: "a relation a reader can walk from being to being without coming back: ownership, habitat, part-of, dependency"
  - line: routine
    region: "true"
    metered: none
    lines: open
    systems: none
    meaning: "the steps a procedure takes, the branches between them and the conditions that choose a branch"
  - line: ordinal
    region: "true"
    metered: none
    lines: 1
    systems: any
    meaning: "which in order: a position on the ORDINAL line — the first, the second — with nothing between two neighbours. It says which, never how many (a count is how many), and it is no time and no place, so what lies on it holds at none of them: two nodes of 2 whose whole is 4"
  - line: temperature
    region: "true"
    metered: temperature
    lines: 1
    systems: temperature
    meaning: "how hot: a position on the one line of thermodynamic temperature, bounded below by absolute zero"
takes:
  - { placement: place, takes: none }
  - { placement: order, takes: none }
  - { placement: presence, takes: none }
  - { placement: habitat, takes: share }
  - { placement: time, takes: room }
  - { placement: location, takes: room }
extent_form:
  in: "optional: the positioning SYSTEM the region is stated in. A system may be metered where its aspect is not (`geographic` in metres), and then the region may carry a measure."
  of: "the ASPECT whose domain this region lies in. Its figure must declare `extent: possible` — an opposition's positions are modalities with nothing between them, so a region on one is refused rather than silently allowed."
  from: "optional: the position the region starts at, in the canonical form of one of that aspect's domain systems"
  to: "optional: the position it ends at"
  lines: "a region spans as many LINES as its measure's unit has powers of the metered dimension — one for a length, two for an AREA, three for a VOLUME — and never more than the system it is stated in has."
  measure: "optional: { count, unit } — how much of the domain it spans. A METERED aspect only: a stretch of a routine has no length, because `routine` declares `metered: none`, and the unit's dimension must be the one the aspect meters."
  level: "optional, with `count` and `in`, instead of `measure`: a length counted in CELLS of that level of the system `in` names — a month, two ISO weeks — which a measure cannot say, since a month is 28 to 31 days. Where `from` is stated, the other end is the same place in the cell `count` cells on; where that cell has no such place, its last place, and the reader says so"
  count: "with `level`: how many cells, a positive whole number"
  requires: "at least one of from / to / measure / level — a region with no bound at either end and no length is not a region; never both `measure` and `level`"
  open_ends: "Ends may be open, as `figures` says, and which ones are open is carried by which keys are present: `from` alone is open-ended, `to` alone is open-start, and a `measure` alone is a LENGTH whose ends are not fixed at all. That last is what most of a real corpus's durations turn out to be — \"for 204 days\" says how long and never says from when.\n"
  not_a_recurrence: "AN EXTENT IS ONE REGION, NOT A REPEATING ONE. \"every 5 minutes\" and \"bills on the 15th of each month\" are RECURRENCE RULES: a rule for generating positions, which is a different kind of thing and is deliberately NOT expressible here. The distinction is not pedantry — a recurrence needs a rule (calendar-anchored, or every N units from a start) and the two have different failure modes. A garden that needs one should propose it rather than writing a measure that lies about being a repetition.\n"
  not_a_calendar_bucket: "`units` holds millisecond, second, minute and day, and deliberately no month, week or year. A month is not a measure — it is 28, 29, 30 or 31 days — and a year is not either. A term whose real rule is \"on this date each month\" is recording a recurrence anchored to a calendar, not a length, and `measure` would make it look like arithmetic that it is not. A length in cells of a calendar's level is written `level` and `count` with `in`, and never as a `measure`.\n"
recurrence_form:
  of: "the SEQUENCE aspect the repetition runs along. An opposition has no neighbours, so nothing on one repeats."
  in: "optional: the positioning SYSTEM it is counted in. Required by `each`, because a level belongs to its system."
  every: "{ count } — every Nth NEIGHBOUR: needs only that positions have a next one. Or { count, unit } — every N UNITS: needs the aspect, or the system named, to be metered in that unit's dimension."
  each: "<level> — the same place in EACH CELL of that level of the system named: each month, each week, each era."
  at: "optional: where in the cell, as the system writes it — `15`, `W-5` — or a LIST of such places, each an occurrence (`[1, 4]`: the first and fourth day of each week of `iso-week`). Prose to the gate"
  lasts: "optional: an extent — each occurrence is a REGION that begins at its position and lasts this long (RFC 5545's DTSTART with DURATION)"
  closures: "optional: a list of positions or extents on which no occurrence falls — dated closures, holidays — each in the form of the system named"
  from: "optional: the position it starts at, in the form of the system named (with no `in:`, of a system the aspect holds), and a day its calendar has"
  to: "optional: the position it ends at, written as `from` is"
  times: "optional: how many occurrences in all, the first included — six instalments. With `to`, whichever comes first ends it"
  requires: "exactly one of `every` / `each`"
uncertainty_form:
  u: "{ count, unit } — the STANDARD uncertainty of the value (JCGM 100:2008, 2.3.1), in a unit of the value's own quantity, or of `ratio` for a relative one. A positive count: a value known exactly states none"
  accuracy: "{ count, unit, kind } — an accuracy AS ITS MAKER STATED IT, with its kind (`accuracy_kinds`), in place of `u`. A reader turns it into u and says that it did; a writer never does"
  where: "INSIDE a quantity — `{count, unit, u}` or `{count, unit, accuracy}`; BESIDE a value that is not a quantity — a position, a series channel — as that entry's attributes `u` and `accuracy`, in the same two forms, and `u_<axis>` for one axis of a position where its axes are known apart (`u_vertical`)"
  absent: "a value stating neither is exact as written. A reader combining it prints `u not stated` and invents none"
  requires: "at most one of `u` and `accuracy`"
compatibility:
  multiple: 2
  source: "JCGM 200:2012 (VIM) 2.47: two results are compatible when their difference is 'smaller than some chosen multiple of the standard measurement uncertainty of that difference'"
  applies_to: "two values of ONE measurand that each state u: one property, of one being or part, at one moment, in one quantity"
  never: [count-of-things, money, anchors, codes, names]
  meaning: "what a reading and a merge's report call AGREEMENT within uncertainty. It orders and labels what a person is shown and never decides: two compatible values that differ stay two values, each with its speaker. A garden states another multiple in its VOCAB.md, with its judge named"
mechanism_form:
  mechanism: "kebab: the row's name, which names its source"
  computes: "{ property: <scheme>:<code> (a `coding`), quantity, unit } — what it reads"
  inputs: "[{ name, property: <scheme>:<code>, quantity, unit }] — each converted EXACTLY into the unit the source fitted it in"
  steps: "the steps of `selection_form`, over the inputs by name"
  valid: "{ where: [<scheme>:<code>], ranges: [{input, extent}] } — the domain the source fitted; outside it the reader REFUSES, says why, and names what would do"
  residual: "{ sigma: {count, unit}, form: log | relative | absolute, validated: {count, unit}, persists: per-being | none | unknown } — the source's model error, its VALIDATED error where it states one, and whether one being's error repeats at its next reading; `unknown` is read both ways, and a residual that persists scales a growth too"
  known_bias: "optional prose, as the source states it"
  source: "{ cite, locator, doi? }"
  terms: "the terms the row is under, as NOTICE lists them"
coefficient_form:
  coefficient: kebab
  count: "the value"
  unit: "a unit"
  u: "optional: its standard uncertainty, or `bounds: [low, high]`"
  where: "[<scheme>:<code>] — the cases it applies to, each a `coding`"
  convention: "optional true — fixed by agreement, not measured"
  source: "{ cite, locator }"
  terms: "as for a mechanism"
forms:
  extent:
    meaning: "one region of a line: at least one of from / to / measure / level — a region with no bound at either end and no length is not a region; never both `measure` and `level`"
    replaces: extent_form
    attrs:
      in:
        meaning: "optional: the positioning SYSTEM the region is stated in. A system may be metered where its aspect is not (`geographic` in metres), and then the region may carry a measure."
      of:
        meaning: "the ASPECT whose domain this region lies in. Its figure must declare `extent: possible` — an opposition's positions are modalities with nothing between them, so a region on one is refused rather than silently allowed."
      from:
        meaning: "optional: the position the region starts at, in the canonical form of one of that aspect's domain systems"
      to: { meaning: "optional: the position it ends at" }
      measure:
        meaning: "optional: { count, unit } — how much of the domain it spans. A METERED aspect only: a stretch of a routine has no length, because `routine` declares `metered: none`, and the unit's dimension must be the one the aspect meters."
      level:
        meaning: "optional, with `count` and `in`, instead of `measure`: a length counted in CELLS of that level of the system `in` names — a month, two ISO weeks — which a measure cannot say, since a month is 28 to 31 days. Where `from` is stated, the other end is the same place in the cell `count` cells on; where that cell has no such place, its last place, and the reader says so"
      count: { meaning: "with `level`: how many cells, a positive whole number" }
  recurrence:
    meaning: "a repetition along a line, by a rule: exactly one of `every` / `each`"
    replaces: recurrence_form
    attrs:
      of:
        meaning: "the SEQUENCE aspect the repetition runs along. An opposition has no neighbours, so nothing on one repeats."
      in:
        meaning: "optional: the positioning SYSTEM it is counted in. Required by `each`, because a level belongs to its system."
      every:
        meaning: "{ count } — every Nth NEIGHBOUR: needs only that positions have a next one. Or { count, unit } — every N UNITS: needs the aspect, or the system named, to be metered in that unit's dimension."
      each:
        meaning: "<level> — the same place in EACH CELL of that level of the system named: each month, each week, each era."
      at:
        meaning: "optional: where in the cell, as the system writes it — `15`, `W-5` — or a LIST of such places, each an occurrence (`[1, 4]`: the first and fourth day of each week of `iso-week`). Prose to the gate"
      lasts:
        meaning: "optional: an extent — each occurrence is a REGION that begins at its position and lasts this long (RFC 5545's DTSTART with DURATION)"
      closures:
        meaning: "optional: a list of positions or extents on which no occurrence falls — dated closures, holidays — each in the form of the system named"
      from:
        meaning: "optional: the position it starts at, in the form of the system named (with no `in:`, of a system the aspect holds), and a day its calendar has"
      to: { meaning: "optional: the position it ends at, written as `from` is" }
      times:
        meaning: "optional: how many occurrences in all, the first included — six instalments. With `to`, whichever comes first ends it"
    one_of: [every, each]
  clause:
    meaning: "what an agreement asks of its parties, one clause each: an open map keyed by a short name. A clause is a position on the `permission` aspect — required (must), omissible (need not), permitted (may), forbidden (must not) — the square of obligation a being's capabilities already take. A clause with no `by` is a rule of the agreement that binds every party"
    replaces: clauses
    attrs:
      within:
        in: extent
        meaning: "with `amount`: the window the amount is counted within — a length that slides (`measure`), or cells of a level (`level`, `count`): ninety days within any hundred and eighty, twenty days in each year"
      used_by:
        in: { key_of: selections }
        meaning: "with `within`: the entries whose extents use the allowance — a person's stays, their leave"
      amount:
        in: { quantity: any }
        meaning: "how much, where it is measured — money, time, anything. Absent while unknown, and `what` then says how it will be known"
      due: { in: { type: position }, meaning: "the day, or the moment, it falls due — the first, when it repeats" }
      notice:
        in: { quantity: duration }
        meaning: "how long before it falls due a reader is told — this clause's own, where the agreement's (seven days) is too short: ninety days before a name lapses, sixty before a lease ends"
      every: { in: recurrence, meaning: "how it repeats: each month of a calendar, six times" }
      when:
        meaning: "what brings it into force, where that is not a day: a reading that holds — an entry made under another clause, a step reached, anything a selection says — or the condition in words, where no reading says it yet"
        in:
          entries: { selection: { in: { key_of: selections } }, said: { in: prose } }
          one_of: [selection, said]
          at_most_one_of: [[selection, said]]
      state:
        in: [in-force, met, waived, broken, disputed]
        meaning: "in-force — it holds and is not yet discharged; the reading when it is silent | met | waived — released by the party it is owed to | broken | disputed — the parties disagree that it holds"
      each:
        in: { key_of: selections }
        meaning: "the clause OCCURS once for each bean or entry this selection holds — each sale, each booking — from the moment it entered; an occurrence never leaves: a refund is its own clause, the reverse, occurring for each refund. Its selection uses only conditions an occurrence cannot lose (`comparators[].monotone`)"
      of:
        in: { type: field_path }
        meaning: "with `each`: the path, read FROM each occurrence, to the amount this clause's `amount` is a share of — `over.*.thing>clauses.fee.amount`"
      falls_due:
        in:
          entries:
            from: { required: "true", in: { type: field_path } }
            after: { in: extent }
            before: { in: extent }
            at: { in: { pattern: "^[A-Za-z0-9-]+$" } }
          one_of: [after, before]
          at_most_one_of: [[after, before]]
        meaning: "instead of `due`: when it falls due RELATIVE to another position, read each time and never stored — `from` a path to a position (`@occurrence`, a moment of `timing`, another clause's `due`), `after` or `before` it by an extent (a measure, or cells of a level), then `at` the place the system writes in the cell reached (`10`), as `recurrence_form.at` names one"
      during:
        in: extent
        meaning: "the window in which it holds: a permission lapses at its end; an obligation holds within it"
      by_role: { in: { type: kebab }, meaning: "instead of `by`: every party whose `role` is this, each bound alike" }
      over:
        in: { key_of: over }
        meaning: "the part of what the agreement concerns that this clause is for — a key of its `over`: of two purchases, the one paid in six instalments. Absent where the clause is for all of it, and where nobody has said which part — the question is then the bean's `open:`, and the key is written when someone says it"
  placement:
    meaning: "Where this being is found: a list of positions, each in a named anchor system, each stating how far it is known to reach. A being may be located in several systems at once, and a location that is not known is STATED as unknown rather than left out.\n"
    replaces: located_at
    attrs:
      openness:
        in: [here, elsewhere, unreachable, unknown]
        meaning: "here (reachable from the machine that recorded it) | elsewhere (reachable, and NOT from here) | unreachable (known, and cannot be reached) | unknown (nobody has established where it is — beyond the being it is in, where `host` names one)"
      observed:
        origin: { act: read, nature: body }
        in: { type: position, unit: day }
        meaning: "ABSOLUTE date this location was checked. A location ages: a tree is moved, a branch is checked out elsewhere, a printout is filed."
      u:
        in: { quantity: length }
        meaning: "the position's HORIZONTAL standard uncertainty (`uncertainty_form`); for a position on one vertical axis, its only one"
      u_vertical:
        in: { quantity: length }
        meaning: "the standard uncertainty of its height, where it states one: where most local ground motion is, and where a receiver is worst"
      accuracy:
        in:
          entries:
            count: { required: "true", in: { type: count } }
            unit: { required: "true", in: { registry: units, take: unit } }
            kind: { required: "true", in: { registry: accuracy_kinds, take: kind } }
        meaning: "instead of `u`: the horizontal accuracy as the receiver stated it, with its kind"
      zone:
        in: { registry: time-zones, take: zone }
        meaning: "the civil time zone in force at this position, a zone of the IANA time zone database: an offset is READ from it for a moment, never stored (N8)"
      mobility:
        in: [fixed, free]
        meaning: "fixed — the being does not move, and is not moved, while `during` holds (a rooted tree, a set mark); free — it moves. Rootedness is a position over a time, never a kind"
      during:
        in: extent
        meaning: "when the being was at this position: a transplant is two entries, each with its window"
      takes:
        in:
          entries:
            count: { required: "true", in: { type: count } }
            unit: { required: "true", in: { registry: units, take: unit } }
        meaning: "what this placement takes of what its host can hold (`capacity`), each a measure in a unit of the capacity's quantity: 2 rack units, 400 gigabytes. Only a placement whose rung takes (`placement`) takes anything"
