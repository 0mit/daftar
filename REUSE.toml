version = 1
SPDX-PackageName = "daftar"
SPDX-PackageSupplier = "Omid (Ahmad Kordbacheh, 0mit)"
SPDX-PackageDownloadLocation = "https://github.com/0mit/daftar"

# THE LAW AND THE GUIDES — CC BY 4.0. First, so the blocks after it narrow it: of several matching blocks the last wins.
[[annotations]]
path = ["*.md", "NOTICE", "seed/*.md", "seed/LANGUAGE", "seed/PUBLIC-ALLOW", "seed/RELEASE-SIGNERS",
        "seed/knowledge/SOURCES.md", "seed/knowledge/technology.tsv", "seed/knowledge/crosswalk-isco-08-isced-f-2013.tsv",
        "seed/knowledge/crosswalk-dwc.tsv", "seed/knowledge/signals.tsv", "seed/knowledge/technology-daftar.tsv",
        "seed/names/*.tsv",
        "site/*.html", "site/*.yaml", "site/assets/**", "site/RELEASE", ".github/ISSUE_TEMPLATE/**",
        ".github/pull_request_template.md",
        ".claude/skills/daftar/SKILL.md", "assets/*/README.md", "core/law/*.yaml"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Omid (Ahmad Kordbacheh, 0mit) and daftar's contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# THE CODE — AGPL-3.0-or-later with the garden exception, and the additional terms in LICENSE
[[annotations]]
path = ["bin/**", "core/*.py", "test/**", "seed/germinate.py", "seed/germinate.sh", "site/board.py", "site/blend.py", "site/assets/*.js",
        ".github/workflows/**", "assets/*/bin/**", "assets/*/lib/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Omid (Ahmad Kordbacheh, 0mit) and daftar's contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later WITH LicenseRef-daftar-garden-exception"

# THE SEEDS OF A GARDEN'S OWN FILES — CC0 1.0: what grows from them is the gardener's; and daftar's tables of facts
[[annotations]]
path = ["seed/*.template", "seed/FORMS.md", ".gitignore", ".gitattributes", "assets/*/templates/**",
        "seed/knowledge/substances.tsv", "seed/knowledge/mechanisms.yaml", "seed/knowledge/coefficients.yaml",
        "seed/knowledge/crosswalk-fhir-r5-observation.tsv"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Omid (Ahmad Kordbacheh, 0mit) and daftar's contributors"
SPDX-License-Identifier = "CC0-1.0"

# THIRD-PARTY DATA — its own terms (NOTICE)
[[annotations]]
path = "seed/knowledge/currencies.tsv"
precedence = "override"
SPDX-FileCopyrightText = "2015-2024 Unicode, Inc."
SPDX-License-Identifier = "Unicode-3.0"

[[annotations]]
path = ["seed/knowledge/ics-chart-2026-06.tsv", "seed/knowledge/ics-gssps-2026-09.tsv"]
precedence = "override"
SPDX-FileCopyrightText = "International Commission on Stratigraphy"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "seed/knowledge/time-zones.tsv"
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "LicenseRef-tzdb-public-domain"
[[annotations]]
path = "seed/knowledge/isced-f-2013.tsv"
precedence = "override"
SPDX-FileCopyrightText = "UNESCO Institute for Statistics"
SPDX-License-Identifier = "CC-BY-SA-3.0-IGO"

[[annotations]]
path = "seed/knowledge/isco-08.tsv"
precedence = "override"
SPDX-FileCopyrightText = "2012 International Labour Organization"
SPDX-License-Identifier = "LicenseRef-ILO-ISCO-08"

[[annotations]]
path = ["assets/view/lib/widgets/Vazirmatn.woff2", "assets/view/lib/widgets/Vazirmatn-OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2015 The Vazirmatn Project Authors (https://github.com/rastikerdar/vazirmatn)"
SPDX-License-Identifier = "OFL-1.1"
