# Faults judged only as files: what the gate reads from a bean's own text, which a bean made in memory does not have.
disk:
  - { rule: form, bean: x80, kind: document, name: "a control character in a note", says: "holds U+0007", statements: [ { say: { by: sam, at: now, note: "a bell\a rings" } } ] }

# EACH RULE'S CLAUSES (test/core_conformance.py): its `says`, cut at its sentences and semicolons, each clause named by
# the words it begins with, and what breaks it — `bad` cases above (by bean, under the rule), `disk` faults, `good`
# cases for a clause that permits, `garden` and `commit` faults of the suite (GARDEN.md or VOCAB.md; a commit's own
# rules), or `suite`: a fault that needs a profile's books or sheets, a session's pass log or a store's rows, refused
# in that suite.
clauses:
  form:
    - { says: "a bean's front matter is its header", bad: [x1f, x1g] }
    - { says: "a statement is one verb of the verb row", bad: [x1, x1b] }
    - { says: "nothing else", bad: [x1c] }
    - { says: "an `id` is one word, used once in its bean", bad: [x1d, x1e] }
    - { says: "Text holds no control character", disk: [x80] }
    - { says: "GARDEN.md holds the manifest's keys alone", garden: [manifest-key, pin-moved] }
    - { says: "once the garden holds a bean, it names its gardener", garden: [no-gardener] }
    - { says: "A grant is to a being or to every member of a reading", bad: [x65, x66, x67] }
  valency:
    - { says: "each required role is filled", bad: [x2, x3s, x3u, x3v, x3w, x3x, x3y, x3, x3c, x3d, x3e, x3f, x3f2, x3f3, x3g, x3h, x3t, x3n, x3o, x3p, x3m, x77, x79, x53, x54, x55] }
    - { says: "a role takes a list only where its row says `many`", bad: [x3b] }
  knowing:
    - { says: "every statement of a bean is the `of` of a knowing act", bad: [x4, x5b] }
    - { says: "a need a person meets (`meet`) is known by that person's own `say`", bad: [x5c] }
    - { says: "a knowing act's `at` is `now` until the save", bad: [x5] }
    - { says: "A bean renamed", commit: [renamed-unsaid] }
    - { says: "An entry a commit adds names who wrote it", commit: [who-no-being] }
    - { says: "A row of a store names the act", suite: [test/store.py] }
  placeholder:
    - { says: "a statement the engine derives", bad: [x6] }
    - { says: "a `bear` by the one who paid, alone", bad: [x6b] }
  order:
    - { says: "nothing stands on itself through others", bad: [x7, x27] }
    - { says: "a part never stands above", bad: [x7b, x7m, x7n, x7o], good: [y46] }
  life:
    - { says: "a living or organic being comes through the living", bad: [x8, x8b], good: [y47] }
    - { says: "a made or said being comes through hands", bad: [x9, x8c] }
    - { says: "a happening, a `fail`, comes through happenings alone", bad: [x8d, x8e, x8f], good: [y52] }
    - { says: "every chain ends at the crown", bad: [x9b, x9c] }
  necessity:
    - { says: "a `necessary` statement names", bad: [x10] }
  squares:
    - { says: "two positions that cannot both stand", bad: [x11, x11b, x11c] }
    - { says: "subcontraries may both stand", good: [y4] }
    - { says: "One observer gives one verdict", bad: [x63, x64] }
    - { says: "A response that finds a statement benign is of a `fail`", bad: [x63b, x63c], good: [y51] }
  bearer:
    - { says: "a quantity is stated only of what", bad: [x12c, x12e, x12f, x12h] }
    - { says: "A mass is a body's", bad: [x12, x12b] }
    - { says: "information and money are what is carried", bad: [x12d, x12g] }
    - { says: "A code of a scheme that names the positions its codes classify", suite: [test/cases.py, test/core_beings.py] }
    - { says: "A concept (a code of a scheme of the form `concept`) is said only of a being its pattern's root can fit", bad: [x12i], suite: [test/core_mechanics.py] }
  frame:
    - { says: "a position is in a declared system", bad: [x13, x13b, x13c, x13d, x13e] }
    - { says: "a day is reckoned in the garden's `zone`, and `now` is written at `at` alone", bad: [x13f] }
  names:
    - { says: "a name its namespace gives once names one being", bad: [x14, x50, x51, x51b, x52] }
    - { says: "A garden's id is twelve hexadecimal digits", bad: [x28] }
    - { says: "A name a garden gave, qualified to cross", bad: [x29] }
    - { says: "an identifier someone else assigned is never qualified", bad: [x87] }
    - { says: "A name a namespace gives holds no bidi control character", bad: [x88] }
  layers:
    - { says: "a file stands in one layer", garden: [two-layers] }
    - { says: "a `pass` from a layer to a layer", bad: [x15, x15b, x15c] }
    - { says: "`ratified` is granted only to the party", bad: [x15d] }
    - { says: "a session's pass log", suite: [test/core_gate.py] }
  ratify:
    - { says: "a change to the core, to a verb's row", commit: [law-unsaid] }
    - { says: "A grant to ratify is the gardener's own act", bad: [x30] }
  consent:
    - { says: "another person is kept here by name only on their own word", bad: [x20] }
    - { says: "A commit places no such person somewhere in the future", commit: [future-whereabouts] }
    - { says: "A `decline` is the word of the one", bad: [x60] }
    - { says: "one who `represent`s another acts for someone else", bad: [x61, x62] }
  harm:
    - { says: "what harm can come of is kept out of git", commit: [private-key] }
    - { says: "a code of a scheme marked special-category is written only sealed", bad: [x89] }
    - { says: "a sealed statement holds a pointer", bad: [x21, x23] }
    - { says: "a commit that seals or unseals one says so", commit: [seal-unsaid] }
    - { says: "and a sensitivity rated below", bad: [x22] }
  room:
    - { says: "two bodies are not in one room at once", bad: [x24] }
    - { says: "an area holds many", good: [y12] }
    - { says: "two listening at one port", bad: [x26] }
    - { says: "and one being attending two happenings", bad: [x78] }
    - { says: "What a garden declares exclusive", bad: [x25] }
  vacancy:
    - { says: "every row a garden adds to the law", garden: [unused-row] }
  kept:
    - { says: "what is kept is not damaged", commit: [journal-rewritten, journal-line-break] }
    - { says: "a series' part, once written", commit: [part-rewritten] }
    - { says: "a commit that takes a header key or a statement out", commit: [statement-taken, no-body] }
    - { says: "a file the release keeps is as its release made it", commit: [language-patched, digests-moved] }
    - { says: "and what an entity's closed books read", suite: [test/books.py] }
  line:
    - { says: "what holds a line holds its form", bad: [x84] }
    - { says: "a walk's ways on lead to steps of the walk", bad: [x40] }
    - { says: "a course is a being placed on a walk", bad: [x85] }
    - { says: "a reading's steps are each one operation", bad: [x41] }
    - { says: "a pin names a commit this garden has", bad: [x86, x94] }
  measured:
    - { says: "what is measured is in its form", bad: [x53] }
    - { says: "a region lies on a line that has regions", bad: [x53] }
    - { says: "a repetition strides by one rule", bad: [x50] }
    - { says: "a clause (a `can`, or a position on the permission square)", bad: [x51] }
    - { says: "an allowance's window and amount together", bad: [x81] }
    - { says: "what it occurs for, and what brings it into force", bad: [x82] }
    - { says: "and what a placement takes", bad: [x52] }
    - { says: "a clause's `by_role`", bad: [x73] }
    - { says: "a clause's `guard`", bad: [x91, x92, x93] }
    - { says: "A payment `charged` in another currency", bad: [x68, x69, x70] }
    - { says: "a weighing judges every pair", bad: [x71, x72] }
    - { says: "a mark fixes the base of a cell", bad: [x74] }
    - { says: "a grant's window is a repetition", bad: [x83] }
    - { says: "a need's `interval` is a length of time", bad: [x53b, x53c], good: [y50] }
    - { says: "a possible's `chance` is a ratio from 0 to 1", bad: [x99, x100, x101], good: [y56, y57] }
  profile:
    - { says: "what a profile gives is used only where the garden takes the profile", bad: [x60] }
    - { says: "and what its forms hold is in its form", bad: [x61, x62] }
