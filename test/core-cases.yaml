  - { name: "the payer who bears beside another bearer says more than the default", bean: y2, kind: contract, statements: [ { say: { by: sam, at: now } }, { pay: { id: p, by: ada, of: { count: "2", unit: XTS } } }, { bear: { by: ada, of: p } }, { bear: { by: ben, of: p } } ] }
  - { name: "a name nobody has said yet is `unknown`, and two of them in a namespace that gives once name nobody", bean: y10, kind: host, statements: [ { say: { by: sam, at: now } }, { name: { by: hpe, of: self, as: unknown } }, { name: { by: hpe, of: nas, as: unknown } } ] }
  - { name: "a person written under an opaque id needs no word of theirs", bean: p-0a1b2c3d, kind: person, statements: [ { say: { by: sam, at: now } }, { own: { by: theone, of: self } } ], header: { title: p-0a1b2c3d } }
  - { name: "a sealed statement: its verb, an id, a pointer, and the word it is held on", bean: y11, kind: document, statements: [ { say: { by: sam, at: now } }, { concern: { of: [ben] } }, { measure: { id: weight, held: "root:vault/0123456789abcdef0123456789abcdef", while: "pot#agreed" } } ] }
  - { name: "one being at one place twice, as two of its parts", bean: y12, kind: rack, statements: [ { say: { by: sam, at: now } }, { be: { by: self, at: "home-rack#u3", as: location } }, { part: { by: self, of: home-rack } } ] }
  - { name: "an exclusive booking declined holds nothing", bean: y13, kind: contract, statements: [ { say: { by: sam, at: now } }, { attend: { by: ada, of: pot, at: 2026-11-02/2026-11-06 } }, { attend: { id: asked, by: ada, of: pot, at: 2026-11-04/2026-11-05 } }, { decline: { by: ada, of: asked } } ] }
  - { name: "a garden met here, and the name it gave, qualified", bean: y14, kind: garden, statements: [ { say: { by: sam, at: now } }, { name: { by: garden-id, of: self, as: "0a1b2c3d4e5f" } }, { own: { by: ben, of: self } }, { name: { by: garden, of: ben, as: "0a1b2c3d4e5f/person:ben" } } ] }
  - { name: "a namespace that does not give once may name two beings alike", bean: y3, kind: host, statements: [ { say: { by: sam, at: now } }, { name: { by: nickname, of: self, as: "box" } }, { name: { by: nickname, of: nas, as: "box" } } ] }
  - { name: "subcontraries may both stand", bean: y4, kind: contract, statements: [ { say: { by: sam, at: now } }, { pay: { id: r, by: ben, of: { count: "1", unit: XTS } } }, { permitted: { of: r, through: pot } }, { omissible: { of: r, through: pot } } ] }
  - { name: "a contrary through another source stands beside", bean: y5, kind: contract, statements: [ { say: { by: sam, at: now } }, { pay: { id: r, by: ben, of: { count: "1", unit: XTS } } }, { obligatory: { of: r, through: pot } }, { forbidden: { of: r, through: garden-a } } ] }
  - { name: "a knowing act with `of` covers what it names, and another act the rest", bean: y6, kind: document, statements: [ { say: { by: sam, of: [a], at: now } }, { read: { by: ben, at: now } }, { do: { id: a, by: nas, as: web } }, { do: { by: nas, as: router } } ] }
  - { name: "a part at its whole's own level", bean: y7, kind: host, statements: [ { say: { by: sam, at: now } }, { part: { by: self, of: nas } } ] }
  - { name: "a document may say", bean: y8, kind: document, statements: [ { say: { by: pot, at: now } } ] }
  - { name: "a statement of another bean is `<bean>#<id>`", bean: y9, kind: document, statements: [ { say: { by: sam, at: now } }, { meet: { by: nas, of: "nas#needs-rack" } } ] }

