# Cases for test/core.py: a small garden written in the core's statements, which must pass; cases that must pass beside
# it; and cases each of which must be refused by the rule it names. Invented beings; nothing here is a fact. The garden
# began as the refinery's examples (2026-10-01), with two corrections the engine makes: a port is written with its
# system (`tcp-port:445`: a bare `445` is a TCP port, a UDP port and a geohash), and a unit is UCUM's, its English name attached by the law (`kg`, kilogram).

zone: Asia/Tehran                  # GARDEN.md's: the bearer's zone, where a day finds its place half

vocab:                             # the garden's own rows, as its VOCAB.md would hold them
  kinds:                           # beside the law's own (person, org, contract, document, garden, host, …)
    - { kind: clause,    nature: sayable, organisation: statement }
    - { kind: part,      nature: body,    organisation: component }
    - { kind: rack,      nature: body,    organisation: device }
    - { kind: grain,     nature: body,    matter: molecule, vacant: "the cases use it: one molecule, no ensemble" }
    - { kind: lump,      nature: body,    matter: material, vacant: "the cases use it: matter in bulk" }
    - { kind: bird,      nature: body,    organisation: organism, bios: living, rung: sensitive, vacant: "the cases use it: a maker that is no hands" }
    - { kind: nest,      nature: body,    matter: material, bios: organic, vacant: "the cases use it: what the living make" }
    - { kind: herd,      nature: body,    organisation: population, bios: living, vacant: "the cases use it: a collection of its members" }
  namespaces:
    - { namespace: hpe,      once: true }
    - { namespace: garden-a, once: true }
    # dns is the core's own (core/law/namespaces.yaml): a standard, not a bean, and declared once
    - { namespace: nickname, vacant: "a case beside the garden uses it" }
  flows:
    - { flow: no-world-journal, from: world, to: journal, through: capture, grant: refused }
    - { flow: sent-out,  from: request, to: remote, through: send, grant: granted, party: shop, basis: pot }
    - { flow: no-guide,  from: guide, to: law,     through: make, grant: refused }
  exclusive:
    - { verb: attend, why: "one being, once: what the cases below book" }
  profiles: [code, network, domain, knowledge, view]   # each but accounting, whose verb a case below is refused

garden:
  ada:
    kind: person
    statements:
      - say:  { by: ada, at: now }
      - name: { by: garden-a, of: self, as: "person:ada" }
      - own:  { by: theone, of: self }
      - come: { by: self, through: [ { someone: person } ] }
      - classify: { of: self, as: "isco-08:2511" }
  ben:
    kind: person
    statements:
      - say:  { by: ben, at: now }
      - own:  { by: theone, of: self }
  sam:
    kind: person
    statements:
      - say:  { by: sam, at: now }
      - own:  { by: theone, of: self }
      - grant: { by: self, to: [ada], of: [ladder], as: ratify, class: G }
  hpe:  { kind: org,  statements: [ { say: { by: sam, at: now } }, { name: { by: garden-a, of: self, as: "org:hpe" } } ] }
  shop: { kind: org,  statements: [ { say: { by: sam, at: now } }, { name: { by: dns, of: self, as: "shop.example" } } ] }
  garden-a:
    kind: garden
    statements:
      - say:   { by: sam, at: now }
      - grant: { by: sam, to: [ben], of: [pot], as: read }
  home-rack:
    kind: rack
    statements:
      - say:  { by: sam, at: now }
      - come: { by: self, through: [ { someone: person, at: shop } ] }
  nas:
    kind: host
    statements:
      - say:     { by: sam, at: now }
      - be:      { by: self, at: home-rack, as: place }
      - name:    { by: hpe, of: self, as: "SN-0042" }
      - come:    { by: self, through: [ { someone: person, at: hpe } ] }
      - own:     { by: sam, of: self }
      - answer:  { by: sam, of: self, as: keeping }
      - acquire: { of: self, from: shop, as: bought, at: 2025-03-01 }
      - measure: { of: self, as: mass, value: { count: "4.2", unit: kg }, at: 2025-03-01 }
      - do:      { by: self, as: file-server }
      - serve:   { by: self, at: ["192.0.2.10", "tcp-port:445"], through: smb, to: [sam, ben] }
      - need:    { id: needs-rack, by: self, of: [home-rack] }
      - necessary: { of: needs-rack, through: home-rack }
  disk:
    kind: part
    statements:
      - say:  { by: sam, at: now }
      - part: { by: self, of: nas }
      - come: { by: self, through: [nas-maker] }
  nas-maker:
    kind: host
    statements:
      - say:  { by: sam, at: now }
      - come: { by: self, through: [ { someone: person, at: hpe } ] }
  pot:
    kind: contract
    statements:
      - say:        { by: ada, of: [agreed, paid, ada-bears, ben-bears, rent, owed, may], at: now }
      - agree:      { id: agreed, by: [ada, ben], of: self, through: spoken, at: 2026-09-23 }
      - pay:        { id: paid, by: ada, of: { count: "10.00", unit: XTS }, at: 2026-09-20 }
      - bear:       { id: ada-bears, by: ada, of: paid, share: 1 }
      - bear:       { id: ben-bears, by: ben, of: paid, share: 1 }
      - pay:        { id: rent, by: ben, to: ada, of: { count: "5.00", unit: XTS }, at: 2026-10-01/2027-09-30 }
      - obligatory: { id: owed, of: rent, through: agreed }
      - permitted:  { id: may, of: rent, through: agreed }
  clause-3:
    kind: clause
    statements:
      - say: { by: ada, at: now }
      - be:  { by: self, at: [pot, "ordinal:3"], as: order }
  ladder:
    kind: document
    statements:
      - say:   { by: sam, at: "2026-10-01 10:26+03:30" }
      - stand: { by: molecule, at: atom, as: made-of }
      - stand: { by: reason, at: organism, as: possible-on, while: proportion }
      - necessary: { of: theone }
      - possible:  { of: nas, through: shop }
      - possible:  { of: pot#rent, through: shop }
      - contingent: { of: pot#rent, through: shop }
  journal-pass:
    kind: document
    statements:
      - read: { id: r1, by: sam, from: nas, at: now }
      - pass: { of: [r1], from: world, to: estate, through: record, as: read }
  persian-lease:
    kind: contract
    statements:
      - say: { by: ada, at: now, note: "an extent in the Persian calendar: its end takes its start's tag" }
      - pay: { by: ben, to: ada, of: { count: "1", unit: XTS }, at: "persian:1405-07-09/1406-07-08" }
      - pay: { by: ben, to: ada, of: { count: "1", unit: XTS }, at: "2026-10-01 10:00+03:30/2026-10-01 12:00+03:30" }

