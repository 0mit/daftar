          capface: {kind: face}
          rodface: {kind: face}
      nut:
        compliance: rigid
        shape: hex
        expect: [nut]
        features:
          thread: {kind: thread, side: int}
          face: {kind: face}
          flats: {kind: flats}
      slide:
        compliance: rigid
        shape: ring
        material: ptfe
        expect: [slide-ring]
        features:
