        use: ambient
        material: air
        external: true
        expect: []
      pin-a:
        compliance: rigid
        shape: bar
        external: true
        expect: [pin]
        features:
          seat: {kind: seat}
      pin-b:
        compliance: rigid
        shape: bar
        external: true
        expect: [pin]
        features:
          seat: {kind: seat}
      cylinder:
        device: true
        parts: [tube, endcap, mount, gland, bush, rod, piston, nut, ptfeseal, wear, rodseal, wiper, oring, plug]
        expect: [hydraulic-cylinder]
    joints:
