        expect: [ptfe-seal, piston-seal]
      wear:
        compliance: rigid
        shape: split-ring
        material: polymer
        expect: [wear-ring]
        features:
          seat: {kind: seat}
      rodseal:
        compliance: elastic
        shape: ring
        section: lip
        material: polyurethane
        expect: [lip-seal, rod-seal]
        features:
          lip: {kind: lip}
      wiper:
        compliance: elastic
        shape: ring
        section: lip
        material: polyurethane
        expect: [lip-seal, wiper-seal]
        features:
          lip: {kind: lip}
      oring:
        compliance: elastic
        shape: ring
        section: round
        material: nbr
        expect: [o-ring, static-seal]
      plug:
