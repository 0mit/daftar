heldout:
  water-pump:
    nodes:
      housing:
        compliance: rigid
        material: cast-aluminium
        expect: []
        features:
          bbore: {kind: bore}
          sbore: {kind: bore}
          cgroove: {kind: groove, side: int, profile: rect}
          volute: {kind: face}
      b-inner:
        compliance: rigid
        shape: ring
        material: bearing-steel
        expect: [bearing-inner-ring]
        features:
          bore: {kind: bore}
          race: {kind: raceway, side: ext}
      b-outer:
        compliance: rigid
        shape: ring
        material: bearing-steel
        expect: [bearing-outer-ring]
        features:
          seat: {kind: seat}
          race: {kind: raceway, side: int}
          face: {kind: face}
      bearing:
        device: true
        parts: [b-inner, b-outer]
        said: deep-groove-ball-bearing
        expect: [deep-groove-ball-bearing]
      shaft:
        compliance: rigid
        shape: bar
        material: steel
        expect: [shaft]
        features:
          s1: {kind: seat}
          s2: {kind: seat}
          s3: {kind: seat}
          s4: {kind: seat}
      circlip:
        compliance: elastic
        shape: split-ring
        material: spring-steel
        expect: [circlip, retaining-ring]
        features:
          rim: {kind: seat}
          face: {kind: face}
          lugs: {kind: lug-hole, count: 2}
      seal:
        compliance: elastic
        shape: ring
        section: lip
        material: nbr
        expect: [lip-seal]
        features:
          case: {kind: seat}
          lip: {kind: lip}
      impeller:
        compliance: rigid
        material: cast-iron
        expect: []
        features:
          bore: {kind: bore}
          vanes: {kind: face}
      flange:
        compliance: rigid
        material: steel
        expect: []
        features:
          bore: {kind: bore}
          face: {kind: face}
          holes: {kind: hole-pattern, count: 4}
      coolant:
