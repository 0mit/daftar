  - { suite: test/core_guides.py, part: 13, why: "its last checks compare the core's guides with today's examples, translated" }
  - { suite: test/core_adopt.py, part: 13, why: "the adoption: a garden in today's words adopting the core needs a release in today's words" }
  - { suite: test/core_merge.py, part: 13, why: "it holds the pin's dispatch to today's gate and merge, which part 13 deletes" }
  - { suite: test/core_between.py, part: 13, why: "its law checks hold core/law/flows.yaml equal to what std-vocab generates" }
  - { suite: test/core_law.py, part: 13, why: "its law checks hold core/law/ equal to what std-vocab generates" }
  - { suite: test/core_measure.py, part: 13, why: "its law checks hold core/law/measures.yaml equal to what std-vocab generates" }
