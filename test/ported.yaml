  - { suite: test/viewcap.py,   how: "the view asset's page, report, render, feed and host on statements, asked of `grant` statements" }
  - { suite: test/garden.py,    how: "the garden model in a garden of the core; every tool a verb of core/law/tools.yaml" }
  - { suite: test/journal.py,   how: "the journal tool unchanged; safe's block written into a bean of statements" }
  - { suite: test/public.py,    how: "the guard over a garden of the core: its ids, the text of its `name`s, its addresses" }
  - { suite: test/save.py,      how: "the save in a garden of the core: `at: now` stamped with the entry's moment" }
  - { suite: test/calendars.py, how: "the tools held to core/law/systems.yaml and places.yaml; positions judged by the core's gate" }
  - { suite: test/assets.py,    how: "the one reader of seed/LANGUAGE; every asset a profile of core/law/profiles.yaml; a page saved" }
  - { suite: test/layers.py,    how: "core/law/layers.yaml over the release's files; a garden's standing rows; rule `layers`" }
  - { suite: test/cost.py,      how: "the core's gate timed over a `record` series held in a part" }
  - { suite: test/docs.py,      how: "the prose is the guides in their places (v1 part 13), and the retired words a guide must not write are core/law/terms.yaml's" }
  - { suite: test/manifesto.py, how: "a clause's words read from the law's own files (core/law/), cited by structure" }
  - { suite: test/rationale.py, how: "seed/RATIONALE.md keyed by the core's paths (`core/law/<file>: <path>`), each reason carried whole" }
  - { suite: test/catalogue.py, how: "the catalogue of the release read from core/law/, its garden one of the core" }
  - suite: test/view.py
