# Where each of today's suites went in v1 (part 12, 2026-10-02): held to the tree by test/core_ported.py.
#
# Part 12 met 52 suites that committed today's words through today's gate, grew a garden in them, or read today's law.
# Each is ported in place to a garden of the core (`ported`), still waiting for the part that moves the law it reads
# (`waiting`), or retired (`retired`): replaced by suites of the core, each promise `held` by checks the tree has
# (`<suite>: <words of the check>`), `gone` with the law it was a promise of, or `left` — not held yet, saying why. What
# is gone or left is for the operator's veto (the journal entry "v1 part 12 built").

met: [test/agreements.py, test/assets.py, test/base.py, test/calendars.py, test/catalogue.py, test/converge.py, test/cost.py,
      test/crosswalk.py, test/days.py, test/deeptime.py, test/docs.py, test/expiry.py, test/fast.py, test/figures.py,
      test/garden.py, test/germinate.py, test/held.py, test/hub.py, test/journal.py, test/knowledge.py, test/launch.py,
      test/layers.py, test/manifesto.py, test/money.py, test/observations.py, test/ordinal.py, test/passes.py,
      test/peering.py, test/place.py, test/positions.py, test/privacy.py, test/profiles.py, test/public.py,
      test/quantities.py, test/rationale.py, test/reckon.py, test/recurrence.py, test/reform.py, test/refusals.py,
      test/rehearsal.py, test/root.py, test/rope.py, test/save.py, test/senses.py, test/sequence.py, test/shape.py,
      test/stamps.py, test/uncertainty.py, test/upgrade.py, test/view.py, test/viewcap.py, test/zones.py]

