  - { suite: test/core_view.py, part: 13, why: "its law checks hold core/law/profiles.yaml and terms.yaml equal to what std-vocab generates" }
  - { suite: test/core_write.py, part: 13, why: "its release is built by reading the profiles std-vocab offers (test/grow.py reads the core's)" }
  - { suite: test/core_gate.py, part: 13, why: "its release is built by reading the profiles std-vocab offers (test/grow.py reads the core's)" }

